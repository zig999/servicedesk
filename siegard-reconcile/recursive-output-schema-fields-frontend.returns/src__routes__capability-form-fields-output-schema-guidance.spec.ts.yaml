read:
  - node: rules/integration/an-output-schema-entry-states-what-the-system-reads-from-it
    held_at: >-
      the CLAIM_PATTERNS array and the criterion 1/3/4/5/6 tests that check the guidance paragraph
      against each of the policy's five claims, the criterion 9 test forbidding refusal/check
      vocabulary, the criterion 10 test requiring identical guidance text on the create screen and
      the detail (edit) screen, and the criteria 11/12 tests asserting Save is not disabled for
      schemas exercising the properties/items walk or lacking type/description.
    evidence: |
      const CLAIM_PATTERNS: readonly RegExp[] = [
        /o que é inserido aqui é json/i,
        /os nomes de campo lidos a partir dele são os caminhos através do objeto properties de nível superior deste schema e de todo objeto properties e todo schema items alcançável a partir dele/i,
        /esse caminho é construído concatenando a chave própria de cada objeto ao caminho do seu pai com um ponto, e os items próprios de cada array ao caminho do seu pai com colchetes/i,
        /o type e a description declarados no nó que cada caminho alcança, onde o schema os declara, são lidos como a semântica declarada desse campo/i,
        /nenhum outro conteúdo deste schema é lido ou validado/i,
        /uma description aqui declara o que seu valor significa e não nomeia nenhuma decisão/i,
      ];
  - node: rules/integration/an-output-schema-entrys-statement-carries-no-sixth-claim
    held_at: >-
      the criterion 7 test requiring every sentence of the guidance paragraph to match one of the
      six known claim patterns, and the criterion 8 tests requiring no digit and no brace in the
      guidance text.
    evidence: |
      const sentences = (guidance?.textContent ?? "")
        .split(".")
        .map((sentence) => sentence.trim())
        .filter((sentence) => sentence.length > 0);

      expect(sentences.length).toBeGreaterThan(0);
      for (const sentence of sentences) {
        expect(CLAIM_PATTERNS.some((pattern) => pattern.test(sentence))).toBe(true);
      }
  - node: rules/investigation/a-field-semantics-name-is-its-path-through-the-output-schema
    held_at: >-
      the criterion 1 and criterion 2 tests checking the path-through-properties/items claim and
      the dot/bracket concatenation-grammar claim, and the criterion 11 test asserting Save stays
      enabled for an output schema whose properties are declared only beneath a nested items
      schema.
    evidence: |
      fillValidForm({
        outputSchema:
          '{"type":"object","properties":{"installations":{"type":"array","items":{"type":"object","properties":{"state":{"type":"string"}}}}}}',
      });

      expect(screen.getByRole("button", { name: "Save" }).hasAttribute("disabled")).toBe(false);
looked_past: >-
  The eslint-disable comment at the top of the file (manual cleanup rationale) and the general
  test-structure/style choices (helper functions, duplicated mount boilerplate across describe
  blocks) say nothing about a domain fact and are a code-review matter, not this pass's.
