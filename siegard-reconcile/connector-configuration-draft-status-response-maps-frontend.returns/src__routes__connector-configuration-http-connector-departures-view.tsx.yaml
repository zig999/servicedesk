  - node: rules/integration/a-connector-configuration-surface-states-what-the-http-connector-would-refuse-in-its-configuration-fields-content
    held_at: the whole component (length guard, heading, mapped list of departure texts)
    evidence: |-
      if (departures.length === 0) { return null; }
      return (
        <div className="flex flex-col gap-1">
          <p className="text-sm font-medium text-foreground">{HTTP_CONNECTOR_DEPARTURES_HEADING}</p>
          <ul>
            {departures.map((departure) => (
              <li key={httpConnectorDepartureKey(departure)}>{httpConnectorDepartureText(departure)}</li>
            ))}
          </ul>
        </div>
      );
