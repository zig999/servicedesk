  - node: rules/glossary/a-registered-concept-is-never-removed
    held_at: >-
      the ConceptInUseError class's constructor (message and name) and the describe function's
      four-branch switch, which enumerates exactly the four reference kinds the rule names as
      blocking a concept's removal
    evidence: |-
      super(`the glossary refuses to remove concept "${concept}": it is still named by ${describe(reference)}`);
      this.name = 'ConceptInUseError';
      ...
      case 'capability':
        return 'a registered capability that answers it';
      case 'evidence':
        return 'a collected evidence item';
      case 'citation':
        return 'an evaluation citation';
      case 'hypothesis-revision-collects':
        return "a hypothesis-revision's own collects";
