findings:
  - file: src/persistence/relational-case-store.repository.ts
    where: "insertRevision(), lines 573-582, called from insertHypothesisRevision() at line 134-136"
    evidence: "async function insertRevision(tx: IQueryable, input: HypothesisRevisionInput): Promise<number> {\n  const key: IHypothesisKey = { slug: input.slug, hypothesis_name: input.hypothesis_name };\n  await runStatement(tx, hypothesisIdentityStatement(key), raiseWriteFailure);\n  const revision = await insertRevisionRow(tx, input);"
    cost: "A hypothesis revision can be inserted for a case that currently holds no draft version. The store's own CaseHoldsNoDraftError (imported nowhere in this file) is never raised, so the refusal the rule names never fires here, and a revision can be authored with no draft whose subject type the concept-acceptance step was meant to check it against."
    kind: contradicts
    node: rules/knowledge/a-hypothesis-is-revised-only-against-its-cases-draft
    correction: "insertRevision would need to look up the case's current draft version first and raise CaseHoldsNoDraftError when none exists, the same pattern updateDraftVersion already uses for CaseVersionNotDraftError."

  - file: src/persistence/relational-case-store.repository.ts
    where: "placeHypothesis(), lines 138-140, and raisePlaceHypothesisFailure(), lines 629-634"
    evidence: "public async placeHypothesis(input: PlaceHypothesisInput): Promise<void> {\n    await runStatement(this.connection, placeHypothesisStatement(input), raisePlaceHypothesisFailure(input));\n  }"
    cost: "place-hypothesis against a version that is not in draft state succeeds instead of being refused, so a released case version's manifest can be changed after publication — exactly the immutability an investigation's replay depends on."
    kind: contradicts
    node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
    correction: "Check the version's state (as updateDraftVersion does) before the insert and raise CaseVersionNotDraftError when it is not draft."

  - file: src/persistence/relational-case-store.repository.ts
    where: "removeManifestEntry(), lines 142-144"
    evidence: "public async removeManifestEntry(slug: string, version: number, hypothesisName: string): Promise<void> {\n    await runStatement(this.connection, removeManifestEntryStatement(slug, version, hypothesisName), raiseWriteFailure);\n  }"
    cost: "A manifest entry can be removed from a released version's manifest with no refusal, letting a published procedure change after release with nothing in this file ever raising CaseVersionNotDraftError for it."
    kind: contradicts
    node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
    correction: "Check the version's state before the delete and raise CaseVersionNotDraftError when it is not draft."

  - file: src/persistence/relational-case-store.repository.ts
    where: "release(), lines 146-148, and releaseStatement(), lines 643-648"
    evidence: "function releaseStatement(slug: string, version: number): IStatement {\n  return {\n    text: `UPDATE ${CASE_VERSIONS_TABLE} SET state = $3, released_at = NOW() WHERE slug = $1 AND version = $2`,\n    params: [slug, version, RELEASED_STATE],\n  };\n}"
    cost: "release() can be invoked against a version that is not draft — including one already released — silently rewriting released_at, since the UPDATE carries no state precondition and CaseVersionNotDraftAtReleaseError is never imported or thrown anywhere in this file. A caller relying on the 409 refusal to detect a stale action gets a silent success instead."
    kind: contradicts
    node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
    correction: "releaseStatement's WHERE clause (or a preceding read, mirroring updateDraftVersion) would need to require state = draft, with a violation raising CaseVersionNotDraftAtReleaseError."

  - file: src/persistence/relational-case-store.repository.ts
    where: "discard(), lines 150-152, and discardDraft(), lines 650-653"
    evidence: "async function discardDraft(tx: IQueryable, key: ICaseVersionKey): Promise<void> {\n  await runStatement(tx, deleteManifestEntriesStatement(key), raiseWriteFailure);\n  await runStatement(tx, deleteCaseVersionStatement(key), raiseWriteFailure);\n}"
    cost: "discardDraft deletes a case_version and its manifest entries regardless of the version's current state, so a released version — and the investigation whose replay depends on it staying readable — can be removed through the same call path meant only for an abandoned draft."
    kind: contradicts
    node: rules/knowledge/only-a-draft-case-version-may-be-discarded
    correction: "discardDraft would need to check the version's state is draft before deleting, and refuse (or no-op with an error) otherwise."

