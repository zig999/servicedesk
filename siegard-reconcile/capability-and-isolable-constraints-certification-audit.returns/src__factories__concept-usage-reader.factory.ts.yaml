findings:
  - file: src/factories/concept-usage-reader.factory.ts
    where: the if/else-if chain in resolveConceptUsage, lines 27-38
    evidence: >-
      if (capability.held) {
        return { named: true, reference: 'capability' };
      }
      if (await sources.investigationStore.isConceptNamedByEvidence(concept)) {
        return { named: true, reference: 'evidence' };
      }
      if (await sources.investigationStore.isConceptNamedByCitation(concept)) {
        return { named: true, reference: 'citation' };
      }
      if (await sources.caseStore.isConceptCollectedByHypothesisRevision(concept)) {
        return { named: true, reference: 'hypothesis-revision-collects' };
      }
    cost: >-
      rules/glossary/a-registered-concept-is-never-removed's own Description says the refusal "names
      which of those conditions was found, so the person told to keep the concept knows what to look
      at" — but its statement pairs each of the four conditions with a reference value one at a time and
      never says which wins when a concept satisfies more than one at once. domain/integration/capability's
      own Description ("It answers exactly one concept... its output schema... bounds every citation over
      the evidence it produces") means a concept a capability answers routinely also has evidence naming it
      and citations bounded by that evidence, so this is the ordinary case, not an edge one: for such a
      concept this chain always reports 'capability' and never discloses that evidence or a citation also
      names it. An operator who deregisters the capability believing that clears the concept meets the
      removal refused again, now for a reference ('evidence' or 'citation') the first refusal never showed
      them, because the priority that decided what to disclose first lives only in the order of these four
      ifs.
    kind: unstated
    correction: >-
      the precedence among the four conditions — which reference is reported when a concept satisfies more
      than one — would have to be decided and recorded in rules/glossary/a-registered-concept-is-never-removed's
      own statement (or a sibling node it points to), so the order this function encodes is read from a
      decision rather than invented by whichever branch was written first.
    node: rules/glossary/a-registered-concept-is-never-removed
