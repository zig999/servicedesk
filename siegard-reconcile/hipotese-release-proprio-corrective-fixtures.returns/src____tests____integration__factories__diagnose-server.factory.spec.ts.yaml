    held_at: "releaseManifestedRevisions, calling lifecycle.releaseHypothesisRevision directly against each placed revision"
    evidence: |
      await lifecycle.releaseHypothesisRevision(slug, revision.hypothesis_name, revision.revision);
  - node: rules/knowledge/a-released-case-version-manifests-only-released-hypothesis-revisions
    held_at: "insertFixtureCase, which places every manifest entry, releases every referenced hypothesis-revision, and only then releases the case version"
    evidence: |
      const placed = await placeFixtureHypotheses(lifecycle, fixture, draft.version);
      await releaseManifestedRevisions(lifecycle, fixture.slug, placed);
      await lifecycle.release(fixture.slug, draft.version);
  - node: rules/knowledge/a-released-hypothesis-revision-is-never-altered
    held_at: nowhere
    evidence: "no attempt in this file to alter a hypothesis-revision after releasing it"
  - node: rules/knowledge/validation-runs-at-every-read
    held_at: nowhere
    evidence: "no read of a case version through the validating case-query wiring occurs in this file"
looked_past: "The test title claims durations_total \"exceeding the sum of the three stage figures\" while the actual assertion uses toBeGreaterThanOrEqual (permits equality), and TOTAL_PROVIDER_CALLS/per-call token mocks are fixture-cardinality-derived test-double values rather than domain facts — both are test-strength/design concerns for another pass, not domain facts misstated here."
