looked_past: >-
  The choice to enforce field presence and type through Zod at the DTO layer
  at all — as opposed to any other validation mechanism — is a library/style
  choice and not itself reported, only the specific place it absorbs a
  domain-level completeness condition that the specification carves out for
  a distinct refusal.
