looked_past: >-
  Whether case-simulation-screen.tsx and version-manifest-screen.tsx (the two callers of CaseVersionEditorLink) actually render it unconditionally on every reading of their own surfaces, refused and pending readings included, is those files' own conformance question, not this link component's — it was not opened for that judgment here.
