  - node: constraints/diagnosis-answers-synchronously
    held_at: >-
      the diagnoseHandler function (lines 23-35): it awaits the assessment and sends it back
      within the same request-response cycle, with no job, queue or polling construct anywhere
      in the file
    evidence: |-
      const assessment = await handleDiagnoseRequest(dependencies, parsed.data);
        return reply.code(200).send(assessment);
  - node: constraints/the-diagnosis-and-simulation-routes-are-rate-limited
    held_at: >-
      the onRequest hook registered in createDiagnoseRoutesPlugin (lines 12-18), configured with
      the module-level constants at lines 7-8
    evidence: |-
      const RATE_LIMIT_MAX_REQUESTS_PER_MINUTE = 10;
      const RATE_LIMIT_WINDOW_MS = 60_000;
      ...
      createRateLimitHook({
            maxRequestsPerWindow: RATE_LIMIT_MAX_REQUESTS_PER_MINUTE,
            windowMs: RATE_LIMIT_WINDOW_MS,
          }),
  - node: contracts/investigation/diagnosis
    held_at: >-
      the POST /v1/diagnose registration and its handler's response (lines 19 and 33-34): body
      validated against diagnoseRequestSchema, then the assessment sent back as the response
    evidence: |-
      app.post(`${API_PREFIX}/diagnose`, (request, reply) => diagnoseHandler(dependencies, request, reply));
      ...
      const assessment = await handleDiagnoseRequest(dependencies, parsed.data);
      return reply.code(200).send(assessment);
  - node: contracts/system/guided-diagnosis
    held_at: nowhere
    evidence: >-
      the whole diagnoseHandler only parses the body, calls handleDiagnoseRequest and forwards
      whatever it returns as `assessment`; none of the capability's own terms — outcome,
      referral, text, degraded, deadline — appear anywhere in this file, so what is exposed here
      is the endpoint wiring and not the capability's content
