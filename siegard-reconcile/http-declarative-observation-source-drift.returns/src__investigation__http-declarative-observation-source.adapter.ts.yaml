looked_past: >-
  The Resolution<T>/PreparedCall control-flow decomposition (resolvePreparedCall, its four
  sequential resolve* steps, and the CallResult/Resolution helper types) is a code-structure
  choice with no domain fact of its own, so it is left to whatever pass judges construction rather
  than conformance; likewise the remainingBudgetMs === undefined fallback branch in
  effectiveTimeoutMsFor only exercises what ObserveConceptOptions already declares optional, so it
  states no new domain fact beyond that existing, out-of-file contract.
