looked_past: >-
  isBlocked is set to true in two branches and never set back to false anywhere in the file,
  and invalidateManifest() is called on the manifest-would-hold-no-hypothesis refusal but not
  on the manifest-position-occupied or case-version-not-draft ones — both look like
  implementation-shape questions about this hook's own state handling rather than a domain
  fact stated or denied, so left to the pass that reviews code shape.
