findings:
  - file: src/hooks/use-simulation-subject.ts
    where: "composedAttributes, line 50"
    evidence: |-
      if (field.value.trim() === "" || attributeMap.has(field.attribute)) {
    cost: >-
      An attribute input made of only spaces is silently treated the same as an untouched, truly
      empty input — dropped from the assembled subject and from the count isReady uses. The
      specification's own decided reading of an empty attribute input is scoped to the empty
      string exactly; whitespace-equivalence for this field is decided nowhere, so the next reader
      who wants to know what counts as "no attribute-value" here will find only the literal empty
      string in the specification and a wider rule living only in this file.
    correction: >-
      Either drop the .trim() and compare field.value === "" alone, matching the node's decided
      "left empty" reading, or have the specification decide and state the whitespace-equivalence
      for this field before the code applies it.
    kind: unstated
    node: rules/investigation/an-empty-attribute-input-is-no-attribute-value
  - file: src/hooks/use-simulation-subject.ts
    where: "isReady, line 96"
    evidence: |-
      const isReady = requester.trim() !== "" && subject.attributes.length > 0;
    cost: >-
      A requester made of only whitespace is treated as no requester for readying a simulate
      call. rules/investigation/a-simulation-carries-its-requester states only "a call whose
      payload carries no requester, or an empty one, is refused" — none of the specification's
      four scoped empty-string readings is stated with a whitespace extension for this field.
    correction: >-
      Compare requester !== "" alone, or have the specification decide and state
      whitespace-equivalence for the requester field before the code applies it.
    kind: unstated
    node: rules/investigation/a-simulation-carries-its-requester
