    held_at: "the assertion in \"records inconclusive no-data citing every non-ok evidence item, and never enters the pool for that hypothesis\""
    evidence: "{ hypothesis: 'h1', verdict: 'inconclusive', reason: 'no-data', citations: [{ concept: 'concept-denied' }, { concept: 'concept-timeout' }] }"
