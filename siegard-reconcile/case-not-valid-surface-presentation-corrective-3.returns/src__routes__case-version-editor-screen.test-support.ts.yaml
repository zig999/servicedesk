  - node: rules/knowledge/a-refusal-a-case-keyed-surface-cannot-name-is-presented-as-a-read-that-did-not-complete
    held_at: >-
      nowhere — apiErrorResponse is a generic error-response builder; it carries no code,
      no fixed status and no statement of its own, so which reading a refusal falls into
      is decided by whichever caller supplies the arguments, not by this file.
    evidence: |-
      export function apiErrorResponse(code: string, status: number, message: string): Response {
        return jsonResponse({ error: { code, message } }, status);
      }
  - node: rules/knowledge/a-revise-reads-its-drafts-declared-subject-type-even-when-that-draft-does-not-read-back-as-a-case
    held_at: >-
      nowhere — the only PATCH-related helpers here count and parse PATCH calls generically;
      neither inspects a subject type or a concept's declared acceptance.
    evidence: |-
      export function parsedPatchBody(fetchMock: ReturnType<typeof createFetchStub>): unknown {
        const patchCalls = fetchMock.mock.calls.filter(([, init]) => init?.method === "PATCH");
        const rawBody = patchCalls[0]?.[1]?.body;
        if (typeof rawBody !== "string") {
          throw new Error("expected exactly one PATCH call carrying a JSON string body");
        }
        return JSON.parse(rawBody);
      }
