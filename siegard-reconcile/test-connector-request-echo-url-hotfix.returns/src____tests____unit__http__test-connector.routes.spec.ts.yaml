      expect(body.error.details).toEqual({ address: '***REDACTED***/subjects/subject-value-1' });
      expect(body.request.headers.authorization).toBe('Bearer ***REDACTED***');
  - node: rules/integration/a-diagnostic-test-of-an-unreachable-connector-answers-as-a-completed-test
    held_at: the unreachable-connector test, lines 377-402
    evidence: |-
      expect(response.statusCode).toBe(200);
      expect(body.response.kind).toBe('unreachable');
      expect(body.response.error.code).toBe('ConnectorUnreachableError');
      expect(body.response.error.details).toEqual({ connector: 'a-connector' });
      expect('status' in body.response).toBe(false);

looked_past: >-
  The response-envelope shape the first two tests check (an outer HTTP 200 wrapping an inner
  `response.kind`/`status`/`headers`/`body`/`elapsedMs`, and `orphaned_placeholders`) and the
  distinction the last test draws between a `'timed-out'` outcome and an `'unreachable'` one when
  the capability's own timeout aborts the call are both domain facts this file states, but neither
  is settled by my four nodes or by the offered candidates (an API contract node is explicitly
  disclaimed elsewhere in the specification from declaring "an answer shape of its own," and the
  timeout/unreachable distinction is deferred by my own node-set text to a sibling rule outside
  it) — judging them would mean widening past the set and candidates I was given, so I leave them
  for whichever pass holds the DTO-shape and capability-timeout nodes.

