looked_past: >-
  The describe string cites "(domain/integration/capability-schema-draft-unresolved-reason)" and the
  exact label wording for each reason is never asserted (only length and distinctness) — both read
  as deliberate test-to-node traceability and as respecting the specification's own restraint that
  wording belongs to the interface, not a domain-fact departure, so neither is reported here.
