      file asserts carries only Save changes and Cancel, no release-condition disclosure
  - node: rules/knowledge/an-abandoned-case-version-edit-writes-nothing
    held_at: nowhere
    evidence: >-
      expect(within(footer).getByRole("button", { name: "Cancel" })).toBeTruthy(); — only the
      control's presence is asserted; no test clicks it or checks that leaving writes nothing
      or returns the curator to the originating surface
  - node: contracts/knowledge/case-query
    held_at: >-
      the split between the validated version read and the own-record read in
      enrichedNotValidHandlers
    evidence: >-
      [`GET ${VERSION_PATH}`]: notValidResponse,
      [`GET ${VERSIONS_LIST_PATH}`]: () => jsonResponse({ data: [{ version: 3, state: "draft" }] }),
      [`GET ${DECLARED_ATTRIBUTES_PATH}`]: () => jsonResponse(record),
