      the two "omits/leaves" citation-shape tests, lines 85-98 and 100-111
    evidence: |-
      expect('field' in citation!).toBe(false);
      expect(citation).toEqual({ concept: 'concept-timeout' });
  - node: domain/investigation/verdict
