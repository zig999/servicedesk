looked_past: >-
  The "before any revisions listing has answered" and "revisions listing fails" cases also hide
  the state cell, but these are transient/error states the pinned-revision-state rule's own
  "consistency: eventual" already contemplates rather than a settled business decision, and the
  "draft-version load with a malformed manifest fixture" describe block tests defensive rendering
  against a manifest shape the domain model (manifest-entry's required hypothesis-revision
  reference) already makes impossible in practice — both are engineering robustness, not a domain
  fact for this pass to weigh.
