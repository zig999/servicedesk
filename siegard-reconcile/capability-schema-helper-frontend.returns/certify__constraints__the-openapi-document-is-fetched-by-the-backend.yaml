certified:
  - node: constraints/the-openapi-document-is-fetched-by-the-backend
    state: partial
    tests:
      - file: src/hooks/use-capability-schema-helper.spec.ts
        name: >-
          never issues a request whose URL is the operator-named link itself, once that link is named
      - file: src/hooks/use-capability-schema-helper.spec.ts
        name: >-
          lists the operations the shared hook's own read answers for the link, touching no other operations route
      - file: src/hooks/use-capability-schema-helper.spec.ts
        name: >-
          sends exactly {link, path, method} from the chosen operation, and exposes the drafted outcome once it resolves
    why: >-
      The operations-listing half of the fact is exercised for this one hook and would fail if it
      stopped holding: with fetch stubbed and the link named, the dedicated test asserts no requested
      URL equals the operator-named link, and the criterion-3 test asserts the stronger positive —
      every URL requested during the listing starts with the backend's own read route — so a direct
      fetch of the document during listing fails both. Three stated parts go unexercised. First, the
      capability-schema-draft half is only touched incidentally: the criterion-7 test's fetch mock
      answers any non-listing URL with a draft body, and its `waitFor(() => expect(calls).toHaveLength(1))`
      can be satisfied at the moment the first call lands, so a hook that also fetched the document's
      own URL while drafting is caught only if the extra call happens to arrive first or before the
      poll settles; that assertion exists to pin the request body for criterion 7 and will be changed
      the day the body changes, so nothing marks the constraint as load-bearing there. Second, the
      connector configuration draft the statement names alongside the capability schema draft is
      generated by a different frontend module, and nothing in the offered file names a link on that
      path or observes what it requests. Third, the statement closes on "no frontend module issues
      that fetch directly" — a claim over every frontend module — while the proof observes one hook;
      a module that fetched the document's URL outside `useCapabilitySchemaHelper` leaves every
      assertion in this file passing. The dedicated test also compares by exact string equality
      against the named link, so a direct fetch of the same document under a URL that differs by a
      query string or a normalized form passes it, though the criterion-3 test's route-prefix
      assertion catches that case for the listing path specifically.
    remainder: untestable
    remainder_why: >-
      No finite set of behavioural tests closes the remainder as the node states it. The connector-
      configuration-draft half alone would be testable — one input, an operator-named OpenAPI link
      supplied to the connector configuration helper, against one expected result, that every request
      the module issues goes to the backend route and none to the link itself — and a draft-path test
      of this hook that fails on any request outside the two backend routes would lift the incidental
      assertion to a load-bearing one. But the statement's closing clause is a totality over every
      frontend module, and the node's own fitness names how it is decided: "a dependency and
      network-call audit over the frontend module finds no direct request to an OpenAPI document's own
      URL". That is a fact about where code sits, spanning files no test enumerates; a module added
      tomorrow that issues the fetch is outside anything the offered proof, or any extension of it
      over known entry points, observes.
