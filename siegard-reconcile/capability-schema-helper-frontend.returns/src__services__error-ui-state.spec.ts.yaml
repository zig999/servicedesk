findings:
  - file: src/services/error-ui-state.spec.ts
    where: "the test at lines 219-227, \"resolves OpenApiDocumentNotFetchedError, OpenApiDocumentNotReadableError and OpenApiOperationNotFoundError to the shared generic-error state rather than a code of their own (capability schema helper's refusal-stated-to-the-operator criterion 8)\""
    evidence: |-
      const kinds = [
        "OpenApiDocumentNotFetchedError",
        "OpenApiDocumentNotReadableError",
        "OpenApiOperationNotFoundError",
      ].map((code) => uiStateForApiError(new ApiError(code, "message")).kind);

      expect(kinds).toEqual(["generic-error", "generic-error", "generic-error"]);
    cost: >-
      A caller of uiStateForApiError — the classification this test fixes in place — cannot
      tell an unfetchable link, an unreadable document and a missing operation apart: all three
      collapse into the same "generic-error" kind the table also gives a code it does not
      recognise at all. A screen built on this kind has nothing left to read which of the three
      conditions answered the refusal, so it cannot state that distinction to the operator, and
      the test's own citation of the schema-helper refusal rule as its reason makes this look
      like proof of compliance rather than the opposite of it.
    kind: contradicts
    correction: >-
      The mapping (or whichever surface is meant to carry this disclosure) should give each of
      the three conditions a kind of its own, distinct from the other two and from the plain
      "generic-error" fallback, and this test should assert that distinction rather than the
      three codes' identity.
    node: rules/integration/a-refused-schema-draft-states-its-refusal-to-the-operator
