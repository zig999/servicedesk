    evidence: |-
      orphaned_placeholders: z.array(z.string()).readonly(),
  - node: rules/integration/a-diagnostic-test-of-an-unreachable-connector-answers-as-a-completed-test
    held_at: >-
      the 'unreachable' branch of testConnectorOutcomeSchema (lines 53-57), together with
      testConnectorUnreachableErrorSchema (lines 35-39) — no status field accompanies this
      branch, matching "no response status"
    evidence: |-
      z.object({
          kind: z.literal('unreachable'),
          error: testConnectorUnreachableErrorSchema,
          elapsedMs: z.number().nonnegative(),
        }),
      const testConnectorUnreachableErrorSchema = z.object({
        code: z.string().min(1),
        message: z.string().min(1),
        details: z.object({ connector: z.string().min(1) }),
      });
  - node: rules/integration/a-connector-configuration-is-tested-through-a-registered-capability
    held_at: the testConnectorRequestSchema, lines 18-24 (capability, connector, subject, requester)
    evidence: |-
      export const testConnectorRequestSchema = z.object({
        capability: capabilityIdentitySchema,
        connector: z.string().min(1),
        subject: subjectSchema,
        requester: z.string().min(1),
        input: z.unknown().optional(),
      });
  - node: rules/integration/a-diagnostic-response-masks-a-resolved-credential
