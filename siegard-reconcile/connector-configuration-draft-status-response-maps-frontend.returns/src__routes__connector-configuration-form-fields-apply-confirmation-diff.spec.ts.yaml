        return jsonResponse({ operations: [HELPER_OPERATION] });
      }
  - node: rules/integration/a-configuration-helper-operation-is-chosen-from-the-fetched-documents-listing
    held_at: chooseHelperOperation, which selects a listed option rather than typing a path or method
    evidence: |-
      async function chooseHelperOperation(path: string, method: string): Promise<void> {
        fireEvent.click(screen.getByLabelText("Operação"));
        const option = await screen.findByRole("option", { name: `${path} — ${method}` });
        fireEvent.mouseDown(option);
      }
  - node: rules/integration/a-connector-configuration-draft-response-carries-no-capability
    held_at: the draftResponse fixture, which carries no capability-related field
    evidence: |-
      return jsonResponse({ connector: CONNECTOR, configuration: configurationText, unresolved: [], generated_credentials: [] });
