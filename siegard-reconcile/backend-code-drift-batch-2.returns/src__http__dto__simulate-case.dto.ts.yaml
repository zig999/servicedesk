looked_past: >-
  caseRefSchema's slug/version pair (lines 16-19) and simulateCaseRequestSchema's requester field
  are plain identifier/actor plumbing with no node in this pack or the wider specification
  stating a conflicting shape for them, so they were not carried into a finding;
  resolvedOutcomeSchema's extra `determining` field beyond domain/knowledge/resolution's two
  attributes was checked against domain/knowledge/case-version (a candidate, opened) and matches
  that node's own account of what resolve-outcome returns, so it is not reported as drift
  against domain/knowledge/resolution.
