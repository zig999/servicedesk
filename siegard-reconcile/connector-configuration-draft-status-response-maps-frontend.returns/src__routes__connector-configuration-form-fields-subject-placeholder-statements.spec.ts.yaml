findings:
  - file: src/routes/connector-configuration-form-fields-subject-placeholder-statements.spec.ts
    where: >-
      the third describe block ("the subject-placeholder statement is read from the capability
      list this area already holds, adding no second registry read (criterion 5)") and its single
      test
    evidence: |-
      it("issues a single request to the capability registry despite repeated edits to the Configuration field", async () => {
        const fetchMock = await mountWithCapabilities([capability()]);
        await typeConnector(CONNECTOR);
        await typeConfiguration(JSON.stringify({ address: "${subject:account-id}" }));
        await screen.findByText(subjectPlaceholderDeclaredText("account-id"));
        await typeConfiguration(JSON.stringify({ address: "${subject:account-id}", extra: "x" }));
        await screen.findByText(subjectPlaceholderDeclaredText("account-id"));
        const capabilitiesCalls = fetchMock.mock.calls.filter(
          ([input]) => (typeof input === "string" ? input : input.toString()) === CAPABILITIES_PATH,
        );
        expect(capabilitiesCalls).toHaveLength(1);
      });
    cost: >-
      This pins a specific caching/consistency guarantee — that the capability registry is read
      once and reused across every edit to the Configuration field — as a binding behavioral
      contract. Neither this node pack nor a specification-wide search surfaces any node that
      requires this. A future implementer who re-reads the registry on each edit would be breaking
      a guarantee that exists only in this test file, with no specification account of why it
      holds or how far it may be relaxed.
    kind: unstated
    correction: >-
      State, in the governing rule or a sibling node, whether and when the capability list
      backing this statement may be re-read, so this test enforces a decided fact rather than an
      undocumented one.
