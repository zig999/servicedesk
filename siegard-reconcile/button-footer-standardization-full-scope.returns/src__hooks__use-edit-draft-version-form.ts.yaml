looked_past: >-
  Noticed but not reported as a spec finding: isReadOnly is computed from
  record.state === "released" alone while isBlocked and canDiscard also check the
  local isReleased flag, so immediately after a successful release and before the
  invalidated query refetches, isReadOnly could read false while isBlocked reads
  true — a reactivity gap the server-side refusal (setStatus("conflict") on a
  stale PATCH) still covers, not a misstated domain fact; the declared
  `isFirstVersion?: boolean` field is never populated in the returned object; and
  the effect that calls resetFormFrom on every change to versionQuery.data would
  also overwrite an in-progress, unsubmitted edit on a background refetch (e.g.
  window refocus) rather than only on the curator's own leaving — a robustness
  question about this hook's own reactivity, not a fact the source asserts against
  a node.
