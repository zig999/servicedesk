looked_past: >-
  The "route to the named version's own editor" describe title cites "criteria 1-6" while the
  test body only numbers criteria 1-5, with a sixth (unrecognized error code) covered by a
  separate describe block ("UNDERDETERMINED entry 1") — a labeling/organization detail rather
  than a domain fact, left for whoever reviews test authoring; likewise the "this task's own
  recorded inference: no navigate-away" retry behavior in the load-failure test names its own
  provenance as a planning decision rather than a specification node, and is left to whoever
  checks that record rather than judged here as an unstated domain fact.
