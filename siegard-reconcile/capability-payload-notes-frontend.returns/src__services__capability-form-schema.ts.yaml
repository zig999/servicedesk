findings:
  - file: src/services/capability-form-schema.ts
    where: "line 3, the CAPABILITY_NATURES constant"
    evidence: |-
      export const CAPABILITY_NATURES = ["read-only", "mutating"] as const;
    cost: >-
      The enumeration's two values now live in two places — the specification's
      node and this frontend constant used to build the form's zod enum. A future
      change to domain/integration/capability-nature (a renamed value, a third
      nature added) has no reason to touch this file, so the form's accepted
      values can silently drift from what the specification declares, and whoever
      edits the node will not know a second copy needs the same edit.
    kind: contradicts
    node: domain/integration/capability-nature
    correction: >-
      Derive the form's allowed nature values from a single shared source (the
      specification's own enumeration, surfaced once) instead of restating
      "read-only" and "mutating" as a local TypeScript constant.
