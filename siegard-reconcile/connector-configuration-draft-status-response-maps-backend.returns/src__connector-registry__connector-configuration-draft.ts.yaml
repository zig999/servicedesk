findings:
  - file: src/connector-registry/connector-configuration-draft.ts
    where: "the local type alias at line 25, feeding the `ending` field of ConnectorConfigurationDraftStatusReading (lines 27-31)"
    evidence: |-
      type ConnectorConfigurationDraftStatusReadingEnding = 'ok' | 'unavailable' | 'denied' | 'timeout';
    cost: >-
      domain/investigation/evidence-result already names this exact four-value vocabulary and
      already has one canonical home in code, src/investigation/evidence-result.ts, which exports
      EVIDENCE_RESULTS and EvidenceResult for exactly this purpose. This file re-derives the same
      four literals as a private, unexported alias instead of referencing that type, so the
      vocabulary now has two independent declarations; if evidence-result.ts's set ever changes,
      nothing ties this alias to it and the two can silently disagree with no type error to catch it.
    kind: contradicts
    correction: >-
      import and use EvidenceResult from src/investigation/evidence-result.ts as the type of
      `ending` instead of declaring ConnectorConfigurationDraftStatusReadingEnding locally.
    node: domain/investigation/evidence-result
