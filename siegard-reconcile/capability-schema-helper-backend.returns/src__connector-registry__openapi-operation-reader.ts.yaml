  - file: src/connector-registry/openapi-operation-reader.ts
    where: "operationEntry() computing operationKey, and readOpenApiOperation()'s return of `method`, lines 94 and 130-139"
    evidence: |-
      const operationKey = method.toLowerCase();
      ...
      return { pathItem, operation: rawOperation, operationKey };
      ...
      return {
        method: operationKey,
    cost: >-
      The drafted configuration's method comes back lower-cased (e.g. "get") instead of the
      upper-cased verb the executing connector's shape requires ("GET"). An operator reviewing
      the draft sees a method spelled the way the document happens to key its path item rather
      than the value the HTTP call itself carries, and a later comparison of this drafted method
      against a currently-registered configuration's own upper-case method would disagree on
      case alone, reporting a mismatch that isn't one.
    kind: contradicts
    node: rules/integration/a-connector-configuration-draft-states-the-chosen-operations-method
    correction: >-
      Upper-case the value before assigning it to `method` (e.g. `method: operationKey.toUpperCase()`),
      so an operation the document names under `get` is drafted as method `GET` exactly as the rule
      states.
