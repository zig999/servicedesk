findings:
  - file: src/routes/version-manifest-screen.tsx
    where: "RevisionSelect, lines 169 and 192-203"
    evidence: "const pinnedRevisionState = revisions.find((item) => item.revision === row.revision)?.state;\n...\n{pinnedRevisionState !== undefined && (\n          <span className=\"inline-flex shrink-0 items-center gap-1 text-sm\">"
    cost: "revisions is the raw, possibly-paged answer for that hypothesis (fetched with no offset/limit, so a default page a curator has not paged past); optionsWithPinnedRevision already compensates for this same truncation when showing the revision number, but pinnedRevisionState does not — when the pinned revision falls off that page, pinnedRevisionState is undefined and the whole draft/released badge is skipped. A curator composing the manifest then sees an entry with no state indicator at all, and only discovers the pin is still draft when a later release is refused — exactly the silence the rule states the disclosure exists to prevent."
    kind: contradicts
    correction: "resolve the pinned revision's own state the same way its number is resolved — e.g. fold the pinned revision into (or alongside) the fetched list before reading .state, rather than searching only the unmodified page — so the badge renders unconditionally, whatever page answered revisions."
    node: rules/knowledge/a-presented-manifest-entry-states-its-pinned-revisions-state

looked_past: "The hasNewerRevision / \"Newer revision available\" disclosure in RevisionSelect compares a pin against the hypothesis's highest revision, which is a-presented-manifest-entry-says-whether-its-pinned-revision-is-the-latest's fact, a node outside this file's set, so it is not judged here."
