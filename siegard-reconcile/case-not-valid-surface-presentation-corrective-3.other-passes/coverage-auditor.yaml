coverage:
  - criterion: >-
      Opening the version editor for a version whose read is refused because a validator rule of
      validation-runs-at-every-read does not hold for that version at that reading states
      explicitly that the version does not read back as a case.
    state: covered
    tests:
      - file: src/routes/case-version-editor-screen-not-valid.spec.ts
        name: "CaseVersionEditorScreen — a version refused for validation states explicitly that it does not read back as a case... > renders the explicit statement and no attribute of the version or its manifest when validation refuses the read, renders neither that statement nor any load-error text once the same version reads back as a validated case"
      - file: src/routes/case-version-editor-screen-not-valid.spec.ts
        name: "CaseVersionEditorScreen — no attribute of the version recovered from an earlier successful read still cached reaches the not-valid statement... > renders only the not-read-back-as-a-case statement, never an attribute of the version left over in the query cache from an earlier successful read, once a later reading of the same version is refused for validation"
  - criterion: >-
      What that screen states for a version that does not read back as a case is distinguishable
      from what the same screen states for a read of that version that did not complete, and
      neither is presented in place of the other.
    state: covered
    tests:
      - file: src/routes/case-version-editor-screen-not-valid.spec.ts
        name: "CaseVersionEditorScreen — a version refused for validation states explicitly that it does not read back as a case... > renders the explicit statement and no attribute of the version or its manifest when validation refuses the read, renders neither that statement nor any load-error text once the same version reads back as a validated case"
      - file: src/routes/case-version-editor-screen-not-valid.spec.ts
        name: "CaseVersionEditorScreen — a refusal carrying an error code the screen holds no presentation of its own for states only the read-did-not-complete statement... > renders only the fixed read-did-not-complete statement, never the not-valid statement, the refusal's own error code, its own message, or any attribute the refusal carries, when the version's own read fails with a code the screen holds no presentation of its own for"
    why: >-
      Both directions are asserted — the refused reading shows the not-read-back statement and not
      the load-error text, the unrecognised-code reading shows the load-error text and not the
      not-read-back statement — each against the literal sentence, so a merge of the two texts
      would fail.
  - criterion: >-
      The route that screen carries to that version's own manifest is offered on that same
      reading, with no read of the version having read back as a case first.
    state: covered
    tests:
      - file: src/routes/case-version-editor-screen-not-valid.spec.ts
        name: "CaseVersionEditorScreen — the route to this version's own manifest on the reading refused for validation (criterion 3) > renders a Manifest link targeting this same version's own manifest route on the same reading that refused the version for validation, with no successful read of the version having occurred first"
      - file: src/routes/case-version-editor-screen-not-valid.spec.ts
        name: "CaseVersionEditorScreen — the route to this version's own manifest is offered on every reading, not only the one refused for validation... > renders a Manifest link targeting this same version while the read is still pending, once it has failed to complete, once it has answered a validated case, and once it has been refused for validation alike"
    why: >-
      The refused-reading test pins the href to this same slug and version with the version GET
      refused for the whole mount, so no successful read precedes it. Recorded as a fact a reader
      routes, not a gap: the second test asserts the link on the pending, failed and ready readings
      as well, which is more than this criterion states — it rests on
      rules/knowledge/a-presented-case-version-offers-a-route-to-its-own-manifest-on-every-reading
      rather than on the criterion, and would fail on a later change that kept criterion 3 true.
  - criterion: >-
      A refusal of that screen's read of the version carrying an error code the screen holds no
      presentation of its own for still presents exactly what the screen states for a read that did
      not complete, disclosing neither the error code, nor the refusal's message, nor any value the
      refusal carries.
    state: covered
    tests:
      - file: src/routes/case-version-editor-screen-not-valid.spec.ts
        name: "CaseVersionEditorScreen — a refusal carrying an error code the screen holds no presentation of its own for states only the read-did-not-complete statement... > renders only the fixed read-did-not-complete statement, never the not-valid statement, the refusal's own error code, its own message, or any attribute the refusal carries, when the version's own read fails with a code the screen holds no presentation of its own for"
      - file: src/routes/case-version-editor-screen-not-valid.spec.ts
        name: "CaseVersionEditorScreen — no attribute of the version recovered from an earlier successful read still cached reaches the read-did-not-complete statement... > renders only the read-did-not-complete statement, never an attribute of the version left over in the query cache from an earlier successful read, once a later reading of the same version fails with a code the screen holds no presentation of its own for"
    why: >-
      The refusal is stubbed with an unrecognised code, a distinctive message and a details body
      carrying seven version and manifest values, and each is asserted absent from the DOM beside
      the fixed sentence.
  - criterion: >-
      Opening the manifest builder for a version whose read is refused because a validator rule of
      validation-runs-at-every-read does not hold for that version at that reading states
      explicitly that the version does not read back as a case.
    state: covered
    tests:
      - file: src/routes/version-manifest-screen-not-valid.spec.ts
        name: "VersionManifestScreen — a version refused for validation states explicitly that it does not read back as a case... > renders the explicit statement and no manifest entry when validation refuses the read, renders neither that statement nor any load-error text once the same version reads back as a validated case"
      - file: src/routes/version-manifest-screen-not-valid.spec.ts
        name: "VersionManifestScreen — no manifest entry recovered from an earlier successful read still cached reaches the not-valid statement... > renders only the not-read-back-as-a-case statement, never a manifest entry left over in the query cache from an earlier successful read, once a later reading of the same version is refused for validation"
  - criterion: >-
      What that screen states for a version that does not read back as a case is distinguishable
      from what the same screen states for a read of that version that did not complete, and
      neither is presented in place of the other.
    state: covered
    tests:
      - file: src/routes/version-manifest-screen-not-valid.spec.ts
        name: "VersionManifestScreen — a version refused for validation states explicitly that it does not read back as a case... > renders the explicit statement and no manifest entry when validation refuses the read, renders neither that statement nor any load-error text once the same version reads back as a validated case"
      - file: src/routes/version-manifest-screen-not-valid.spec.ts
        name: "VersionManifestScreen — a refusal carrying an error code the screen holds no presentation of its own for states only the read-did-not-complete statement... > renders only the fixed read-did-not-complete statement, never the not-valid statement, the refusal's own error code, its own message, or any value it carries, when the version's own read fails with a code the screen holds no presentation of its own for"
  - criterion: >-
      On that same reading the screen offers the act of adding a hypothesis to that version's
      manifest, including for a version whose manifest currently holds no entry at all.
    state: covered
    tests:
      - file: src/routes/version-manifest-screen-not-valid.spec.ts
        name: "VersionManifestScreen — the add-hypothesis act on the reading refused for validation (criterion 3) > renders the + Add hypothesis link targeting this version's own new-hypothesis route on the reading refused for validation, with no successful read of the version having occurred first"
      - file: src/routes/version-manifest-screen-not-valid.spec.ts
        name: "VersionManifestScreen — the add-hypothesis act is offered on every reading short of one answering the version released... > renders the + Add hypothesis link while the read is pending, once it has failed to complete, once it has been refused for validation, once it has answered a draft version with entries and once with none, and withholds it only once it has answered a version released"
    why: >-
      The refused reading's fixture carries no manifest entry at all, and the second test asserts
      the offer again on an answered draft whose manifest is empty, so the "no entry at all" clause
      is exercised on both. Recorded as a fact a reader routes, not a gap: that second test also
      asserts the act is withheld once the version reads back released, which no criterion of this
      task states — it rests on
      rules/knowledge/a-manifest-surface-offers-placing-a-hypothesis-on-every-reading-but-a-released-versions,
      and would fail on a later change that kept this criterion true.
  - criterion: >-
      A refusal of that screen's read of the version carrying an error code the screen holds no
      presentation of its own for still presents exactly what the screen states for a read that did
      not complete, disclosing neither the error code, nor the refusal's message, nor any value the
      refusal carries.
    state: covered
    tests:
      - file: src/routes/version-manifest-screen-not-valid.spec.ts
        name: "VersionManifestScreen — a refusal carrying an error code the screen holds no presentation of its own for states only the read-did-not-complete statement... > renders only the fixed read-did-not-complete statement, never the not-valid statement, the refusal's own error code, its own message, or any value it carries, when the version's own read fails with a code the screen holds no presentation of its own for"
  - criterion: >-
      A refusal of a move, a repin or a remove made through that screen still presents the
      statement that screen already holds for that named refusal, unchanged by this task.
    state: partial
    tests:
      - file: src/routes/version-manifest-screen-remove-refusal-telling.spec.ts
        name: "VersionManifestScreen — the manifest surface's own presentation for each composing refusal it names, and the generic notice for every other one... > states the position-occupied refusal and the would-hold-no-hypothesis refusal distinctly from each other, and discloses no code, message or value for a place or a remove refused with any other code"
      - file: src/hooks/use-manifest-builder-unnamed-refusal-disclosure.spec.ts
        name: "useManifestBuilder — a move refused for a reason this hook holds no classification of its own for discloses neither the refusal's own error code nor its own message... > raises only the fixed generic-failure toast, never the refusal's own error code or its own message, when a move is refused with a code other than the two this hook recognises"
    why: >-
      Two of the three acts the criterion names are reached — a move refused as
      ManifestPositionOccupiedError and a remove refused as ManifestWouldHoldNoHypothesisError.
      Nothing in the set issues a repin refusal, so that act's already-held statement is
      unexercised entirely. For the two that are reached, no test asserts what either statement
      says: the test reads each row alert's textContent and requires only that it be non-empty and
      that the two differ from each other, so a telling reworded into a sentence the screen never
      held would still pass — which is the half the criterion's "unchanged by this task" names. The
      implementation record itself discloses that the remove telling was in fact changed by this
      task, from a silent invalidate to a new REMOVE_BLOCKED_MESSAGE alert; no test in this set
      distinguishes the statement the screen already held from the one this task introduced. The
      hook-level test bears only on refusals the screen holds no presentation for, not on a named
      one.
  - criterion: >-
      Opening the New Hypothesis screen for a case's draft version whose read is refused because a
      validator rule of validation-runs-at-every-read does not hold for that draft version at that
      reading presents the hypothesis composition form.
    state: covered
    tests:
      - file: src/routes/hypothesis-revision-screen-case-not-valid.spec.ts
        name: "HypothesisRevisionScreen — the composition form is presented, on both entry points, while the draft version's own read is refused (criterion 1, criterion 3) › renders the hypothesis composition form for New Hypothesis and for Revise Hypothesis when GET .../versions/{version} is refused with CaseVersionNotValidError, rather than the read-did-not-complete statement"
  - criterion: >-
      A hypothesis composed on that screen and submitted lands in that same draft version's
      manifest, with no read of that draft version having read back as a case first.
    state: partial
    tests:
      - file: src/routes/hypothesis-revision-screen-case-not-valid.spec.ts
        name: "HypothesisRevisionScreen — composing and submitting a hypothesis while the draft version's own read is refused for failing validation lands it through the offered manifest route (criterion 2) › issues POST /v1/cases/{slug}/hypotheses built from the composed form's own content and offers the route to this same draft version's own manifest on success, with no successful read of the draft version having occurred first"
      - file: src/routes/hypothesis-revision-screen-case-not-valid.spec.ts
        name: "HypothesisRevisionScreen — a successful compose-and-submit on the refused reading leaves the placement into the manifest to the curator's own subsequent act (UNDERDETERMINED, from the specification, entry 1) › issues no PUT to this draft version's own manifest-placement endpoint on a successful revise-hypothesis submission; only the route to the manifest builder is offered, leaving where the entry lands to the curator's own choice made there"
    why: >-
      The "with no read of that draft version having read back as a case first" half is exercised:
      the version GET is refused for the whole mount and the submit still issues one POST carrying
      the form's own content. The "lands in that same draft version's manifest" half is not.
      Nothing in the set observes the composed hypothesis standing in that version's manifest; the
      submit test stops at the POST to the hypotheses endpoint and at the Open Manifest Builder
      control navigating to the manifest path, and the second test asserts affirmatively that no
      placement request against the version's manifest is ever issued. The implementation record's
      own inference reads the landing as route-reachability, and no test in this set tells a
      reachable route apart from an entry that never lands.
  - criterion: >-
      Opening the Revise Hypothesis screen for a case's draft version in that same condition
      presents the composition form on the same terms as the New Hypothesis screen.
    state: covered
    tests:
      - file: src/routes/hypothesis-revision-screen-case-not-valid.spec.ts
        name: "HypothesisRevisionScreen — the composition form is presented, on both entry points, while the draft version's own read is refused (criterion 1, criterion 3) › renders the hypothesis composition form for New Hypothesis and for Revise Hypothesis when GET .../versions/{version} is refused with CaseVersionNotValidError, rather than the read-did-not-complete statement"
    why: >-
      One test walks both entry points under the same refusal and makes the same three assertions
      against each — the name field, the Save control, and the absence of the
      read-did-not-complete statement — so "on the same terms" is what it compares.
  - criterion: >-
      A failure of that screen's read of the glossary, or of its read of the revisions, still
      presents the statement the screen makes for a read that did not complete, distinct from what
      it presents for its read of the draft version.
    state: covered
    tests:
      - file: src/routes/hypothesis-revision-screen-case-not-valid.spec.ts
        name: "HypothesisRevisionScreen — a failure reading the glossary, or reading the hypothesis's own revisions, still presents the read-did-not-complete statement, distinct from the case-version statement (criterion 4) › renders the read-did-not-complete statement, never the composition form or the case-version statement, when GET /v1/glossary/concepts fails while the draft version reads back cleanly"
      - file: src/routes/hypothesis-revision-screen-case-not-valid.spec.ts
        name: "HypothesisRevisionScreen — a failure reading the glossary, or reading the hypothesis's own revisions, still presents the read-did-not-complete statement, distinct from the case-version statement (criterion 4) › renders the read-did-not-complete statement, never the composition form or the case-version statement, when the hypothesis's own revisions read fails while the draft version reads back cleanly"
      - file: src/routes/hypothesis-revision-screen-case-not-valid.spec.ts
        name: "HypothesisRevisionScreen — the read-did-not-complete statement for a revisions read failure shows nothing a prior successful read of that same data left cached (UNDERDETERMINED, from the specification, entry 2) › renders only the fixed read-did-not-complete statement, never a hypothesis revision recovered from an earlier successful read still cached, once that same revisions read fails again"
    why: >-
      Both named reads are exercised separately, each with the draft version reading back cleanly,
      and each asserts the case-version statement absent, so the distinctness the criterion states
      is what fails if the two merge.
  - criterion: >-
      A refusal of that screen's read of the draft version carrying an error code the screen holds
      no presentation of its own for still presents exactly what the screen states for a read that
      did not complete, disclosing neither the error code, nor the refusal's message, nor any value
      the refusal carries.
    state: covered
    tests:
      - file: src/routes/hypothesis-revision-screen-case-not-valid.spec.ts
        name: "HypothesisRevisionScreen — a refusal of the draft version's own read carrying an error code the screen holds no presentation of its own for is presented exactly as a read that did not complete, disclosing nothing further (criterion 5) › renders the same read-did-not-complete statement an unrelated failed read renders, and discloses neither the refusal's own error code, its own message, nor any value it carries"
    why: >-
      The one test mounts the unmapped-code refusal and then a genuinely incomplete read in the
      same body and finds the same fixed sentence for both, and asserts the code, the message and
      the details value each absent.
