looked_past: >-
  writeTerms replaces a whole vocabulary table on every call (`DELETE FROM ${table}` then
  reinsert only the given terms); whether any caller ever invokes it with a list missing a
  released outcome or a term another record still names is a question about glossary.service.ts's
  own usage of this method, not about this repository file.
