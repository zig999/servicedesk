    held_at: "actionsForRow — the unconditional Simulate link, present for every row regardless of version.state"
    evidence: |-
      <Button type="button" variant="secondary" asChild>
        <Link to="/cases/$slug/versions/$version/simulate" params={params}>
          Simulate
        </Link>
      </Button>
  - node: contracts/knowledge/case-query
    held_at: "VersionsPanel — the useCaseVersions(slug) call implementing list-case-versions"
    evidence: "const { data, isLoading, isError, refetch } = useCaseVersions(slug);"
  - node: domain/knowledge/case
    held_at: "the slug param threading the case identity through the screen, and the New draft link implementing create-draft"
    evidence: |-
      const { slug } = useParams({ from: "/cases/$slug" }); ... <Link to="/cases/$slug/versions/new" params={{ slug }}>
                New draft
              </Link>
  - node: domain/knowledge/case-version
    held_at: "toRow — mapping a version's version and state into the row shown"
    evidence: |-
      return {
        id: version.version,
        version: version.version,
        state: STATE_CELL[version.state],
        actions: actionsForRow(slug, version),
      };
  - node: domain/knowledge/case-version-state
    held_at: "STATE_CELL, keyed exactly by the enumeration's two values"
    evidence: |-
      const STATE_CELL: Record<CaseVersionState, { color: string; label: string }> = {
        draft: { color: "bg-warning", label: "Draft" },
        released: { color: "bg-success", label: "Released" },
      };
