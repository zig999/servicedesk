looked_past: >-
  the `isBlocked` flag's own gating semantics (what makes a loaded, unedited form blockable or not
  beyond the invalidity case this file exercises) live in the hook implementation outside this
  file's scope, and reviewing that mechanism as a UI concern rather than a domain fact is another
  judgment's.
