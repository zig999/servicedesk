findings:
- file: src/http/dto/simulate-case.dto.ts
  where: the verdict literals inside evaluationSchema's discriminated union, lines 42, 50, 58
  evidence: 'verdict: z.literal(''confirmed''), / verdict: z.literal(''refuted''), / verdict: z.literal(''inconclusive''),'
  cost: the sibling src/http/dto/simulate-hypothesis.dto.ts imports the same vocabulary — import { VERDICTS } from '../../investigation/verdict.js'; and const [CONFIRMED_VERDICT, REFUTED_VERDICT, INCONCLUSIVE_VERDICT] = VERDICTS; — so this file hardcodes a second copy of the same three strings; if a verdict value is ever added or renamed at its one declared source, this schema has no dependency on that source and can silently drift out of sync while still looking correct.
  kind: contradicts
  node: domain/investigation/verdict
  correction: import VERDICTS from '../../investigation/verdict.js' and build the three literals from it, matching simulate-hypothesis.dto.ts's own pattern.
- file: src/http/dto/simulate-case.dto.ts
  where: citations on the confirmed and refuted branches of evaluationSchema, lines 43 and 51
  evidence: 'citations: z.array(citationSchema).min(1).readonly(),'
  cost: the "at least one citation" threshold is stated once, by rules/investigation/a-decided-evaluation-cites-evidence ("Every confirmed or refuted evaluation carries at least one citation"), which is not among the nodes domain/investigation/evaluation and domain/investigation/citation state as this file's own shape; re-deriving the number here as this schema's own .min(1) gives the rule a second home, and the day the business changes that threshold nobody can tell from this file alone which value is the decided one.
  kind: contradicts
  node: rules/investigation/a-decided-evaluation-cites-evidence
- file: src/http/dto/simulate-case.dto.ts
  where: usage, elapsed_ms and prompt on the confirmed and refuted branches of evaluationSchema, lines 44-46 and 52-54
  evidence: "usage: usageSchema.optional(),\n    elapsed_ms: z.int().optional(),\n    prompt: z.string().optional(),"
  cost: domain/investigation/evaluation states these three are "present exactly when a call happened, absent when reason no-data means judgment was never called at all" — a state only the inconclusive branch can reach, since deciding confirmed or refuted always required the judgment call to run; marking them optional here too means a response missing usage/elapsed_ms/prompt on a confirmed or refuted evaluation validates as if the specification allowed that combination, though it never does, and a consumer reading this schema alone would not learn that these are actually mandatory there.
  kind: contradicts
  node: domain/investigation/evaluation
  correction: require usage, elapsed_ms and prompt in the confirmed and refuted branches; keep them optional only in the inconclusive branch where reason is no-data.
- file: src/http/dto/simulate-case.dto.ts
  where: costSchema, lines 89-93
  evidence: "const costSchema = z.object({\n  calls: z.number(),\n  input_tokens: z.number(),\n  output_tokens: z.number(),\n});"
  cost: domain/investigation/cost declares calls, input_tokens and output_tokens as integers; z.number() accepts any finite value including fractions, so a malformed cost (e.g. an averaged or miscomputed count) passes this response validation though the specification's own shape never allows a non-integer here — and usageSchema, four lines above in the same file, validates the identically-named input_tokens/output_tokens as z.int(), so the same fact is checked two different ways in one file.
  kind: contradicts
  node: domain/investigation/cost
  correction: use z.int() for calls, input_tokens and output_tokens, matching usageSchema and durationsSchema's own convention in this file.
