looked_past: >-
  The refusal condition rules/glossary/a-registered-concept-is-never-removed states (a concept
  named by a capability, evidence item, citation or hypothesis-revision blocks removal) is
  implemented against IConceptUsageReader in glossary.service.ts rather than in this port
  interface — that file's conformance to the rule, not this one's plain deleteConcept(name)
  signature, is the judgment that belongs to it.
