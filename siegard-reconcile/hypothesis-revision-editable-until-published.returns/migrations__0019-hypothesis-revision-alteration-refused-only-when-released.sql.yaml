    held_at: "the RETURN NEW reached when the EXISTS check finds no released reference"
    evidence: "RETURN NEW;\nEND;"
  - node: scenarios/knowledge/revising-a-released-revision-creates-the-next
    held_at: "the RAISE EXCEPTION reached when the EXISTS check finds a released reference"
    evidence: "RAISE EXCEPTION 'ReleasedHypothesisRevisionNotAlterableError';"
looked_past: "the identifier and style choices (snake_case table/function/trigger names, DROP-then-CREATE structuring) are the project's own schema arrangement, not a domain fact, and are left to the standard-conformance pass."
