looked_past: >-
  resolvedParameterDetailsList() and isOpenApiParameter() silently drop a parameter object that
  lacks a string name or a recognized location rather than raising or disclosing anything, and
  requiredSecurityScheme() groups every "http" scheme (any httpScheme value, not only basic or
  bearer) into the same shape as an apiKey scheme; neither is a domain-fact statement I can quote
  as clearly right or wrong from this file alone, so I left both for a judgment closer to the
  file that actually decides credential reducibility and parameter well-formedness.
