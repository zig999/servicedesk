findings:
  - file: src/http/dto/simulate-hypothesis.dto.ts
    where: "the durationsSchema definition, lines 70-74"
    evidence: |
      const durationsSchema = z.object({
        collection: z.number(),
        judgment: z.number(),
        total: z.number(),
      });
    cost: "collection, judgment and total are declared integer (whole milliseconds) by the specification; this schema accepts any finite number, so a fractional-millisecond value — say from a bug in a stage's elapsed-time computation — would pass response validation silently, and a load test reading the field against the declared total budget would be reading a value the specification never allowed to be non-integer."
    kind: contradicts
    correction: "type collection, judgment and total with an integer constraint (e.g. z.number().int()), matching the node's declared attribute type."
    node: domain/investigation/durations
  - file: src/http/dto/simulate-hypothesis.dto.ts
    where: "the usageSchema definition, lines 35-38"
    evidence: |
      const usageSchema = z.object({
        input_tokens: z.number(),
        output_tokens: z.number(),
      });
    cost: "input_tokens and output_tokens are declared integer token counts by the specification; a fractional value still passes this schema, so a provider-usage parsing bug producing a non-integer count would go unnoticed at the one boundary meant to reject a malformed record."
    kind: contradicts
    correction: "type both fields with an integer constraint, matching the node's declared attribute type."
    node: domain/investigation/usage
  - file: src/http/dto/simulate-hypothesis.dto.ts
    where: "the elapsed_ms field repeated in each of the three evaluationSchema branches, lines 48, 56 and 65"
    evidence: "elapsed_ms: z.number().optional(),"
    cost: "elapsed_ms is declared an optional integer by the specification; the schema accepts any finite number, so the one boundary meant to reject a non-integer call duration does not."
    kind: contradicts
    correction: "type elapsed_ms with an integer constraint, matching the node's declared attribute type."
    node: domain/investigation/evaluation

