  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-open-for-editing
    held_at: >-
      nowhere
    evidence: >-
      const discardedVersion = await store.createDraft(aCreateDraftInput(slug, glossary));

      const response = await app.inject({ method: 'DELETE', url: `/v1/cases/${slug}/versions/${discardedVersion}` });
      — the draft is discarded immediately after creation; no editing surface is reached or
      asserted.
looked_past: >-
  The Postgres-specific plumbing — the foreign-key-violation tolerance, the raw DELETE/INSERT
  statements, the per-test cleanup bookkeeping — is test infrastructure rather than a domain
  fact, and is left to whatever pass judges test-code quality.
