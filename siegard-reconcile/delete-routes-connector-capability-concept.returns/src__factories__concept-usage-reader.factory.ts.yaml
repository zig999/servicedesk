looked_past: >-
  The factory instantiates RelationalInvestigationStore and RelationalCaseStore directly with `new` rather than
  receiving them as injected dependencies, unlike capabilityQuery which is passed in — a wiring-style choice this
  pass leaves to a code review rather than a conformance finding.
