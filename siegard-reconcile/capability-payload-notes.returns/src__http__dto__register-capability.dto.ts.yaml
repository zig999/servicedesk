findings:
  - file: src/http/dto/register-capability.dto.ts
    where: >-
      registerCapabilityParamsSchema (name, version) and
      registerCapabilityBodySchema (nature, input_schema, output_schema,
      connector, concept) — all declared as required, non-optional zod
      fields, four of them additionally with `.min(1)`
    evidence: |-
      export const registerCapabilityParamsSchema = z.object({
        name: z.string().min(1),
        version: z.string().min(1),
      });
      ...
      export const registerCapabilityBodySchema = z.object({
        nature: z.enum(CAPABILITY_NATURES),
        input_schema: z.string().min(1),
        output_schema: z.string().min(1),
        timeout: z.number().int().positive().optional(),
        connector: z.string().min(1),
        concept: z.string().min(1),
        payload_notes: z.string().optional(),
      });
    cost: >-
      An empty or missing name, version, nature, input_schema, output_schema,
      connector or concept fails Zod parsing at the boundary and is answered
      as a generic HTTP 400 VALIDATION_ERROR (the route's declared-shape
      refusal) before the request ever reaches the capability registry's own
      completeness check. The specification names a distinct refusal for
      exactly this condition — a registration leaving a required attribute
      absent or empty is undeclared and is refused with HTTP 422
      IncompleteCapabilityContractError — and that refusal can never be
      produced through this route: a reader tracing IncompleteCapabilityContractError
      to find where it fires will not find it reachable from register-capability,
      because the DTO already intercepts every one of those cases as a shape
      violation first.
    kind: contradicts
    node: rules/integration/a-capability-declares-its-contract
    correction: >-
      Let empty or absent values for these required attributes reach the
      capability registry's own completeness check (e.g. do not enforce
      `.min(1)` or non-optional presence for them at the DTO layer), so an
      incomplete registration is refused there with HTTP 422
      IncompleteCapabilityContractError rather than with a generic
      VALIDATION_ERROR at the shape-validation boundary.
