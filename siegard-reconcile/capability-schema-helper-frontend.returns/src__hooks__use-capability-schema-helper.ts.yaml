looked_past: >-
  onChooseOperation accepts any OpenApiOperation value without checking it against the operations
  list currently offered; the node set's own description attributes the constraint that a choice
  can only come from the fetched listing to the interface's control (dropdown), not to this hook,
  so this is left to whichever judgment covers the rendering surface.
