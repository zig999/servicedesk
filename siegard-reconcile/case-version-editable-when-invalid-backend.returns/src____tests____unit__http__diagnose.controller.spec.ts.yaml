  The node set handed to this delegation (case-version editing surface, discard, update-draft,
  case-query) governs none of what this file actually tests — diagnose's draft/released gate and
  its required-attribute gate — so every node in the given set reads nowhere here; the facts this
  file does state were checked instead against the investigation-domain nodes found by searching
  the specification root, and that mismatch between the assigned set and the file's own domain is
  the caller's scoping to weigh, not a finding of this pass.
