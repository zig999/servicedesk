findings:
  - file: src/routes/capability-detail-screen.spec.ts
    where: "the describe block \"a route to the listing is offered even for an identity nothing is registered at (task's own UNDERDETERMINED note)\", its one test, lines 73-86"
    evidence: |
      const fetchMock = createFetchStub({
        [CAPABILITY_PATH]: () => errorResponse("CapabilityIdentityNotFoundError", 404),
      });
      await mountCapabilityDetailScreen(fetchMock);

      await screen.findByRole("button", { name: "Retry" });
    cost: >-
      rules/integration/a-capability-keyed-surface-states-a-read-in-flight-and-a-read-that-failed
      is the one node that ever puts a reattempt control on this surface, and its own
      expression carves this exact refusal out of that window: "the registry's own refusal
      of an identity no capability is currently registered at excepted, that refusal being
      its own answer and not this window." This test locks a "Retry" control onto precisely
      the refusal the node excepts, and the test's own title concedes the point ("task's own
      UNDERDETERMINED note") rather than citing a node that settles it. A future reader
      checking what the specification says an operator sees when the identity itself is
      unregistered finds only an exception, never a presentation to point at, while the
      running suite now locks in one anyway.
    kind: unstated
    correction: >-
      Decide, in the specification, what a capability-identity-keyed surface presents when
      the registry refuses read-capability-by-identity because the name and version are
      unregistered — whether that reuses the reattempt-carrying failed presentation or is a
      distinct presentation of its own — and record the decision (and its reasoning) rather
      than leaving the render locked in by this test alone.

