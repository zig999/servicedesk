looked_past: |-
  The CallPool's manual FIFO waiting queue and the acquire-then-immediately-release pattern in acquireSlotOrDeadline for a slot won by the deadline are implementation mechanics, not a domain fact, so I did not weigh their style or robustness (nor the bare non-null assertions in hypothesisNamed/evidenceFor) as a conformance matter.
