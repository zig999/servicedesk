looked_past: >-
  The statusMap test (criterion 4) exercises only one nested object among the four the rule
  names (responseMap, query and headers untested here); the ending values used are arbitrary
  fixture data for key-diffing rather than an assertion about the status-vocabulary rule; exact
  route paths and Portuguese UI wording are implementation and interface detail no node in this
  pack fixes.
