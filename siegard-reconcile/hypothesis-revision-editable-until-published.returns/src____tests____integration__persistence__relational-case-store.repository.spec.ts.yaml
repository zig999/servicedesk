findings:
  - file: src/__tests__/integration/persistence/relational-case-store.repository.spec.ts
    where: "the it block \"records the instant of release, and a second call to release leaves that instant unchanged\", lines 798-813"
    evidence: |
      await store.release(slug, version);
          const firstRead = await store.assembleVersion(slug, version);
          await store.release(slug, version);
          const secondRead = await store.assembleVersion(slug, version);

          expect(firstRead?.state).toBe('released');
          expect(firstRead?.released_at).toBeDefined();
          expect(secondRead?.released_at).toBe(firstRead?.released_at);
    cost: The rule this test's own trigger belongs to refuses release asked of a version not in draft state with a CaseVersionNotDraftAtReleaseError, and after the first `release` the version is no longer in draft state; this test instead awaits the second `store.release` call unguarded and asserts it succeeds with the released_at instant merely unchanged. A reader trusting this test will build (or keep) a store that lets a caller retry release silently rather than being told the version has already left draft state, and the next person looking for "what happens on a second release" will find this idempotent-success behavior here rather than the refusal the lifecycle rule states.
    kind: contradicts
    node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
    correction: The test should call `store.release(slug, version)` a second time expecting rejection (e.g. `await expect(store.release(slug, version)).rejects.toBeInstanceOf(...)`, matching the CaseVersionNotDraftAtReleaseError the rule names for release asked of a non-draft version), rather than awaiting it unguarded and asserting `released_at` merely stayed the same.
  - file: src/__tests__/integration/persistence/relational-case-store.repository.spec.ts
    where: "the it block \"resolves without raising, leaving no new row behind, when the named revision does not exist for that hypothesis\", lines 1443-1471"
    evidence: |
      await expect(
          store.overwriteHypothesisRevision({
            slug,
            hypothesis_name: 'a-hypothesis',
            revision: neverHeldRevision,
            criterion: 'a criterion nothing should have stored',
            collects: [],
            resolution: aResolution(glossary),
          }),
        ).resolves.toBeUndefined();
    cost: The overwrite policy in scope for this file decides only two outcomes for a revise — overwrite the hypothesis's own highest existing revision in place, or create its next revision — and says nothing about a revision number the hypothesis has never held. This test commits the store to a third, silent-success outcome for that case, so a caller passing a stale or mistyped revision number gets no signal at all, and the specification carries no record of that choice.
    kind: unstated
    node: rules/knowledge/a-hypothesis-revision-is-overwritten-while-unreleased
    correction: Decide, in the specification, what an overwrite naming a revision number the hypothesis does not currently hold does — refuse it (naming an error) or explicitly sanction the silent no-op this test asserts — so the store's behavior traces to a stated fact rather than to an assumption embedded only in this test.
