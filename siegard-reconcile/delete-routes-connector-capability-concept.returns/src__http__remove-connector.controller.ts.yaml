read:
  - node: constraints/no-route-enforces-authentication
    held_at: >-
      the handler `handleRemoveConnectorRequest` — it dispatches straight to
      `dependencies.removeConnector` with no authentication middleware, guard or check invoked
      first.
    evidence: |
      export async function handleRemoveConnectorRequest(
        dependencies: RemoveConnectorControllerDependencies,
        params: RemoveConnectorParamsDto,
      ): Promise<void> {
        await dependencies.removeConnector(params.connector);
      }
  - node: contracts/integration/connector-configuration-registry
    held_at: >-
      the exported handler `handleRemoveConnectorRequest`, which implements the surface's
      remove-connector operation by delegating to the injected `removeConnector` dependency.
    evidence: |
      export async function handleRemoveConnectorRequest(
        dependencies: RemoveConnectorControllerDependencies,
        params: RemoveConnectorParamsDto,
      ): Promise<void> {
        await dependencies.removeConnector(params.connector);
      }
  - node: domain/integration/connector-configuration-registry
    held_at: >-
      the `RemoveConnectorControllerDependencies` type and its use in the handler, matching the
      domain service's remove-connector operation, invoked by connector name.
    evidence: |
      export type RemoveConnectorControllerDependencies = {
        readonly removeConnector: (connector: string) => Promise<void>;
      };
      ...
      await dependencies.removeConnector(params.connector);
  - node: rules/integration/removing-a-connector-configuration-is-unconditional
    held_at: >-
      the handler body — a single unconditional call with no branch testing whether a
      configuration is currently registered under the name, and no distinct return for either
      case.
    evidence: "await dependencies.removeConnector(params.connector);"
  - node: constraints/a-domain-error-unmapped-by-status-is-refused-generically
    held_at: nowhere
    evidence: >-
      the handler performs no error handling of any kind — it awaits `dependencies.removeConnector`
      and returns nothing else; the whole file was examined for this fact and holds no catch, no
      status assignment and no error mapping.
