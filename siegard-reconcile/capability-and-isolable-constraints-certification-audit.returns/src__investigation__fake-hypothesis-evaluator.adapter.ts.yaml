findings:
  - file: src/investigation/fake-hypothesis-evaluator.adapter.ts
    where: the return statement of evaluate(), line 29
    evidence: |-
      return { ...outcome, usage: ZEROED_USAGE, elapsed_ms: ZEROED_ELAPSED_MS };
    cost: >-
      A test that seeds an inconclusive outcome with reason `no-data` — meaning judgment was
      never called for that hypothesis at all — gets back usage and elapsed_ms populated
      (zeroed) from this adapter regardless of that reason, because the override is
      unconditional. Any assertion or downstream code that relies on "usage/elapsed_ms present
      only when a call actually happened" can no longer distinguish a genuine zero-cost call
      from a call that, by its own seeded reason, never ran — the shape the specification
      calls invalid becomes the one every no-data fixture run through this fake actually
      produces.
    kind: contradicts
    node: domain/investigation/evaluation
    correction: >-
      Attach usage and elapsed_ms only when the seeded outcome's reason is not `no-data` —
      return the seeded outcome unchanged for a no-data fixture, and only merge in
      `{ usage: ZEROED_USAGE, elapsed_ms: ZEROED_ELAPSED_MS }` for every other reason — so the
      fake's returned shape matches the presence rule the node states.
