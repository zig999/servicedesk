findings:
  - file: src/__tests__/unit/investigation/anthropic-hypothesis-evaluator.adapter.spec.ts
    where: "the test 'defaults the token ceiling to 1024 when the caller configures none', lines 687-694"
    evidence: |-
      expect(createMock.mock.calls[0]?.[0]).toMatchObject({ max_tokens: 1024 });
    cost: >-
      1024 is asserted as the ceiling on how many tokens the provider may spend answering a judgment
      call — a threshold that decides when a model's confirmed/refuted answer risks being cut off
      mid-JSON and turned into a spurious judgment-failure. No node in the specification names this
      figure or any other max_tokens ceiling; the number lives only in this expectation, so a reader
      trying to learn what bounds a judgment call's response has nowhere in the specification to find
      it, only this test.
    kind: unstated
read:
  - node: domain/investigation/evaluation
    held_at: >-
      the outcome assertions across the file, e.g. the no-data-carries-none-of test
    evidence: |-
      expect(outcome).not.toHaveProperty('usage');
      expect(outcome).not.toHaveProperty('elapsed_ms');
      expect(outcome).not.toHaveProperty('prompt');
  - node: rules/investigation/a-measured-duration-below-one-millisecond-is-zero
    held_at: nowhere
    evidence: |-
      expect(outcome.elapsed_ms).toBeGreaterThanOrEqual(20);
      expect(outcome.elapsed_ms).toEqual(expect.any(Number));
      Every elapsed_ms assertion in the file checks either a lower bound after an artificial delay or
      merely `expect.any(Number)`; none constructs a sub-millisecond span or asserts it records as 0
      rather than being rounded up to 1.
  - node: constraints/the-judgment-prompt-is-closed
    held_at: >-
      the "declares no tools field" test and the marker test asserting the closed <judgment_input> block
    evidence: |-
      expect(Object.hasOwn(params ?? {}, 'tools')).toBe(false);
      expect(content).toContain('<judgment_input>');
  - node: domain/investigation/hypothesis-evaluator
    held_at: every evaluate() call across the file
    evidence: |-
      const outcome = await evaluator.evaluate(A_CRITERION, SOME_OK_EVIDENCE, A_CASE_CONTEXT);
