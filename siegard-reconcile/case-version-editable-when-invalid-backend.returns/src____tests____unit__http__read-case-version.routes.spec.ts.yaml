looked_past: >-
  The first test's title claims coverage "for a draft whose manifest holds no hypothesis," but the fixture
  never sets or asserts a manifest at all (read-case-version's own response never carries one) — a
  test-description/test-body gap rather than a domain-fact issue, and not reported as a finding.

