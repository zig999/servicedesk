    evidence: "const manifest = await readManifest(tx, key);\n  return assembledCaseVersionOf(key, versionRow, manifest);"

  - node: scenarios/knowledge/a-draft-revision-is-overwritten-by-repeated-saves
    held_at: overwriteRevision, applied against the same revision number while it stays draft
    evidence: "UPDATE ${HYPOTHESIS_REVISIONS_TABLE}\n           SET criterion = $4, resolution_outcome = $5, resolution_action = $6, resolution_recipient = $7\n           WHERE case_slug = $1 AND hypothesis_name = $2 AND revision = $3"

  - node: scenarios/knowledge/a-release-is-refused-for-manifested-draft-hypothesis-revisions
    held_at: nowhere — releaseVersion itself never reads the manifest entries' own hypothesis-revision state
    evidence: "async function releaseVersion(tx: IQueryable, key: ICaseVersionKey): Promise<void> {\n  refuseUnlessDraftAtRelease(key, await requireVersionState(tx, key));\n  await runStatement(tx, releaseStatement(key.slug, key.version), raiseWriteFailure);\n}"

  - node: scenarios/knowledge/a-released-version-keeps-its-original-revision
    held_at: refuseUnlessDraft blocking any write to a released version's manifest, together with insertRevisionRow always creating a new revision number rather than altering an existing one
    evidence: "if (state !== DRAFT_STATE) {\n    throw new CaseVersionNotDraftError(key.slug, key.version, state);\n  }"

  - node: scenarios/knowledge/placing-a-manifest-entry-is-never-refused-for-a-drafts-revision-state
    held_at: insertManifestEntry, which checks only the case version's own draft state and never queries the referenced hypothesis-revision's own state
    evidence: "async function insertManifestEntry(tx: IQueryable, input: PlaceHypothesisInput): Promise<void> {\n  const key: ICaseVersionKey = { slug: input.slug, version: input.version };\n  refuseUnlessDraft(key, await requireVersionState(tx, key));\n  await runStatement(tx, placeHypothesisStatement(input), raisePlaceHypothesisFailure(input));\n}"

looked_past: "the operation layer's own duplication of the \"case holds a draft\" check (once in ReviseHypothesisOperation.refuseWithoutDraft, once again here in insertRevision's requireCaseHoldsDraft) is a code-shape observation rather than a domain-fact discrepancy, and the gating of a-released-case-version-manifests-only-released-hypothesis-revisions and a-release-refusal-with-no-named-violation-says-so sits in case/release.operation.ts, a file this delegation was not asked to judge."
