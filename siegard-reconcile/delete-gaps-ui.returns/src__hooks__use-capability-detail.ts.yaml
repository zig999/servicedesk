findings:
  - file: src/hooks/use-capability-detail.ts
    where: the update mutation's onSuccess/onError handlers, lines 134-140
    evidence: |-
      onSuccess: () => {
            void queryClient.invalidateQueries({ queryKey: ["capabilities"] });
            void queryClient.invalidateQueries({ queryKey: ["capability", name, version] });
          },
          onError: (error) => {
            toast.error(saveFailureMessage(error));
          },
    cost: An operator who submits an edit to this capability learns nothing from this file about whether the registration was made or what now stands registered — only a bare `isSubmitSuccessful` boolean crosses the hook boundary, carrying no identity and no content — while this same file's removal path, a few lines below, states that outcome in full ("`${name} ${version} is no longer registered.`"). A reader who wants to know what a successful capability edit tells the operator finds it stated for delete and not for save.
    kind: contradicts
    node: rules/integration/a-submitted-registration-states-its-outcome-to-the-operator
    correction: onSuccess should state that the registration was made and name what now stands registered — the name and version submitted — the way deleteMutation's onSuccess already names the identity removed.
  - file: src/hooks/use-capability-detail.ts
    where: the "ready"-phase returned state, lines 221-244
    evidence: |-
      isDirty,
          isSubmitting: mutation.isPending,
          isSubmitSuccessful: mutation.isSuccess,
          onSubmit,
          onCancel,
          isDeleting: deleteMutation.isPending,
          onDelete: () => {
            deleteMutation.mutate();
          },
        };
    cost: An operator editing this capability who wants to put an edit down and keep working has only `onCancel`, whose whole effect is to leave the surface (back, or to the capabilities listing); there is no act here that returns the form and the two schema fields to the content of the surface's own last read while keeping the operator on that surface, so recovering a schema an operator has typed over costs a full leave-and-return through the listing rather than nothing.
    kind: contradicts
    node: rules/integration/a-loaded-registration-edit-may-be-discarded-without-leaving-the-surface
    correction: expose a discard action that resets `form`, `inputSchemaValue` and `outputSchemaValue` to `query.data`/`inputSchemaBaseline`/`outputSchemaBaseline` without navigating, taking effect only after a further explicit confirmation, distinct from `onCancel`.
