looked_past: the file's own assertions — that footer controls sit inside a role=group named "Actions" and that Save, Cancel and Discard changes render there together — are ARIA-grouping and control-naming decisions, which every node here that touches these same controls (the abandon and discard-edit rules among them) explicitly assigns to the interface rather than stating itself, so the file's actual content is a layout test rather than a domain-fact assertion and is not this pass's to flag.
