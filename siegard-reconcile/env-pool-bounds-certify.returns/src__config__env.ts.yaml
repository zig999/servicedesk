read:
  - node: constraints/the-pool-bounds-are-positive-integers
    held_at: >-
      the `DATABASE_POOL_MAX_CONNECTIONS`, `DATABASE_POOL_IDLE_TIMEOUT_MS` and
      `DATABASE_POOL_STATEMENT_TIMEOUT_MS` fields of `envSchema`, and the `safeParse`/throw in
      `loadEnv`
    evidence: >-
      DATABASE_POOL_MAX_CONNECTIONS: z.coerce.number().int().positive().default(10),
      DATABASE_POOL_IDLE_TIMEOUT_MS: z.coerce.number().int().positive().default(10_000),
      DATABASE_POOL_STATEMENT_TIMEOUT_MS: z.coerce.number().int().positive().default(30_000),
      ...
      const parsed = envSchema.safeParse(source);
      if (!parsed.success) {
        const issues = parsed.error.issues.map((issue) => `${issue.path.join('.')}: ${issue.message}`);
        throw new InvalidEnvironmentError(issues);
      }
looked_past: >-
  The `.default(10)`, `.default(10_000)` and `.default(30_000)` fallback values on the three pool
  bounds are a fact of constraints/the-connection-pool-is-bounded-by-configuration (that each bound
  falls back to a declared default) rather than of the-pool-bounds-are-positive-integers, and that
  node explicitly states the specification names the three bounds' existence and shape and "never
  the values themselves," so the concrete numbers are not a domain fact the specification withholds
  and raise nothing against either node.
