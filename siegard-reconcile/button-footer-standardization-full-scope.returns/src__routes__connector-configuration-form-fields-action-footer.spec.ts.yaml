looked_past: The create screen's Cancel link is hardcoded to "/connectors" (frontend/app/src/routes/connector-configuration-create-screen.tsx, `<Link to="/connectors">Cancel</Link>`) rather than to the surface the authoring was reached from, which rules/integration/a-connector-configuration-authoring-may-be-abandoned-without-registering requires — that is a question about that production file's own conformance, not about what this test file itself enunciates.
