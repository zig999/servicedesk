findings:
  - file: src/routes/connector-configuration-helper-fields-independent-content-and-staleness.spec.ts
    where: describe block "a stale drafted disclosure clears the moment a new request begins (UNDERDETERMINED note 3)"
    evidence: |-
      expect(screen.getByText(DISTINCTIVE_CONFIGURATION_TEXT)).toBeTruthy();
      expect(screen.queryByText(DISTINCTIVE_CONFIGURATION_TEXT)).toBeNull();
      expect(screen.getByText("Rascunhando a configuração do conector…")).toBeTruthy();
      expect(screen.queryByRole("alert")).toBeNull();
    cost: >-
      The test fixes, as a passing assertion, exactly what the surface presents once a new
      draft request begins over an earlier answered draft. Two nodes touching this file both say
      this is not decided ("What that surface states while a draft request is outstanding is not
      decided here"). A future node deciding this differently would leave this test the one
      place disagreeing with the specification.
    kind: unstated
    correction: >-
      Decide, in a node constraining domain/integration/connector-configuration-draft, what the
      Configuration Helper states while a new draft request is outstanding over an earlier
      answered draft, then align this test to that decision.
  - file: src/routes/connector-configuration-helper-fields-independent-content-and-staleness.spec.ts
    where: describe block "a stale refusal clears the moment a new request begins (UNDERDETERMINED note 3)"
    evidence: |-
      expect(screen.getByRole("alert")).toBeTruthy();
      expect(screen.queryByRole("alert")).toBeNull();
      expect(screen.getByText("Rascunhando a configuração do conector…")).toBeTruthy();
    cost: >-
      Same gap as the sibling block above, over a refused rather than an answered draft request.
    kind: unstated
    correction: >-
      Decide, in a node constraining domain/integration/connector-configuration-draft, what the
      Configuration Helper states while a new draft request is outstanding over an earlier
      refused request, then align this test to that decision.
