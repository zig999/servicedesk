read:
  - node: rules/knowledge/a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
    held_at: >-
      the trigger button that opens the dialog and the confirm button in `DialogFooter`; neither
      gates on the version's own validation outcome — the trigger takes only the caller-supplied
      `disabled` prop, and the confirm button takes only `discard.isConfirmEnabled` /
      `discard.isConfirming`.
    evidence: |
      <Button type="button" variant="destructive" disabled={disabled}>
        Discard draft
      </Button>
      ...
      disabled={!discard.isConfirmEnabled || discard.isConfirming}
  - node: rules/knowledge/a-draft-case-versions-discard-reproduces-the-cases-own-slug
    held_at: >-
      the confirmation `Label`/`Input` pair, which asks the curator to type the case's own slug
      before the confirm button is enabled.
    evidence: |
      <span>Type {slug} to confirm</span>
      ...
      <Input
        value={discard.slugConfirmation}
        onChange={(event) => discard.onSlugConfirmationChange(event.target.value)}
  - node: rules/knowledge/releasing-or-discarding-a-draft-case-version-takes-a-further-explicit-act
    held_at: >-
      the confirm `Button` inside `DialogFooter`, a distinct control from the trigger button that
      merely asks for the dialog to open.
    evidence: |
      <Button
        type="button"
        variant="destructive"
        loading={discard.isConfirming}
        disabled={!discard.isConfirmEnabled || discard.isConfirming}
        onClick={discard.onConfirm}
      >
        Discard draft
      </Button>
