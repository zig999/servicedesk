    evidence: "export type CaseVersionState = 'draft' | 'released';"
    cost: "this file declares its own independent literal union for the case-version-state enumeration instead of importing the `CaseVersionState` that `case.ts` already derives from its own `CASE_VERSION_STATES = ['draft', 'released'] as const`; the two declarations happen to agree today, but nothing ties them together, so if the specification's case-version-state enumeration ever gains, drops or renames a value, a reader who updates `case.ts`'s canonical list has no signal that this file's own copy also needs the same edit, and the day they disagree nobody can say which one is the domain's own answer"
