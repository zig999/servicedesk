findings:
  - file: src/__tests__/unit/http/build-app.spec.ts
    where: >-
      the test "refuses with 400 a request whose subject carries no attribute at all"
      (diagnose route), around line 612-624
    evidence: |-
      const response = await app.inject({
        method: 'POST',
        url: '/v1/diagnose',
        payload: validRequestBody({ subject: { type: 'a-subject-type', attributes: [] } }),
      });

      expect(response.statusCode).toBe(400);
      expect(built.runDiagnose).not.toHaveBeenCalled();
    cost: >-
      The specification's own decision for this exact condition (decision-log.md, location
      rules/investigation/a-subject-carries-at-least-one-attribute.md: "A call whose subject
      carries no attribute-value is refused with an HTTP 422 response reporting a
      SubjectCarriesNoAttributeError", precisely because "400 being reserved by
      a-malformed-request-is-refused-with-a-validation-error for the route's declared shape")
      calls for HTTP 422 and a named domain error here, not the generic 400 this test locks in
      with no error-class assertion at all.
    kind: contradicts
    node: rules/investigation/a-subject-carries-at-least-one-attribute
    correction: >-
      assert HTTP 422 and a SubjectCarriesNoAttributeError body for this request, matching the
      node's statement
  - file: src/__tests__/unit/http/build-app.spec.ts
    where: >-
      the test "refuses with 400 a simulate-case request whose subject carries no attribute at
      all, at the wire, before the route ever reaches its own controller", around line 696-707
    evidence: |-
      const response = await app.inject({
        method: 'POST',
        url: '/v1/simulate',
        payload: { ...validSimulateRequestBody(), subject: { type: 'a-subject-type', attributes: [] } },
      });

      expect(response.statusCode).toBe(400);
    cost: >-
      Same rule, same decided response: rules/investigation/a-subject-carries-at-least-one-attribute
      names no exception for simulate. This test's own title frames the 400 as a wire-level shape
      check, but the node's decided fact is a domain refusal (422, SubjectCarriesNoAttributeError),
      not a shape violation.
    kind: contradicts
    node: rules/investigation/a-subject-carries-at-least-one-attribute
    correction: >-
      assert HTTP 422 and a SubjectCarriesNoAttributeError body for this request, matching the
      node's statement
