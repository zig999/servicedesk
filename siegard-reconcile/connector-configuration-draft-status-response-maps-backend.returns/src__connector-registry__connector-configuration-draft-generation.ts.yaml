looked_past: >-
  reconciledUnresolved builds displacedItems from a Set keyed by parameter
  name alone, which would conflate two distinct displaced parameters that
  share a name at different locations into one unresolved item — a possible
  behavioral edge case, not a quoted domain fact any node here states
  differently, so it is left for a different pass to weigh.
