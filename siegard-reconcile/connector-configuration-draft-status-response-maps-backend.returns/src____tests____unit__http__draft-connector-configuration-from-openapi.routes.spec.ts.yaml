findings:
  - file: src/__tests__/unit/http/draft-connector-configuration-from-openapi.routes.spec.ts
    where: >-
      the test "accepts a method field naming no standard HTTP verb, matching it
      case-insensitively against the document's own declared operation key" (lines 194-202)
    evidence: >-
      it("accepts a method field naming no standard HTTP verb, matching it case-insensitively
      against the document's own declared operation key", async () => {
        const built = buildTestApp();
        app = built.app;
        built.fetchOpenApiDocument.mockResolvedValueOnce(JSON.stringify({ openapi: '3.0.0', paths: { '/widgets': { purge: {} } } }));

        const response = await app.inject({ method: 'POST', url: ROUTE_URL, payload: validBody({ method: 'Purge' }) });

        expect(response.statusCode).toBe(200);
      });
    cost: >-
      The test fixes, as a passing behavior, that an operation is looked up by folding the
      request's method field and the document's own path-item key to one case before comparing
      them. No node in this file's set, nor
      rules/integration/an-openapi-document-declaring-no-such-operation-refuses-the-draft (which
      only states that a request naming a path and method the document declares no operation for
      is refused) nor
      rules/integration/a-connector-configuration-draft-states-the-chosen-operations-method
      (which only upper-cases the value the draft states, and only after an operation is already
      chosen) says anything about how the lookup itself compares case. A future change that made
      operation lookup case-sensitive would break only this test, and the next reader would find
      no specification passage to consult over which behavior the business actually wants.
    kind: unstated
    correction: >-
      Record an invariant (or extend
      rules/integration/an-openapi-document-declaring-no-such-operation-refuses-the-draft) stating
      that the requested method is matched against the document's own path-item operation key
      case-insensitively when selecting the operation.
  - file: src/__tests__/unit/http/draft-connector-configuration-from-openapi.routes.spec.ts
    where: "the test 'refuses with 400 a request whose connector is an empty string' (lines 236-243)"
    evidence: |-
      it('refuses with 400 a request whose connector is an empty string', async () => {
        const built = buildTestApp();
        app = built.app;

        const response = await app.inject({ method: 'POST', url: ROUTE_URL, payload: validBody({ connector: '' }) });

        expect(response.statusCode).toBe(400);
      });
    cost: >-
      rules/integration/a-draft-request-is-offered-only-over-a-named-connector-and-a-chosen-operation's
      own Description reasons the opposite way about exactly this input: "A draft resolves its
      subject placeholders by the capabilities registered against the connector name, so a
      request made under an empty name names every parameter unresolved with reason
      no-capability-registered, a true statement about the wrong cause." That reasoning only
      holds if the backend processes an empty-name request and answers with a generated draft
      disclosing the emptiness indirectly through unresolved reasons — the whole point being that
      withholding the act at the Configuration Helper is needed because the backend itself would
      not refuse and would instead mislead the operator about the cause. This test instead fixes
      a 400 VALIDATION_ERROR refusal at the API boundary for that same input, so a reader of this
      test learns a connector-name emptiness check the specification's own reasoning says does
      not exist at this route, and the scenario the Description explains — a misleading but true
      disclosure the surface exists to prevent — never occurs to be prevented.
    kind: contradicts
    node: rules/integration/a-draft-request-is-offered-only-over-a-named-connector-and-a-chosen-operation
    correction: >-
      Either the test's expectation changes to a 200 whose unresolved list names every parameter
      with reason no-capability-registered (matching the node's own stated resolution mechanics),
      or the node is amended to state that draft-connector-configuration-from-openapi itself
      refuses an empty connector name — the two currently disagree and only one can be what the
      business decided.
