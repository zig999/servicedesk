findings:
  - file: src/investigation/http-declarative-observation-source.adapter.ts
    where: >-
      unavailableFor(), lines 52-54, as used for the MalformedHttpConnectorConfigurationError
      branch of resolveHttpConnectorCallConfiguration (line 157)
    evidence: |-
      function unavailableFor(error: Error): ObservationOutcome {
        return { result: 'unavailable', result_detail: error.name };
      }
    cost: >-
      An operator whose connector configuration fails this check sees only
      `result_detail: "MalformedHttpConnectorConfigurationError"`, with no statement of the
      vocabulary the malformed key was held to — the accepted HTTP methods when the method key
      is wrong, or the accepted evidence-result endings when the statusMap is wrong. They have
      to go read source (or guess) to learn what to correct, rather than reading it off the
      observation the rule says should already carry that detail; the same function used here
      also carries the connector name for ConnectorUnreachableError two lines away, so the loss
      is specific to this branch, not a general limitation of the outcome shape.
    kind: contradicts
    correction: >-
      result_detail for a MalformedHttpConnectorConfigurationError would need to carry the
      vocabulary beside the error name — the accepted methods or the accepted evidence-result
      endings — the way unavailableForUnreachableConnector already appends the connector name
      beside ConnectorUnreachableError, rather than reusing the name-only unavailableFor for
      this one error.
    node: rules/integration/an-http-connector-configuration-declares-its-method-and-status-vocabulary

