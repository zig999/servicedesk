  - node: rules/integration/a-connector-configuration-draft-states-the-chosen-operations-method
    held_at: "operationEntry's operationKey, carried into readOpenApiOperation's returned method field"
    evidence: |-
      const operationKey = method.toLowerCase();
      const rawOperation = isPlainObject(pathItem) ? pathItem[operationKey] : undefined;
      if (!isPlainObject(rawOperation)) {
        throw new OpenApiOperationNotFoundError(path, method);
      }
      return { pathItem, operation: rawOperation, operationKey };
  - node: rules/integration/a-malformed-or-unsupported-openapi-document-refuses-the-draft
    held_at: "parsedOpenApiDocument/parsedAsJsonOrYaml/parsedAsYaml (JSON tried first, YAML on failure) and refuseUnsupportedVersion (openapi 3.x check, swagger check, else no-version-declared)"
    evidence: |-
      function refuseUnsupportedVersion(document: PlainObject): void {
        if (typeof document.openapi === 'string') {
          if (!document.openapi.startsWith('3.')) {
            throw new OpenApiDocumentNotReadableError({ kind: 'unsupported-version', declaredVersion: document.openapi });
          }
          return;
        }
        if (typeof document.swagger === 'string') {
          throw new OpenApiDocumentNotReadableError({ kind: 'unsupported-version', declaredVersion: document.swagger });
        }
        throw new OpenApiDocumentNotReadableError({ kind: 'no-version-declared' });
      }
  - node: rules/integration/an-openapi-document-declaring-no-such-operation-refuses-the-draft
    held_at: "operationEntry, throwing OpenApiOperationNotFoundError with the requested path and method"
    evidence: |-
