looked_past: >-
  isConceptNamedByEvidence and isConceptNamedByCitation share near-identical bodies (same
  queryOneOrAbsent/raiseReadFailure shape over two tables), and the read-side validators
  (resultOf/isVerdict/isConsolidationRegister/isEvaluationReason) repeat the same guard-and-throw
  pattern four times — code shape, not a domain fact, so it is left to a code review rather than
  reported here.
