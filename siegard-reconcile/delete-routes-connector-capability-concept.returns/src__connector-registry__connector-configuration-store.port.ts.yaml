looked_past: >-
  The port's method names (readConnectorConfigurations, writeConnectorConfigurations,
  deleteConnectorConfiguration) differ from the published contract's own operation names
  (read-connector-configuration, list-connector-configurations, register-connector,
  remove-connector) and from the domain service's plural read/singular write shape;
  this is a naming and shaping choice at the storage-abstraction level, not a domain fact
  the file states or omits, so it is not reported as a finding.
