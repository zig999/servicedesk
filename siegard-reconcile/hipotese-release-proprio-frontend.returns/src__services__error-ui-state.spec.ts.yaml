  - node: scenarios/knowledge/releasing-an-already-released-revision-tells-the-curator-so
    held_at: "the test at lines 56-87, asserting the HypothesisRevisionNotDraftAtReleaseError kind is distinct from every other listed code and from the generic fallback"
    evidence: |
      const targetKind = uiStateForApiError(
            new ApiError("HypothesisRevisionNotDraftAtReleaseError", "not draft at release"),
          ).kind;
          const otherKinds = otherCodes.map((code) => uiStateForApiError(new ApiError(code, "message")).kind);

          expect(otherKinds).not.toContain(targetKind);
          expect(targetKind).not.toBe("generic-error");
looked_past: "The test at lines 202-207 asserting that a ConceptDescriptionRequiredError state carries only kind and no message of its own is a type-shape assertion about UiErrorState generally, not a domain fact tied to any node in this set, and the many other error-code-to-kind mappings in the file (CaseNotFoundError, ConceptNotAnsweredError, CapabilityNotReadOnlyError, and the rest) belong to nodes outside this delegation's set and were left unexamined against the wider specification."
