looked_past: >-
  patchMutation's onSuccess invalidates only the ["case-versions", slug] listing and never
  the singular ["case-version", slug, version] query cache, and the "ready" phase type
  declares an isFirstVersion field the hook's own return never populates — both are
  code-quality observations rather than a domain fact the source states or omits.
