findings:
  - file: src/routes/case-creation-screen-submission.spec.ts
    where: "lines 51-55, the assertion following the POST call"
    evidence: |-
      expect(
            calledAnyUrlStartingWith(fetchMock, `/v1/cases/${typedSlug}`),
            "expected no prior read of the typed slug before create-draft is submitted",
          ).toBe(false);
    cost: >-
      This locks in a rule no specification node ever decided: that the case-authoring surface
      must never issue a read against the typed slug before submitting create-draft. The
      specification's own withholding rule (rules/knowledge/a-case-authoring-surface-offers-no-submission-while-required-content-is-absent)
      is explicit that it "bounds the absent case only" and decides nothing about what happens
      once every required field holds content — it says nothing about a slug-existence read.
      Nothing in domain/knowledge/case or rules/knowledge/a-case-is-created-by-the-first-create-draft-naming-its-slug
      forbids such a read either; that rule only describes how the backend resolves a slug
      collision once create-draft is submitted, not what the surface may do beforehand. A future
      change adding a legitimate slug-availability check (which no node prohibits) would fail
      this test, and nobody consulting the specification would find the constraint the test is
      actually enforcing, because it was never decided there.
    kind: unstated
    correction: >-
      Either state, in a specification node, that a case-authoring surface must not read the case
      being created before submitting create-draft, or drop the assertion if the specification
      means to leave this open the way it leaves the required-content withholding open.
