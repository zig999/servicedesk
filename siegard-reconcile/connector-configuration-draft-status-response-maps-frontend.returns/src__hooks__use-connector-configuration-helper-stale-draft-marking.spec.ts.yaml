looked_past: >-
  The stubbed draft answer omits status_readings, response_fields and reading_notes, which
  domain/integration/connector-configuration-draft declares required, and the test never
  asserts that changing an input leaves the apply act still offered while stale — both are
  coverage gaps in a file scoped to the staleness criteria alone, not a stated domain fact,
  so they are left for whichever file's tests actually exercise those disclosures.
