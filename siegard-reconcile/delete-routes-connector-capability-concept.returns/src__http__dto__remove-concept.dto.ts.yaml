looked_past: >-
  The `.min(1)` guard on `name` is the same non-empty-path-segment convention every other params
  DTO in this codebase applies (register-concept.dto.ts, remove-capability.dto.ts,
  remove-connector.dto.ts and the rest), confirmed by remove-concept.routes.spec.ts's own test for
  "the route with an empty string param for this segment" — a technical validation-shape choice
  implementing constraints/a-malformed-request-is-refused-with-a-validation-error rather than a
  domain fact of its own, so it is not reported as a finding.
