findings:
  - file: src/http/dto/test-connector.dto.ts
    where: the subjectAttributeValueSchema definition (lines 3-6), embedded in subjectSchema (lines 8-11) and required as testConnectorRequestSchema's subject field (line 21)
    evidence: |-
      const subjectAttributeValueSchema = z.object({
        attribute: z.string().min(1),
        value: z.string().min(1),
      });
    cost: >-
      An integrator reading this request schema learns that the test request must carry an
      `attribute` name the caller supplies for each value, validated as required content in its
      own right; a request omitting one fails validation before the server ever reaches the
      placeholder-matching the specification reserves to it. The next reader has no reason to
      suspect the attribute name is meant to come from the registered configuration's own
      placeholders rather than from the caller, because this schema treats it exactly like any
      other operator-authored field.
    kind: contradicts
    correction: >-
      the subject attribute entries this schema accepts from the operator would carry only a
      value, with the attribute name read server-side from the registered configuration's
      ${subject:<attribute-name>} placeholders rather than validated here as caller-supplied
      content.
    node: rules/integration/a-connector-configuration-is-tested-through-a-registered-capability
  - file: src/http/dto/test-connector.dto.ts
    where: the 'timed-out' branch of testConnectorOutcomeSchema (lines 49-52)
    evidence: |-
      z.object({
          kind: z.literal('timed-out'),
          elapsedMs: z.number().nonnegative(),
        }),
    cost: >-
      An integrator reading this schema learns that the diagnostic can answer with a distinct
      "timed-out" outcome carrying nothing but an elapsed duration — no status, no error code, no
      connector name — as though that shape were settled. The one node in this file's set that
      describes what a completed diagnostic test answers says explicitly that a capability
      timeout's own abort is "Not decided here", so this shape is a decision the specification
      never made, and the next reader who wants to know what a timed-out test reports will find
      it only in this file rather than in the specification.
    kind: unstated
read:
