read:
  - node: rules/integration/a-connector-configuration-surface-states-which-response-map-keys-a-registered-capability-reads
    held_at: >-
      the branches rendering coverage.keyStatements (kind "read"/"read-by-none") and
      coverage.expectedFieldStatements, together with the coverage.kind === "cannot-be-read" branch
    evidence: |
      {coverage.keyStatements.map((statement) =>
              statement.kind === "read" ? (
                <li key={`read:${statement.key}`}>{responseMapKeyReadText(statement.key, statement.capabilityLabels)}</li>
              ) : (
                <li key={`read-by-none:${statement.key}`}>{responseMapKeyReadByNoneText(statement.key)}</li>
              ),
            )}
      {coverage.expectedFieldStatements.map((statement) => (
              <li key={`${statement.capabilityLabel}:${statement.fieldName}`}>{responseMapExpectedFieldText(statement.capabilityLabel, statement.fieldName)}</li>
            ))}
      if (coverage.kind === "cannot-be-read") {
        return (
          <div><p>{RESPONSE_MAP_COVERAGE_HEADING}</p><p>{RESPONSE_MAP_COVERAGE_CANNOT_BE_READ_MESSAGE}</p></div>
        );
      }
  - node: rules/integration/a-connector-configuration-surfaces-readiness-statements-carry-no-claim-no-rule-decides
    held_at: nowhere
    evidence: >-
      The component returns only p, ul and li elements built from imported text functions — no
      button, no onClick, no call gating a submission — so it neither withholds an act nor
      states any claim beyond the four listed statements.
  - node: scenarios/integration/a-response-map-key-the-capability-does-not-read-is-stated-beside-the-field-it-expects
    held_at: the same keyStatements/expectedFieldStatements rendering as above
    evidence: |-
      statement.kind === "read" ? (<li>{responseMapKeyReadText(...)}</li>) : (<li>{responseMapKeyReadByNoneText(...)}</li>)
      <li>{responseMapExpectedFieldText(statement.capabilityLabel, statement.fieldName)}</li>
