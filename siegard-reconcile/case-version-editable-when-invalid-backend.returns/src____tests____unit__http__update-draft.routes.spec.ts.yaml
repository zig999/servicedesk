read:
  - node: contracts/knowledge/case-query
    held_at: the readCaseVersion mock and its use to build the update-draft response, first test
    evidence: >-
      built.readCaseVersion.mockResolvedValueOnce({ version: attributes });
      ...
      expect(built.readCaseVersion).toHaveBeenCalledWith('a-slug', 3);
  - node: domain/knowledge/case-version
    held_at: the heldAttributes and validUpdateBody fixture functions
    evidence: |-
      function heldAttributes(overrides: Partial<CaseVersionAttributes> = {}): CaseVersionAttributes {
        return {
          title: 'an-updated-title',
          when_to_use: 'when an attendant needs the updated case',
          subject: 'an-updated-subject',
          fallback: heldResolution('no-hypothesis-confirmed'),
          ...overrides,
        };
      }
  - node: rules/knowledge/a-case-read-by-an-unknown-slug-or-version-is-refused
    held_at: the CaseNotFoundError refusal test
    evidence: >-
      expect(response.statusCode).toBe(404);
      ...
      expect(responseBody.error.code).toBe('CaseNotFoundError');
      expect(responseBody.error.details).toEqual({ slug: 'an-absent-slug', version: 9 });
  - node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
    held_at: the glossary-incoherent subject test, which still expects 200
    evidence: >-
      built.readCaseVersion.mockResolvedValueOnce({ version: heldAttributes({ subject: 'an-unregistered-subject-type' }) });
      ...
      expect(response.statusCode).toBe(200);
  - node: constraints/a-successful-case-version-own-record-read-answers-with-http-200
    held_at: >-
      the same glossary-incoherent subject test — the stored record is answered 200 regardless
      of whether it would validate
    evidence: >-
      built.readCaseVersion.mockResolvedValueOnce({ version: heldAttributes({ subject: 'an-unregistered-subject-type' }) });
      ...
      expect(response.statusCode).toBe(200);
  - node: constraints/a-malformed-request-is-refused-with-a-validation-error
    held_at: >-
      the four 400-refusal tests (missing body attribute, its VALIDATION_ERROR/details shape,
      non-numeric version segment, empty version segment)
    evidence: >-
      expect(response.statusCode).toBe(400);
      expect(responseBody.error.code).toBe('VALIDATION_ERROR');
      expect(responseBody.error.message).toContain('body');
      expect(responseBody.error.details.length).toBeGreaterThan(0);
  - node: rules/knowledge/a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
    held_at: nowhere
    evidence: >-
      every it(...) in this file calls app.inject({ method: 'PATCH', ... }) — no test issues or
      asserts a discard
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-discardable
    held_at: nowhere
    evidence: >-
      the file registers only createUpdateDraftRoutesPlugin and never exercises caseStore.discard
  - node: constraints/a-successful-case-version-discard-answers-with-no-content
    held_at: nowhere
    evidence: 'discard: vi.fn(), — present only as an unused stub method on ICaseStore, never invoked or asserted on'
  - node: rules/knowledge/an-accepted-update-draft-answers-its-versions-own-stored-declared-attributes
    held_at: the first test's body assertion
    evidence: >-
      expect(response.json()).toEqual({
        title: attributes.title,
        when_to_use: attributes.when_to_use,
        subject: attributes.subject,
        fallback: attributes.fallback,
        consolidation_register: attributes.consolidation_register,
      });
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-open-for-editing
    held_at: nowhere
    evidence: >-
      findDraftVersion: vi.fn(), placeHypothesis: vi.fn(), removeManifestEntry: vi.fn(), — the
      manifest and its hypothesis count are never modeled or asserted on anywhere in this file
looked_past: >-
  The repeated buildTestApp()/stub-construction boilerplate across every test, and the choice
  to unit-test the route with fully mocked ports rather than integration-test it, are code-shape
  concerns with no domain fact attached and belong to a different pass.
candidates_opened:
  - rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
  - constraints/a-domain-error-unmapped-by-status-is-refused-generically
