findings:
  - file: src/http/dto/simulate-case.dto.ts
    where: "evaluationSchema's discriminated union, lines 42, 50 and 58"
    evidence: "verdict: z.literal('confirmed') ... verdict: z.literal('refuted') ... verdict: z.literal('inconclusive')"
    cost: "the verdict vocabulary already has one canonical home — the VERDICTS constant at src/investigation/verdict.ts, which src/investigation/evaluation.ts and the adapters already import — and this schema re-derives the same three strings as inline literals instead of importing it, the same way EVALUATION_REASONS, EVIDENCE_RESULTS and CONSOLIDATION_REGISTERS are imported a few lines above and below it; if domain/investigation/verdict's value set ever changes, nothing forces this file to change with it, so the response schema can silently accept or reject the wrong set of verdicts."
    kind: contradicts
    correction: "import { VERDICTS } from '../../investigation/verdict.js' and drive the discriminated union's three literal branches from it."
    node: domain/investigation/verdict
  - file: src/http/dto/simulate-case.dto.ts
    where: "usage/elapsed_ms/prompt in all three branches of evaluationSchema, lines 44-46, 52-54 and 61-63"
    evidence: |
      usage: usageSchema.optional(),
        elapsed_ms: z.number().optional(),
        prompt: z.string().optional(),
    cost: "domain/investigation/evaluation states usage, elapsed_ms and prompt are 'present exactly when a call happened, absent when reason `no-data` means judgment was never called at all' — no-data is a reason an inconclusive evaluation alone can carry, so a confirmed or a refuted evaluation always had a call happen and should always carry the three; marking them optional on every branch lets a response validate that the domain model rules out."
    kind: contradicts
    correction: "drop .optional() from usage, elapsed_ms and prompt on the confirmed and refuted branches, and keep them required on the inconclusive branch except where reason is 'no-data'."
    node: domain/investigation/evaluation
