read:
  - node: constraints/a-case-is-read-whole
    held_at: assembleWholeVersion, reading the version row and the whole manifest inside one transaction
    evidence: "const versionRow = await queryOneOrAbsent<ICaseVersionRow>(tx, caseVersionSelect(key), raiseReadFailure);\n  if (versionRow === undefined) {\n    return undefined;\n  }\n  const manifest = await readManifest(tx, key);\n  return assembledCaseVersionOf(key, versionRow, manifest);"

  - node: contracts/knowledge/case-lifecycle
    held_at: RelationalCaseStore's public methods (createDraft, insertHypothesisRevision, overwriteHypothesisRevision, releaseHypothesisRevision, placeHypothesis, removeManifestEntry, release, discard, updateDraft)
    evidence: "public async createDraft(input: CreateDraftInput): Promise<number> {\n    return runInTransaction(this.connection, raiseWriteFailure, (tx) => createDraftVersion(tx, input));\n  }"

  - node: contracts/knowledge/case-query
    held_at: assembleVersion, listCases, listCaseVersions, listHypotheses, listHypothesisRevisions
    evidence: "public async listHypothesisRevisions(\n    slug: string,\n    hypothesisName: string,\n    pagination: PaginationRequest,\n  ): Promise<PaginatedResponse<HypothesisRevisionListItem>> {"

  - node: domain/knowledge/case
    held_at: caseIdentityStatement and assignNextVersion
    evidence: "UPDATE ${CASES_TABLE} SET next_version = next_version + 1\n           WHERE slug = $1\n           RETURNING next_version - 1 AS version"

  - node: domain/knowledge/case-summary
    held_at: caseCatalogEntryOf
    evidence: "return {\n    slug: row.slug,\n    ...(row.current_state !== null ? { current_state: caseVersionStateOf(row.current_state) } : {}),\n    version_count: Number(row.version_count),"

  - node: domain/knowledge/case-version
    held_at: ICaseVersionRow / assembledCaseVersionOf / draftInsertStatement
    evidence: "return {\n    slug: key.slug,\n    version: key.version,\n    title: row.title,\n    when_to_use: row.when_to_use,"

