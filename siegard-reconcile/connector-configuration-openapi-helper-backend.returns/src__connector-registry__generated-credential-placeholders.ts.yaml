      const OCCUPIED_REASON: ConnectorConfigurationDraftUnresolvedReason = 'drafted-key-occupied-by-another-security-scheme';
  - node: rules/integration/a-connector-configuration-draft-names-a-generated-credential-for-a-reducible-security-scheme
    held_at: "credentialPlacementFor, httpSchemePlacement, withResolvedScheme and generatedCredentialName, lines 105-192"
    evidence: |
      function credentialPlacementFor(scheme: OpenApiRequiredSecurityScheme): CredentialPlacement | undefined {
        if (scheme.kind === 'apiKey') {
          return apiKeyPlacement(scheme.location, scheme.name);
        }
        if (scheme.kind === 'http') {
          return httpSchemePlacement(scheme.httpScheme);
        }
        return undefined;
      }
      function generatedCredentialName(connector: string, schemeName: string): string {
        return `${upperSnakeSegment(connector)}_${upperSnakeSegment(schemeName)}`;
      }
  - node: rules/integration/a-connector-configuration-draft-places-each-part-where-the-call-carries-it
    held_at: "apiKeyPlacement and httpSchemePlacement, lines 157-184, which place a generated credential at the location its own security scheme declares"
    evidence: |
