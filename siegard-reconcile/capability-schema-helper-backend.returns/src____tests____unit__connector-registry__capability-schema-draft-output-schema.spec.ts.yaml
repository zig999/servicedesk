read:
  - node: domain/integration/capability-schema-draft
    held_at: >-
      the parsed-shape assertions in the first test ("parses output_schema as a JSON object
      declaring a top-level properties object"), lines 19-40
    evidence: |-
      const parsed: unknown = JSON.parse(draft.outputSchema);
        expect(typeof parsed).toBe('object');
        expect(parsed).not.toBeNull();
        expect(Array.isArray(parsed)).toBe(false);
        expect(typeof (parsed as Record<string, unknown>).properties).toBe('object');
