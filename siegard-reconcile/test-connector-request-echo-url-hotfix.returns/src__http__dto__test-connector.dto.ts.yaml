        body: z.unknown().optional(),
      });
looked_past: >-
  The 404/409/422 refusal statuses, error names and disclosure rules
  a-connector-configuration-is-tested-through-a-registered-capability also fixes are not
  represented anywhere in this DTO (they live in the error classes and status map the candidate
  index binds to other files), so I did not judge them here; I also did not flag the
  capabilityIdentitySchema shape (name/version) or the optional `input` field as either fact,
  since neither a node in this set nor a specification search settled what, if anything, they
  should hold.
