looked_past: >-
  The test asserts only that a "Test" heading sits outside an "Actions" group
  ("expect(within(footer).queryByRole(\"heading\", { name: \"Test\" })).toBeNull();") — a
  control-grouping/placement fact every relevant node in this pack repeatedly disclaims as form
  belonging to the interface, not the specification, and (per its own title) answers a plan-level
  criterion rather than a domain rule, so it is not this pass's finding to make.
