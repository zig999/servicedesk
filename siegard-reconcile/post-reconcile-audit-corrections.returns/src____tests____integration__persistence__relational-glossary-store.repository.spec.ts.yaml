  effect" they say "stays unprovable for this vocabulary until that pinning is lifted" and then assert
  only the foreign-key rejection, not the named effect itself; that is a testing-fixture limitation the
  tests disclose honestly, not a domain-fact conformance question, so it is left unreported here.
