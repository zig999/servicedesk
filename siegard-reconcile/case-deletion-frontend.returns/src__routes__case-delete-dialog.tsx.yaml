findings:
  - file: src/routes/case-delete-dialog.tsx
    where: "lines 17-18, the CASE_DELETE_DIALOG_DESCRIPTION constant rendered as DialogDescription"
    evidence: >-
      "This removes the case together with every hypothesis referencing it, every
      hypothesis-revision of those hypotheses and every collect those revisions hold. This
      cannot be undone."
    cost: >-
      rules/knowledge/a-case-holding-no-version-may-be-deleted already states, as its own
      authority, exactly what an accepted delete removes ("the case itself, every hypothesis
      referencing it, every hypothesis-revision of those hypotheses, released ones included,
      and every collect those revisions hold") and that nothing restores it. The dialog
      hard-codes a near-restatement of that same list (already dropping "released ones
      included") as its own copy. Should the rule's scope of what delete removes ever change,
      this string has no dependency on the rule and would keep telling a curator confirming
      an irreversible act a consequence the specification no longer states, with nothing
      forcing the two into agreement.
    correction: >-
      Replace the hard-coded enumeration with wording derived from (or generated alongside)
      rules/knowledge/a-case-holding-no-version-may-be-deleted, so the list of what delete
      removes has one home.
    kind: contradicts
    node: rules/knowledge/a-case-holding-no-version-may-be-deleted
