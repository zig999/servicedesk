looked_past: The exact shape of the orphaned-placeholder report and the accepted-but-unvalidated non-integer
  timeout / non-positive limit at the service layer (whose split from HTTP-level validation the decision
  log already accounts for) are formatting and layering choices, not domain facts. A seeming timeout contradiction
  was checked against decision-log.md (~lines 509-511) and resolved as an intentional DTO-vs-service validation
  split, not drift.
