      ...
      public async removeConcept(name: string): Promise<void> {
          const usage = await this.conceptUsageReader.readConceptUsage(name);
          if (usage.named) {
            throw new ConceptInUseError(name, usage.reference);
          }
          await this.store.deleteConcept(name);
        }
