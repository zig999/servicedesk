read:
  - node: constraints/the-openapi-document-is-fetched-by-the-backend
    held_at: >-
      the stubFetch handler, which throws for any URL other than the backend draft route
    evidence: >-
      if (url !== DRAFT_ROUTE) {
        throw new Error(`use-draft-connector-configuration-from-openapi-reading-parts proof: no mocked response for ${url}`);
      }
  - node: contracts/integration/connector-configuration-draft
    held_at: >-
      the DRAFT_ROUTE constant and every mounted request naming it
    evidence: >-
      const DRAFT_ROUTE = "/v1/draft-connector-configuration-from-openapi";
  - node: domain/integration/connector-configuration
    held_at: nowhere
    evidence: >-
      FULL_DRAFT carries connector and configuration as fixture properties only; no test in this file asserts anything about them specifically
  - node: domain/integration/connector-configuration-draft
    held_at: >-
      the FULL_DRAFT constant, lines 29-38
    evidence: >-
      const FULL_DRAFT: ConnectorConfigurationDraft = {
        connector: CONNECTOR,
        configuration: '{"address":"https://api.example.com/v2/translate"}',
        unresolved: [{ name: "api-key", reason: "no-capability-registered" }],
        generated_credentials: [{ name: "api-key", security_scheme: "apiKey" }],
        method_mismatch: { registered: "GET", operation: "POST" },
        status_readings: [],
        response_fields: [],
        reading_notes: [],
      };
  - node: domain/integration/connector-configuration-draft-reading-note
    held_at: >-
      the third describe block, testing kind/subject always present and detail present only when named
    evidence: >-
      expect(outcome.draft.reading_notes).toEqual([readingNoteWithDetail, readingNoteWithoutDetail]);
      expect(Object.prototype.hasOwnProperty.call(outcome.draft.reading_notes[1], "detail")).toBe(false);
  - node: domain/integration/connector-configuration-draft-reading-note-kind
    held_at: >-
      ALL_NINE_READING_NOTE_KINDS and the fourth describe block
    evidence: >-
      const ALL_NINE_READING_NOTE_KINDS: readonly ConnectorConfigurationDraftReadingNoteKind[] = [
        "default-response-not-drafted",
        "status-range-not-drafted",
        "non-json-success-content-not-read",
        "envelope-read-through",
        "variants-united",
        "repeated-field-name-path-not-taken",
        "no-responses-declared",
        "no-success-response-schema",
        "success-schema-declares-no-properties",
      ];
  - node: domain/integration/connector-configuration-draft-response-field
    held_at: >-
      the second describe block, testing name/path/status always present and declared_type/declared_required/envelope present only when named
    evidence: >-
      expect(outcome.draft.response_fields).toEqual([responseFieldWithOptionalTerms, responseFieldWithoutOptionalTerms]);
      for (const key of ["declared_type", "declared_required", "envelope"]) {
        expect(Object.prototype.hasOwnProperty.call(outcome.draft.response_fields[1], key)).toBe(false);
      }
  - node: domain/integration/connector-configuration-draft-status-reading
    held_at: >-
      the first describe block, testing status/ending always present and declared_as present only when named
    evidence: >-
      expect(outcome.draft.status_readings).toEqual([statusReadingWithDeclaredAs, statusReadingWithoutDeclaredAs]);
      expect(Object.prototype.hasOwnProperty.call(outcome.draft.status_readings[1], "declared_as")).toBe(false);
  - node: domain/integration/connector-configuration-draft-unresolved-item
    held_at: nowhere
    evidence: >-
      unresolved: [{ name: "api-key", reason: "no-capability-registered" }] is present only as unassessed fixture data inside FULL_DRAFT; no assertion in this file reads it
  - node: domain/integration/connector-configuration-draft-unresolved-reason
