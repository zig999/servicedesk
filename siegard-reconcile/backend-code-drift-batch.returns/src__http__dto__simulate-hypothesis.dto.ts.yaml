findings:
  - where: "usageSchema, lines 35-38"
    evidence: "input_tokens: z.number(),\n  output_tokens: z.number(),"
    cost: "domain/investigation/usage declares both attributes type integer; z.number() admits any finite JS number, so a fractional token count (e.g. 12.5) passes validation and is served as a valid usage record — the boundary meant to enforce the domain model's declared shape is looser than the shape it names."
    kind: contradicts
    correction: "use z.int() (as caseRefSchema.version already does in this same file) for input_tokens and output_tokens"
    node: domain/investigation/usage
  - where: "evaluationSchema, elapsed_ms at lines 48, 56 and 65"
    evidence: "elapsed_ms: z.number().optional(),"
    cost: "domain/investigation/evaluation declares elapsed_ms type integer, the same millisecond unit domain/investigation/durations keeps its stage totals in; z.number() lets a fractional millisecond value through validation in all three verdict branches, so the response can carry a call duration the domain model's own type forbids."
    kind: contradicts
    correction: "use z.int().optional() for elapsed_ms in each of the three discriminated-union branches"
    node: domain/investigation/evaluation
  - where: "durationsSchema, lines 70-74"
    evidence: "collection: z.number(),\n  judgment: z.number(),\n  total: z.number(),"
    cost: "domain/investigation/durations declares collection, judgment and total type integer, in milliseconds; z.number() admits fractional milliseconds for all three, so a load test comparing this value against the declared total budget (the node's own stated use) can be handed a value shaped differently than the domain model promises."
    kind: contradicts
    correction: "use z.int() for collection, judgment and total"
    node: domain/investigation/durations
