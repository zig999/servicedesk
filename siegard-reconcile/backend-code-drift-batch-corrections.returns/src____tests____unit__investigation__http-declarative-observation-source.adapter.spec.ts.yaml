findings:
- file: src/__tests__/unit/investigation/http-declarative-observation-source.adapter.spec.ts
  where: the it() block at lines 854-865, "treats a response body that is not valid JSON as nothing extracted, rather than throwing, on the ok path"
  evidence: 'expect(outcome).toEqual({ result: ''ok'', observation: JSON.stringify({}) });'
  cost: The choice to answer an ok-status response whose body does not parse as JSON with an empty, usable-looking observation — rather than ending unavailable, or some other classification — is fixed only in this test. A reader checking what the specification says a malformed corporate-system payload does to an otherwise-successful call finds nothing, and anyone changing this behavior later (e.g. to end unavailable, matching how every other malformed-input case in this same file already degrades) has no node to update or be held to.
  kind: unstated
  correction: State, in a node governing the HTTP connector's own reading of its response (an-http-connector-configuration-declares-its-call or a sibling node), what an ok-classified status whose body does not parse as JSON yields.
