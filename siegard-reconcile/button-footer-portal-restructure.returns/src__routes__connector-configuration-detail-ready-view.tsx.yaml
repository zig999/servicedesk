findings:
  - where: "the `state.justSaved` status paragraph in `trailingActions`, lines 82-87"
    evidence: |
      {state.justSaved && (

                    <p role="status" className="text-sm text-foreground">
                      Saved.
                    </p>
                  )}
    cost: "The surface's only statement of a submission's outcome is a bare \"Saved.\" shown when `justSaved` is true; there is no construct anywhere in this file rendering a refused outcome (that nothing registered and which refusal answered it), and even the success message never names what was registered — the connector name submitted. An operator who submits an edit that the registry refuses (for example a malformed configuration) sees no status at all here, so they cannot tell a refusal from a request never sent, and even on success they are not told which connector configuration was saved."
    kind: contradicts
    node: rules/integration/a-submitted-registration-states-its-outcome-to-the-operator
    correction: "Render a distinguishable refusal branch (stating that nothing was registered and naming the refusal condition, or that the reason is unrecognised) alongside the success branch, and have the success message name the connector configuration that was registered rather than only \"Saved.\""

