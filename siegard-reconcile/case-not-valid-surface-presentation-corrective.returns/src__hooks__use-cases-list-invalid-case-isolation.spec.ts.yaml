findings:
  - file: src/hooks/use-cases-list-invalid-case-isolation.spec.ts
    where: >-
      the case-alpha version-detail mock and its expected summary in the first test, lines
      61-62 and 78-82
    evidence: |-
      "/v1/cases/case-alpha/versions/1": () =>
        jsonResponse({ authored_at: "2024-01-01T00:00:00.000Z" }),
      ...
      {
        slug: "case-alpha",
        summary: { versionCount: 1, currentState: "released", lastUpdated: "2024-01-01T00:00:00.000Z" },
      },
    cost: >-
      case-alpha's current version is stated as released (`state: "released"` in the versions
      list), so a reader treating this test as the contract for a released case's summary is
      told title, when_to_use and released_version are never part of it; an implementation
      change that stops deriving those three fields for a released case would pass this test
      undetected.
    kind: contradicts
    node: domain/knowledge/case-summary
    correction: >-
      mock the version-detail response with title, when_to_use and released_version data and
      include them in the expected summary for case-alpha, since its current version is released.

  - file: src/hooks/use-cases-list-invalid-case-isolation.spec.ts
    where: >-
      the case-good version-detail mock and its expected summary in the second test, lines
      107-108 and 133-137
    evidence: |-
      "/v1/cases/case-good/versions/1": () =>
        jsonResponse({ authored_at: "2024-02-02T00:00:00.000Z" }),
      ...
      {
        slug: "case-good",
        summary: { versionCount: 1, currentState: "released", lastUpdated: "2024-02-02T00:00:00.000Z" },
      },
    cost: >-
      same gap as case-alpha, repeated in the second test: case-good's current version is
      released yet the expected summary carries no title, when_to_use or released_version,
      so the test again pins a shape the specification does not allow for a released case.
    kind: contradicts
    node: domain/knowledge/case-summary
    correction: >-
      mock the version-detail response with title, when_to_use and released_version data and
      include them in the expected summary for case-good, since its current version is released.

