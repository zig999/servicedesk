looked_past: "the error-context vocabulary the tests pin (kind: 'unsupported-version' | 'no-version-declared' | 'unparseable', declaredVersion, detail, and the httpScheme/schemeName field names) is an internal representation choice for how the reader names its refusal and reading data, not a business fact any node states a shape for; whether that shape is a reasonable one is the standard-conformance pass's question, not this one's."
