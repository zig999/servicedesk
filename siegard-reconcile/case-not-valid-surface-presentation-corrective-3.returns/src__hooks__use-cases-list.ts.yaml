looked_past: >-
  releasedInfo's fetch of an already-released version's detail (the branch taken when
  the highest version is still draft and an earlier version was released) has no
  try/catch of its own, so a failure there would reject the whole entry rather than being
  handled per-case; no node in this file's set or the candidate index governs that
  specific fetch, so this is left for whichever judgment reaches that behavior rather than
  reported here as a finding.
