    where: "the test 'resolves CaseVersionNotReleasedError to 409', lines 91-97"
    evidence: |
      it('resolves CaseVersionNotReleasedError to 409', () => {
        const error = new CaseVersionNotReleasedError('a-slug', 1, 'draft');

        const status = statusForError(error);

        expect(status).toBe(409);
      });
    cost: "The rule this refusal answers for (rules/investigation/only-a-released-case-version-is-diagnosed) names no error identity and no HTTP status at all — every sibling refusal in the specification pairs its rule with an explicit 'HTTP nnn response reporting XError' clause, and the deadline case (rules/investigation/no-stage-aborts-on-its-deadline) even has a decision-log entry doing exactly that. This one has none, so this test is the only place asserting that a diagnose against a non-released version answers with 409 and with the name CaseVersionNotReleasedError specifically; a reader who checks the specification for that pairing finds only the general refusal, not the status or the error identity."
    kind: unstated
    correction: "Decide and record, in the specification's decision log, which node names CaseVersionNotReleasedError and its HTTP status — most naturally rules/investigation/only-a-released-case-version-is-diagnosed, following the same pattern the deadline rule already uses — so the pairing has a home outside the test."
    node: rules/investigation/only-a-released-case-version-is-diagnosed
