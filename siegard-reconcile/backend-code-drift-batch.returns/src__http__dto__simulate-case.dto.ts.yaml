findings:
  - where: "usageSchema, lines 34-37"
    evidence: |
      const usageSchema = z.object({
        input_tokens: z.number(),
        output_tokens: z.number(),
      });
    cost: "domain/investigation/usage fixes input_tokens and output_tokens as integer, but the wire schema accepts any finite number; a response can legally carry a fractional token count (e.g. 12.5), and a client trusting the specification's integer type has no schema-level guarantee of it — the same file enforces integer-only elsewhere (`version: z.int().positive()`, `elapsed_ms: z.int()`), so the looseness here is not this codebase's general convention for a measured/counted value."
    kind: contradicts
    node: domain/investigation/usage
    correction: "validate input_tokens and output_tokens with z.int() (or z.number().int()) rather than z.number()."

