looked_past: >-
  The manual isDispatchingRef bookkeeping duplicates state TanStack Query's own mutation.status
  already tracks (idle/pending/success/error); that redundancy is a code-quality question
  separate from the concurrency-drop behavior reported above and is not this pass's to weigh.
