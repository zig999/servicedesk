read:
  - node: domain/integration/capability
    held_at: >-
      the `completeAnswer()` fixture and the `REQUIRED_ATTRIBUTES_OTHER_THAN_PAYLOAD_NOTES`
      list, which together exercise `name`, `version`, `nature`, `input_schema`,
      `output_schema`, `timeout`, `connector` and `concept` as present, and `payload_notes`
      as the one attribute the schema tolerates absent.
    evidence: |-
      const REQUIRED_ATTRIBUTES_OTHER_THAN_PAYLOAD_NOTES = [
        'nature',
        'input_schema',
        'output_schema',
        'timeout',
        'connector',
        'concept',
      ] as const;

      function completeAnswer(): Record<string, unknown> {
        return {
          name: 'a-capability',
          version: '1.0.0',
          nature: 'read-only',
          input_schema: 'an-input-schema',
          output_schema: 'an-output-schema',
          timeout: 5_000,
          connector: 'a-connector',
          concept: 'a-concept',
        };
      }
  - node: domain/investigation/evidence
    held_at: nowhere
    evidence: >-
      This file only imports and exercises `readCapabilityByIdentityResponseSchema`; it
      declares no evidence-shaped fixture and asserts nothing about evidence semantics.
  - node: domain/investigation/hypothesis-evaluator
    held_at: nowhere
    evidence: >-
      This file contains no reference to a hypothesis evaluator, a criterion, or an
      evaluation call.
  - node: rules/integration/a-capability-declares-its-contract
    held_at: nowhere
    evidence: >-
      This file never asserts an HTTP 422 refusal, an `IncompleteCapabilityContractError`,
      or a timeout default; both `it` blocks only call `.safeParse` and check
      `result.success`, with no status code or error type inspected.
  - node: rules/integration/a-presented-capability-states-its-declared-attributes-as-the-read-answered-them
    held_at: >-
      both `it` blocks: the first asserting the schema accepts an answer with every
      declared attribute except `payload_notes`, the second asserting the schema refuses
      an answer missing any of the other declared attributes.
    evidence: |-
      it('does not refuse an answer in which payload_notes stands absent and every other declared attribute stands present', () => {
        const answer = completeAnswer();

        const result = readCapabilityByIdentityResponseSchema.safeParse(answer);

        expect(result.success).toBe(true);
      });

      it.each(REQUIRED_ATTRIBUTES_OTHER_THAN_PAYLOAD_NOTES)(
        'refuses an answer in which %s stands absent, since payload_notes is the only attribute this schema admits absent',
        (attribute) => {
          const answer = completeAnswer();
          delete answer[attribute];

          const result = readCapabilityByIdentityResponseSchema.safeParse(answer);

          expect(result.success).toBe(false);
        },
      );
  - node: rules/investigation/judgment-reads-the-evidence-snapshot
    held_at: nowhere
    evidence: >-
      No judgment, evaluation or snapshot concept appears anywhere in this file.
  - node: constraints/the-stored-schema-mirrors-the-declared-model
    held_at: nowhere
    evidence: >-
      This file tests an HTTP response schema, not a persistence relation or migration;
      no column or relation is referenced.
  - node: constraints/the-schema-replays-from-its-scripts
    held_at: nowhere
    evidence: >-
      No migration script or replay behavior is referenced anywhere in this file.
looked_past: >-
  REQUIRED_ATTRIBUTES_OTHER_THAN_PAYLOAD_NOTES omits `name` and `version` — both required
  per domain/integration/capability and both named alongside the other attributes in
  rules/integration/a-presented-capability-states-its-declared-attributes-as-the-read-answered-them
  — so the it.each loop never exercises absence of `name` or `version`; that is a test-coverage
  gap rather than a stated domain fact, and belongs to a different pass.
