findings:
  - file: src/persistence/relational-case-store.repository.ts
    where: "resolveSourceVersion (lines 690-696) and manifestCopyStatement (lines 727-735), used by createDraftVersion"
    evidence: |-
      if (input.source_version !== undefined) {
        return input.source_version;
      }
      ...
      INSERT INTO ${CASE_VERSION_HYPOTHESES_TABLE} (case_slug, case_version, hypothesis_name, revision, position)
             SELECT case_slug, $2, hypothesis_name, revision, position
             FROM ${CASE_VERSION_HYPOTHESES_TABLE}
             WHERE case_slug = $1 AND case_version = $3
    cost: >-
      A create-draft that names a source_version this case never held — mistyped, or a version
      long since discarded — is never refused: the copy statement's SELECT simply matches no
      row, so the new draft is created anyway with an empty manifest, reading exactly like a
      case's legitimate first-ever draft. A curator who asked to continue from an earlier
      version has no way to tell "rolled back, and that version happened to be empty" from
      "the version I named was never found," and no refusal names the version that failed to
      resolve.
    correction: >-
      resolveSourceVersion (or createDraftVersion) would need to confirm input.source_version
      names a version this same case actually holds before creating the draft, refusing by a
      name of its own when it does not — the same discipline every other lifecycle operation in
      this file already applies to an unknown version.
    kind: unstated
    node: rules/knowledge/a-new-drafts-manifest-is-copied-from-an-existing-version
