findings:
  - file: src/persistence/relational-case-store.repository.ts
    where: "hypothesesPageSelect, in listHypothesesPage's SQL text"
    evidence: "text: `SELECT name FROM ${HYPOTHESES_TABLE} WHERE case_slug = $1 ORDER BY name LIMIT $2 OFFSET $3`,"
    cost: "Which hypotheses a page of list-hypotheses carries follows entirely from this ORDER BY name decision, the same shape of fact rules/knowledge/a-case-listing-answers-cases-in-slug-order and rules/knowledge/a-hypothesis-revisions-listing-answers-highest-revision-first were written to decide explicitly for the other two orderable listings contracts/knowledge/case-query publishes. No node states an order for list-hypotheses at all — the next reader who wants to know why hypotheses come back name-first, or whether a curator paging through a large case can rely on that order holding, will look in the specification and find nothing, because the decision lives only in this SQL clause."
    kind: unstated
    correction: "Decide, and record as a rule of the specification, the order a list-hypotheses page answers in — by name ascending, as this clause already does, or otherwise — the way a-case-listing-answers-cases-in-slug-order and a-hypothesis-revisions-listing-answers-highest-revision-first were decided for the other two listings."

read:
  - node: constraints/a-case-is-read-whole
    held_at: "assembleWholeVersion / readManifest, run inside one transaction"
    evidence: |
      const manifest = await readManifest(tx, key);
        return assembledCaseVersionOf(key, versionRow, manifest);
  - node: contracts/knowledge/case-lifecycle
    held_at: "the ICaseStore method set — createDraft, insertHypothesisRevision, overwriteHypothesisRevision, placeHypothesis, removeManifestEntry, release, discard, updateDraft, releaseHypothesisRevision"
    evidence: |
      public async createDraft(input: CreateDraftInput): Promise<number> {
          return runInTransaction(this.connection, raiseWriteFailure, (tx) => createDraftVersion(tx, input));
        }
  - node: contracts/knowledge/case-query
    held_at: "the ICaseStore read methods — assembleVersion, listCases, listCaseVersions, listHypotheses, listHypothesisRevisions"
    evidence: |
      public async listCases(pagination: PaginationRequest): Promise<PaginatedResponse<CaseCatalogEntry>> {
          return runInTransaction(this.connection, raiseReadFailure, (tx) => listCasesPage(tx, pagination));
        }
  - node: domain/knowledge/case
    held_at: "assignNextVersion / nextVersionUpdateStatement and caseIdentityStatement"
    evidence: |
      text: `UPDATE ${CASES_TABLE} SET next_version = next_version + 1
                 WHERE slug = $1
                 RETURNING next_version - 1 AS version`,
  - node: domain/knowledge/case-summary
    held_at: "casesPageSelect and caseCatalogEntryOf"
    evidence: |
      ...(row.current_state !== null ? { current_state: caseVersionStateOf(row.current_state) } : {}),
        version_count: Number(row.version_count),
  - node: domain/knowledge/case-version-state
    held_at: "DRAFT_STATE/RELEASED_STATE constants and isCaseVersionState"
    evidence: |
      function isCaseVersionState(value: string): value is CaseVersionState {
        return value === DRAFT_STATE || value === RELEASED_STATE;
      }
  - node: domain/knowledge/hypothesis
    held_at: "hypothesisIdentityStatement"
    evidence: "text: `INSERT INTO ${HYPOTHESES_TABLE} (case_slug, name) VALUES ($1, $2) ON CONFLICT (case_slug, name) DO NOTHING`,"
  - node: domain/knowledge/hypothesis-revision
    held_at: "manifestEntryOf / hypothesisRevisionListItemOf, and releaseHypothesisRevisionRow"
    evidence: "return { position: row.position, hypothesis_revision: hypothesisRevision };"
  - node: domain/knowledge/hypothesis-revision-state
    held_at: "HYPOTHESIS_REVISION_STATE_VALUES, built from the imported HYPOTHESIS_REVISION_STATES, and isHypothesisRevisionState"
    evidence: "const HYPOTHESIS_REVISION_STATE_VALUES: ReadonlySet<string> = new Set<string>(HYPOTHESIS_REVISION_STATES);"
  - node: domain/knowledge/manifest-entry
    held_at: "manifestEntryOf"
    evidence: "return { position: row.position, hypothesis_revision: hypothesisRevision };"
  - node: rules/knowledge/a-case-has-at-most-one-draft
    held_at: "raiseCreateDraftFailure"
    evidence: "return (cause) => (isConstraintViolation(cause, ONE_DRAFT_PER_CASE_CONSTRAINT) ? new CaseAlreadyHasDraftError(slug) : raiseWriteFailure(cause));"
  - node: rules/knowledge/a-case-listing-answers-cases-in-slug-order
    held_at: "casesPageSelect"
    evidence: "SELECT slug FROM ${CASES_TABLE} ORDER BY slug LIMIT $1 OFFSET $2) c ... ORDER BY c.slug`"
  - node: rules/knowledge/a-case-summary-is-derived-from-its-existing-versions
    held_at: "casesPageSelect's latest/released subqueries"
    evidence: |
      SELECT DISTINCT ON (slug) slug, state, authored_at,
                        COUNT(*) OVER (PARTITION BY slug) AS version_count
                 FROM ${CASE_VERSIONS_TABLE}
                 ORDER BY slug, version DESC
  - node: rules/knowledge/a-case-version-is-written-once
    held_at: "refuseUnlessDraft, guarding updateDraftVersion, insertManifestEntry, deleteManifestEntry and discardDraft"
    evidence: |
      function refuseUnlessDraft(key: ICaseVersionKey, state: CaseVersionState): void {
        if (state !== DRAFT_STATE) {
          throw new CaseVersionNotDraftError(key.slug, key.version, state);
        }
      }
  - node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
    held_at: "refuseUnlessDraft / refuseUnlessDraftAtRelease and releaseVersion"
    evidence: |
      function refuseUnlessDraftAtRelease(key: ICaseVersionKey, state: CaseVersionState): void {
        if (state !== DRAFT_STATE) {
          throw new CaseVersionNotDraftAtReleaseError(key.slug, key.version, state);
        }
      }
  - node: rules/knowledge/a-case-version-number-is-never-reused
    held_at: "nextVersionUpdateStatement, an ever-incrementing counter untouched by discardDraft"
    evidence: |
      text: `UPDATE ${CASES_TABLE} SET next_version = next_version + 1
                 WHERE slug = $1
                 RETURNING next_version - 1 AS version`,
  - node: rules/knowledge/a-hypothesis-name-is-unique-within-its-case
    held_at: "hypothesisIdentityStatement"
    evidence: "text: `INSERT INTO ${HYPOTHESES_TABLE} (case_slug, name) VALUES ($1, $2) ON CONFLICT (case_slug, name) DO NOTHING`,"
  - node: rules/knowledge/a-hypothesis-position-is-unique-within-its-case
    held_at: "raisePlaceHypothesisFailure"
    evidence: |
      isConstraintViolation(cause, POSITION_UNIQUE_CONSTRAINT)
          ? new ManifestPositionOccupiedError(input.slug, input.version, input.position)
          : raiseWriteFailure(cause);
  - node: rules/knowledge/a-hypothesis-revision-is-overwritten-while-unreleased
    held_at: "insertRevisionRow's revisionInsertStatement (always creates a new row numbered COALESCE(MAX(revision),0)+1) and overwriteRevision's revisionOverwriteStatement (updates an existing row's content in place)"
    evidence: |
      SELECT $1, $2, COALESCE(MAX(revision), 0) + 1, $3, $4, $5, $6, $7
               FROM ${HYPOTHESIS_REVISIONS_TABLE}
               WHERE case_slug = $1 AND hypothesis_name = $2
  - node: rules/knowledge/a-hypothesis-revision-moves-through-its-declared-lifecycle
    held_at: "releaseHypothesisRevisionStatement — the transition write itself (state set to released); the refusal for a non-draft or non-existent revision is not checked by this function"
    evidence: |
      async function releaseHypothesisRevisionRow(tx: IQueryable, key: IRevisionKey): Promise<void> {
        await runStatement(tx, releaseHypothesisRevisionStatement(key), raiseWriteFailure);
      }
  - node: rules/knowledge/a-hypothesis-revision-number-is-never-reused
    held_at: "revisionInsertStatement"
    evidence: "SELECT $1, $2, COALESCE(MAX(revision), 0) + 1, $3, $4, $5, $6, $7"
  - node: rules/knowledge/a-hypothesis-revisions-listing-answers-highest-revision-first
    held_at: "hypothesisRevisionsPageSelect"
    evidence: |
      ORDER BY revision DESC
               LIMIT $3 OFFSET $4`,
  - node: rules/knowledge/a-hypothesis-revisions-listing-discloses-each-revisions-own-state
    held_at: "hypothesisRevisionListItemOf"
    evidence: "state: hypothesisRevisionStateOf(row.state),"
  - node: rules/knowledge/a-new-drafts-manifest-is-copied-from-an-existing-version
    held_at: "resolveSourceVersion and createDraftVersion's manifestCopyStatement"
    evidence: |
      if (sourceVersion !== undefined) {
          await runStatement(tx, manifestCopyStatement(input.slug, version, sourceVersion), raiseWriteFailure);
        }
  - node: rules/knowledge/a-slug-identifies-one-case
    held_at: "caseIdentityStatement"
    evidence: "text: `INSERT INTO ${CASES_TABLE} (slug) VALUES ($1) ON CONFLICT (slug) DO NOTHING`, params: [slug] };"
  - node: rules/knowledge/every-case-version-remains-readable
    held_at: "discardDraft, guarded by refuseUnlessDraft so only a draft version's own rows are ever deleted"
    evidence: |
      async function discardDraft(tx: IQueryable, key: ICaseVersionKey): Promise<void> {
        refuseUnlessDraft(key, await requireVersionState(tx, key));
        await runStatement(tx, deleteManifestEntriesStatement(key), raiseWriteFailure);
        await runStatement(tx, deleteCaseVersionStatement(key), raiseWriteFailure);
      }
  - node: rules/knowledge/hypotheses-are-ordered-by-precedence
    held_at: "manifestSelect"
    evidence: |
      WHERE cvh.case_slug = $1 AND cvh.case_version = $2
               ORDER BY cvh.position`,
  - node: scenarios/knowledge/a-catalog-entry-follows-the-released-version
    held_at: "casesPageSelect's latest/released subqueries"
    evidence: |
      LEFT JOIN (
                 SELECT DISTINCT ON (slug) slug, version, title, when_to_use
                 FROM ${CASE_VERSIONS_TABLE}
                 WHERE state = $3
                 ORDER BY slug, version DESC
               ) released ON released.slug = c.slug
  - node: scenarios/knowledge/a-hypothesis-revision-is-released-independently-of-any-manifest
    held_at: "releaseHypothesisRevisionStatement, touching only hypothesis_revisions"
    evidence: |
      text: `UPDATE ${HYPOTHESIS_REVISIONS_TABLE} SET state = $4
               WHERE case_slug = $1 AND hypothesis_name = $2 AND revision = $3`,
  - node: scenarios/knowledge/revising-a-released-revision-creates-the-next
    held_at: "insertRevisionRow / revisionInsertStatement, creating a new draft-state row without touching the prior one"
    evidence: "params: [input.slug, input.hypothesis_name, input.criterion, outcome, action, recipient, HYPOTHESIS_REVISION_DRAFT_STATE],"

looked_past: "For rules/knowledge/a-hypothesis-revision-moves-through-its-declared-lifecycle, the refusal itself is not in this function, but src/case/release-hypothesis-revision.operation.ts and its own dedicated HypothesisRevisionNotDraftAtReleaseError plainly exist elsewhere in the tree to compose it against readHypothesisRevisionOwnState — that file is outside this file set, so whether it actually holds the refusal correctly is a judgment over that file, not this one; also, isCaseVersionState's inline literal comparison (value === DRAFT_STATE || value === RELEASED_STATE) versus the imported-Set style used for hypothesis-revision-state is a style inconsistency, not a domain-fact disagreement, since both constants are typed against the imported CaseVersionState union and the function fails closed on any other value."
