looked_past: >-
  isRemoveDisabled is bound to a single, file-wide isRemoving flag rather than to the
  row being removed, so every row's Remove button disables during any one row's
  in-flight removal — a UI-mechanics choice with no domain fact behind it, not this
  pass's concern.
