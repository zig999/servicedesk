findings:
  - file: src/routes/new-case-draft-screen.tsx
    where: >-
      line 33, the isFirstVersion disclosure inside the final return block
    evidence: >-
      {state.isFirstVersion && <p>This is the case&apos;s first version.</p>}
    cost: >-
      The screen tells the curator, as a stated fact, whether the draft being composed
      is the case's very first version. No node in the specification authorizes a
      new-draft-authoring surface to disclose this, fixes when it should be shown, or
      states the wording — unlike the closely neighbouring disclosures this same family
      of nodes governs in detail (a case's current version not reading back, a read not
      completing, and so on). A later reader auditing what this screen is entitled to
      tell a curator will not find this fact in the specification and cannot tell
      whether it is a deliberate business decision or drift the code introduced on its
      own.
    kind: unstated
    correction: >-
      Either record, in a specification node over domain/knowledge/case or
      domain/knowledge/case-version, that a new-draft-authoring surface discloses
      whether the draft is the case's first version, or remove the disclosure from the
      screen if it was never meant to be a specification-governed fact.
