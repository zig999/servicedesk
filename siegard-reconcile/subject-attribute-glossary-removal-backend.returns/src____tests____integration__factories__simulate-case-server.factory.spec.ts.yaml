    held_at: >-
      the draft-state test, lines 361-372 — it dispatches simulate against a case version pinned to draft and
      still asserts 200 with the complete record, without the subject naming every attribute the case's own
      requirements might separately hold
    evidence: >-
      'answers 200 with the complete record likewise for a draft-state pinned case version, never released',
      async () => {
        expect(draftVersion).toBeDefined();
        const response = await app.inject({ method: 'POST', url: '/v1/simulate', payload: requestBodyFor(DRAFT_SLUG, draftVersion as number, requester) });
        expect(response.statusCode).toBe(200);
  - node: rules/investigation/a-subject-carries-at-least-one-attribute
    held_at: "requestBodyFor(), lines 338-344"
    evidence: >-
      subject: { type: 'contract', attributes: [{ attribute: SEEDED_SUBJECT_ATTRIBUTE_NAME, value: 'CTR-0001' }] },
looked_past: >-
  SEEDED_SUBJECT_ATTRIBUTE_NAME is named as though it were inserted into a governed vocabulary the way subject_types,
  outcomes, actions and recipients are, but no insertTerms-style seeding call ever writes it anywhere — that naming
  is a code-quality/comment-style matter, not a domain fact the source states or misstates, so I leave it to a
  different pass.
