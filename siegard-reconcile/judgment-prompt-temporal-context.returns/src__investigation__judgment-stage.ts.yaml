    held_at: |-
      isStructurallyValid's call to acceptedCitations, gating acceptance of a returned outcome's citations
    evidence: |-
      const accepted = acceptedCitations({ ...context, citations });
        return accepted.length === citations.length;
  - node: rules/investigation/a-decided-evaluation-cites-evidence
    held_at: |-
      isStructurallyValid, rejecting zero citations and thereby forcing retryOrFail rather than a confirmed/refuted evaluation with none
