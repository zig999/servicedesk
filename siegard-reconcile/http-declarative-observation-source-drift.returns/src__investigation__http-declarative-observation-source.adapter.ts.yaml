findings:
  - file: src/investigation/http-declarative-observation-source.adapter.ts
    where: parsedBodyOrUndefined, and its use inside outcomeFromResponse
    evidence: |-
      async function parsedBodyOrUndefined(response: Response): Promise<unknown> {
        try {
          return await response.json();
        } catch {
          return undefined;
        }
      }
      ...
      const body = await parsedBodyOrUndefined(response);
      const observation = observationOf(capability, configuration.responseMap, body);
      return { result: 'ok', observation: JSON.stringify(observation) };
    cost: >-
      An HTTP response whose status the statusMap classifies as ok, but whose body is not valid
      JSON (or is empty), is not ended unavailable or otherwise flagged — it is silently recorded
      as a successful observation carrying an empty object (`observation: '{}'`). domain/investigation/evidence-result
      states that only an ok result "may enter a cache", so a call that returned no usable data at
      all is eligible to be cached as if it had answered. No node states what ending an ok-classified
      response with an unparseable body should produce; the next reader who wants to know how the
      system treats a malformed response body will not find that answer in the specification, only
      in this catch block.
    kind: unstated
    correction: >-
      State, alongside the existing endings for an unclassified status and an unreachable connector,
      what result a response whose statusMap-classified status is ok but whose body cannot be parsed
      as JSON should produce (e.g. unavailable, with a result detail naming the parse failure), then
      have this function implement that ending instead of defaulting to an ok observation.

