findings:
  - file: src/__tests__/unit/http/list-hypothesis-revisions.routes.spec.ts
    where: "the test at lines 150-165, 'refuses with the same status the status map assigns CaseNotFoundError, when the slug names a known case but the named hypothesis name does not exist under it'"
    evidence: >-
      'refuses with the same status the status map assigns CaseNotFoundError, when the slug names a known case but the named ' +
        'hypothesis name does not exist under it — the identical propagation mechanism as an unknown slug, since the store raises the ' +
        'same typed error either way and this layer catches neither' ... built.listHypothesisRevisions.mockRejectedValueOnce(new CaseNotFoundError('a-known-slug', 0));
    cost: >-
      The test fixes, as the route's own reading of the domain, that a hypothesis name absent under a known case is reported through
      the same CaseNotFoundError identity a case/version miss uses — filling the class's required version field with a bare 0 that
      names nothing real — rather than through an identity of its own. rules/knowledge/a-case-read-by-an-unknown-slug-or-version-is-refused
      scopes CaseNotFoundError to "a case slug, or a slug and version, that no case version currently answers," never to a hypothesis
      name; elsewhere the specification's own decision log rejects reusing CaseNotFoundError for a different miss condition precisely
      because collapsing two distinct misses under one identity erases a distinction a reader needs. This test settles that same choice
      for a hypothesis miss, in a test file rather than in a node, so a later reader who wants to know how an unknown hypothesis name
      is refused finds only this mock and never a rule that decided it, and a change introducing a dedicated identity for that miss
      would have nothing in the specification to answer to.
    kind: unstated
    correction: >-
      Record, in a node constraining domain/knowledge/hypothesis (or wherever the specification decides), what identity and status
      refuse a list-hypothesis-revisions call naming a hypothesis a known case does not currently hold, then have this test assert
      against that decision rather than against its own mock.
