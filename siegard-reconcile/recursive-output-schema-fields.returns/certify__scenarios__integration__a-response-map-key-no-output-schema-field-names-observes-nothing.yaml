certified:
  - node: scenarios/integration/a-response-map-key-no-output-schema-field-names-observes-nothing
    state: partial
    tests:
      - file: src/__tests__/unit/investigation/http-declarative-observation-source.adapter.spec.ts
        name: >-
          carries installations with its resolved value, no field named id and no field named login, ending ok — exactly as the response-map-key-names-nothing scenario states
    why: >-
      The two observation clauses are bound exactly: the test reproduces the node's given — tech-profile naming connector fsm-http with the output schema declaring top-level login and installations, the fsm-http configuration declaring statusMap {"200":"ok"} and responseMap {"id":"data.id","installations":"data.installations"}, and a 200 answering {"data":{"id":"u1","installations":["a","b"]}} — and asserts the observation is exactly JSON.stringify({ installations: ['a','b'] }), so carrying a field named id, carrying a field named login, or losing installations' value each breaks the strict equality. What goes unexercised is the collecting seam the scenario states: the test drives HttpDeclarativeObservationSource.observeConcept directly, so "an investigation collects tech-profile's concept" never happens and "the evidence records result ok" is asserted only as the adapter's own returned ending, one layer below the evidence record the then names — nothing in the offered proof reads back an evidence record at all, so an investigation that dropped, relabelled or overwrote this ok ending would leave the test passing. The remaining tests in the file that exercise the same subject rule (excludes an output-schema property from the ok observation when no responseMap key names it; ends ok with an empty observation, refusing nothing at read time, when every responseMap key names no output-schema property at all; carries exactly the field whose name is at once a responseMap key and a declared output-schema property with a resolving path) bear on the rule under other inputs, not on this scenario's stated given, and none of them reaches the evidence either.
    remainder: testable
    remainder_why: >-
      One input — an investigation collecting tech-profile's concept with that capability registered, the fsm-http configuration declaring statusMap {"200":"ok"} and responseMap {"id":"data.id","installations":"data.installations"}, and the call answering 200 with {"data":{"id":"u1","installations":["a","b"]}} — against one expected result: the evidence recorded for that collection has result ok and an observation carrying installations with the value ["a","b"], no field named id and no field named login.
