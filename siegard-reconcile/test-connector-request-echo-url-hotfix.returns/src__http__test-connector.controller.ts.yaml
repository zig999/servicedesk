  - node: rules/integration/a-diagnostic-response-masks-a-resolved-credential
    held_at: >-
      resolveTestRequests building the echoed request through a redacting env proxy, and requestEcho
      returning that masked request as the response's echo — the masking behavior itself, not the
      literal text it renders (see finding)
    evidence: |-
      const echoed = resolveConnectorRequest({ configuration, subject, requester, env: redactingEnv() });
      ...
      function redactingEnv(): NodeJS.ProcessEnv {
        return new Proxy({} as NodeJS.ProcessEnv, { get: () => REDACTED_CREDENTIAL_MARKER });
      }
  - node: rules/integration/a-diagnostic-test-of-an-unreachable-connector-answers-as-a-completed-test
    held_at: >-
      issueOutcome's catch branch and unreachableOutcome — returns a completed 'unreachable' result
      carrying ConnectorUnreachableError and the connector name, no response status, instead of
      throwing a refusal
    evidence: |-
      } catch (error) {
        return unreachableOutcome(connector, error, Date.now() - startedAt);
      }
      ...
      function unreachableOutcome(connector: string, cause: unknown, elapsedMs: number): TestConnectorResponseDto['response'] {
        const error = new ConnectorUnreachableError(connector, { cause });
        return {
          kind: 'unreachable',
          error: { code: error.name, message: error.message, details: error.context },
          elapsedMs,
        };
      }
looked_past: >-
  The response-outcome shape for a completed HTTP answer (status, headers, body via rawBody's
  JSON-or-text fallback) and the discriminant literals ('response', 'timed-out', 'unreachable') are
  governed by the TestConnectorResponseDto type this file only fills, not defines, so any drift there
  belongs to a review of that DTO file rather than this one.
