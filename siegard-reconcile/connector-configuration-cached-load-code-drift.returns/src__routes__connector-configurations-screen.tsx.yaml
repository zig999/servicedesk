looked_past: >-
  The loading, failed-load/retry, and empty-list copy strings are treated as
  interface form (wording and placement the specification's own route/state
  invariants explicitly leave to the interface) rather than domain fact, since
  no listing-level analogue of the single-configuration read-state invariant
  exists to hold them, and this pass does not judge whether one should.
