findings:
  - file: src/__tests__/unit/connector-registry/registered-method-comparison.spec.ts
    where: "the test at lines 122-128, \"treats a method key present in the registered text but holding a non-string value the same as no method being declared\""
    evidence: |-
      it('treats a method key present in the registered text but holding a non-string value the same as no method being declared', async () => {
        const registry = readerAnswering(registeredWithText('erp-http', JSON.stringify({ method: 123 })));

        const mismatch = await registeredMethodMismatch(registry, 'erp-http', 'POST');

        expect(mismatch).toBeUndefined();
      });
    cost: "The rule this test proves states only two conditions for \"the registered configuration's own text declares a method\" versus \"declares no method\" — present or absent. Whether a method key present but holding a non-string JSON value (a number here) counts as declaring one is answered nowhere in the rule's statement, its expression, or its decision-log entries for this node; this test settles it by itself, silently choosing the same outcome as absence. A reader who wants to know what a connector configuration is allowed to declare for method, or why a non-string value is safe to ignore rather than refuse, finds the answer only in this test and the code it drives, not in the specification the rule claims to be proving."
    kind: unstated
    node: rules/integration/a-connector-configuration-drafts-method-is-compared-against-what-is-currently-registered
    correction: "State, in the rule's statement or expression, what counts as \"the registered configuration's own text declares a method\" when the method key is present but not a string — whether that counts as declaring one, as declaring none, or refuses some other way — so this test proves an outcome the specification itself decided rather than one decided in the test."

looked_past: "The two expectTypeOf assertions (lines 82-92) pin registeredMethodMismatch's parameter list and the RegisteredConnectorConfigurationReader shape; these are type-shape/implementation-signature checks with no domain fact behind them, which is a standard-conformance concern rather than this pass's. Likewise the test asserting error propagation for a malformed-JSON registered configuration (lines 143-149) reuses the specification's own ConnectorConfigurationNotWellFormedError vocabulary for a genuine not-well-formed-JSON-object condition, so it is left unflagged as a faithful application of an already-named domain concept rather than an invented one."
