looked_past: >-
  Noticed the CaseLifecycleOperations type omits update-draft, one of the nine operations
  contracts/knowledge/case-lifecycle publishes, and traced it before reporting anything: the
  operation is composed through a separate, already-existing controller
  (src/http/update-draft.controller.ts and src/http/update-draft.routes.ts) rather than through
  this factory, so the omission is this factory's existing architecture rather than a fact this
  file states wrongly; not reported as a finding.
