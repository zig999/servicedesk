findings:
  - file: src/routes/case-version-editor-screen-view-released-manifest-state.spec.ts
    where: "describe block \"the released manifest table's state cell when the pin is absent from the answered page (this task's own inference)\", lines 102-125"
    evidence: |
      expect(within(row).getByText("Delayed payment history")).toBeTruthy();
      expect(within(row).getByText("4")).toBeTruthy();
      expect(within(row).queryByText("Draft")).toBeNull();
      expect(within(row).queryByText("Released")).toBeNull();
    cost: >-
      For a manifest entry whose hypothesis's revisions listing answered but did not carry the
      pinned revision on the page fetched (here revision 9 answered where the entry pins revision
      4), the screen renders the entry's other facts but shows neither "Draft" nor "Released" at
      all. The pinned-revision-state rule states the disclosure is unconditional — it names only
      three things it does not depend on (the case version's own state, a release having been
      attempted, or the reader opening the revision selector) — and does not except a page that
      failed to carry the pinned revision from that guarantee. A curator looking at this entry
      loses exactly the fact — is this pin still in draft? — the specification says must never be
      recoverable only from a failed release; here it is recoverable from nowhere at all, silently.
      The test's own title names this "this task's own inference," which is the source deciding
      a business behavior the specification does not state and, on this point, actively
      contradicts.
    kind: contradicts
    correction: >-
      Either fetch (or otherwise resolve) the pinned revision's own state regardless of which page
      the hypothesis's default revisions listing answered, so the state cell states the value
      unconditionally as the rule requires, or have the specification itself carve out this
      exception if it is meant to exist.
    node: rules/knowledge/a-presented-manifest-entry-states-its-pinned-revisions-state
