findings:
  - file: src/__tests__/unit/http/draft-connector-configuration-from-openapi.routes.spec.ts
    where: "the test titled \"accepts a method field naming no standard HTTP verb, matching it case-insensitively against the document's own declared operation key\", lines 185-193"
    evidence: |-
      built.fetchOpenApiDocument.mockResolvedValueOnce(JSON.stringify({ openapi: '3.0.0', paths: { '/widgets': { purge: {} } } }));
      const response = await app.inject({ method: 'POST', url: ROUTE_URL, payload: validBody({ method: 'Purge' }) });
      expect(response.statusCode).toBe(200);
    cost: "this test is the only place in the tree that decides how a request's own named method is matched against the document's declared operation key -- folding case and accepting a verb outside the closed GET/POST/PUT/PATCH/DELETE set an-openapi-document-declaring-no-such-operation-refuses-the-draft and a-connector-configuration-draft-states-the-chosen-operations-method are silent on; a reader who wants to know whether that lookup is case-sensitive or which verbs it accepts finds the answer only in this assertion, not in any rule"
    kind: unstated
    correction: "state, in an-openapi-document-declaring-no-such-operation-refuses-the-draft or a sibling rule, whether the request's named method is compared against the document's own operation key case-sensitively or case-insensitively, and whether an operation key outside the closed HTTP-verb vocabulary is honored"
  - file: src/__tests__/unit/http/draft-connector-configuration-from-openapi.routes.spec.ts
    where: "the three OpenApiDocumentNotReadableError detail assertions, lines 307, 320 and 333"
    evidence: |-
      expect(body.error.details).toEqual({ kind: 'unparseable', detail: 'the fetched document text' });
      expect(body.error.details).toEqual({ kind: 'unsupported-version', declaredVersion: '2.0' });
      expect(body.error.details).toEqual({ kind: 'no-version-declared' });
    cost: "a-draft-refusal-distinguishes-a-fetch-failure-from-an-unreadable-document spells out OpenApiDocumentNotFetchedError's own details field by field -- link, a closed three-value kind enum, an optional status -- but says nothing about what OpenApiDocumentNotReadableError's own details carry beyond \"naming what failed to parse or which version was declared\"; this file is where that shape -- a kind enum of 'unparseable', 'unsupported-version' and 'no-version-declared', each paired with its own accompanying field ('detail' or 'declaredVersion', or neither) -- actually gets fixed, so the next reader who wants to know what a NotReadableError answer looks like has to read this test rather than the rule meant to answer that"
    kind: unstated
    correction: "state, in a-draft-refusal-distinguishes-a-fetch-failure-from-an-unreadable-document (or a-malformed-or-unsupported-openapi-document-refuses-the-draft), what OpenApiDocumentNotReadableError's details carry -- the kind values it distinguishes and the field(s) accompanying each"

looked_past: "the DI-wiring test asserting the route \"reaches its own controller ... never a fetcher or registry it constructs itself\" (lines 165-183) is an architecture/wiring assertion rather than a domain fact, and the exact JSON key ordering locked in by the string-equality checks on configuration (e.g. line 88) is a serialization detail rather than something any node states -- both left to the standard-conformance pass rather than reported here."
