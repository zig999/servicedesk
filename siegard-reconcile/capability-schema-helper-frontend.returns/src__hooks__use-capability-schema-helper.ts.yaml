findings:
  - file: src/hooks/use-capability-schema-helper.ts
    where: "`onLinkChange` (line 55, `onLinkChange: setLink,`) alongside the `chosenOperation` state declared at line 49"
    evidence: |-
      const [chosenOperation, setChosenOperation] = useState<OpenApiOperation | undefined>(undefined);

      const { outcome: operationsOutcome, refetch } = useOpenApiDocumentOperations(link);

      return {
        link,
        onLinkChange: setLink,
    cost: >-
      Changing the named link only updates `link`; nothing clears `chosenOperation`, so the hook
      keeps exposing the operation chosen under the previous document as `chosenOperation` even
      once the listing for the new link has replaced it. A caller reading `chosenOperation` to
      decide whether the request-draft act is offered, or to render the operation beside the
      helper, is shown a choice that names no entry of the current link's listing -- the exact
      state the specification says must read as cleared -- and the operator who types the
      original link back is handed a stale selection rather than the "waits on one" state the
      surface owes until a fresh choice is made.
    kind: contradicts
    correction: >-
      Reset chosenOperation to undefined whenever link changes away from the link it was chosen
      under (e.g. an effect keyed on link, or deriving chosenOperation so it cannot outlive the
      link's own listing), matching the scenario's given/when/then.
    node: scenarios/integration/a-cleared-operation-choice-leaves-a-stated-schema-draft-stale
