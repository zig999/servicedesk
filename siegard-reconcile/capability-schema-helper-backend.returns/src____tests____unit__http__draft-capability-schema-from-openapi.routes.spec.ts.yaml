findings:
  - file: src/__tests__/unit/http/draft-capability-schema-from-openapi.routes.spec.ts
    where: >-
      the UNREADABLE_DOCUMENT_CASES fixture (lines 321-337) and the assertion at line 351 in the
      it.each block that consumes it
    evidence: >-
      expectedDetails: { kind: 'unparseable', detail: 'the fetched document text', link: REFUSAL_LINK
      },  ...  expectedDetails: { kind: 'unsupported-version', declaredVersion: '2.0', link:
      REFUSAL_LINK },  ...  expectedDetails: { kind: 'no-version-declared', link: REFUSAL_LINK
      },  ...  expect(body.error.details).toEqual(expectedDetails);
    cost: >-
      A reader who opens rules/integration/a-schema-draft-refusal-distinguishes-a-fetch-failure-from-an-unreadable-document
      to learn what an OpenApiDocumentNotReadableError refusal discloses is told it carries "the
      link the request named, exactly as it named it, and nothing else of the document." This test
      fixes the opposite as the correct answer — a kind discriminator plus, for two of the three
      cases, an extra detail or declaredVersion field — so whichever of the test or the node is
      trusted, the other is read as wrong: the node's reader does not expect these extra fields and
      the test's reader has no node backing the fields it locks in.
    kind: contradicts
    correction: >-
      Either the test's expectedDetails narrow to { link: REFUSAL_LINK } for all three unreadable-document
      cases to match the node, or the node's statement is amended to disclose the finer-grained
      unreadable-document reason this test fixes and the decision log records why.
    node: rules/integration/a-schema-draft-refusal-distinguishes-a-fetch-failure-from-an-unreadable-document
read:
