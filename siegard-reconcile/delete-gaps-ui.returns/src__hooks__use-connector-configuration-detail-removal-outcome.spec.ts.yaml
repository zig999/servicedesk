looked_past: >-
  The describe/it titles cite node identities and label two scenarios UNDERDETERMINED with an
  embedded rationale for merging VALIDATION_ERROR, INTERNAL_ERROR and an unrecognised code into
  one refusal statement; whether that rationale belongs in a test title rather than a decision
  record is a comment-discipline question, not a domain-fact one, and I judged the merge itself
  against the node text and the identical, already-established pattern in
  use-capability-detail-removal-outcome.spec.ts rather than against the title's own claim.
