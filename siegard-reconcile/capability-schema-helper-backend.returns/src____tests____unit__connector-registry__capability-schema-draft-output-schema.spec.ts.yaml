  - node: rules/integration/a-part-both-unreducible-and-name-claimed-stands-in-unresolved-under-each-reason
    held_at: nowhere
    evidence: >-
      function outputSchemaFor(document: unknown, path: string, method: string): CapabilitySchemaDraftOutputSchemaReading {
        const reading = readOpenApiOperation(JSON.stringify(document), path, method);
        return draftedOutputSchema(reading);
      } — every test in the file goes through this helper alone, which never touches an input_schema
      collision of any kind.
