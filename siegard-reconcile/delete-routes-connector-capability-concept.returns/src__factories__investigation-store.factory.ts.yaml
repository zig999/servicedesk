looked_past: >-
  This file is pure dependency-injection wiring — two factory functions that instantiate
  RelationalInvestigationStore behind port types — and carries none of the domain,
  removal-rule or HTTP-surface facts most of the delivered node set names; those facts,
  where the file set implements them at all, are held by the store, the routes and the
  registry services the trace binds them to rather than by this factory.
