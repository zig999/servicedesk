findings:
  - file: src/case/case-store.port.ts
    where: "line 7, the module-level constant HYPOTHESIS_REVISION_STATES"
    evidence: "export const HYPOTHESIS_REVISION_STATES = ['draft', 'released'] as const;"
    cost: "the hypothesis-revision-state enumeration now lives twice — once as the node's own declared values, once as this exported, runtime-visible array. Unlike the sibling CaseVersionState (a plain compile-time union with no runtime twin), this array is a second, executable home for the vocabulary: nothing forces it to change if the node's own enumeration ever does, and any code that imports it to validate or iterate states is reading this file's copy rather than the specification."
    kind: contradicts
    node: domain/knowledge/hypothesis-revision-state
    correction: "derive HypothesisRevisionState as a plain compile-time union (`'draft' | 'released'`), the same way CaseVersionState is declared just above it, rather than restating the node's enumeration as an exported runtime constant."

