findings:
  - file: src/__tests__/unit/connector-registry/connector-configuration-draft.spec.ts
    where: "line 27, the test title `it('refuses an unresolved item whose reason is not one of the four vocabulary values', ...)`"
    evidence: >-
      it('refuses an unresolved item whose reason is not one of the four vocabulary values', () => {
    cost: >-
      A reader who trusts this title for the size of the vocabulary comes away believing it
      has four members; the node that owns the enumeration holds exactly three
      (no-capability-registered, security-scheme-not-reducible-to-a-credential,
      drafted-key-occupied-by-another-security-scheme), and this very file's own `expected`
      array two tests above (lines 18-22) is built from those same three values. The label on
      the test that exists to guard the vocabulary misstates the vocabulary it guards — a stale
      count left behind by the recent removal of the fourth, now-retired reason
      (no-matching-input-schema-property).
    kind: contradicts
    node: domain/integration/connector-configuration-draft-unresolved-reason
    correction: change "four" to "three" in the test title.
  - file: src/__tests__/unit/connector-registry/connector-configuration-draft.spec.ts
    where: "lines 93-101, the test asserting the domain module carries no import statement at all"
    evidence: >-
      const importSpecifiers = [...source.matchAll(/(?:from|import)\s*\(?\s*['"]([^'"]+)['"]/g)];

      expect(importSpecifiers).toEqual([]);
    cost: >-
      The constraint this test claims to guard permits infrastructure to reach the domain
      "only through ports" — it audits for a framework, a driver or a provider-client package,
      not for the presence of any import whatsoever. This test instead fails on any import at
      all, including a legitimate port-type or domain-to-domain type import the specification
      would allow; a future, conformant change that imports such a type into this file would be
      rejected by a test stricter than the rule it names.
    kind: contradicts
    node: constraints/the-domain-depends-on-no-infrastructure
    correction: >-
      narrow the assertion to import specifiers naming a framework, driver or provider-client
      package, rather than rejecting every import specifier.
