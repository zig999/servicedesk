findings:
  - file: src/seed.ts
    where: "seedConcepts(), lines 74-84"
    evidence: |-
      await connection.query(
        `INSERT INTO concepts (name, ttl, description) VALUES ($1, $2, $3)
         ON CONFLICT (name) DO UPDATE SET description = EXCLUDED.description`,
        [concept.name, concept.ttl, concept.description],
      );
      for (const subjectType of concept.accepts) {
        await connection.query('INSERT INTO concept_accepts (concept_name, subject_type_name) VALUES ($1, $2) ON CONFLICT DO NOTHING', [concept.name, subjectType]);
      }
    cost: >-
      Re-seeding an environment where a concept's fixture already exists but its ttl changed, or a
      subject type was removed from its accepts list, leaves the stored ttl and the stale
      concept_accepts row exactly as they were: the UPDATE clause touches only description, and the
      concept_accepts insert only adds pairs, never removes one the fixture no longer names.
    kind: contradicts
    node: rules/glossary/a-registered-concept-is-never-removed
    correction: >-
      On conflict, update ttl (not only description) from the fixture, and reconcile
      concept_accepts to the fixture's own accepts list — removing a pair the fixture no longer
      names.
