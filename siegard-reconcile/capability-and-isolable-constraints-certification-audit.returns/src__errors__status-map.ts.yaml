looked_past: >-
  The file's remaining entries (the ~30 error-to-status pairings not governed by any node of
  this set) were checked against the wider specification's decision log and full-text projection
  for consistency and found to match what other, out-of-set nodes decide (e.g. CaseNotFoundError
  → 404, DuplicateGlossaryNameError → 500, OpenApiOperationNotFoundError → 422); none contradicted
  the specification, so none is reported here. The linear instanceof scan over
  STATUS_BY_ERROR_CLASS, as opposed to a direct keyed lookup, is a construction choice with no
  domain-fact content and is left to a code review rather than this pass.
