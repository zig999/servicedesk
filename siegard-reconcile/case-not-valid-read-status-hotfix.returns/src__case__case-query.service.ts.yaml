    where: "readCaseInputRequirements(), lines 41-46"
    evidence: |-
      const assembled = await heldVersion(this.caseStore, slug, version);
          const theCase = structuralCase(assembled, slug, version);
          const registeredCapabilities = await everyRegisteredCapability(this.capabilities);
          return deriveCaseInputRequirements(theCase, registeredCapabilities);
    cost: readCase and readCaseInputRequirements read the same stored version, but only readCase follows structuralCase with `this.refuseIncoherence(theCase, version)`; readCaseInputRequirements returns derived requirements for a case version whose glossary terms, concepts or capabilities may currently be incoherent, with no 409/CaseVersionNotValidError refusal at all. A curator composing against a broken draft, or any caller of this operation, gets computed input requirements for something the specification says is "not yet readable as a case at all, whether previewed."
    kind: contradicts
    correction: readCaseInputRequirements should call the same coherence check readCase does (e.g. `await this.refuseIncoherence(theCase, version)`) before deriving requirements, so a validator-rule failure at that reading is refused the same way for both operations.
    node: rules/knowledge/validation-runs-at-every-read

