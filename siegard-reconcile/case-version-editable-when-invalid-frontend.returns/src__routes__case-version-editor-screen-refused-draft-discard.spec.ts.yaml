  test body it labels correctly exercises what a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
  already determines; and the imported test-support module (case-version-editor-screen-discard.test-support)
  was read only as data to understand fixtures, not reviewed, since it is outside this file set.
