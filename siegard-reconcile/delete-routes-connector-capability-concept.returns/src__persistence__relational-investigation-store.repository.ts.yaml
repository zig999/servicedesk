  - node: constraints/the-system-persists-to-one-relational-database
    held_at: write() and read(), which run every statement through one transactional connection
    evidence: |-
      public async write(investigation: Investigation): Promise<void> {
          await runInTransaction(this.connection, raiseWriteFailure, (tx) => writeWholeInvestigation(tx, investigation));
        }

        public async read(id: string): Promise<StoredInvestigation | undefined> {
          return runInTransaction(this.connection, raiseReadFailure, (tx) => readWholeInvestigation(tx, id));
        }
  - node: domain/investigation/assessment
    held_at: assessmentParams (write) and assessmentOf (read)
    evidence: |-
      function assessmentParams(assessment: Assessment): readonly unknown[] {
        return [
          assessment.outcome,
          assessment.referral.action,
          assessment.referral.recipient,
          assessment.determining_hypothesis ?? null,
          assessment.text,
          assessment.register,
          assessment.usage.input_tokens,
          assessment.usage.output_tokens,
          assessment.elapsed_ms,
          assessment.prompt,
        ];
      }
  - node: domain/investigation/citation
    held_at: citationStatement/citationOf, and nonEmptyCitations enforcing a citation for every
      decided verdict
    evidence: |-
      function nonEmptyCitations(citations: readonly Citation[], hypothesis: string): readonly [Citation, ...Citation[]] {
        if (citations.length === 0) {
          throw raiseReadFailure(new Error(`investigation_evaluations holds a decided verdict for hypothesis "${hypothesis}" with no citations`));
        }
        return citations as readonly [Citation, ...Citation[]];
      }
  - node: domain/investigation/cost
    held_at: costParams (write) and the inline object assembled in investigationOf (read)
    evidence: |-
      function costParams(cost: Cost): readonly unknown[] {
        return [cost.calls, cost.input_tokens, cost.output_tokens];
      }
  - node: domain/investigation/durations
    held_at: durationsParams (write) and the conditional writing spread in investigationOf (read)
    evidence: |-
      durations: {
            collection: row.durations_collection,
            judgment: row.durations_judgment,
            ...(row.durations_writing !== null ? { writing: row.durations_writing } : {}),
            total: row.durations_total,
