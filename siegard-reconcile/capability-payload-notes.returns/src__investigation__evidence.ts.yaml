findings:
  - file: src/investigation/evidence.ts
    where: "line 4, the module-level constant beside the `Evidence` type"
    evidence: |-
      export const DEFAULT_EVIDENCE_TTL_SECONDS = 60;
    cost: >-
      The sixty-second default is a decided fact of rules/knowledge/a-collected-concept-declares-a-ttl
      (per the decision log: "Sixty seconds... one minute keeps any cached observation fresher than
      the investigation deadline by a factor of three"), and it belongs to a concept's own declared
      ttl, not to evidence's ttl attribute (domain/investigation/evidence.ttl is required and always
      populated from whatever ttl the concept already resolved at collection). Restating the number
      here under an evidence-scoped name gives the decided default a second, disconnected home: if the
      specification's default ever changes, nothing ties this constant to that decision, and a reader
      of this file has no way to tell the number is not this file's own to decide.
    kind: contradicts
    correction: >-
      Remove the locally declared default and, wherever a default ttl is actually needed, read it from
      wherever the concept's own resolved ttl (already defaulted at registration per
      rules/knowledge/a-collected-concept-declares-a-ttl) is obtained, rather than re-stating the number.
    node: rules/knowledge/a-collected-concept-declares-a-ttl

