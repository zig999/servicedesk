looked_past: >-
  The file's own domain facts — 10 requests per minute per route via `REQUESTS_WITHIN_LIMIT`,
  a route's over-limit state on one route (diagnose) leaving simulate-case and
  simulate-hypothesis unaffected, and one source address's over-limit state on all three
  routes leaving a second address unaffected — match
  constraints/the-diagnosis-and-simulation-routes-are-rate-limited's statement and its own
  fitness clause; that node is outside this delegation's node set, so conformance to it is not
  reported here.
