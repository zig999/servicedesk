  - node: rules/integration/a-connector-configuration-drafts-configuration-is-well-formed-object-text
    held_at: the parseJsonObject helper, applied to both the field's text and the draft's text
    evidence: |-
      function parseJsonObject(text: string): Record<string, unknown> | null {
        let parsed: unknown;
        try { parsed = JSON.parse(text); } catch { return null; }
        return isPlainRecord(parsed) ? parsed : null;
      }
  - node: rules/integration/an-apply-confirmation-states-what-the-draft-would-change
    held_at: computeApplyConfirmationDiff, together with NESTED_OBJECT_KEYS naming statusMap, responseMap, query and headers
    evidence: |-
      const topLevel = objectKeyChangeSet(fieldObject, draftObject);
      const nested: NestedKeyDiff[] = [];
      for (const key of NESTED_OBJECT_KEYS) {
        const fromNested = fieldObject[key];
        const toNested = draftObject[key];
        if (isPlainRecord(fromNested) && isPlainRecord(toNested)) { nested.push({ key, diff: objectKeyChangeSet(fromNested, toNested) }); }
      }
      return { kind: "itemisable", topLevel, nested };
