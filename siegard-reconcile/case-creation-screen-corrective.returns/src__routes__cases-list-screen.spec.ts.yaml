findings:
  - file: src/routes/cases-list-screen.spec.ts
    where: "the three 'it' blocks at lines 164-209, 211-249 and 251-281 (search behavior)"
    evidence: |-
      it("narrows the rendered rows to cases whose slug matches the typed search text", async () => {
      ...
      it("does not narrow rows by a match against a visible column other than slug", async () => {
      ...
      it("keeps showing the searchable table with zero rows when the search text matches no case, rather than the no-cases-yet empty state", async () => {
      ...
      const input = screen.getByLabelText("Search cases by slug");
      fireEvent.change(input, { target: { value: "beta" } });
      const filteredRows = within(table).getAllByRole("button");
      expect(filteredRows).toHaveLength(1);
    cost: >-
      The rule that a curator may narrow the case listing by typed slug text — including that the
      match is against slug alone (a typed match on the rendered "Released" state text is
      required to yield zero rows) and that a listing answering no match keeps the searchable
      table rather than falling back to the no-cases-yet empty state — is asserted here as a
      requirement of the screen, but the specification never states that the case listing offers
      any search or filtering capability at all. A reader who goes to the specification to learn
      what the case listing does will not find this feature, and the next person changing it has
      only this test file to consult, so the rule now lives in a place no one revising the
      business is looking.
    kind: unstated
    correction: >-
      A node stating that the case listing may be narrowed by typed slug text, and what that
      narrowing does and does not match against, would have to be added to the specification
      (or the search behavior removed from the screen and its test) before this test states it
      as a requirement on its own authority.

