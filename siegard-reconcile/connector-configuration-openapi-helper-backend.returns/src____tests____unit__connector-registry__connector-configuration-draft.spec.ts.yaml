findings:
  - file: src/__tests__/unit/connector-registry/connector-configuration-draft.spec.ts
    where: "the test titled \"the draft's domain module carries no import statement at all, naming no framework, driver or provider client\", lines 94-103"
    evidence: |-
      const importSpecifiers = [...source.matchAll(/(?:from|import)\s*\(?\s*['"]([^'"]+)['"]/g)];

        expect(importSpecifiers).toEqual([]);
    cost: "The constraint permits infrastructure to reach the domain through ports — it bans only a framework, driver or provider-client import, not every import. This test instead asserts the module carries zero import statements of any kind, so a legitimate port import added to connector-configuration-draft.ts later would fail this test even though the specification's own fitness criterion (\"finds no framework, driver or client package\") admits it. A future reader who hits this failure will read the test's bare-zero rule as the constraint itself rather than the narrower one the node actually states."
    kind: contradicts
    correction: "Assert only that no matched import specifier names a framework, driver or provider-client package (or otherwise scope the check to the constraint's own terms), rather than asserting the specifier list is empty outright."
    node: constraints/the-domain-depends-on-no-infrastructure

looked_past: "The test 'exports no runtime guard function alongside the closed vocabulary — only the vocabulary array itself carries a runtime value' (lines 105-109) asserts a module-export-surface shape with no node in this set or elsewhere in the specification stating it; it reads as a code-shape/style concern rather than a domain fact, so it is left for a different pass."
