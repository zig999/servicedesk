looked_past: >-
  Six of the thirteen nodes in the pack (capability's own declaration, the two
  integration rules on a capability's contract and its presentation, and the two
  schema-migration constraints) describe facts that belong to the capability-registry
  and persistence layers rather than to this port interface; the file makes no claim
  about any of them, so there is nothing here for another pass to weigh either.
