findings:
  - file: src/__tests__/unit/connector-registry/generated-credential-placeholders.spec.ts
    where: "the test 'recognizes HTTP basic and bearer schemes case-insensitively', lines 224-231"
    evidence: |-
      it('recognizes HTTP basic and bearer schemes case-insensitively', () => {
        const placement = generateCredentialPlaceholders({
          connector: 'erp-http',
          requiredSecuritySchemes: [httpScheme('mixedCaseBasic', 'BASIC')],
        });

        expect(placement.headers.Authorization).toBe('Basic ${credential:ERP_HTTP_MIXEDCASEBASIC}');
      });
    cost: "the rule and its Description name only \"an HTTP basic scheme\" and \"an HTTP bearer scheme\" as reducible, and the formal expression tests \"s http basic\"/\"s http bearer\" without saying whether the OpenAPI document's own scheme string is matched exactly or case-insensitively; this test locks in case-insensitive matching (and the production code mirrors it with httpScheme.toLowerCase()), so a reader checking whether a document spelling its scheme \"BASIC\" or \"Basic\" is honored by the draft finds the answer only here, in a test and its mirrored implementation, and a later change dropping the normalization would contradict no documented rule"
    kind: unstated
    node: rules/integration/a-connector-configuration-draft-names-a-generated-credential-for-a-reducible-security-scheme
    correction: "state, in the rule or its Description, whether an HTTP security scheme's scheme value is read case-insensitively when deciding it reduces to basic or bearer, the way the security-field-in-effect and $ref readings are each stated as following OpenAPI 3.x's own definitions"

looked_past: "the test 'folds case before replacing characters outside A-Z0-9, rather than replacing lower-case letters away before the fold' (lines 166-173) narrates an implementation ordering that produces the same output as the alternative ordering for any input, since letter-vs-symbol classification does not depend on case -- a test-quality observation about what the assertion actually distinguishes, not a specification-conformance one."
