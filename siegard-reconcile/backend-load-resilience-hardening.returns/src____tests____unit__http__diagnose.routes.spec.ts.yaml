findings:
  - file: src/__tests__/unit/http/diagnose.routes.spec.ts
    where: >-
      the test "keeps refusing the same source address past its own ten-request window even once
      the wall clock crosses into the next calendar minute, never resetting the count on the
      clock face alone" (lines 261-271)
    evidence: |-
      it("keeps refusing the same source address past its own ten-request window even once the wall clock crosses into the next calendar minute, never resetting the count on the clock face alone", async () => {
        const built = buildRateLimitTestApp();
        app = built.app;
        vi.setSystemTime(new Date('2024-01-01T00:00:55.000Z'));

        await sendDiagnoseRequests(app, REQUESTS_WITHIN_RATE_LIMIT, RATE_LIMIT_SOURCE_IP);
        vi.setSystemTime(new Date('2024-01-01T00:01:05.000Z'));
        const [over] = await sendDiagnoseRequests(app, 1, RATE_LIMIT_SOURCE_IP);

        expect(over.statusCode).toBe(429);
      });
    cost: >-
      Whether the ten-request count is a rolling window measured from each request or a bucket
      that resets at each calendar-minute boundary decides exactly when a caller who has been
      refused may resume being served — the same thing the node's own Retry-After value exists to
      tell the caller. That choice is pinned only by this test (and whatever counting the
      middleware it drives happens to implement); a reader checking the specification for how the
      one-minute window is measured finds only "at most 10 requests per minute" and has to infer
      the rolling-window behavior from the test suite instead of from a decided node.
    kind: unstated
    correction: >-
      constraints/the-diagnosis-and-simulation-routes-are-rate-limited (or a decision-log entry
      against it) would need to state that the per-route count is a rolling window measured from
      each request rather than a fixed calendar-minute bucket.
    node: constraints/the-diagnosis-and-simulation-routes-are-rate-limited
