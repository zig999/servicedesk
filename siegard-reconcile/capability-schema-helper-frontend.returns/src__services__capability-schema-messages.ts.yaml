looked_past: >-
  The multi-line string-concatenation style and the loose Record<string, string> typing (rather
  than a type tied to a shared enum) are code-style and type-safety matters this pass does not
  judge on their own — they surface here only insofar as they let the vocabulary duplication
  finding go unnoticed at compile time.
