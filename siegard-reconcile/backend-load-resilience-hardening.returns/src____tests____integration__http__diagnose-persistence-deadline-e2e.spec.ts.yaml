looked_past: >-
  The Proxy-based delayed-connection wrapper (wrapClient, delayedConnect, createDelayingConnection)
  and the test-only timing constants (WRITE_DELAY_MS, CLEANUP_WAIT_MS) are engineering mechanism
  with no domain-fact content of their own, so they are left to a code-quality reading rather than
  reported here.
