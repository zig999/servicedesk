findings:
  - file: src/routes/glossary-browser-screen-concept-removal-landing.spec.ts
    where: >-
      the third describe block, lines 89-112 ("no surface addressed by the removed
      identity survives the removal (underdetermined, from the specification)")
    evidence: >-
      describe("GlossaryBrowserScreen — no surface addressed by the removed identity
      survives the removal (underdetermined, from the specification)", () => { it("shows
      the removed concept's own name nowhere on the screen once its removal answers 204,
      not only absent from the listing's own rows", ... expect(await
      screen.findByRole("row", { name: /fraud-flag/i })).toBeTruthy();
      expect(screen.queryByText("billing-dispute")).toBeNull(); });
    cost: >-
      The test asserts, as behavior a caller can depend on, that once a concept's
      removal answers 204 no trace of the removed concept's own name survives anywhere
      on the whole screen — a stronger, more general guarantee than the specification
      decided. The decision log records only that a successful removal's destination is
      the listing and never the removed identity's own surface
      (rules/integration/a-successful-removal-lands-on-the-removed-entitys-own-listing);
      it says nothing about every other place the removed name might still appear (a
      lingering dialog, a status message, or any other element). A reader who wants to
      know what a concept removal is required to purge from the screen will look in the
      specification and find only the narrower, decided fact — and the test's own title
      concedes as much by calling the guarantee it encodes "underdetermined, from the
      specification."
    kind: unstated
    correction: >-
      Either decide the broader guarantee — that no reference to a just-removed identity
      survives anywhere on the presenting screen, not only in the listing's own rows —
      into the specification (widening
      rules/integration/a-successful-removal-lands-on-the-removed-entitys-own-listing or
      a sibling node) and record it in the decision log, or narrow this test to what that
      node and constraints/a-successful-concept-removal-answers-with-no-content actually
      decide.
    node: rules/integration/a-successful-removal-lands-on-the-removed-entitys-own-listing
