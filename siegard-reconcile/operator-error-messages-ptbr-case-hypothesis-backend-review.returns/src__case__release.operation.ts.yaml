findings:
- file: src/case/release.operation.ts
  where: releaseViolations -- the if (structural.kind === 'invalid') branch that returns early
  evidence: "const structural = structuralOutcome(assembled);\nif (structural.kind === 'invalid') {\n\
    \  return structural.problems;\n}\nreturn [\n  ...(await caseCoherenceViolations(structural.theCase,\
    \ sources.glossary, sources.capabilities)),\n  ...(await manifestOwnStateViolations(assembled, sources.hypothesisRevisions)),\n\
    ];"
  cost: When a draft fails a structural rule AND manifests an entry referencing a draft hypothesis-revision,
    the release refusal names only the structural problems -- manifestOwnStateViolations never runs in
    this branch even though it depends only on assembled. One refusal the spec says should be whole comes
    back split into two successive ones.
  kind: contradicts
  correction: Compute manifestOwnStateViolations(assembled, sources.hypothesisRevisions) unconditionally
    and merge it into the violations returned when structural.kind === 'invalid', so both kinds of failure
    are always named together.
  node: contracts/knowledge/case-lifecycle
