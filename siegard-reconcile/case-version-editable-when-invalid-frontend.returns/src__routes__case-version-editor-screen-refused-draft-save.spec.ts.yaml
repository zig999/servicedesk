looked_past: >-
  The block comment above notValidDraftHandlers (explaining why this file needs the same
  refused-draft fixture shape that case-version-editor-screen-refused-draft.spec.ts builds) and
  the "(criterion N)"/"(UNDERDETERMINED entry N)" suffixes in the describe titles are test-file
