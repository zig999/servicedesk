findings:
  - file: src/hooks/use-simulation-subject-hold-dispatch-open-for-missing-requirement.spec.ts
    where: "twoRequirementsResponse() and threeRequirementsResponse(), lines 21-22 and 31-33"
    evidence: |-
      { attribute: "account-id", required: true, capabilities: [] },
      { attribute: "escalation-flag", required: false, capabilities: [] },
    cost: >-
      The node holds a case-input-requirement to at least one asking capability — "never fewer
      than one, since an attribute nobody currently asks for is not a requirement at all" — but
      every requirement entry these fixtures hand the hook carries capabilities: []. A reader who
      takes these two response builders as a model of what a case-input-requirements read
      actually returns learns a shape the specification says cannot occur.
    correction: >-
      Give each mocked requirement at least one capability entry (name, version, connector,
      concept), so the fixture's shape matches the cardinality the node declares.
    kind: contradicts
    node: domain/knowledge/case-input-requirement
