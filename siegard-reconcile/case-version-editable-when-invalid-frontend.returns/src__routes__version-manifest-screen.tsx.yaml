findings:
  - file: src/routes/version-manifest-screen.tsx
    where: >-
      the ConflictBanner rendered in the loaded branch of VersionManifestScreen, lines
      307-312
    evidence: >-
      {state.isBlocked && (
        <ConflictBanner
          title="This version was released by someone else"
          message="Your changes were not saved. Reload to see the current state, or start a new draft."
        />
      )}
    cost: >-
      The node holds a presentation of its own for exactly two composing refusals
      (ManifestPositionOccupiedError, ManifestWouldHoldNoHypothesisError) and requires every
      other refusal either composing act carries to be shown as "the notice that surface
      shows for a request that failed for a reason it does not recognise, disclosing nothing
      further about it." A manifest-composing call refused because the version moved out of
      draft answers with CaseVersionNotDraftError (rules/knowledge/a-case-version-moves-through-its-declared-lifecycle),
      which is neither of the two named codes, so it falls in the "every other refusal"
      bucket. This banner instead names the specific cause ("released by someone else") and
      prescribes a specific remedy ("start a new draft"), disclosing exactly what the node
      forbids disclosing for an unnamed refusal. The next reader who wants to know where this
      specific wording and this specific diagnosis were decided will not find them in the
      specification — they were decided here, in this component, as a third presentation the
      node does not authorize.
    kind: contradicts
    correction: >-
      Replace the differentiated title/message with whatever this app's own generic
      "request failed for a reason it does not recognise" notice is, carrying nothing about
      the version having been released or about starting a new draft, so the only two
      differentiated refusal presentations the surface holds are the two the node names.
    node: rules/knowledge/a-manifest-surface-names-the-composing-refusals-it-holds-a-presentation-for
read:
