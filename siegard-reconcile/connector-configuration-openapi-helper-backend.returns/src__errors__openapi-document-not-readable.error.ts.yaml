findings:
  - file: src/errors/openapi-document-not-readable.error.ts
    where: "the OpenApiDocumentNotReadableReason union and the 'no-version-declared' branch of describeReason"
    evidence: |-
      | { readonly kind: 'no-version-declared' };

      ...

          case 'no-version-declared':
            return 'the OpenAPI document declares no openapi or swagger version field';
    cost: "a-malformed-or-unsupported-openapi-document-refuses-the-draft draws this refusal's disclosure as a two-way split -- naming what failed to parse, or naming which version was declared -- and the decision log records that a third condition was deliberately declined for this same rule's neighbouring serialization question. This file instead carries a third, disjoint reason kind -- a document declaring no version field at all, distinct from both 'not well-formed' and 'declared version is wrong' -- with its own wording. A reader who wants to know every shape this refusal's detail can take has to read this error class rather than the node, and the distinction between 'unreadable' and 'no version at all' becomes a fact this file alone decided."
    kind: unstated
    node: rules/integration/a-malformed-or-unsupported-openapi-document-refuses-the-draft
    correction: "fold the no-version-declared case into the unparseable reason (a document with no openapi/swagger field is not a well-formed OpenAPI document) unless the specification is amended to state a third, separately-disclosed condition for this refusal."

looked_past: "the describeReason messages' exact wording (capitalisation, punctuation) is a presentation detail this pass does not weigh; only the third reason kind itself is a domain distinction the specification does not draw."
