looked_past: >-
  The route's own 400 handling (fixed VALIDATION_ERROR shape, message naming "the request body")
  duplicates a pattern that a candidate node (constraints/a-malformed-request-is-refused-with-a-validation-error)
  says should be stated once for the whole surface, and the same inline construction likely repeats across
  the other route files; the content matches that node exactly, so this is a style/duplication question for
  another pass rather than a domain-fact departure this one reports.
