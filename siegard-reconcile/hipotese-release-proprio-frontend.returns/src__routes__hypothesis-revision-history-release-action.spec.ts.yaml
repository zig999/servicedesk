looked_past: "The asymmetric refetch strategy this file asserts — no re-read of the listing after a successful release (criteria 5, 7) but a re-read after a refusal specifically for the revision no longer being draft (criterion 8) — is a caching/UI-efficiency choice the specification is silent on and that changes nothing a curator can learn or do, so it is a code-review matter rather than a domain-fact one."
