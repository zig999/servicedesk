  - node: rules/integration/a-capability-authoring-surface-offers-a-schema-helper
    held_at: nowhere
    evidence: |-
      function stateWith(overrides: Partial<CapabilitySchemaHelperState> = {}): CapabilitySchemaHelperState {
        return {
          link: "https://api.example.com/openapi.json",
          onLinkChange: () => {},
          operations: [],
          operationsOutcome: { kind: "idle" },
          onRetryOperationsRead: () => {},
          chosenOperation: undefined,
          onChooseOperation: () => {},
          onRequestDraft: () => {},
      ...
      }
      The fields link, operations, operationsOutcome, onLinkChange, onChooseOperation and onRequestDraft are set only to satisfy the state's type; no assertion in this file exercises the helper's offer of the link, the operation listing or the request act.
  - node: rules/integration/an-answered-schema-draft-request-states-its-draft-to-the-operator
    held_at: nowhere
    evidence: |-
      expect(onApplyInputSchema).toHaveBeenCalledWith(DISTINCTIVE_DRAFT.input_schema);
      expect(onApplyOutputSchema).toHaveBeenCalledWith(DISTINCTIVE_DRAFT.output_schema);
      The file checks only that the apply handlers receive the draft's own schema text; it makes no assertion that input_schema, output_schema or unresolved are stated to the operator on the draft's arrival.
