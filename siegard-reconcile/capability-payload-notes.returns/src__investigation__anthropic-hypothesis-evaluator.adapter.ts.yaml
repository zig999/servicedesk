  DEFAULT_MAX_TOKENS (1024) and the code-fence/JSON parsing mechanics (CODE_FENCE,
  unwrapCodeFence, parseJsonOrUndefined) are technical call-shaping details with no
  node addressing them either way, and Anthropic's own Usage shape may carry fields
  beyond input_tokens/output_tokens flowing through message.usage unchanged — these
  read as implementation/typing concerns for a different pass, not domain facts.
