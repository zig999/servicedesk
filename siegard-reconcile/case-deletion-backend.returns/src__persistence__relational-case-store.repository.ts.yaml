findings:
  - file: src/persistence/relational-case-store.repository.ts
    where: the hypothesesPageSelect function, lines 482-487
    evidence: |-
      SELECT name FROM ${HYPOTHESES_TABLE} WHERE case_slug = $1 ORDER BY name LIMIT $2 OFFSET $3
    cost: >-
      Alphabetical-by-name is a business decision about which of a case's hypotheses a curator
      reaches first when paging list-hypotheses — the same kind of decision the specification made
      explicitly for the case catalog (rules/knowledge/a-case-listing-answers-cases-in-slug-order)
      and for a hypothesis's own revisions (rules/knowledge/a-hypothesis-revisions-listing-answers-highest-revision-first),
      each reasoning that an order "left undeclared... would be whatever the storage's own
      arrangement returned." Here the order is fixed by this SQL alone; a reader auditing what
      order list-hypotheses answers in finds the decision nowhere in the specification and has to
      reverse-engineer it from this query.
    kind: unstated
    correction: >-
      State the order a case's hypotheses listing answers in as its own invariant over
      domain/knowledge/hypothesis (mirroring the sibling orderings already decided for cases and
      for hypothesis-revisions), then have this SELECT read from that decision rather than fix it
      here first.
  - file: src/persistence/relational-case-store.repository.ts
    where: the overwriteRevision function, lines 797-804 (contrast with insertRevision, lines 741-751)
    evidence: |-
      async function overwriteRevision(tx: IQueryable, input: OverwriteHypothesisRevisionInput): Promise<void> {
        const key: IRevisionKey = { slug: input.slug, hypothesis_name: input.hypothesis_name, revision: input.revision };
        await runStatement(tx, revisionOverwriteStatement(input), raiseOverwriteFailure(input));
        await runStatement(tx, revisionCollectsDeleteStatement(key), raiseWriteFailure);
        for (const conceptName of input.collects) {
          await runStatement(tx, revisionCollectStatement(key, conceptName), raiseWriteFailure);
        }
      }
    cost: >-
      A hypothesis-revision left in draft state can outlive the one draft that ever revised it —
      the node this finding is about states plainly that a case emptied by discarding its one
      draft "can still be named by hypotheses nothing else can ever take down," and that
      a-hypothesis-is-revised-only-against-its-cases-draft "refuses even that once the case holds
      no draft." insertRevision, a few lines above in this same file, enforces exactly that refusal
      by calling requireCaseHoldsDraft(tx, input.slug) before writing; overwriteRevision performs
      the equivalent write — replacing an existing revision's content in place — with no such call
      and no table in its statements (hypothesis_revisions, hypothesis_revision_collects) that
      references case_versions at all. A curator who overwrites an orphaned draft-state revision
      after its case's one draft was discarded meets no CaseHoldsNoDraftError here, so the refusal
      the specification names for revising without a draft binds one of this file's two revise
      paths and not the other.
    kind: contradicts
    node: rules/knowledge/a-hypothesis-is-revised-only-against-its-cases-draft
    correction: >-
      overwriteRevision should call requireCaseHoldsDraft(tx, input.slug) before applying
      revisionOverwriteStatement, the same guard insertRevision already applies.
