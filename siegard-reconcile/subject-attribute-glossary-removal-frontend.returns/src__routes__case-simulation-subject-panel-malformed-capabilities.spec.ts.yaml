findings:
  - file: src/routes/case-simulation-subject-panel-malformed-capabilities.spec.ts
    where: "the two it() blocks under the describe at line 93, lines 94-100 and 102-108"
    evidence: |-
      it("discloses nothing while state.isLoadingRegistries is true, even though the array is non-empty", async () => {
          await renderPanel(baseState({ isLoadingRegistries: true, capabilitiesWithMalformedInputSchema: [malformedCapability()] }));
          expect(screen.queryByText("legacy-lookup 9.9.9")).toBeNull();
        });
    cost: >-
      The rule that a malformed capability's identity is withheld from the composer while the
      registries read is loading or has errored lives only in this test. Neither
      rules/investigation/a-composed-subjects-interface-discloses-a-malformed-capability, its
      sibling empty-set rule, nor contracts/knowledge/case-input-requirements says anything about
      a loading or error window during which the disclosure is suppressed. A future reader will
      not find this in the specification, and nothing stops the next change from silently
      dropping or altering it.
    correction: >-
      Decide, in rules/investigation/a-composed-subjects-interface-discloses-a-malformed-capability
      (or a new node beside it), whether the disclosure is withheld while the read is
      outstanding or has failed, and record the reasoning.
    kind: unstated
    node: rules/investigation/a-composed-subjects-interface-discloses-a-malformed-capability
