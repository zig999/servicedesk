  The first test also asserts that the Name and Version fields render disabled
  (`nameInput.hasAttribute("disabled")`, `versionInput.hasAttribute("disabled")`); that
  behavior comes from the shared, out-of-set `capability-form-fields.tsx` component's own
  `isEditingIdentity` prop — this file only exercises the existing component, as the
  criterion-6 describe block's own title states ("reuses the existing
  capability-form-fields.tsx markup unchanged") — so whether disabling identity is itself a
  fact any node holds is that component's own file's question, not this one's.
