looked_past: >-
  The confirmation gating before a removal is issued and the operator's navigation after a
  successful or refused removal are rendered by whatever component calls these hooks, not by this
  file, so I did not weigh their presence here, and the classification `uiStateForApiError` performs
  on the raw error is that function's own file to judge, not this one's.
