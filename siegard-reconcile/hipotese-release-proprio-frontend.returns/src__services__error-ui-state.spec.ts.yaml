  - node: rules/knowledge/a-hypothesis-revision-moves-through-its-declared-lifecycle
    held_at: "the test at lines 49-54, mapping the exact refusal name the rule states to a dedicated UI kind"
    evidence: |
      const state = uiStateForApiError(
            new ApiError("HypothesisRevisionNotDraftAtReleaseError", "not draft at release"),
          );
          expect(state.kind).toBe("hypothesis-revision-not-draft-at-release");
