findings:
  - file: src/__tests__/unit/http/test-connector.routes.spec.ts
    where: >-
      line 370, inside "refuses a test-connector request whose resolved address is not a valid
      absolute URL..."; and line 398, inside "ends a test whose issued call fails before any HTTP
      response..."
    evidence: |-
      expect(body.error.details).toEqual({ address: '***REDACTED***/subjects/subject-value-1' });
      ...
      expect(body.request.headers.authorization).toBe('Bearer ***REDACTED***');
    cost: >-
      The literal marker a masked credential renders as — the exact string `***REDACTED***` in
      place of the resolved value — is asserted here as a fixed fact of the connector-diagnostics
      response, but rules/integration/a-diagnostic-response-masks-a-resolved-credential only says
      that masking happens, never what the masked value displays as. The one node in the
      specification that does pin `***REDACTED***` (rules/investigation/a-presented-evidence-items-inputs-are-shown-with-a-resolved-credential-masked)
      scopes to domain/investigation/evidence, a different aggregate, and its own decision log
      entry justifies that choice by pointing at this connector's controller code as precedent
      rather than deciding it independently for connector diagnostics. A reader who wants to know
      what an operator actually sees in place of a secret on this route has to read this test or
      the controller, not the specification, and nothing keeps this literal in step with the
      sibling rendering if either is changed on its own.
    kind: unstated
    correction: >-
      State, in rules/integration/a-diagnostic-response-masks-a-resolved-credential (or a node it
      points to), the fixed text a masked credential value is replaced with for this diagnostic's
      echoed request and disclosed address.

