findings:
  - file: src/errors/case-version-not-draft-at-release.error.ts
    where: the trailing clause of the message built in the constructor, line 6
    evidence: >-
      `e a liberação é o único gatilho que move uma versão para fora do rascunho`
    cost: >-
      The rule that release is the only trigger leaving draft is stated by
      rules/knowledge/a-case-version-moves-through-its-declared-lifecycle ("release is the one
      trigger that ever leaves it"); this message re-derives it as explanatory prose independent
      of that node. If the lifecycle node's transitions are ever revised — another way out of
      draft added, or release itself changed — this clause has to be updated separately and in
      step, and nothing ties the two together: a reader who trusts this refusal's wording after
      such a change would be told a rule the specification no longer states, and correcting the
      node's transitions would not correct this sentence.
    kind: contradicts
    correction: >-
      Drop the explanatory clause and keep the message to the refusal's own facts (case, version,
      state) that rules/knowledge/a-case-version-moves-through-its-declared-lifecycle already
      requires the refusal to carry, leaving the transition rule itself stated only by that node.
