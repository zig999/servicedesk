looked_past: >-
  The file's real subject — an "Add attribute" row reconciliation against ${subject:<name>}
  placeholders of the Test panel's Configuration field, excluding ${requester} and
  ${credential:<name>} and deduplicating a repeated name — is governed by
  rules/integration/a-presented-connector-configurations-test-collects-values-for-the-attributes-the-presented-answer-names
  and rules/integration/a-connector-configuration-is-tested-through-a-registered-capability,
  neither in this file's node pack; every test that requires a new placeholder set to take
  effect first drives it through saveConfiguration, consistent with those nodes' requirement
  that the attribute set is read from the presented/registered answer rather than an unsubmitted
  edit, so no contradiction is reported. Three tests labelled "disclosed inference" (DOM-identity
  preservation, naming-collision survivor, row order) are interaction/session-state mechanics no
  node addresses.
