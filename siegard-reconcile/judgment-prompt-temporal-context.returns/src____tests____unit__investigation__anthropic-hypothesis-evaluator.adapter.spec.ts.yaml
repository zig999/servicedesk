    held_at: the observed_at rendering test
    evidence: |-
      expect(item).toContain('<observed_at>2023-11-05T08:15:30.000Z</observed_at>');
  - node: rules/investigation/an-evidence-items-ttl-is-counted-in-seconds-from-its-own-observation
    held_at: the per-item ttl/observed_at pairing test
    evidence: |-
      expect(itemOne).toContain('<ttl>30</ttl>');
      expect(itemOne).toContain('<observed_at>2023-01-01T00:00:00.000Z</observed_at>');
  - node: rules/investigation/a-cited-field-exists-in-the-capability-output-schema
    held_at: >-
      the confirmed-citation test, whose cited field matches the evidence item's own snapshotted field name
    evidence: |-
      const citation = { concept: 'concept-one', field: 'field-one' };
      ...
      expect(firstCitation).toEqual(citation);
  - node: rules/investigation/a-decided-evaluation-cites-evidence
    held_at: >-
      the "answers inconclusive with reason judgment-failure when a confirmed answer carries no citations" test
    evidence: |-
      createMock.mockResolvedValueOnce(messageWithText(JSON.stringify({ verdict: 'confirmed', citations: [] })));
      ...
      expect(outcome).toMatchObject({ verdict: 'inconclusive', reason: 'judgment-failure', citations: [] });
  - node: rules/investigation/an-inconclusive-evaluation-declares-its-reason
    held_at: >-
      the no-data/not-grounded/judgment-failure distinguishing tests
    evidence: |-
      expect(outcome).toEqual({ verdict: 'inconclusive', reason: 'no-data', citations: [ { concept: 'concept-timeout' }, { concept: 'concept-denied' } ] });
      ...
      expect(outcome).toMatchObject({ verdict: 'inconclusive', reason: 'not-grounded', citations: [] });
looked_past: >-
  The ANTHROPIC_API_KEY environment-variable fallback, the Anthropic SDK constructor wiring, and the
  tolerance for a ```json/``` code-fenced model response are adapter plumbing and parsing robustness
  rather than domain facts, so they were not carried into findings.
