findings:
  - file: src/routes/case-simulation-screen.spec.ts
    where: >-
      the "route to the named version's own editor across every reading" test, criterion 3
      (the read refused with CaseVersionNotValidError, lines ~177-187), compared against
      criterion 2 (the read that did not complete, lines ~164-172)
    evidence: |-
      // criterion 2: the read did not complete
      const failedFetch: FetchFn = async () => {
        throw new Error("network down");
      };
      await mountCaseSimulationScreen(failedFetch);
      expect(await screen.findByText("Unable to load this version right now.")).toBeTruthy();
      ...
      // criterion 3: the read was refused with CaseVersionNotValidError
      const refusedFetch: FetchFn = async () =>
        jsonResponse(
          { error: { code: "CaseVersionNotValidError", message: "validation failed" } },
          409,
        );
      await mountCaseSimulationScreen(refusedFetch);
      expect(await screen.findByText("Unable to load this version right now.")).toBeTruthy();
    cost: >-
      The node requires the surface to state the CaseVersionNotValidError refusal
      "distinct from what the same surface states for a read of that version that did not
      complete, so that a reader tells the two apart" — a version failing validation is one
      the curator must correct, a read that did not complete is one to attempt again. This
      test pins both conditions to the identical text "Unable to load this version right
      now.", so as written it passes exactly when the surface renders the two indistinguishably
      to the curator — the confusion the node names as sending "the reader to the wrong act" —
      and a curator meeting the validation refusal is told nothing that points them toward
      correcting the draft rather than retrying a read no retry can ever complete.
    kind: contradicts
    node: rules/knowledge/a-version-keyed-surface-states-a-named-version-that-does-not-read-back-as-a-case
    correction: >-
      Criterion 3 should assert a statement distinct from criterion 2's — one that tells the
      curator the named version does not currently read back as a case — rather than reusing
      "Unable to load this version right now.", so the test actually holds the two readings
      apart as the node requires.

