findings:
  - file: src/__tests__/unit/http/read-case-version.routes.spec.ts
    where: "lines 95-106, the test 'carries no consolidation_register key, rather than an empty or null one, when the draft declares none'"
    evidence: |-
      const body = response.json() as object;
      expect(body).not.toHaveProperty('consolidation_register');
      const expectedKeys = Object.keys(readCaseVersionResponseSchema.shape).filter((key) => key !== 'consolidation_register');
      expect(Object.keys(body).sort()).toEqual(expectedKeys.sort());
    cost: >-
      This test pins the response shape for an absent consolidation_register as key-omission, and a future
      change that made the response state the absence explicitly (adding a positive marker instead of
      dropping the key) would fail this passing test. The drift the node exists to forbid — a version
      declaring no register reading exactly like a version nobody asked about — becomes the shape the
      suite actively protects, and the next maintainer reading this test learns the omitted-key contract
      as settled rather than finding the node's own requirement.
    kind: contradicts
    correction: >-
      The assertion would need to require the response to carry an explicit indication that this version
      declares no consolidation_register (a positive statement of absence), rather than asserting the key
      is missing.
    node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case

