findings:
  - file: src/persistence/relational-investigation-store.repository.ts
    where: readWholeInvestigation and the contentHash helper it calls
    evidence: |-
      const document = investigationOf({ id, row, attributes, evidence, evaluations });
      return { document, hash: contentHash(document) };
      ...
      function contentHash(document: Investigation): string {
        return createHash('sha256').update(JSON.stringify(document), 'utf8').digest('hex');
      }
    cost: Every read of an investigation now answers a SHA-256 hex digest of the JSON-serialized
      record alongside the document itself. No node states that a read carries such a digest, what
      it is for, or that JSON.stringify plus sha256 is the exact scheme a caller may depend on;
      whoever reads the specification to learn what read() answers will not learn this attribute
      exists at all, and a later change to the serialization or the algorithm has no node holding
      it accountable.
    kind: unstated
    correction: state, against domain/investigation/investigation or the store's own contract, that
      a read answers the record together with a content hash and how that hash is computed
    node: domain/investigation/investigation

