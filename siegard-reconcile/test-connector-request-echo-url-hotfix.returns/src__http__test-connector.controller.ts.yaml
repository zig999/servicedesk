        orphaned_placeholders: orphanedPlaceholderNames,
      };
  - node: domain/integration/connector-configuration
    held_at: >-
      resolveTestedConnectorConfiguration, which reads the configuration as raw JSON text and as a
      parsed record, and the separate refusal paths for capability vs. connector configuration that
      reflect a capability's connector attribute not being enforced to resolve to an existing
      configuration
    evidence: |-
      async function resolveTestedConnectorConfiguration(
        dependencies: TestConnectorControllerDependencies,
        connector: string,
      ): Promise<ResolvedTestConnectorConfiguration> {
        const resolution = await dependencies.readConnectorConfiguration(connector);
        if (!resolution.held) {
          throw new ConnectorConfigurationNotFoundError(connector);
        }
        return { raw: resolution.configuration, parsed: parsedConnectorConfiguration(resolution.configuration) };
      }
  - node: rules/integration/a-connector-configuration-is-tested-through-a-registered-capability
    held_at: >-
      resolveTestedCapability (the 404/409 refusals) and requireResolvedAddressIsAbsoluteUrl (the 422
      refusal, run against the masked echoed request and disclosing only its address)
    evidence: |-
      if (!resolution.held) {
        throw new CapabilityNotRegisteredForTestError(resolution.name, resolution.version);
      }
      if (resolution.capability.connector !== body.connector) {
        throw new CapabilityConnectorMismatchError(resolution.capability.connector, body.connector);
      }
      ...
      function requireResolvedAddressIsAbsoluteUrl(request: AssembledConnectorRequest): void {
        try {
          connectorRequestUrl(request);
        } catch (error) {
          throw new ConnectorCallAddressNotAbsoluteUrlError(request.address, { cause: error });
        }
      }
  - node: rules/integration/a-connector-configuration-read-by-an-unregistered-name-is-refused
    held_at: "resolveTestedConnectorConfiguration's held check"
    evidence: |-
      if (!resolution.held) {
        throw new ConnectorConfigurationNotFoundError(connector);
      }
  - node: rules/integration/a-connector-placeholder-is-declared-by-its-capability
    held_at: >-
      the orphaned-placeholder computation and its inclusion in the diagnostic response, reporting the
      seam for the pairing under test
    evidence: |-
      const orphanedPlaceholderNames = orphanedPlaceholders(configuration.raw.configuration, capability.input_schema);
      return {
        request: requestEcho(httpFields.method, echoed),
        response,
        orphaned_placeholders: orphanedPlaceholderNames,
