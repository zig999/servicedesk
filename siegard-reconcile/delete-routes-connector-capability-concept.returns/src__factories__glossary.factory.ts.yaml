looked_past: >-
  The NO_CONCEPT_NAMED default object literal here duplicates the identically-shaped
  default already declared inside glossary.service.ts (both default an unsupplied
  conceptUsageReader to `{ named: false }`); it carries no independent value, threshold
  or name of its own and never runs in production (build-app.factory.ts always wires the
  real reader), so it reads as wiring redundancy rather than a domain-fact conflict for
  this pass.
