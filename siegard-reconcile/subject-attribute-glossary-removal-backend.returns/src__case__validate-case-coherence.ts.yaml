      the file imports only collectionPlan from ./case-resolution.js and computes no
      case-input-requirement, no per-attribute derivation and no capability input-schema check.
  - node: rules/knowledge/a-concept-accepts-the-declared-subject-type
    held_at: "conceptViolations, lines 91-95"
    evidence: |-
      } else if (!resolution.concept.accepts.includes(theCase.subject)) { violations.push(`the concept "${name}" does not accept the subject type "${theCase.subject}" the case declares`); }
  - node: rules/knowledge/case-terms-exist-in-the-glossary
    held_at: "vocabularyViolations lines 60-62 and conceptViolations lines 89-90"
    evidence: |-
