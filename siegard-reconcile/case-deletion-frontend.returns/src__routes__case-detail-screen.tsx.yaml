looked_past: >-
  Presentational choices this file makes — the row/tab labels, the bg-warning/bg-success colors
  in STATE_CELL, and "Continue editing" versus "View" for the same underlying route — are form
  the interface owns rather than a domain fact, and the delete flow's confirmation, refusal
  naming and post-delete navigation are implemented in useCaseDeleteControl and CaseDeleteDialog,
  files outside this set, so their own conformance is a different file's judgment.
