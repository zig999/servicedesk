read:
  - node: contracts/knowledge/case-query
    held_at: >-
      nowhere — the file uses the contract's own AssembledCaseVersion shape only as a store
      fixture type, never exercising read-case-version's own behavior (validation, refusal,
      whole-case assembly).
    evidence: >-
      import type {
        AssembledCaseVersion,
        ...
      } from '../../../case/case-store.port.js';
  - node: domain/knowledge/case-version
    held_at: the aDraftWithSubject fixture builder and the store's discard method
    evidence: >-
      function aDraftWithSubject(slug: string, version: number, subject: string): AssembledCaseVersion {
        return {
          slug,
          version,
          title: 'A title',
          when_to_use: 'A use',
          authored_at: '2026-01-01T00:00:00Z',
          subject,
          fallback: { outcome: 'an-outcome', referral: { action: 'an-action', recipient: 'a-recipient' } },
          state: 'draft',
          manifest: [],
        };
      }
  - node: rules/knowledge/a-case-read-by-an-unknown-slug-or-version-is-refused
    held_at: the two CaseNotFoundError tests
    evidence: >-
      expect(response.statusCode).toBe(404);
      const body = response.json() as { error: { code: string; details?: unknown } };
      expect(body.error.code).toBe('CaseNotFoundError');
      expect(body.error.details).toEqual({ slug: 'an-absent-slug', version: 9 });
  - node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
    held_at: nowhere
    evidence: >-
      This file tests only the DELETE discard route; no test here reads or presents title,
      when_to_use, subject, fallback or consolidation_register through an editing surface.
  - node: constraints/a-successful-case-version-own-record-read-answers-with-http-200
    held_at: nowhere
    evidence: >-
      This file never invokes read-case-version or asserts an HTTP 200 record read; every
      request here is a DELETE against the discard route.
  - node: constraints/a-malformed-request-is-refused-with-a-validation-error
    held_at: the three malformed-segment tests
    evidence: >-
      const response = await app.inject({ method: 'DELETE', url: '/v1/cases/a-slug/versions/not-a-number' });
      expect(response.statusCode).toBe(400);
      expect(built.discard).not.toHaveBeenCalled();
  - node: rules/knowledge/a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
    held_at: the final test, discarding a draft with a glossary-failing subject
    evidence: >-
      const store = new SingleDraftCaseStore(aDraftWithSubject(slug, version, 'a-subject-type-the-glossary-does-not-hold'));
      const dependencies: DiscardControllerDependencies = { discard: (s, v) => discardCaseVersion(store, s, v) };
      ...
      expect(response.statusCode).toBe(204);
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-discardable
    held_at: >-
      the same final test — manifest: [] on the discarded draft, discard accepted, and the
      version's own read afterward resolving undefined; the third then-clause (the version
      number is never reused) is not asserted in this file
    evidence: >-
      manifest: [],
      ...
      expect(response.statusCode).toBe(204);
      expect(response.body).toBe('');
      await expect(store.assembleVersion(slug, version)).resolves.toBeUndefined();
  - node: constraints/a-successful-case-version-discard-answers-with-no-content
    held_at: the first test in the file
    evidence: >-
      expect(response.statusCode).toBe(204);
      expect(response.body).toBe('');
      expect(response.rawPayload.length).toBe(0);
  - node: rules/knowledge/an-accepted-update-draft-answers-its-versions-own-stored-declared-attributes
    held_at: nowhere
    evidence: >-
      This file exercises only the discard route; update-draft is stubbed out with
      notNeededByDiscard and never called.
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-open-for-editing
    held_at: nowhere
    evidence: >-
      No test here reaches an editing surface or asserts what it states about a
      manifest-less draft; this file's manifest-less draft is exercised only through discard.
looked_past: >-
  The header-style rationale comments (the TST-03 fixture note at lines 24-28, and the
  symmetric-test rationale at lines 141-146 citing another spec file's proof) are test-design
  commentary rather than a domain fact stated on its own authority, and the three
  malformed-request tests assert only the 400 status without the error code or details the
  governing constraint also requires — both are a different judgment's to weigh, not a
  domain-fact conformance finding.
