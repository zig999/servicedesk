certified:
  - node: rules/integration/a-connector-configuration-surface-promises-no-check-of-a-credential-placeholders-resolution
    state: partial
    tests:
      - file: src/routes/connector-configuration-form-fields-credential-placeholder-statement.spec.ts
        name: renders the credential statement naming the placeholder, its server-side resolution at a test or an observation, and that nothing on this surface checks it
      - file: src/routes/connector-configuration-form-fields-credential-placeholder-statement.spec.ts
        name: renders no credential-placeholder heading or statement when the Configuration field embeds none
      - file: src/routes/connector-configuration-form-fields-credential-placeholder-statement.spec.ts
        name: leaves Save enabled while the credential-placeholder statement stands
      - file: src/routes/connector-configuration-form-fields-credential-placeholder-statement.spec.ts
        name: reports no resolution-check result for the credential placeholder beyond the statement's own text
    why: >-
      Presence-per-placeholder and the withholding behavior are exercised. The statement's actual
      wording is not: every content assertion compares against the production message generator
      itself, so expected and actual move together -- the message could drop any of its three
      claims and every test would still pass.
    remainder: testable
    remainder_why: >-
      Assert the literal expected text (not via the generator) for two distinct embedded
      credential names, each naming its own credential, each stating server-side resolution and
      each stating it is checked by nothing on the surface.
