looked_past: >-
  The justSaved acknowledgement's own timing (instant on a successful save, clearing on the next
  edit, staying false while a save is pending) restates surface-acknowledgement behavior that
  a-submitted-registration-states-its-outcome-to-the-operator explicitly leaves as form — "how
  long it stands ... belong[s] to the interface" — so it is not reported here.
