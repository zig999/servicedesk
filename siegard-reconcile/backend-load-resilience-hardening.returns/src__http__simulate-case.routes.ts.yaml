  - node: constraints/the-diagnosis-and-simulation-routes-are-rate-limited
    held_at: >-
      the constants declared at the top of the file and the onRequest hook registration that wires them into the plugin
    evidence: |-
      const RATE_LIMIT_MAX_REQUESTS_PER_MINUTE = 10;
      const RATE_LIMIT_WINDOW_MS = 60_000;
      ...
      app.addHook(
        'onRequest',
        createRateLimitHook({
          maxRequestsPerWindow: RATE_LIMIT_MAX_REQUESTS_PER_MINUTE,
          windowMs: RATE_LIMIT_WINDOW_MS,
        }),
      );
