findings:
  - file: src/persistence/relational-case-store.repository.ts
    where: hypothesesPageSelect
    evidence: |-
      function hypothesesPageSelect(slug: string, pagination: PaginationRequest): IStatement {
        return {
          text: `SELECT name FROM ${HYPOTHESES_TABLE} WHERE case_slug = $1 ORDER BY name LIMIT $2 OFFSET $3`,
          params: [slug, pagination.limit, pagination.offset],
        };
      }
    cost: >-
      list-hypotheses answers name-ascending order and a curator paging it without a known name
      relies on that order holding page to page, but no node anywhere in the specification commits
      to it — unlike the three sibling listings (cases by slug, case-versions by version, hypothesis
      revisions by revision number), each of which has its own invariant recording the order and the
      reasoning for it. A reader auditing this behavior against domain/knowledge/hypothesis or
      contracts/knowledge/case-query finds no ordering decision at all, so this file is the only place
      the order is recorded, and it can change without anyone reading a violated node.
    kind: unstated
    correction: >-
      record a listing-order rule for list-hypotheses (parallel to
      rules/knowledge/a-case-listing-answers-cases-in-slug-order and
      rules/knowledge/a-case-versions-listing-answers-highest-numbered-first), constraining
      domain/knowledge/hypothesis and naming name-ascending order as the decided answer, or
      whatever order the business actually intends.
    node: domain/knowledge/hypothesis

