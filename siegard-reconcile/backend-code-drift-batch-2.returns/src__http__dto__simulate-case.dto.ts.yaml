findings:
  - file: src/http/dto/simulate-case.dto.ts
    where: "citationSchema (lines 29-32), reused unchanged across every verdict branch of evaluationSchema (lines 39-65)"
    evidence: |-
      const citationSchema = z.object({
        concept: z.string().min(1),
        field: z.string().min(1).optional(),
      });
    cost: >-
      A citation attached to a confirmed or refuted evaluation can validate with no `field` at
      all, even though the specification requires that field be present whenever a citation
      grounds a confirmed or refuted verdict. The schema uses one shape for every verdict branch
      — the same shape the inconclusive/no-data branch uses — so nothing here can ever catch a
      decided citation that fails to point at the one place in the evidence it is supposed to
      name.
    kind: contradicts
    correction: >-
      Give confirmed and refuted citations their own shape with `field` required, and keep the
      current optional/absent shape only for the inconclusive branch, so the discriminated union
      enforces field-presence by verdict the way it already enforces `citations.min(1)` and
      `reason` by verdict.
    node: domain/investigation/citation
  - file: src/http/dto/simulate-case.dto.ts
    where: "costSchema (lines 89-93)"
    evidence: |-
      const costSchema = z.object({
        calls: z.number(),
        input_tokens: z.number(),
        output_tokens: z.number(),
      });
    cost: >-
      A cost payload with a fractional `calls` or token count (e.g. 3.5 calls) validates cleanly,
      even though the specification declares calls, input_tokens and output_tokens as integers.
      The same file holds durationsSchema and usageSchema to `z.int()` for their own
      integer-typed attributes, so a reader has no reason to expect cost's counts are looser than
      every other integer-typed field around them.
    kind: contradicts
    correction: >-
      Use z.int() for calls, input_tokens and output_tokens, matching domain/investigation/cost's
      declared type and the int discipline durationsSchema/usageSchema already apply in this same
      file.
    node: domain/investigation/cost
