findings:
  - file: src/services/connector-configuration-draft-disclosure.spec.ts
    where: "each status reading is projected into its own status, ending and declared_as, one-to-one and unmodified"
    evidence: |-
      status_readings: [{ status: "200", ending: "record-stub-response", declared_as: "Successful profile retrieval" }, { status: "403", ending: "skip-endpoint" }],
    cost: >-
      The fixture presents "record-stub-response" and "skip-endpoint" as ordinary drafted
      statusMap endings, but connector-configuration-draft-status-reading types its "ending"
      attribute as a closed enumeration of exactly ok, unavailable, denied and timeout. A reader
      or later test-writer has no way to tell these two strings are not real evidence-result
      endings a draft could ever carry.
    kind: contradicts
    node: domain/integration/connector-configuration-draft-status-reading
    correction: >-
      Replace "record-stub-response" and "skip-endpoint" with two of the four evidence-result
      values the ending attribute is actually typed against, e.g. "ok" and "denied".
looked_past: >-
  The response_fields and reading_notes arrays never carry test content beyond the empty-array
  cases, so disclosure of a response field's declared_type/declared_required/envelope and a
  reading note's kind/subject/detail go untested in this file; a coverage gap, not a stated fact.
