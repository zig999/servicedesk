looked_past: >-
  The describe.each block's title carries an "UNDERDETERMINED note" pointing at
  rules/integration/a-connector-configuration-holds-a-well-formed-object; that node does settle
  the array/null case, so the guard is grounded rather than underdetermined — a test-labeling
  concern for another pass, not a domain-fact drift. Similarly, the connector-name and
  successful-save-destination behavior is governed by
  rules/integration/a-connector-configuration-names-its-connector,
  rules/integration/a-successful-connector-registration-lands-on-the-configurations-own-surface
  and rules/integration/a-submitted-registration-states-its-outcome-to-the-operator, found by
  searching the specification root and each consistent with what the test asserts.
