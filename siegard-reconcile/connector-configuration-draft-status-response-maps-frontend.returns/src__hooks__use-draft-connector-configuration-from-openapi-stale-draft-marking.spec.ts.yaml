  The file only exercises the "generated for" half of rules/integration/a-stated-draft-is-marked-stale-once-what-it-was-generated-for-changes
  (statedFor equals the request that produced the draft) and the second test's own describe title
  flags the widen-vs-separate-field question as "UNDERDETERMINED, from the specification" — neither
