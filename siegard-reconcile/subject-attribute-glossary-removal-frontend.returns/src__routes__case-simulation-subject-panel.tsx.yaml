findings:
  - file: src/routes/case-simulation-subject-panel.tsx
    where: "the header preceding the required-fields list, line 69"
    evidence: |-
      Required by the connectors:
    cost: >-
      The list under this header is populated from state.requiredFields, whose per-field entries
      are then shown alongside the currently-registered capabilities that ask for the attribute —
      each already labelled with its own connector. The header instead names the connector as the
      thing an attribute is "required by". A reader maintaining this panel who takes the header at
      its word could dedupe or key the section by connector identity, when the requirement's own
      cardinality (1..* per domain/knowledge/case-input-requirement) and its derivation are
      per-capability, not per-connector — a connector is only a string a capability declares, not
      an entity that itself asks for anything.
    correction: >-
      State what actually governs presence in the list — e.g. "Required by the case version's
      case-input-requirements" or "Required by the following capabilities" — rather than
      attributing the requirement to the connector.
    kind: contradicts
    node: domain/knowledge/case-input-requirement
