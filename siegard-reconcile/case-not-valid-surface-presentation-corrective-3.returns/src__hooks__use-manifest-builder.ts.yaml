findings:
  - file: src/hooks/use-manifest-builder.ts
    where: >-
      the case-version-not-draft branch of placeMutation.onError (lines 126-130) and of
      removeMutation.onError (lines 158-162)
    evidence: |-
      if (kind === "case-version-not-draft") {

        setIsBlocked(true);
        return;
      }
    cost: >-
      The node holds a presentation of its own for exactly two refusals of the acts that
      compose the manifest — ManifestPositionOccupiedError and
      ManifestWouldHoldNoHypothesisError — and says every other refusal either
      place-hypothesis or remove-hypothesis carries is presented as the undifferentiated
      notice a-refusal-a-case-keyed-surface-cannot-name-is-presented-as-a-read-that-did-not-complete
      names, disclosing nothing further. CaseVersionNotDraftError, which
      a-case-version-moves-through-its-declared-lifecycle names for exactly this call, is
      one of those "every other" refusals, yet this hook gives it a third, distinct,
      persistent state (`isBlocked`, never reset back to false anywhere in the file) instead
      of the same generic toast every unrecognised refusal gets. A reader who goes to the
      specification to learn why a manifest write is "blocked" differently from any other
      failure finds no node that grants that third distinction, and the next person adding a
      fourth will point at this branch as precedent rather than at a decided boundary.
    kind: contradicts
    correction: >-
      Fold the case-version-not-draft outcome into the same fallthrough as every other
      unrecognised refusal (toast.error(GENERIC_FAILURE_MESSAGE) alone), or have the node
      grant this refusal a presentation of its own before the code gives it one.
    node: rules/knowledge/a-manifest-surface-names-the-composing-refusals-it-holds-a-presentation-for

  - file: src/hooks/use-manifest-builder.ts
    where: the repin fallback in placeMutation.onError, lines 136-140
    evidence: |-
      if (vars.kind === "repin") {

        setRevisionError({ hypothesisName: vars.hypothesisName, message: REVISION_FAILURE_MESSAGE });
      }
      toast.error(GENERIC_FAILURE_MESSAGE);
    cost: >-
      The node's own expression is that a place-hypothesis refused with any error code other
      than ManifestPositionOccupiedError is told "that the request failed for a reason the
      surface does not recognise and nothing else — not the error code, not the refusal's
      message, not any value it carries." Here, whenever the underlying call was a repin, an
      unrecognised refusal additionally sets a row-scoped message — "Could not switch to that
      revision. Try again." — naming which act failed, on top of the generic toast. That is a
      third named presentation the node forecloses; a reader checking the specification for
      what a repin failure discloses beyond "something went wrong" will not find this
      distinction there.
    kind: contradicts
    correction: >-
      Drop the repin-specific revisionError message for refusals other than the two the node
      names, leaving the generic toast as the sole statement — or have a node grant repin
      failures a presentation of their own before the code adds one.
    node: rules/knowledge/a-manifest-surface-names-the-composing-refusals-it-holds-a-presentation-for

