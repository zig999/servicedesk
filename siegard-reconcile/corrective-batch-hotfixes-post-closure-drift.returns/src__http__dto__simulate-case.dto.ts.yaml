findings:
  - file: src/http/dto/simulate-case.dto.ts
    where: assessmentSchema, lines 91-96
    evidence: |
      const assessmentSchema = z.object({
        outcome: z.string().min(1),
        referral: referralSchema,
        determining_hypothesis: z.string().min(1).optional(),
        text: z.string().min(1),
      });
    cost: "contracts/investigation/case-simulation exists to hand the curator the detail a customer never sees, and domain/investigation/assessment requires register, usage, elapsed_ms and prompt on every assessment because a consolidation call always runs and always settles on some register. This schema declares none of the four, so a caller typed against SimulateCaseResponseDto has no way to read the consolidation call's register, token spend, duration or materialized prompt, even though src/investigation/assessment.ts and the persisted record already carry all eight required attributes -- delivery/consolidation-call-record-chain-hotfix's own implementation record names simulate-case.dto.ts by name under deferred as the widening nobody has done yet."
    correction: "add register (the consolidation-register enum), usage (usageSchema), elapsed_ms (z.number()) and prompt (z.string()), all required, to assessmentSchema."
    node: domain/investigation/assessment
  - file: src/http/dto/simulate-case.dto.ts
    where: evidenceSchema, lines 66-78
    evidence: |
      const evidenceSchema = z.object({
        concept: z.string().min(1),
        inputs: z.string(),
        observation: z.string(),
        observed_at: z.string().min(1),
        ttl: z.number(),
        origin: z.string(),
        result: z.enum(EVIDENCE_RESULTS),
        result_detail: z.string().optional(),
        capability_name: z.string(),
        capability_version: z.string(),
        elapsed_ms: z.number(),
      });
    cost: "fields and concept_description are the item's own snapshotted semantics -- the capability's declared field-by-field meaning and the concept's own description at the moment of collection -- exactly the traceability a curator running simulate-case needs to judge what grounded a verdict. Neither key is declared here, so a consumer typed against SimulateCaseResponseDto has no declared way to read either for any evidence item the simulation collected."
    correction: "add fields (a required array of the field-semantics shape) and concept_description (a required string) to evidenceSchema."
    node: domain/investigation/evidence
