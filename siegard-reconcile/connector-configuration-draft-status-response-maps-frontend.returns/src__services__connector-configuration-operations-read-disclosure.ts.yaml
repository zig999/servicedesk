    held_at: the three "refused" branches of the switch, each returning a distinct message for a distinct named condition
    evidence: |-
      case "openapi-document-not-fetched": return { kind: "refused", message: operationsNotListedFetchFailureMessage(openApiFetchFailureText(outcome.failure)) };
