  (throwing ConnectorConfigurationNotFoundError, tested at "throws ConnectorConfigurationNotFoundError
  naming the requested connector...") split, and the test title's framing that "capability-naming being
  the only condition about a connector's use this domain declares", are architecture and rationale commentary
  rather than an asserted domain value contradicting or omitted from a node, so they are not reported
  as findings here.
