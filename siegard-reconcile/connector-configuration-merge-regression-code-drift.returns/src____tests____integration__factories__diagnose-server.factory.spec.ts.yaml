    where: "the persisted-durations assertion, `expect(written?.durations_collection).toBeGreaterThan(0);` (around line 414)"
    evidence: "expect(written?.durations_collection).toBeGreaterThan(0);"
    cost: "The collection stage in this test runs through `fetchMock`, an async function with no artificial delay of its own (unlike `createMock`'s explicit 10ms `setTimeout`), so it can legitimately settle in under one millisecond. The invariant names that outcome honest and requires it be recorded as 0 rather than invented upward — yet this assertion forbids exactly that value. A future collection call that genuinely resolves under a millisecond would fail this test not because anything is broken, but because the assertion bakes in an assumption ('collection duration is never zero') the specification explicitly refuses to let anyone enforce, and a reader trusting the test would come away believing zero is never a legitimate collection duration."
    kind: contradicts
    node: rules/investigation/a-measured-duration-below-one-millisecond-is-zero
    correction: "relax the assertion to tolerate zero (e.g. `toBeGreaterThanOrEqual(0)`), or otherwise stop requiring `durations_collection` to be strictly positive, consistent with the invariant's own statement that a sub-millisecond span is recorded as 0 and is never raised to avoid recording a zero."

