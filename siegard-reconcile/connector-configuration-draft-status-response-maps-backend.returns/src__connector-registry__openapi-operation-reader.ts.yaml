looked_past: >-
  Whether reading.method's lower-case spelling is upper-cased before it reaches the drafted
  configuration, and whether the distinction between an operation declaring no `responses` object
  at all and one declaring an empty `{}` survives into the reading notes, both depend on
  connector-configuration-draft-generation.ts and connector-configuration-draft-reading-notes.ts,
  which are outside this file and belong to their own reading.
