looked_past: "migration 0021's own hypothesis_revision_collects_no_delete_when_released rule silently no-ops a DELETE against a released revision's collects rather than raising the 409 the sibling node describes, and this test's deleteCollectsDirectly calls depend on exactly that silent no-op — but the claim of that behavior sits in the migration file, not in anything this spec file itself states."
