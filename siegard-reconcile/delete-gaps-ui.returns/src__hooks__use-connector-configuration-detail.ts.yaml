findings:
  - file: src/hooks/use-connector-configuration-detail.ts
    where: >-
      the `ConnectorConfigurationDetailState` type's `ready` phase (lines 47-59) and the
      object the hook returns for it (lines 188-207)
    evidence: |-
      | {
          readonly phase: "ready";
          readonly form: UseFormReturn<ConnectorConfigurationFormValues>;
          readonly configuration: ConfigurationFieldState;
          readonly isDirty: boolean;
          readonly isSubmitting: boolean;

          readonly isSubmitSuccessful: boolean;
          readonly onSubmit: (event?: BaseSyntheticEvent) => void;
          readonly onCancel: () => void;
          readonly onRemove: () => void;
          readonly isRemoving: boolean;
        };
    cost: >-
      Nothing in this hook collects a test value per Subject attribute named by the
      presented answer's own `${subject:<attribute-name>}` placeholders, and nothing
      detects or states a divergence between the configuration a test would exercise
      and the one being presented; an operator running the connector's test after the
      registered configuration has changed underneath them gets no signal that the
      values they supplied were collected against a configuration they are no longer
      looking at.
    kind: contradicts
    correction: >-
      Have this hook collect one test value per distinct Subject-attribute name found
      in the presented answer's own configuration text (never from `configurationValue`,
      which may hold an unsubmitted edit or applied draft), and compare that attribute
      set against the configuration read at the moment of the test, exposing a stated
      divergence to the caller when they differ.
    node: rules/integration/a-presented-connector-configurations-test-collects-values-for-the-attributes-the-presented-answer-names

  - file: src/hooks/use-connector-configuration-detail.ts
    where: "the `query.isError` branch, lines 153-161"
    evidence: |-
      if (query.isError) {
          return {
            phase: "load-error",
            retryLoad: () => {
              void query.refetch();
            },
            onCancel,
          };
        }
    cost: >-
      A connector name nothing is registered under and a read that failed for any other
      reason both resolve to the same `load-error` phase, both carrying `retryLoad`; an
      operator who reaches an unregistered connector name is offered a retry that can
      never succeed instead of being told plainly that nothing is registered there.
      Because `query.isError` returns before the `ready` phase is ever reached, this
      hook can never present the authoring form under an unregistered connector name
      either, so the create side of `register-connector` is unreachable from this screen.
    kind: contradicts
    correction: >-
      Distinguish, inside the `query.isError` branch, a refusal naming
      ConnectorConfigurationNotFoundError from any other failure, and return a phase
      for the former that states nothing is registered under the connector name,
      presents no connector or configuration value, and carries no retry action —
      separate from the `load-error` phase, which keeps `retryLoad` for a read that
      genuinely failed.
    node: rules/integration/a-presented-connector-configuration-states-a-connector-name-nothing-is-registered-under

  - file: src/hooks/use-connector-configuration-detail.ts
    where: "the object the `ready` phase returns, lines 188-207"
    evidence: |-
      return {
          phase: "ready",
          form,
          configuration: {
            value: configurationValue,
            isValid: configurationValid,

            onChange: handleConfigurationChange,
          },
          isDirty,
          isSubmitting: mutation.isPending,
          isSubmitSuccessful: mutation.isSuccess,
          onSubmit,
          onCancel,
          onRemove: () => {
            removeMutation.mutate();
          },
          isRemoving: removeMutation.isPending,
        };
    cost: >-
      An operator who has edited the connector name or the Configuration field away
      from what the read answered has no act, anywhere in this hook, that returns the
      fields to that read content without leaving the screen: `onCancel` navigates away
      (`router.history.back()` or to `/connectors`), and no field of the returned state
      resets `configurationValue`/`configurationBaseline` or `form` to `query.data`.
      Recovering from an unwanted edit to opaque configuration text an operator cannot
      retype from memory costs a round trip through another screen instead of the
      in-place act the rule requires.
    kind: contradicts
    correction: >-
      Expose a discard action from the ready phase (e.g. `onDiscard`) whose whole
      effect is to reset `form` to `{ connector: query.data.connector }` and reset
      `configurationValue`/`configurationBaseline` to `query.data.configuration`,
      available while `isDirty` is true and taking effect only on a further explicit
      act, per the rule.
    node: rules/integration/a-loaded-registration-edit-may-be-discarded-without-leaving-the-surface

