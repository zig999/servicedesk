findings:
  - file: src/hooks/use-hypothesis-revision-form.ts
    where: >-
      the `HypothesisRevisionFormState` union's `load-error` variant (line 52) and the branch
      that returns it (lines 242-256)
    evidence: |-
      | { readonly phase: "load-error"; readonly retryLoad: () => void }
      ...
      if (isGlossaryError || isRevisionsError || (versionQuery.isError && !isVersionNotValid)) {
          return {
            phase: "load-error",
            retryLoad: () => {
              void versionQuery.refetch();
              if (hypothesisName !== null) {
                void revisionsQuery.refetch();
              }
              conceptOptions.refetch();
              outcomeOptions.refetch();
              actionOptions.refetch();
              recipientOptions.refetch();
            },
          };
        }
    cost: >-
      A curator whose glossary read failed, one whose hypothesis-revisions read failed, and one
      whose case-version read failed for a reason this surface does not recognise all land on the
      identical `load-error` phase, with no field saying which read did not complete; `retryLoad`
      then re-issues all five queries regardless of which one actually failed, so the curator can
      neither tell which read to retry nor have the surface retry only that one, though the node
      requires the two statements — glossary-or-revisions did not complete, versus the case version
      did not complete — to be told apart, and the glossary and revisions cases from each other.
    kind: contradicts
    correction: >-
      Give `load-error` a discriminator (or split it into distinct phases) naming which read failed
      — the case version's own unrecognised refusal, the glossary's terms, or the hypothesis's
      revisions — with each retried and reported on its own, rather than one undifferentiated phase
      that retries everything at once.
    node: rules/knowledge/a-hypothesis-composition-states-which-of-its-reads-did-not-complete
