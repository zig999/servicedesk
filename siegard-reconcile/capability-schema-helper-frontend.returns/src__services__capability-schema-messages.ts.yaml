findings:
  - file: src/services/capability-schema-messages.ts
    where: >-
      lines 8-13, the CAPABILITY_SCHEMA_DRAFT_UNRESOLVED_REASON_MESSAGES record
    evidence: |
      const CAPABILITY_SCHEMA_DRAFT_UNRESOLVED_REASON_MESSAGES: Readonly<Record<string, string>> = {
        "schema-not-reducible-to-a-type":
          "O esquema declarado não se reduz a um único tipo do JSON Schema.",
        "name-claimed-by-another-parameter":
          "O nome já é ocupado por outro parâmetro ou campo desta operação.",
      };
    cost: >-
      domain/integration/capability-schema-draft-unresolved-reason declares the closed set of
      reasons once, as an enumeration; this record retypes that same closed set as untyped
      string-literal keys (Record<string, string>, not a type tied to the specification's
      enumeration), so the set of valid reasons now lives in two places that can drift apart
      silently — if the specification's enumeration ever gains, renames or drops a reason,
      nothing here fails to compile or warns; capabilitySchemaDraftUnresolvedReasonMessage
      simply falls through to the raw machine code (`?? reason`) for the operator to read, and
      the next person maintaining this file has no link back to the node that is supposed to
      own the set.
    kind: contradicts
    node: domain/integration/capability-schema-draft-unresolved-reason
    correction: >-
      Key this record by the specification's own enumeration (e.g. a type generated from or
      validated against domain/integration/capability-schema-draft-unresolved-reason) rather
      than by two independently retyped string literals, so the two sets cannot diverge without
      a compile-time signal.
