looked_past: >-
  The refusal-disclosure tests never assert the absence of input_schema, output_schema or an
  unresolved list beside a stated refusal (a-refused-schema-draft-states-its-refusal-to-the-operator's
  own closing clause), and the unrecognized-failure test hardcodes the literal substring "não
  declara nenhuma operação" instead of importing the operation-not-found message constant it is
  guarding against — both are test-coverage/duplication concerns about wording the specification
  itself leaves to the interface, not a domain fact stated or misstated in this file, so they are
  left for a different pass.
