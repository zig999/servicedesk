findings:
  - file: migrations/0005-investigation.sql
    where: the CHECK constraint on investigation_evaluations.reason, lines 84-86
    evidence: |-
      CONSTRAINT investigation_evaluations_reason_check
        CHECK (reason IN ('no-data', 'judgment-failure', 'deadline-exceeded'))
    cost: >-
      A judgment call that completes within its deadline over evidence that collected ok, and
      returns a well-formed inconclusive verdict grounded in nothing, must be recorded with
      reason `not-grounded` — the value src/investigation/evaluation-reason.ts already declares
      (`export const EVALUATION_REASONS = ['no-data', 'judgment-failure', 'deadline-exceeded',
      'not-grounded'] as const;`) and src/investigation/anthropic-hypothesis-evaluator.adapter.ts
      already produces. This constraint admits only the first three, so that exact write is
      refused by the database at the moment the record most needs writing, and no later
      migration in the tree ever widens this constraint to admit the fourth value.
    kind: contradicts
    correction: >-
      A later migration must drop and recreate investigation_evaluations_reason_check to read
      CHECK (reason IN ('no-data', 'judgment-failure', 'deadline-exceeded', 'not-grounded')) —
      the same forward-correcting shape 0015, 0016 and 0023 already use for a constraint 0005
      declared narrower than the node it governs.
    node: domain/investigation/evaluation-reason
