looked_past: >-
  declaredFieldsOf only extracts an output schema's own top-level property keys and never takes a
  responseMap or resolves a path in a response body, so the full three-way condition
  rules/integration/an-observation-carries-only-the-output-schema-fields-its-response-map-reaches
  states is not assembled anywhere in this file; nothing here states that condition differently or
  claims it as settled, so whether the rest of the rule is implemented elsewhere is a completeness
  question for a different pass, not a stated-fact conflict.
