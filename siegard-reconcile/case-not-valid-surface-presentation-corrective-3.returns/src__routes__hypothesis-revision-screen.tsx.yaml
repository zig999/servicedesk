findings:
  - file: src/routes/hypothesis-revision-screen.tsx
    where: the `load-error` branch, lines 24-33
    evidence: |-
      if (state.phase === "load-error") {
        return (
          <section>
            <p>Unable to load this form right now.</p>
            <Button type="button" onClick={state.retryLoad}>
              Retry
            </Button>
          </section>
        );
      }
    cost: >-
      A curator whose composing surface failed to read the glossary's terms (so a concept,
      outcome, action or recipient option list came back empty or unusable) and a curator whose
      read of the hypothesis's own revisions failed (so they cannot see what a submit would
      overwrite) both see the identical text and the identical Retry control as a curator whose
      read of the anchoring case version never completed at all. Nothing on the surface names
      which of the three reads is the one to retry, so the curator cannot tell a failure that
      leaves the anchor unknown from one that leaves the anchor known and only a side list
      unfilled, and the one distinction the node exists to make usable is not made.
    kind: contradicts
    correction: >-
      The `load-error` phase (or whatever states the hook exposes for it) would need to carry
      which read failed, and this branch would need to render a statement naming the glossary's
      terms or the hypothesis's revisions distinctly from the statement made for the case
      version's own read not completing, instead of collapsing every incomplete read into one
      "Unable to load this form right now." message.
    node: rules/knowledge/a-hypothesis-composition-states-which-of-its-reads-did-not-complete

