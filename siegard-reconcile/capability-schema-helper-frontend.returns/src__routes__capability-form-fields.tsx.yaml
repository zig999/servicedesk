read:
  - node: domain/integration/capability
    held_at: >-
      the form's field set for the aggregate's own attributes
    evidence: |
      <FormField label="Name" errorId="name-error" error={errors.name?.message}>
      <FormField label="Version" errorId="version-error" error={errors.version?.message}>
      <FormField label="Nature" errorId="nature-error" error={errors.nature?.message}>
      <FormField label="Timeout (ms)" errorId="timeout-error" error={errors.timeout?.message}>
      <FormField label="Connector" errorId="connector-error" error={errors.connector?.message}>
  - node: domain/integration/capability-nature
    held_at: >-
      the Nature Select's options, built from an imported enumeration rather than restated here
    evidence: |
      const NATURE_OPTIONS: SelectOption[] = CAPABILITY_NATURES.map((nature) => ({
        value: nature,
        label: nature,
      }));
  - node: domain/investigation/field-semantics
    held_at: the paragraph beneath the Output schema field
    evidence: >-
      Os nomes de campo lidos a partir dele são as chaves do próprio objeto
      properties de nível superior deste schema. O type e a description
      declarados por cada uma dessas chaves, onde o schema os declara, são
      lidos como a semântica declarada desse campo. Nenhum outro conteúdo
      deste schema é lido ou validado.
  - node: rules/glossary/a-description-states-meaning-never-policy
    held_at: the closing sentence of the same paragraph
    evidence: >-
      Uma description aqui declara o que seu valor significa e não nomeia
      nenhuma decisão.
  - node: rules/integration/a-capability-authoring-surface-offers-a-schema-helper
    held_at: >-
      the Schema Helper's placement, immediately beneath the Input schema and Output schema
      fields
    evidence: |
      <CapabilitySchemaHelperFields
        state={schemaHelper}
        onApplyInputSchema={inputSchemaApply.onApply}
        onApplyOutputSchema={outputSchemaApply.onApply}
      />
  - node: rules/integration/a-capability-declares-well-formed-schemas
    held_at: nowhere
    evidence: >-
      isSubmitting || !inputSchema.isValid || !outputSchema.isValid || isDirty === false
  - node: rules/integration/a-capability-is-read-only
    held_at: nowhere
    evidence: |
      const NATURE_OPTIONS: SelectOption[] = CAPABILITY_NATURES.map((nature) => ({
        value: nature,
        label: nature,
      }));
  - node: rules/integration/an-output-schema-entry-states-what-the-system-reads-from-it
    held_at: the paragraph beneath the Output schema field
    evidence: >-
      O que é inserido aqui é JSON. Os nomes de campo lidos a partir dele são
      as chaves do próprio objeto properties de nível superior deste schema.
      O type e a description declarados por cada uma dessas chaves, onde o
      schema os declara, são lidos como a semântica declarada desse campo.
      Nenhum outro conteúdo deste schema é lido ou validado. Uma description
      aqui declara o que seu valor significa e não nomeia nenhuma decisão.
  - node: rules/integration/applying-a-drafted-capability-schema-changes-only-the-local-edit
    held_at: >-
      the two independently-instantiated apply hooks and their own confirmation dialogs
    evidence: |
      const inputSchemaApply = useApplyToJsonSchemaField(
        inputSchema,
        isDirty ?? inputSchema.value !== "",
      );
      const outputSchemaApply = useApplyToJsonSchemaField(
        outputSchema,
        isDirty ?? outputSchema.value !== "",
      );
  - node: rules/integration/one-capability-answers-one-concept
    held_at: nowhere
    evidence: |
      <Select
        value={field.value}
        onChange={field.onChange}
        onBlur={field.onBlur}
