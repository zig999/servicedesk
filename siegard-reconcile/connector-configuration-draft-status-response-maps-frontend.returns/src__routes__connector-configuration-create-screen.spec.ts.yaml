findings:
  - file: src/routes/connector-configuration-create-screen.spec.ts
    where: the describe block title, line 91
    evidence: |-
      describe("ConnectorConfigurationCreateScreen -- the footer Connectors link registers nothing before it navigates (UNDERDETERMINED note: a-connector-configuration-surface-offers-a-route-to-the-listing leaves open whether the route submits before landing on the listing)", () => {
    cost: >-
      A reader of this suite who trusts the parenthetical will believe the specification leaves
      open whether the Connectors-link route may still issue a register-connector call once it
      has landed on the listing — but the node the comment names, read directly, forecloses any
      register-connector call from this route at all, before or after: "taking that route
      registers nothing and alters no registered configuration" and "Following that route from s
      issues no register-connector call and leaves every registered connector configuration
      exactly as it stood." Nothing is left open for a later request to settle differently.
    kind: contradicts
    correction: >-
      Drop the "UNDERDETERMINED" framing, or correct it to state that
      rules/integration/a-connector-configuration-surface-offers-a-route-to-the-listing already
      forecloses any register-connector call tied to this route, not only one issued before
      navigating.
    node: rules/integration/a-connector-configuration-surface-offers-a-route-to-the-listing
