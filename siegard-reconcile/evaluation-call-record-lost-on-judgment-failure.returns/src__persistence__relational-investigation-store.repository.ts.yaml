findings:
  - file: src/persistence/relational-investigation-store.repository.ts
    where: "raiseRootInsertFailure, lines 267-269, and its use inside writeWholeInvestigation"
    evidence: "return (cause) => (isUniqueViolation(cause) ? new InvestigationAlreadyStoredError(id) : raiseWriteFailure(cause));"
    cost: "write() rejects with InvestigationAlreadyStoredError whenever the id already has a record, rather than resolving the way a write that settled would; a caller that reads only this store's own write() outcome sees the duplicate as something to recover from, not as the already-answered request the rule describes, and nothing in this file makes the second attempt behave as a write that settled."
    kind: contradicts
    node: rules/investigation/an-investigation-is-written-once
    correction: "on a unique-violation of the root insert, write() should resolve without raising, the same as a fresh insert — the attempt found exactly the record it was sent to write."
  - file: src/persistence/relational-investigation-store.repository.ts
    where: "reasonOf, lines 429-432"
    evidence: |
      if (row.reason === null) {
          throw raiseReadFailure(new Error(`investigation_evaluations holds an inconclusive verdict with no reason for hypothesis "${row.hypothesis}"`));
        }
    cost: "the rule that every inconclusive evaluation declares a reason is re-asserted here as an independent, hard-coded null check carrying its own business-worded message, rather than by reference to the node that states it; a later change to that rule has to be found and re-derived here separately, and until then the two can silently disagree about which stored rows are valid."
    kind: contradicts
    node: rules/investigation/an-inconclusive-evaluation-declares-its-reason
  - file: src/persistence/relational-investigation-store.repository.ts
    where: "nonEmptyCitations, lines 443-448"
    evidence: |
      if (citations.length === 0) {
          throw raiseReadFailure(new Error(`investigation_evaluations holds a decided verdict for hypothesis "${hypothesis}" with no citations`));
        }
    cost: "the rule that a confirmed or refuted evaluation carries at least one citation is re-asserted here as an independent, hard-coded length check carrying its own business-worded message, rather than by reference to the node that states it; a later change to that rule has to be carried into this file separately, and disagreement between the two is invisible until a stored evaluation is actually read back."
    kind: contradicts
    node: rules/investigation/a-decided-evaluation-cites-evidence
