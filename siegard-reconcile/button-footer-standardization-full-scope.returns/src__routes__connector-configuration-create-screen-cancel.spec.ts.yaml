looked_past: The describe block labels this Cancel test "criterion 7" (the abandonment rule) while the literal destination it asserts, "/connectors", is exactly what the neighbouring listing-route rule commits to and the abandonment rule leaves generic ("wherever the authoring surface was reached from") — whether the abandonment rule's own dynamic-destination requirement is exercised anywhere, as opposed to only this fixed-destination case, is a coverage question for another pass, not a domain fact this file states falsely.
