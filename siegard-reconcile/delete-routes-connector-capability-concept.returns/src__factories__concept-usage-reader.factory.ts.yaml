findings:
  - file: src/factories/concept-usage-reader.factory.ts
    where: "resolveConceptUsage, the fourth conditional branch, lines 36-38"
    evidence: |-
      if (await sources.caseStore.isConceptCollectedByUnmanifestedHypothesisRevision(concept)) {
        return { named: true, reference: 'hypothesis-revision-collects' };
      }
    cost: A concept collected by a hypothesis-revision that a case version's manifest currently points at (a manifested one) never trips this branch, so remove-concept can proceed against a concept the rule's own decided text requires it still refuse; the glossary row is removed while a manifested hypothesis_revision_collects row still names it, stranding exactly the reference the rule exists to keep from stranding.
    kind: contradicts
    node: rules/glossary/a-registered-concept-is-never-removed
    correction: Resolve concept usage from any hypothesis-revision's own collects, manifested or not, rather than narrowing the fourth source to an unmanifested-only check.
