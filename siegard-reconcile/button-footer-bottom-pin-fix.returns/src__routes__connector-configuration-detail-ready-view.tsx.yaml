findings:
  - where: "the `state.justSaved` block, lines 82-87, and the trailingActions block as a whole (lines 51-95)"
    evidence: |
      {state.justSaved && (

        <p role="status" className="text-sm text-foreground">
          Saved.
        </p>
      )}
    cost: "The registered outcome is stated as a bare \"Saved.\", never naming the connector name that now stands registered, and no branch of this file ever states a refused outcome or which refusal answered it — the only submission-outcome prop this component reads is `state.justSaved`. An operator whose edit the registry refused sees nothing distinguishing that from an edit still in flight or one never submitted, and the next reader auditing this view for where a refusal is told to the operator finds no such construct here at all."
    kind: contradicts
    correction: "Render a distinguishable message for a refused submission (naming the condition the registry answered, or stating the condition is unrecognised where it named none), and name the connector configuration that now stands registered in the success message, per the rule's own expression."
    node: rules/integration/a-submitted-registration-states-its-outcome-to-the-operator

