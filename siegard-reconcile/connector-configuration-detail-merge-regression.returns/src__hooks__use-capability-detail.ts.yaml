findings:
  - file: src/hooks/use-capability-detail.ts
    where: the useMutation onSuccess callback (lines 114-121)
    evidence: |-
      onSuccess: (_data, values) => {
        form.reset(values);
        setInputSchemaBaseline(inputSchemaValue);
        setOutputSchemaBaseline(outputSchemaValue);

        void queryClient.invalidateQueries({ queryKey: ["capabilities"] });
        void queryClient.invalidateQueries({ queryKey: ["capability", name, version] });
      },
    cost: >-
      After a save succeeds, the fields are reset from the submitted form values — never
      from _data, the PUT response, and not from any fresh read — while the invalidated
      ["capability", name, version] query has only been marked stale, not yet refetched.
      query.isLoading stays false because stale data is already held, so the "ready" phase
      does not lapse into "loading"; the operator keeps looking at exactly what they submitted,
      under the same identity, for as long as the background refetch takes. If the registry
      normalizes, trims or otherwise adjusts any attribute on write, the surface shows a value
      nobody ever read back, and the next reader who wants to know what a "ready" capability
      screen shows will look at this hook and find the read conflated with the write it is
      supposed to stay apart from.
    kind: contradicts
    correction: >-
      Populate the ready-phase fields only from a read's own answer — either the PUT response
      _data if the contract has it answer identically to read-capability-by-identity, or by
      waiting for the invalidated ["capability", name, version] query to resolve — rather than
      seeding form and schema baselines from the submitted values.
    node: rules/integration/a-presented-capability-states-its-declared-attributes-as-the-read-answered-them

