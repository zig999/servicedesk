looked_past: "The contract's behavioral guarantees — that simulate-hypothesis writes no investigation, emits no event, and lets nothing reach a cache — are facts about runtime behavior a DTO shape cannot evidence either way, and the finer per-reason citation rule (a no-data verdict must cite the non-ok evidence, from rules/investigation/an-inconclusive-evaluation-declares-its-reason and rules/investigation/a-decided-evaluation-cites-evidence) is bound by the trace to src/investigation/judgment-stage.ts, not to this transport schema, so its enforcement there is a different file's finding."

