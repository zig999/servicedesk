findings:
  - file: src/routes/connector-configuration-detail-ready-view.tsx
    where: the `state.justSaved` success message, lines 87-92
    evidence: |-
      {state.justSaved && (

        <p role="status" className="text-sm text-foreground">
          Saved.
        </p>
      )}
    cost: >-
      An operator who submits an edit is told only "Saved.", never which connector
      configuration now stands registered. The node requires the surface to state what
      was registered — the connector name the submission carried — alongside the fact
      that it registered; this text carries no such content even though the connector
      name (the `connector` prop) is already in scope of this component. An operator who
      has moved between several connectors' detail screens, or returned to this one via
      the listing, has nothing in this confirmation to tie the "Saved." to the connector
      it was saved for.
    kind: contradicts
    correction: >-
      Interpolate the connector name into the confirmation text (e.g. state that the
      connector configuration for `{connector}` is now registered) instead of the bare,
      unqualified word "Saved."
    node: rules/integration/a-submitted-registration-states-its-outcome-to-the-operator

