findings:
  - file: src/routes/case-simulation-screen.tsx
    where: >-
      the `loading` branch (`state.phase === "loading"`) and the `load-error` branch
      (`state.phase === "load-error"`)
    evidence: |
      <section>
        <p>Loading version {version}…</p>
        <CaseVersionEditorLink slug={slug} version={version} />
      </section>
      ...
      <section>
        <p>Unable to load this version right now.</p>
        <Button type="button" onClick={state.retryLoad}>
          Retry
        </Button>
        <CaseVersionEditorLink slug={slug} version={version} />
      </section>
    cost: >-
      Both readings of this version-keyed surface carry a route to the version's own
      editing surface but no route to the version's own manifest, so a curator who
      reaches this screen while the read is pending or has failed has no way from here
      to the manifest — the one screen `a-presented-case-version-offers-a-route-to-its-own-manifest-on-every-reading`
      says should carry that route regardless of what the read answered is, on these
      two readings, a screen carrying only the editor's sibling route and not this one.
    kind: contradicts
    correction: >-
      Render a route to the version's manifest (the counterpart of `CaseVersionEditorLink`)
      in both the `loading` and `load-error` branches, alongside the existing editor route.
    node: rules/knowledge/a-presented-case-version-offers-a-route-to-its-own-manifest-on-every-reading

