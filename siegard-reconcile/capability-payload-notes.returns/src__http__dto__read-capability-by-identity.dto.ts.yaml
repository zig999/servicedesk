looked_past: >-
  payload_notes is the only field without a `.min(1)` guard, so an empty string would pass
  this schema alongside `undefined`; whether that under-constrains the presentation policy's
  "stands absent... and never otherwise" turns on how the value populating this schema is
  produced, which is outside this file, so it is left unreported here rather than raised
  against a construct this file does not contain.
