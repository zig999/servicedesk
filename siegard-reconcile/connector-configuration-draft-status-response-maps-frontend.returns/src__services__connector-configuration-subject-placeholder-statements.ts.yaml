    held_at: parseConfigurationObject, which treats the Configuration field's content as JSON object text and requires it to parse to an object
    evidence: |-
      parsed = JSON.parse(configurationText); ... return isPlainRecord(parsed) ? parsed : null;
  - node: rules/integration/a-connector-configuration-placeholder-is-written-in-one-of-three-forms
    held_at: the SUBJECT_PLACEHOLDER_PATTERN constant, recognizing only the Subject-attribute form
    evidence: |-
      const SUBJECT_PLACEHOLDER_PATTERN = /\$\{subject:([^}]+)\}/g;
  - node: rules/integration/a-connector-configuration-surface-states-a-subject-placeholder-no-registered-capability-declares
    held_at: computeSubjectPlaceholderStatements
    evidence: |-
      if (connectorCapabilities.length === 0) { return [{ kind: "cannot-be-checked" }]; }
      return attributeNames.map((attributeName) => {
        const nonDeclaringCapabilityLabels = capabilityPropertyNames.filter((entry) => !entry.propertyNames.has(attributeName)).map((entry) => entry.label);
        if (nonDeclaringCapabilityLabels.length === 0) { return { kind: "declared", attributeName }; }
        return { kind: "undeclared", attributeName, nonDeclaringCapabilityLabels };
      });
