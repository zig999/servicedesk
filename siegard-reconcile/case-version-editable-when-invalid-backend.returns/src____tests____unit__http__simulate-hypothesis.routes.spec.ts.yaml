read:
  - node: contracts/knowledge/case-query
    held_at: nowhere
    evidence: >-
      const caseQuery: ICaseQuery = { readCase: vi.fn().mockResolvedValue(readCaseResult),
      readCaseVersion: vi.fn(), listCases: vi.fn(), listCaseVersions: vi.fn(), listHypotheses:
      vi.fn(), listHypothesisRevisions: vi.fn() };
  - node: domain/knowledge/case-version
    held_at: nowhere
    evidence: >-
      function heldCase(): Case { return { slug: 'a-slug', title: 'a-title', when_to_use: 'when
      an attendant needs it', version: 1, authored_at: '2024-01-01T00:00:00.000Z', subject:
      'a-subject', fallback: { outcome: 'no-hypothesis-confirmed', referral: { action:
      'an-action', recipient: 'a-recipient' } }, state: 'released', manifest: [], hypotheses: [] };
      } — a fixture returned from a mocked readCase, exercising no manifest composition, no state
      transition and no resolve-outcome logic.
  - node: rules/knowledge/a-case-read-by-an-unknown-slug-or-version-is-refused
    held_at: nowhere
    evidence: >-
      readCase: vi.fn().mockResolvedValue(readCaseResult) — the mock always resolves, so no
      unknown-slug-or-version refusal path is exercised by this file.
  - node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
    held_at: nowhere
    evidence: >-
      app.inject({ method: 'POST', url: '/v1/simulate/hypothesis', payload: REQUEST_BODY,
      remoteAddress }) — every request in this file targets the simulate-hypothesis route, never
      an editing surface.
  - node: constraints/a-successful-case-version-own-record-read-answers-with-http-200
    held_at: nowhere
    evidence: >-
      readCaseVersion: vi.fn() — stubbed and never invoked or asserted against; no request in
      this file reads a case version's own record.
  - node: constraints/a-malformed-request-is-refused-with-a-validation-error
    held_at: nowhere
    evidence: >-
      expect(responses.map((response) => response.statusCode)).toEqual(Array(REQUESTS_WITHIN_LIMIT).fill(200));
      and expect(over.statusCode).toBe(429); — the only statuses this file asserts are 200 and
      429; no malformed-request case is sent or asserted as 400.
  - node: rules/knowledge/a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
    held_at: nowhere
    evidence: >-
      app.register(createSimulateHypothesisRoutesPlugin(dependencies)); — only the
      simulate-hypothesis routes plugin is registered; no discard route is mounted or called.
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-discardable
    held_at: nowhere
    evidence: >-
      app.register(createSimulateHypothesisRoutesPlugin(dependencies)); — the same registration;
      no discard act is offered or issued anywhere in this file.
  - node: constraints/a-successful-case-version-discard-answers-with-no-content
    held_at: nowhere
    evidence: >-
      app.register(createSimulateHypothesisRoutesPlugin(dependencies)); — no discard call is made,
      so no 204/no-content answer is exercised.
  - node: rules/knowledge/an-accepted-update-draft-answers-its-versions-own-stored-declared-attributes
    held_at: nowhere
    evidence: >-
      app.register(createSimulateHypothesisRoutesPlugin(dependencies)); — no update-draft route is
      registered or called by this file.
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-open-for-editing
    held_at: nowhere
    evidence: >-
      app.register(createSimulateHypothesisRoutesPlugin(dependencies)); — no editing surface or
