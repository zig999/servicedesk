findings:
  - file: src/services/connector-configuration-http-departures.spec.ts
    where: 'the describe/it block "an absent method key states no method departure (the task''s own resolved reading of criterion 1)"'
    evidence: |-
      describe("computeHttpConnectorDepartures -- an absent method key states no method departure (the task's own resolved reading of criterion 1)", () => {
        it("returns no departures for an otherwise well-formed configuration declaring no method key at all", () => { const departures = departuresFor(withoutKey(baseConfig(), "method")); expect(departures).toEqual([]); });
      });
    cost: >-
      The node states an observation reaching a configuration lacking any of the three (method,
      responseMap, statusMap) issues no call and ends unavailable — treating an absent method
      exactly as it treats an absent responseMap or statusMap, both of which this same file DOES
      assert as departures. By instead asserting zero departures for an absent method, an operator
      who leaves out statusMap/responseMap/address is warned but one who leaves out method is not.
    kind: contradicts
    node: rules/integration/an-http-connector-configuration-declares-its-method-and-status-vocabulary
    correction: >-
      Either the function (and this test) should state a departure for an absent method key on
      the same footing as absent statusMap/responseMap/address, or the node should say method is
      treated differently — decided into the specification rather than left to the task's own
      resolved reading.
  - file: src/services/connector-configuration-http-departures.spec.ts
    where: 'the describe/it block "a statusMap key that is not a valid HTTP-status-shaped string draws no departure of its own"'
    evidence: |-
      describe("computeHttpConnectorDepartures -- a statusMap key that is not a valid HTTP-status-shaped string draws no departure of its own, only its ending value is judged (the task's own resolved reading)", () => {
        it("returns no departures for a statusMap entry keyed 'notAStatus' whose value is an admitted ending", () => { const departures = departuresFor(baseConfig({ statusMap: { notAStatus: "ok" } })); expect(departures).toEqual([]); });
      });
    cost: >-
      The vocabulary node says nothing about what to do when a statusMap key is not itself shaped
      like an HTTP status; this test asserts a specific resolution and its own title concedes it
      is "the task's own resolved reading" rather than something any node states.
    kind: unstated
    node: rules/integration/an-http-connector-configuration-declares-its-method-and-status-vocabulary
    correction: >-
      Decide, into the vocabulary node, whether a statusMap key not shaped as an HTTP status is
      itself a departure, and disclose that decision in the decision log.
