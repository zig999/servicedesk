findings:
  - file: src/hooks/use-cases-list.ts
    where: "line 17, the module-level type declaration `export type CaseVersionState = \"draft\" | \"released\";`"
    evidence: |-
      export type CaseVersionState = "draft" | "released";
    cost: >-
      The case-version lifecycle's two states are the specification's own enumeration
      (`domain/knowledge/case-version-state`), and this file re-declares them as a literal
      union under its own authority rather than importing the one that already exists in the
      codebase (`frontend/app/src/hooks/use-case-versions.ts` exports the identical
      `export type CaseVersionState = "draft" | "released";`, consumed by
      `case-simulation-header.tsx` and `use-case-simulation-version.ts`). A third place now
      carries the same vocabulary; if the specification's enumeration is ever extended, there
      is no single site a maintainer is led back to, and the two independent declarations can
      silently diverge from each other and from the node.
    kind: contradicts
    correction: >-
      Remove the local declaration and import `CaseVersionState` from the one existing
      canonical declaration (or a shared module deriving it from the specification), so the
      state-machine's states are enumerated in exactly one place in source.
    node: domain/knowledge/case-version-state
