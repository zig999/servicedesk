read:
  - node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
    held_at: >-
      the "presents every declared attribute" test, which shows the not-valid banner alongside
      every one of the five declared attributes and lets the "leaves its form fields enabled"
      test confirm none of them is disabled
    evidence: >-
      expect(screen.getByDisplayValue(DRAFT_RECORD.when_to_use)).toBeTruthy();
      expect(screen.getByDisplayValue(DRAFT_RECORD.subject)).toBeTruthy();
      expect(screen.getByText(DRAFT_RECORD.fallback.outcome)).toBeTruthy();
      expect(screen.getByText(DRAFT_RECORD.fallback.referral.action)).toBeTruthy();
      expect(screen.getByText(DRAFT_RECORD.fallback.referral.recipient)).toBeTruthy();
      expect(screen.getByText(DRAFT_RECORD.consolidation_register)).toBeTruthy();
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-open-for-editing
    held_at: >-
      the first describe block's rendering of the not-valid statement together with the
      draft's own title on the enriched reading; the scenario's own submit-and-accept step is
      not exercised in this file
    evidence: >-
      expect(await screen.findByDisplayValue(DRAFT_RECORD.title)).toBeTruthy();
      expect(await screen.findByText(NOT_VALID_BANNER_TITLE)).toBeTruthy();
  - node: rules/knowledge/a-version-keyed-surface-states-a-named-version-that-does-not-read-back-as-a-case
    held_at: >-
      the first test, which asserts the not-valid banner distinct from the load-error text on
      the refused reading, and its absence once the same version reads back cleanly
    evidence: >-
      expect(await screen.findByText(NOT_VALID_BANNER_TITLE)).toBeTruthy();
      expect(screen.queryByText(LOAD_ERROR_TEXT)).toBeNull();
      ...
      expect(screen.queryByText(NOT_VALID_BANNER_TITLE)).toBeNull();
  - node: rules/knowledge/a-case-version-failing-validation-at-a-read-is-refused-by-name
    held_at: the notValidResponse fixture used for the version read
    evidence: >-
      jsonResponse(
        { error: { code: "CaseVersionNotValidError", message: "validation failed" } },
        409,
      );
  - node: rules/knowledge/a-draft-versions-content-is-presented-only-from-its-own-record
    held_at: nowhere
    evidence: >-
      expect(screen.queryByText("CACHED-SECRET-TITLE")).toBeNull(); — this guards the
      whole-case-assembly exclusion the editing-surface rule states, not the create-draft
      pending interval this node names; no test in this file exercises that interval
  - node: rules/knowledge/a-newly-created-draft-offers-no-act-before-its-own-record-arrives
    held_at: nowhere
    evidence: >-
      every handler in enrichedNotValidHandlers resolves immediately — `[`GET ${VERSION_PATH}`]:
      notValidResponse` — so no test in this file leaves a created draft's own record
      unanswered
  - node: rules/knowledge/a-refusal-a-case-keyed-surface-cannot-name-is-presented-as-a-read-that-did-not-complete
    held_at: nowhere
    evidence: >-
      expect(screen.queryByText(LOAD_ERROR_TEXT)).toBeNull(); — this checks the load-error
      statement's absence on the version-keyed surface under test, never a case-keyed
      surface meeting an unrecognised refusal code, which is what this node names
  - node: rules/knowledge/a-surface-offering-release-states-which-release-conditions-the-draft-meets
