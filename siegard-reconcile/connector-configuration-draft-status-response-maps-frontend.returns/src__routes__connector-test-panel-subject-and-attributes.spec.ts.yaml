findings:
  - file: src/routes/connector-test-panel-subject-and-attributes.spec.ts
    where: describe block "requester is collected as a plain free-text field (disclosed inference)", its one test
    evidence: |-
      const requesterInput = within(dialog).getByLabelText<HTMLInputElement>("Requester");
      expect(requesterInput.tagName).toBe("INPUT");
      expect(requesterInput.getAttribute("role")).not.toBe("combobox");
      fireEvent.change(requesterInput, { target: { value: "operator@example.com" } });
      expect(requesterInput.value).toBe("operator@example.com");
    cost: >-
      The file fixes, as a fact about the connector-test operation, that a test's requester is
      collected from the operator as an unverified, freely-typed string. The specification closes
      this exact question by name for a diagnose and for a simulation, but
      rules/integration/a-connector-configuration-is-tested-through-a-registered-capability — the
      one rule that states everything the test-connector action assembles — names only Subject
      attributes and never mentions a requester at all, though an-http-connector-configuration-declares-its-call
      admits a ${requester} placeholder in the same call.
    kind: unstated
    correction: >-
      A node — most naturally an addition to
      rules/integration/a-connector-configuration-is-tested-through-a-registered-capability, or a
      sibling rule — stating whether test-connector's call carries a requester at all, and if so
      that it is supplied directly by the operator with no further resolution or verification.
looked_past: >-
  The assertions that the attribute-value row renders as a plain INPUT rather than a combobox,
  and that typing an attribute value issues no extra network request, are interface-shape and
  implementation-efficiency claims this specification leaves to the interface's own, so they are
  not reported as findings.
