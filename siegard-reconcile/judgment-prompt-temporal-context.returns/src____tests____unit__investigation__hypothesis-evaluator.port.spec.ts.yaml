findings:
  - file: src/__tests__/unit/investigation/hypothesis-evaluator.port.spec.ts
    where: >-
      the test "attaches the deterministic zero-valued usage and elapsed_ms even where a seeded
      outcome carries no prompt at all, leaving the answered outcome without a prompt key of its
      own" (lines 132–143)
    evidence: |-
      fake.seed(A_CRITERION, { verdict: 'confirmed', citations });
      const evaluator = evaluatorOver(fake);

      const outcome = await evaluator.evaluate(A_CRITERION, SOME_EVIDENCE, A_CASE_CONTEXT);

      expect(outcome.usage).toEqual(ZEROED_USAGE);
      expect(outcome.elapsed_ms).toBe(ZEROED_ELAPSED_MS);
      expect(outcome).not.toHaveProperty('prompt');
    cost: >-
      A confirmed verdict is a call that happened, and this test asserts, as a valid outcome
      shape, that such a call carries usage and elapsed_ms while lacking a prompt entirely. A
      reader building or reviewing a real IHypothesisEvaluator adapter against this port's own
      test suite is shown that split as sanctioned, when domain/investigation/evaluation holds
      usage, elapsed_ms and prompt together as one call's own record, and
      rules/investigation/a-judgment-failure-records-the-last-call-made is built on that trio
      never separating ("a usage summed across two attempts, paired with one attempt's elapsed_ms
      and prompt, would describe a call that never happened and leave a reader unable to hold the
      tokens against the prompt shown"). The next implementer has nowhere in this file to learn
      that a completed call without a materialized prompt is not a shape the specification
      admits.
    kind: contradicts
    node: domain/investigation/evaluation
    correction: >-
      Either seed and require a prompt whenever usage/elapsed_ms accompany a call that happened
      (any non-no-data outcome), or drop the `.not.toHaveProperty('prompt')` assertion so the test
      no longer presents "usage/elapsed_ms present, prompt absent" as a valid completed-call
      shape.
read:
  - node: constraints/the-judgment-prompt-is-closed
    held_at: nowhere
    evidence: >-
      the file never assembles or inspects a prompt; `evaluator.evaluate(A_CRITERION,
      SOME_EVIDENCE, A_CASE_CONTEXT)` (line 38) is the only call through the port, and the one
      `prompt` value that appears is a literal string carried straight through the fake
      (`prompt: 'the materialized judgment prompt'`, line 118) — nothing here assembles or
      constrains prompt content.
  - node: domain/investigation/hypothesis-evaluator
    held_at: the `evaluate` calls made through `IHypothesisEvaluator`, e.g. line 38
    evidence: >-
      import type { CaseContext, EvidenceItem, IHypothesisEvaluator } from
      '../../../investigation/hypothesis-evaluator.port.js'; ... const outcome = await
      evaluator.evaluate(A_CRITERION, SOME_EVIDENCE, A_CASE_CONTEXT);
  - node: domain/investigation/evidence
    held_at: the `SOME_EVIDENCE` fixture, lines 13-24
    evidence: |-
      const SOME_EVIDENCE: readonly EvidenceItem[] = [
        {
          concept: 'a-concept',
          result: 'ok',
          observation: 'an-observed-value',
          fields: [{ name: 'a-field', type: 'string', description: 'a description of a-field' }],
          concept_description: 'what a-concept means',
          capability_payload_notes: '',
          observed_at: '2024-01-01T00:00:00.000Z',
          ttl: 60,
        },
      ];
  - node: domain/investigation/citation
