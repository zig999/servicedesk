  The 400-VALIDATION_ERROR block is hand-written inline in this handler rather than shared with the sibling remove-capability and remove-concept route files, which repeat the same shape; that duplication is a code-review concern about the implementation, not a domain fact the specification states differently, so it is not reported as a finding.
