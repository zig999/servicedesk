looked_past: >-
  orphanedAcrossEveryCapability() flags a placeholder as orphaned only when it is
  absent from every capability currently registered against the connector's name
  (an intersection across capabilities, `rest.every((set) => set.has(placeholder))`),
  which reads as consistent with rules/integration/a-connector-placeholder-is-declared-by-its-capability's
  own description of the check running "against whatever is registered on the
  other side at that moment" — a reasonable resolution of the node's singular
  "a capability" wording for the multi-capability-per-connector case rather than
  a departure from it, so it is not reported as a finding.

