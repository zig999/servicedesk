findings:
- file: src/__tests__/unit/errors/case-version-not-draft-at-release.error.spec.ts
  where: the second test ("names the case slug, the version number and the state the version is in..."),
    lines 17-21
  evidence: 'const error = new CaseVersionNotDraftAtReleaseError(''cliente-sem-internet'', 4, ''released'');

    expect(error.message).toContain(''cliente-sem-internet'');

    expect(error.message).toContain(''4'');

    expect(error.message).toContain(''released'');'
  cost: The test locks in, as a passing requirement, that the operator-facing message contains the literal
    English/internal state token "released" rather than the fixed Brazilian-Portuguese word the vocabulary
    node names for that state. A future change to the error class that translates the state into "liberada"
    would fail this test.
  kind: contradicts
  correction: The assertion should require the fixed Portuguese word for the released state ("liberada")
    to appear, and should assert the raw state token/English word does not appear -- the same way the
    file already asserts .not.toMatch(/\bcase\b/i) for the case noun.
  node: constraints/a-domain-refusal-names-each-domain-noun-by-one-fixed-portuguese-word
