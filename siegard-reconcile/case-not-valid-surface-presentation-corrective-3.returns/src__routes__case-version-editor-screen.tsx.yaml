findings:
  - file: src/routes/case-version-editor-screen.tsx
    where: >-
      the `state.phase === "not-valid"` branch, the paragraph text at line 41
    evidence: >-
      <p>This case&apos;s current version does not read back as a case.</p>
    cost: >-
      This screen is reached by naming both the case's slug and a specific version
      number (`useParams({ from: "/cases/$slug/versions/$version" })`), and the
      hook backing it queries exactly that (slug, version) pair
      (`/v1/cases/${slug}/versions/${version}`) — the version the curator named may
      or may not be the case's current, highest-numbered version. Telling the
      curator "this case's current version does not read back as a case" states a
      different domain fact than the one the read actually answered: a curator who
      opened an older or superseded version and met a validation failure on that
      specific version is told, instead, that the case's current version is
      invalid — which may be false, and which points the curator at the wrong
      version to correct.
    kind: contradicts
    correction: >-
      State that the version named (s, n) does not read back as a case, not that
      the case's current version does not — the "current version" phrasing belongs
      to the case-keyed surface reached by slug alone, not to this surface reached
      by slug and version together.
    node: rules/knowledge/a-version-keyed-surface-states-a-named-version-that-does-not-read-back-as-a-case
