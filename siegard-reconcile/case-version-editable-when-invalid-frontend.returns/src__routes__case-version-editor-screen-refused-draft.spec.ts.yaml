looked_past: >-
  the absence of a Discard control on this editing surface, and the REST-path split between
  VERSION_PATH and DECLARED_ATTRIBUTES_PATH, since neither states a fact any node fixes here —
  discard's own surface and the wire shape separating the validated read from the own-record
  read are interface composition, not a domain fact this pass judges.
