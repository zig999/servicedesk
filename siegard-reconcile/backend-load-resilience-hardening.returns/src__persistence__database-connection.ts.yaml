findings:
  - file: src/persistence/database-connection.ts
    where: the optional `poolOptions` parameter and its `undefined` branch, lines 13 and 17-19
    evidence: |-
      poolOptions?: IDatabaseConnectionPoolOptions,
      ...
      ...(poolOptions === undefined
            ? {}
            : {
    cost: >-
      When createDatabaseConnection is called with no poolOptions, the Pool is constructed with
      no `max`, no `idleTimeoutMillis` and no `statement_timeout` at all, so all three bounds fall
      through to pg's own built-in defaults (driver max 10, driver idle timeout, no statement
      timeout) rather than to any declared default — exactly the case the constraint calls out by
      name, and a reader checking this file for "how do the three bounds get their fallback" finds
      a path that hands the outcome to the driver instead.
    kind: contradicts
    node: constraints/the-connection-pool-is-bounded-by-configuration
    correction: >-
      make poolOptions (and each of its three fields) required for createDatabaseConnection, so a
      Pool can never be built without an explicit max/idleTimeoutMillis/statement_timeout — with
      any "deployment stated none" case resolved to a declared default before this function is
      called, never inside it.

