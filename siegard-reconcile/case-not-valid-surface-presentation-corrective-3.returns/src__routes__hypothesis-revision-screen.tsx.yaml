looked_past: >-
  The "View Manifest" button's presence in the composing branch but absence from the `loading`
  and `load-error` branches sits close to what `a-presented-case-version-offers-a-route-to-its-own-manifest-on-every-reading`
  requires, but that node's own text and Description tie it to the surface a curator lands on
  directly for a case version, a different surface from this hypothesis-composing screen, which
  carries its own dedicated rule that says nothing about a manifest route — I left the gap
  unreported rather than attribute it to a node whose own scope points elsewhere.
