findings:
  - file: src/services/connector-configuration-apply-diff.spec.ts
    where: 'const NESTED_KEYS = ["statusMap", "responseMap", "query", "headers"] as const;'
    evidence: |-
      const NESTED_KEYS = ["statusMap", "responseMap", "query", "headers"] as const;
    cost: >-
      The four-key vocabulary this node names is already exported from the implementation as
      NESTED_OBJECT_KEYS, but this test re-declares the same four literals independently rather
      than importing that export. If the node's set of itemised keys ever changes, the
      implementation's own constant and this spec's local list are two places that both have to
      be edited in step.
    kind: contradicts
    node: rules/integration/an-apply-confirmation-states-what-the-draft-would-change
    correction: >-
      Import NESTED_OBJECT_KEYS from ./connector-configuration-apply-diff and iterate over it in
      the it.each, instead of re-declaring the four key names as a local literal array.
looked_past: >-
  The vocabulary "itemisable"/"not-itemisable" and the test's own criteria-numbering in describe
  titles are naming choices internal to this test and the module it exercises, not a domain fact.
