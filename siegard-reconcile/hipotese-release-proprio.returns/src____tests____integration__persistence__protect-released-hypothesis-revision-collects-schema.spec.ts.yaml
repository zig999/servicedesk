looked_past: "two things belong to other passes rather than this one — first, neither test in the file actually creates a released hypothesis-revision and asserts the DELETE refusal itself, so the file never exercises the refused branch of rules/knowledge/a-released-hypothesis-revision-is-never-altered, which is a coverage question; second, the second test's unconditional UPDATE-is-blocked assertion exercises hypothesis_revision_collects_no_update, a rule migration 0021's own comment identifies as pre-existing and untouched by this task, and reads as a persistence-mechanism safeguard rather than a business-visible fact."
