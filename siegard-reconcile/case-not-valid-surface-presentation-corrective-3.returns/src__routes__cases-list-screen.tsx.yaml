    held_at: >-
      the row's own identity and the navigation target, built from the case's slug alone,
      lines 40-41 and 86-91
    evidence: |-
      function handleRowClick(row: StatusTableRow): void {
        const slug = row.slug;
        if (typeof slug !== "string") {
          return;
        }
        void navigate({ to: "/cases/$slug", params: { slug } });
      }
