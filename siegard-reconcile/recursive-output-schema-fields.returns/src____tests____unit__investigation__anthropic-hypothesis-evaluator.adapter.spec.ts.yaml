findings:
  - file: src/__tests__/unit/investigation/anthropic-hypothesis-evaluator.adapter.spec.ts
    where: >-
      the assertions inside "states that multiple evidence items are evaluated in complete
      isolation, never attributing one item's field value to another even where both declare
      a field of the same name", lines 217-219
    evidence: |
      expect(system).toContain('evaluate each in complete isolation from every other');
      expect(system).toContain('is never attributed to another item, even where two items declare a field of the same name');
    cost: >-
      This guarantee — that the judgment must never let one evidence item's field value ground
      a verdict about another item, even where two items share a field name — is stated only in
      the adapter's own system prompt and pinned only by this test. Nothing in the specification
      records that a hypothesis's judgment treats each evidence item in isolation this way, unlike
      the neighboring prompt facts (observation is JSON text, the current instant is read fresh,
      the block is closed) which the decision log shows were each deliberately decided. A reader
      checking whether this cross-item guarantee still holds after a future prompt rewrite has no
      node to check it against, and the adapter's own prose is the only place the rule can be read
      back from.
    kind: unstated
    correction: >-
      Decide, as an invariant constraining domain/investigation/hypothesis-evaluator (the same
      home judgment-reads-the-current-instant-fresh was given for this prompt), that a hypothesis's
      judgment reads each evidence item's own field values independently of every other item's,
      and record why in the decision log.

