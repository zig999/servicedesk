findings:
  - file: src/__tests__/unit/investigation/evidence-collection-stage.spec.ts
    where: "expectedOkEvidence and expectedNonOkEvidence (lines 277-319), and expectedUnavailableEvidence (lines 321-337), used by every it(...) in the file"
    evidence: |
      capability_name: context.capability.name,
      capability_version: context.capability.version,
      (expectedNonOkEvidence, lines 313-314; the same pair appears in expectedOkEvidence, lines 290-291)
      and, for a concept whose capability never resolved:
      origin: '',
      ...
      capability_name: '',
      capability_version: '',
      (expectedUnavailableEvidence, lines 328, 331-332)
    cost: "domain/investigation/evidence.md declares only a `reference` relationship to domain/integration/capability (cardinality \"1\") and no capability_name or capability_version attribute at all; a reader who opens that node to learn what an evidence item discloses about the capability that produced it — and what it discloses when none resolved — finds no such fields and no honest-empty rule for them, while every test in this file, and by implication the source it exercises, already treats capability_name, capability_version and origin's empty-string default as settled facts. The next person to touch Evidence's shape has no specification record of two of its fields or of what they read when a capability never resolved."
    kind: unstated
    correction: "domain/investigation/evidence.md would need capability_name and capability_version declared as attributes (or the capability reference's own materialization stated), with the honest-empty degradation for an unresolved capability recorded the same way elapsed_ms, fields and concept_description already are."
    node: domain/investigation/evidence

