findings:
  - file: src/investigation/investigation.ts
    where: "the `Investigation` type, line 29"
    evidence: "readonly written_at?: string;"
    cost: "the type lets any Investigation value exist with no written_at at all — a caller building or consuming this shape gets no compile-time signal that the specification treats written_at as a mandatory attribute of the aggregate root, so the next reader checking the type learns the opposite of what the node states, and code elsewhere can construct or pass around a record the domain model says cannot exist without a settle instant"
    kind: contradicts
    node: domain/investigation/investigation
    correction: "declare `written_at: string` without the `?`, matching the node's `required: true`; a pre-write construction step, if the factory needs one, belongs to a type of its own rather than to this required field"

