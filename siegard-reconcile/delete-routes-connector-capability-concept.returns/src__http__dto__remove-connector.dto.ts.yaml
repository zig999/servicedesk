looked_past: >-
  The z.string().min(1) non-empty constraint on the connector name is a technical enforcement of
  "required" rather than a domain fact of its own, so it is not reported as an unstated rule; the
  file's remaining scope (route wiring, response status, refusal branching) belongs to the sibling
  controller and routes files, not this DTO.
