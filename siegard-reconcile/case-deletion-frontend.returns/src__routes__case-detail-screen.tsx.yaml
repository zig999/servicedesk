findings:
  - file: src/routes/case-detail-screen.tsx
    where: "VersionsPanel — the hasDraft computation (line 93) and the conditional hiding of the New-draft control (lines 97-103)"
    evidence: |-
      const hasDraft = data.data.some((version) => version.state === "draft");
      ...
      {!hasDraft && (
        <Button type="button" variant="secondary" asChild>
          <Link to="/cases/$slug/versions/new" params={{ slug }}>
            New draft
          </Link>
        </Button>
      )}
    cost: >-
      Whether a curator may even attempt to start a second draft is decided here, in the
      client, by withholding the control entirely once one draft already exists, rather than
      offering it and letting create-draft answer with the disclosed refusal
      rules/knowledge/a-case-has-at-most-one-draft states. That node says only what create-draft
      answers when asked; it says nothing about a versions listing pre-emptively withholding its
      own route to create-draft. A reader checking the specification for what capability this
      screen exposes around drafting will find the backend refusal and its disclosure, but not
      the fact that the control disappears before the curator ever reaches it — that fact exists
      only in this component.
    correction: >-
      State, alongside rules/knowledge/a-case-has-at-most-one-draft (or in a node of its own),
      whether and when a case-versions listing withholds its own create-draft route once the
      case already holds a draft, so this screen's hasDraft gate implements a decided fact
      rather than one found only in the component.
    kind: unstated
