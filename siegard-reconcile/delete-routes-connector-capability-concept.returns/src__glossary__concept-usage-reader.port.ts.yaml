read:
  - node: constraints/the-domain-depends-on-no-infrastructure
    held_at: >-
      the interface IConceptUsageReader — a pure port declared with no import of any framework,
      driver or provider client, so infrastructure can reach the domain's concept-in-use check
      only by implementing it.
    evidence: |
      export interface IConceptUsageReader {

        readConceptUsage(concept: string): Promise<ConceptUsageResolution>;
      }
  - node: constraints/a-domain-error-unmapped-by-status-is-refused-generically
    held_at: nowhere
    evidence: |
      export type ConceptUsageReference = 'capability' | 'evidence' | 'citation' | 'hypothesis-revision-collects';

      export type ConceptUsageResolution =
        | { readonly named: true; readonly reference: ConceptUsageReference }
        | { readonly named: false };

      export interface IConceptUsageReader {

        readConceptUsage(concept: string): Promise<ConceptUsageResolution>;
      }
