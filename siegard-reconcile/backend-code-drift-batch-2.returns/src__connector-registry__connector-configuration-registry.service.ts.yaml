read:
  - node: contracts/integration/connector-configuration-registry
    held_at: >-
      the four public methods of ConnectorConfigurationRegistryService — registerConnector
      (lines 31-40), removeConnector (lines 42-44), readConnectorConfiguration /
      readConnectorConfigurationOrThrow (lines 46-58), and listConnectorConfigurations
      (lines 60-73)
    evidence: |-
      const kept = held.filter((candidate) => candidate.connector !== configuration.connector);
      await this.store.writeConnectorConfigurations([...kept, configuration]);
  - node: rules/integration/a-connector-configuration-read-by-an-unregistered-name-is-refused
    held_at: readConnectorConfigurationOrThrow, lines 52-58
    evidence: |-
      const resolution = await this.readConnectorConfiguration(connector);
      if (!resolution.held) {
        throw new ConnectorConfigurationNotFoundError(resolution.connector);
      }
