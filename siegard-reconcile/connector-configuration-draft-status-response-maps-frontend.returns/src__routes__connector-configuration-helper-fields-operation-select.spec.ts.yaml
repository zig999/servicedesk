findings:
  - file: src/routes/connector-configuration-helper-fields-operation-select.spec.ts
    where: >-
      the describe block "a listed operation's method is not upper-cased when the state's own
      entry names it lower-case (UNDERDETERMINED, from
      rules/integration/an-openapi-operations-method-is-upper-cased)"
    evidence: |-
      describe("...UNDERDETERMINED, from rules/integration/an-openapi-operations-method-is-upper-cased)", () => {
        it("states the method upper-cased on the option regardless of the case the entry itself holds", () => {
          renderFields(stateWith({ operations: [operation("/items", "get")] }));
          expect(label).toContain("GET");
        });
      });
    cost: >-
      The candidate node an-openapi-operations-method-is-upper-cased already settles this as an
      invariant, and this file's own assertion enforces exactly that. The describe title
      nonetheless calls the behavior "UNDERDETERMINED" and says the method "is not upper-cased" —
      a reader who trusts the label is told the specification leaves this open and that the code
      does the opposite of what it actually does.
    kind: contradicts
    node: rules/integration/an-openapi-operations-method-is-upper-cased
    correction: >-
      Rename the describe title to state the method is upper-cased per the node it cites,
      removing "UNDERDETERMINED" and "is not upper-cased".
looked_past: >-
  The file duplicates test setup across many describe blocks rather than sharing helpers more
  tightly, and several describe titles use a "(criterion N)" numbering scheme; neither is a
  domain-fact departure.
