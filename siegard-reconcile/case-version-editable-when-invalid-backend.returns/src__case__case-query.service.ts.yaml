    held_at: >-
      readCase (lines 34-39): the version is fetched, then structurally parsed, then checked
      for coherence, and only then returned — any failure at either step throws rather than
      returning a partial case.
    evidence: |-
      const assembled = await heldVersion(this.caseStore, slug, version);
          const theCase = structuralCase(assembled, slug, version);
          await this.refuseIncoherence(theCase, version);
          return { case: theCase };
