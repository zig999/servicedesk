read:
  - node: constraints/a-domain-error-unmapped-by-status-is-refused-generically
    held_at: nowhere
    evidence: >-
      export function statusForError(error: unknown): number | undefined {
        if (!(error instanceof Error)) {
          return undefined;
        }
        for (const [errorClass, status] of STATUS_BY_ERROR_CLASS) {
          if (error instanceof errorClass) {
            return status;
          }
        }
        return undefined;
      }
      The function only returns `undefined` for an error the map does not name; the HTTP 500
      status, the `INTERNAL_ERROR` code and the fixed message the node states are not declared
      anywhere in this file — they are supplied by whatever reads this function's `undefined`
      result.
