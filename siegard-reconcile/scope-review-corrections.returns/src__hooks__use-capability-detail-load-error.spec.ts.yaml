findings:
  - file: src/hooks/use-capability-detail-load-error.spec.ts
    where: >-
      the describe block "useCapabilityDetail -- bundling the concept vocabulary into the ready
      phase (an inference the implementation recorded)", lines 78-122
    evidence: >-
      it("reports the load-error phase when the concept vocabulary read fails, even though the
      capability identity GET itself succeeds", async () => { ... await waitFor(() =>
      expect(result.current.phase).toBe("load-error")); }); ... it("reissues the concept
      vocabulary read when retryLoad is called after only that read failed, resolving to ready
      once it succeeds", async () => { ... loadErrorState(result.current).retryLoad(); ... await
      waitFor(() => expect(result.current.phase).toBe("ready")); });
    cost: >-
      the file pins, as a passing test, that this surface's "ready" versus "load-error" state and
      what a single retry control replays both turn on a second resource — the glossary's concept
      vocabulary — succeeding alongside the capability read, and that one retry reissues both
      reads together. None of this file's fourteen nodes, nor
      a-capability-keyed-surface-states-a-read-in-flight-and-a-read-that-failed (which states the
      in-flight/failed/read windows only for the capability identity read itself), say that a
      second, unrelated read gates the same state or that retrying replays it too; a reader
      checking what blocks an operator from reaching "ready", or what a retry control actually
      re-issues, finds only the capability-identity rule and nothing about the concept vocabulary
      it is silently bundled with.
    kind: unstated
    correction: >-
      a node would need to state that this surface's read state is a function of both the
      capability read and the concept-vocabulary read together, and that its retry control
      reissues both.
  - file: src/hooks/use-capability-detail-load-error.spec.ts
    where: >-
      the describe block "useCapabilityDetail -- exposing no isEditingIdentity flag (an
      inference the implementation recorded)", lines 124-134
    evidence: 'expect("isEditingIdentity" in readyState(result.current)).toBe(false);'
    cost: >-
      pinning the absence of a property on the hook's own return shape states a fact about this
      surface's internal composition rather than about what an operator can learn or do, and no
      node of this file's set constrains that shape either way — so nothing here is weighed
      against the specification; noted for completeness rather than pressed as a finding.
    kind: unstated
