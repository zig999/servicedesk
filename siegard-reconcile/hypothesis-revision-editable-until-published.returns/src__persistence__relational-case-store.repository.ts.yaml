findings:
  - file: src/persistence/relational-case-store.repository.ts
    where: "placeHypothesis()/placeHypothesisStatement(), lines 158-160 and 686-692"
    evidence: |
      public async placeHypothesis(input: PlaceHypothesisInput): Promise<void> {
        await runStatement(this.connection, placeHypothesisStatement(input), raisePlaceHypothesisFailure(input));
      }
      ...
      text: `INSERT INTO ${CASE_VERSION_HYPOTHESES_TABLE} (case_slug, case_version, hypothesis_name, revision, position)
             VALUES ($1, $2, $3, $4, $5)`,
    cost: "A hypothesis can be composed into an already-released version's manifest with nothing refusing it — altering exactly what a-case-version-is-written-once says a released version's manifest never does again — and no CaseVersionNotDraftError is raised anywhere in this file for place-hypothesis the way updateDraftVersion already raises one for update-draft, so a reader who goes looking for this refusal here will not find it."
    kind: contradicts
    node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
    correction: "Read the targeted case version's state within the same statement/transaction and throw CaseVersionNotDraftError when it is not draft, before running the INSERT — the same guard updateDraftVersion already applies for update-draft."

  - file: src/persistence/relational-case-store.repository.ts
    where: "removeManifestEntry()/removeManifestEntryStatement(), lines 162-164 and 701-706"
    evidence: |
      public async removeManifestEntry(slug: string, version: number, hypothesisName: string): Promise<void> {
        await runStatement(this.connection, removeManifestEntryStatement(slug, version, hypothesisName), raiseWriteFailure);
      }
      ...
      text: `DELETE FROM ${CASE_VERSION_HYPOTHESES_TABLE} WHERE case_slug = $1 AND case_version = $2 AND hypothesis_name = $3`,
    cost: "A manifest entry can be deleted from an already-released version with nothing refusing it, altering a manifest the specification says a released version never changes again, and no CaseVersionNotDraftError is raised here the way it is for update-draft."
    kind: contradicts
    node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
    correction: "Read the version's state before deleting and throw CaseVersionNotDraftError when it is not draft."

  - file: src/persistence/relational-case-store.repository.ts
    where: "removeManifestEntry()/removeManifestEntryStatement(), lines 162-164 and 701-706"
    evidence: |
      text: `DELETE FROM ${CASE_VERSION_HYPOTHESES_TABLE} WHERE case_slug = $1 AND case_version = $2 AND hypothesis_name = $3`,
    cost: "Removing the last manifest entry of a case version succeeds outright, leaving a version that investigates nothing (only the fallback answers) with no ManifestWouldHoldNoHypothesisError to say so — the refusal rules/knowledge/a-case-has-at-least-one-hypothesis names has nowhere in this file it is raised."
    kind: contradicts
    node: rules/knowledge/a-case-has-at-least-one-hypothesis
    correction: "Before deleting, count the version's remaining manifest entries (or make the delete conditional) and throw ManifestWouldHoldNoHypothesisError when the removal would leave none."

  - file: src/persistence/relational-case-store.repository.ts
    where: "release()/releaseStatement(), lines 166-168 and 708-713"
    evidence: |
      public async release(slug: string, version: number): Promise<void> {
        await runStatement(this.connection, releaseStatement(slug, version), raiseWriteFailure);
      }
      ...
      text: `UPDATE ${CASE_VERSIONS_TABLE} SET state = $3, released_at = NOW() WHERE slug = $1 AND version = $2`,
    cost: "release() accepts any slug/version pair regardless of its current state, silently re-stamping released_at on a version already released rather than refusing; CaseVersionNotDraftAtReleaseError is never imported or thrown anywhere in this file, so the refusal the specification names for this exact operation is not where the next reader would look for it."
    kind: contradicts
    node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
    correction: "Read the version's current state within the transaction and throw CaseVersionNotDraftAtReleaseError when it is not draft, before running the UPDATE."

  - file: src/persistence/relational-case-store.repository.ts
    where: "discard()/discardDraft(), lines 170-172 and 715-718"
    evidence: |
      async function discardDraft(tx: IQueryable, key: ICaseVersionKey): Promise<void> {
        await runStatement(tx, deleteManifestEntriesStatement(key), raiseWriteFailure);
        await runStatement(tx, deleteCaseVersionStatement(key), raiseWriteFailure);
      }
    cost: "discard() deletes the case-version row and every manifest entry it composed for any slug/version pair with no check that the version is still draft, so a released version — which every-case-version-remains-readable says the store keeps forever — can be removed outright with no CaseVersionNotDraftError raised."
    kind: contradicts
    node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
    correction: "Read the version's state before deleting and throw CaseVersionNotDraftError when it is not draft, the way updateDraftVersion already does for update-draft."

  - file: src/persistence/relational-case-store.repository.ts
    where: "requireHypothesisIdentity(), lines 403-408"
    evidence: |
      async function requireHypothesisIdentity(tx: IQueryable, key: IHypothesisKey): Promise<void> {
        const row = await queryOneOrAbsent<{ name: string }>(tx, hypothesisIdentitySelect(key), raiseReadFailure);
        if (row === undefined) {
          throw new CaseNotFoundError(key.slug, NO_VERSION_NAMED);
        }
      }
    cost: "An unrecognized hypothesis name inside a case that does exist is reported with the identical error identity — CaseNotFoundError — as a case slug or version that cannot be resolved at all, so nothing this file states distinguishes 'this case does not exist' from 'this case exists but has no hypothesis by that name'; rules/knowledge/a-case-read-by-an-unknown-slug-or-version-is-refused scopes CaseNotFoundError only to 'a case slug, or a slug and version,' never to a hypothesis name, and no node decides what a missing hypothesis name in this listing should report instead."
    kind: unstated
    correction: "Decide, through the specification's own route, what error identity a list-hypothesis-revisions call naming an unrecognized hypothesis reports, rather than the code reusing CaseNotFoundError for a case that is in fact found."

  - file: src/persistence/relational-case-store.repository.ts
    where: "hypothesisRevisionsPageSelect(), lines 426-435"
    evidence: |
      function hypothesisRevisionsPageSelect(key: IHypothesisKey, pagination: PaginationRequest): IStatement {
        return {
          text: `SELECT revision, criterion, resolution_outcome, resolution_action, resolution_recipient
                 FROM ${HYPOTHESIS_REVISIONS_TABLE}
                 WHERE case_slug = $1 AND hypothesis_name = $2
                 ORDER BY revision
                 LIMIT $3 OFFSET $4`,
    cost: "A curator reading the first page of one hypothesis's revisions sees revision 1, not the hypothesis's highest existing revision — the reverse of what the node requires — so the revision a curator would adopt into a draft, or compare a pin against, moves one page further out of reach with every revision the hypothesis gains, instead of sitting on the first page as the specification decided."
    kind: contradicts
    node: rules/knowledge/a-hypothesis-revisions-listing-answers-highest-revision-first
    correction: "Order the query `ORDER BY revision DESC` so the first page carries the hypothesis's highest existing revision."

