findings:
  - file: src/investigation/judgment-stage.ts
    where: "judgmentFailureEvaluation and its two call sites, in runIsolatedCall (lines 90-93) and retryOrFail (lines 108-110, 115)"
    evidence: |
      function judgmentFailureEvaluation(name: string): Evaluation {
        return { hypothesis: name, verdict: 'inconclusive', reason: 'judgment-failure', citations: [] };
      }
    cost: >-
      domain/investigation/evaluation states that usage, elapsed_ms and prompt are "the call's own
      record ... present exactly when a call happened, absent when reason `no-data` means judgment
      was never called at all" — and the decision log that settled this attribute set is explicit
      that the absence is tied to reason no-data, not to every inconclusive reason. A judgment-failure
      evaluation is only ever reached after an evaluator call actually completed (the rejected `first`
      outcome in runIsolatedCall, or the rejected `retry` outcome in retryOrFail — both are full
      EvaluationOutcome values carrying their own usage/elapsed_ms/prompt before citation validation
      runs), yet judgmentFailureEvaluation discards that completed outcome entirely. Anyone reading an
      investigation's evaluations to account for provider spend or call latency will see every
      judgment-failure hypothesis as if no call had been made for it, even though one — sometimes two —
      actually ran; cost and duration are silently understated exactly where a call did happen.
    correction: >-
      judgmentFailureEvaluation would need to take the completed outcome (the rejected `first`, or
      `retry` when a retry ran) and fold its usage/elapsed_ms/prompt into the returned evaluation the
      way asEvaluation/callRecordOf already do for confirmed, refuted and evaluator-returned
      inconclusive results, instead of returning a bare record with no call data.
    node: domain/investigation/evaluation

