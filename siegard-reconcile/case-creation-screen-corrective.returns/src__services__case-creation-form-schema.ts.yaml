    evidence: |-
      { path: "title", label: "Title" },
      { path: "when_to_use", label: "When to use" },
      { path: "subject", label: "Subject" },
      { path: "fallback.outcome", label: "Fallback outcome" },
      { path: "fallback.referral.action", label: "Fallback referral action" },
      { path: "fallback.referral.recipient", label: "Fallback referral recipient" },
  - node: rules/knowledge/a-case-authoring-surface-offers-no-submission-while-required-content-is-absent
    held_at: >-
      stillAbsentRequiredFields, which filters REQUIRED_CASE_CREATION_FIELDS by isBlank and
      returns exactly the still-absent required fields, naming consolidation_register and the
      manifest nowhere in that list
    evidence: |-
      export function stillAbsentRequiredFields(
        values: CaseCreationRequiredValues,
      ): readonly RequiredCaseCreationField[] {
        return REQUIRED_CASE_CREATION_FIELDS.filter((field) =>
          isBlank(readRequiredFieldValue(values, field.path)),
        );
      }
  - node: rules/knowledge/a-case-is-created-by-the-first-create-draft-naming-its-slug
    held_at: >-
      the schema's own slug field, present as free text the caller supplies rather than a
      value this schema derives
    evidence: |-
      export const caseCreationFormSchema = caseVersionFormSchema.extend({
        slug: z.string().min(1),
      });
  - node: contracts/knowledge/case-query
    held_at: nowhere
    evidence: >-
      The file exports only caseCreationFormSchema, its inferred type, and the required-field
      helpers above; nothing here calls or shapes read-case, list-cases, list-case-versions,
      list-hypotheses or list-hypothesis-revisions.
  - node: contracts/knowledge/case-lifecycle
    held_at: nowhere
    evidence: >-
      The file validates form values only; it names no create-draft submission, no
      revise-hypothesis, place-hypothesis, remove-hypothesis, update-draft, release or discard
      operation.
  - node: rules/knowledge/a-case-listing-offers-a-route-to-author-a-new-case-on-every-reading
    held_at: nowhere
    evidence: >-
      Nothing in the file concerns a case listing or a route to an authoring surface; it is a
      schema and a required-fields check consumed by whatever form uses it.
  - node: rules/knowledge/a-successful-case-version-creation-lands-on-the-created-versions-own-surface
    held_at: nowhere
    evidence: >-
      The file contains no navigation or destination logic; it defines validation only, with
