findings:
  - file: src/hooks/use-glossary-concepts.ts
    where: the concept-in-use branch of removalFailureMessage, lines 52-57
    evidence: |-
      if (error instanceof ApiError && uiStateForApiError(error).kind === "concept-in-use") {
        return `Nothing was removed; something else in the glossary still names the concept "${name}".`;
      }
    cost: >-
      An operator told the concept is "still named" by something "in the glossary" will look inside
      glossary management — at other concepts or vocabulary terms — to find and clear the reference.
      The rule that actually produces this refusal never fires for anything inside the glossary: it
      fires because a registered capability answers the concept, a collected evidence item or its
      citation names it, or a hypothesis-revision's own collects lists it — a capability, an
      investigation record, or a knowledge artefact, none of them part of the glossary. The message
      sends the operator to the wrong bounded context to resolve a refusal they cannot act on there.
    kind: contradicts
    node: rules/glossary/a-registered-concept-is-never-removed
    correction: >-
      State that the concept is still referenced elsewhere in the system — by a capability, a
      collected evidence item, a citation, or a hypothesis-revision — rather than asserting the
      reference is "in the glossary".
