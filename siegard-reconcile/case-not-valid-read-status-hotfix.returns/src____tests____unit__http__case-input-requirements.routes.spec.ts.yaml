looked_past: "the file leaves several assertions incomplete against nodes it does touch — e.g. no test checks that the 400 responses carry code VALIDATION_ERROR or a non-empty details list (constraints/a-malformed-request-is-refused-with-a-validation-error), and the 409 test never asserts the response is not also a 500 or a 404 — which is coverage, not conformance, and another pass's to weigh."
