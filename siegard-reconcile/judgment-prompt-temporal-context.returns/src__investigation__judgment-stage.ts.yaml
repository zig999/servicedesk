      const requiredNames = requiresEvaluationOf(theCase);
  - node: scenarios/investigation/a-collection-timeout-degrades-to-no-data
    held_at: |-
      judgeOneHypothesis's nonOkEvidence branch, returning noDataEvaluation
    evidence: |-
      const nonOkEvidence = evidence.filter((item) => item.result !== 'ok');
        if (nonOkEvidence.length > 0) {
          return noDataEvaluation(name, nonOkEvidence);
        }
  - node: scenarios/investigation/a-foreign-citation-is-refused
    held_at: |-
      runIsolatedCall's citationsAreAcceptable check leading into retryOrFail
    evidence: |-
      if (citationsAreAcceptable(context, first)) {
          return asEvaluation(name, first);
        }
        return retryOrFail({ name, hypothesis, evidenceItems, evaluator, deadlineGuard, context, caseContext, first });
  - node: scenarios/investigation/a-queued-judgment-is-deadline-exceeded
    held_at: |-
      judgeOneHypothesis's acquireSlotOrDeadline check
    evidence: |-
      if (!(await acquireSlotOrDeadline(pool, deadlineGuard))) {
          return deadlineExceededEvaluation(name);
        }
