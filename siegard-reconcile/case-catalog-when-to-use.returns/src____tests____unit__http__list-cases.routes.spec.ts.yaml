    where: "the it block at lines 183-192 (\"answers 500 with the generic envelope...\")"
    evidence: "built.listCases.mockRejectedValueOnce(new Error('a sensitive internal detail nobody outside the server should see'));\n\n  const response = await app.inject({ method: 'GET', url: '/v1/cases' });\n\n  expect(response.statusCode).toBe(500);\n  expect(response.body).not.toContain('sensitive internal detail');"
    cost: "the rule that an unexpected downstream failure is answered with a generic envelope that never surfaces the rejected call's own error text lives only in this test (and the middleware it exercises), so the next reader who wants to know what a caller may learn from a failed request will not find that refusal shape in the specification — unlike the parallel 400 case, which constraints/a-malformed-request-is-refused-with-a-validation-error does state"
    kind: unstated
    correction: "state, as a system-scope architecture constraint alongside constraints/a-malformed-request-is-refused-with-a-validation-error and constraints/listings-are-paged, that an unexpected error is answered with a generic response whose body never includes the underlying error's own message"
