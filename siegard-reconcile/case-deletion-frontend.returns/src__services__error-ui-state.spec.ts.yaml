  - node: rules/knowledge/a-case-deletion-surface-states-which-refusal-answered-its-delete
    held_at: >-
      the tests "resolves CaseNotFoundError to the case-not-found state" and "resolves
      CaseHoldsVersionsError to a kind no other named code resolves to, distinct from the
      generic fallback"
    evidence: >-
      expect(kindFor("CaseNotFoundError", "not found")).toBe("case-not-found"); and
      expectDistinctKind("CaseHoldsVersionsError", "holds versions", ["CaseNotFoundError", ...])
      together with expect(targetKind).not.toBe("generic-error") inside expectDistinctKind — the
      file requires CaseHoldsVersionsError's kind to differ from CaseNotFoundError's kind and
      from the generic fallback, and vice versa.
  - node: rules/knowledge/a-case-deletion-refusal-the-surface-cannot-name-is-told-as-an-unrecognised-failure
    held_at: >-
      the tests "resolves a code the table does not name to the generic-error state rather than
      throwing" and "resolves a code the table does not name to a fallback state carrying only
      the kind, not the refusal's own message"
    evidence: >-
      expect(kindFor("SomeFutureBackendError", "unrecognized")).toBe("generic-error"); and
      const state = stateFor("SomeFutureBackendError", "some future message");
      expect(Object.keys(state)).toEqual(["kind"]);
looked_past: >-
  Most of the file's assertions map error codes belonging to concept, capability, connector,
  hypothesis-revision and case-validity domains to their own kinds; none of those codes or the
  nodes governing them are in this set, and reviewing them is a different delegation's work.
