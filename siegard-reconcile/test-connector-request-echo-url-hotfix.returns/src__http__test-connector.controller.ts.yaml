findings:
  - file: src/http/test-connector.controller.ts
    where: "line 22, the REDACTED_CREDENTIAL_MARKER constant, and its use inside redactingEnv() (lines 108-110) to mask every credential placeholder in the diagnostic's echoed request"
    evidence: |-
      const REDACTED_CREDENTIAL_MARKER = '***REDACTED***';
    cost: >-
      This file is the sole place that fixes what an operator actually sees in place of a masked
      credential on the diagnostic read — the wording a reader would take as the specification's own
      decision. The specification's own decision log records, for a sibling masking rule
      (rules/investigation/a-presented-evidence-items-inputs-are-shown-with-a-resolved-credential-masked),
      that it only reused this same text as precedent and explicitly "claims nothing about" whether
      the diagnostic's own response carries it, and separately that "rules/integration/a-diagnostic-response-masks-a-resolved-credential
      fixes that its own read masks and fixes no rendering for it" and that "no node in the
      specification states any masking rendering at all" for this read. A reviewer who wants to know
      what an operator actually reads in place of a masked value on this endpoint has nowhere to look
      but this constant, and changing it would change operator-facing behavior with nothing in the
      specification to check it against.
    kind: unstated
    node: rules/integration/a-diagnostic-response-masks-a-resolved-credential
    correction: >-
      State the fixed rendering text a diagnostic response uses for a masked credential value in
      rules/integration/a-diagnostic-response-masks-a-resolved-credential (or a node it points to),
      then have REDACTED_CREDENTIAL_MARKER read that decided value rather than being its only source.
