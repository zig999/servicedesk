looked_past: "I did not flag resolveSourceVersion()'s silent no-op when an explicitly named source_version does not exist for the case, or the lack of a compare-and-set guard against a concurrent race on hypothesis-revision numbering, because neither is stated as a required refusal by any node I could locate — flagging either would be reaching for a code-review concern rather than a specification departure."
