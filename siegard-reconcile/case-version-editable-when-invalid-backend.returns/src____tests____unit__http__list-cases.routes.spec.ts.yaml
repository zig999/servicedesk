read:
  - node: contracts/knowledge/case-query
    held_at: >-
      the `caseQuery` dependency built in `buildTestApp()`, whose six operations mirror the
      contract's own operation list and whose `listCases` member is the one the routes plugin
      under test calls
    evidence: >-
      const caseQuery: ICaseQuery = {
          readCase,
          readCaseVersion: vi.fn(),
          listCases,
          listCaseVersions: vi.fn(),
          listHypotheses: vi.fn(),
          listHypothesisRevisions: vi.fn(),
        };
  - node: domain/knowledge/case-version
    held_at: nowhere
    evidence: >-
      the file's only listing entries are { slug: 'case-a', version_count: 0 } and
      { slug: 'case-b', version_count: 0 } — CaseCatalogEntry's own two fields, never
      case-version's declared attributes (title, when_to_use, subject, fallback,
      consolidation_register, manifest)
  - node: rules/knowledge/a-case-read-by-an-unknown-slug-or-version-is-refused
    held_at: nowhere
    evidence: >-
      const readCase = vi.fn<(slug: string, version: number) => Promise<ReadCaseResult>>();
      — declared on the mocked ICaseQuery but never invoked or asserted on by any test in this
      file
  - node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
    held_at: nowhere
    evidence: >-
      app.register(createListCasesRoutesPlugin(dependencies)); — the only route plugin this
      file registers is the case listing, never an editing surface
  - node: constraints/a-successful-case-version-own-record-read-answers-with-http-200
    held_at: nowhere
    evidence: 'readCaseVersion: vi.fn(), — declared but never called or asserted on'
  - node: constraints/a-malformed-request-is-refused-with-a-validation-error
    held_at: >-
      the four "answers 400 for..." tests (non-numeric offset, non-numeric limit, negative
      offset, limit of zero), which assert the refusal's status but not its error code,
      message or details list
    evidence: >-
      const response = await app.inject({ method: 'GET', url: '/v1/cases?offset=not-a-number' });

        expect(response.statusCode).toBe(400);
        expect(built.listCases).not.toHaveBeenCalled();
  - node: rules/knowledge/a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
    held_at: nowhere
    evidence: >-
      app.register(createListCasesRoutesPlugin(dependencies)); — no discard route or operation
      appears anywhere in this file
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-discardable
    held_at: nowhere
    evidence: >-
      the test data never carries a manifest or hypothesis count, and no test in this file
      discards anything
  - node: constraints/a-successful-case-version-discard-answers-with-no-content
    held_at: nowhere
    evidence: >-
      no test in this file issues a discard or asserts an HTTP 204 response
  - node: rules/knowledge/an-accepted-update-draft-answers-its-versions-own-stored-declared-attributes
    held_at: nowhere
    evidence: >-
      no test in this file calls update-draft or asserts on a version's declared attributes
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-open-for-editing
    held_at: nowhere
    evidence: >-
      the file exercises only GET /v1/cases pagination and error paths; no editing surface or
      update-draft scenario appears
looked_past: >-
  This file's actual domain facts — the pagination shape and the generic, non-leaking 500 on
