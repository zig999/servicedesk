findings:
  - file: src/persistence/relational-case-store.repository.ts
    where: function overwriteRevision (used by RelationalCaseStore.overwriteHypothesisRevision)
    evidence: |-
      async function overwriteRevision(tx: IQueryable, input: OverwriteHypothesisRevisionInput): Promise<void> {
        const key: IRevisionKey = { slug: input.slug, hypothesis_name: input.hypothesis_name, revision: input.revision };
        await runStatement(tx, revisionOverwriteStatement(input), raiseOverwriteFailure(input));
        await runStatement(tx, revisionCollectsDeleteStatement(key), raiseWriteFailure);
    cost: >-
      overwriteRevision never calls requireCaseHoldsDraft — the guard its sibling insertRevision
      applies immediately (`await requireCaseHoldsDraft(tx, input.slug);`) before touching a
      hypothesis-revision. An in-place edit of a hypothesis-revision therefore reaches the UPDATE
      whether or not the case currently holds a draft, so an overwrite issued after the draft was
      released or discarded proceeds silently instead of being refused with CaseHoldsNoDraftError,
      and the concept-acceptance check the rule anchors to a draft's declared subject type has no
      draft to anchor to. The next reader who trusts this guard because insertRevision enforces it
      will not find it enforced on the overwrite path.
    kind: contradicts
    node: rules/knowledge/a-hypothesis-is-revised-only-against-its-cases-draft
    correction: >-
      overwriteRevision would need to call requireCaseHoldsDraft(tx, input.slug) before issuing
      revisionOverwriteStatement, the same guard insertRevision already applies.

