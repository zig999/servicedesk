  - node: constraints/the-system-persists-to-one-relational-database
    held_at: |-
      the single-construction assertion (lines 96-102)
    evidence: |-
      const poolConstructions = source.match(/new Pool\(/g) ?? [];

        expect(poolConstructions).toHaveLength(1);
looked_past: >-
  the regexes guarding against hardcoded ports, IPv4 hosts, embedded credentials and 'localhost'
  (lines 23-33, 72-94) are a testing technique in service of the externally-provisioned node
  rather than a domain fact of their own, and I did not report them as such.
