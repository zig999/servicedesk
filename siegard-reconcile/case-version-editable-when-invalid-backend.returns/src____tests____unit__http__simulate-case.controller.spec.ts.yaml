read:
  - node: contracts/knowledge/case-query
    held_at: >-
      the caseQuery object built in buildDependencies, enumerating all six operations the
      contract publishes, and the readCase mock every test drives to answer or refuse the
      controller's one read
    evidence: |-
      const caseQuery: ICaseQuery = {
          readCase,
          readCaseVersion: vi.fn(),
          listCases: vi.fn(),
          listCaseVersions: vi.fn(),
          listHypotheses: vi.fn(),
          listHypothesisRevisions: vi.fn(),
        };
  - node: domain/knowledge/case-version
    held_at: >-
      the heldCase fixture builder, carrying the version's own declared attributes — title,
      when_to_use, subject, fallback, state, manifest — as the record readCase answers
    evidence: |-
      function heldCase(overrides: Partial<Case> = {}): Case {
        return {
          slug: 'a-slug',
          title: 'a-title',
          when_to_use: 'when an attendant needs it',
          version: 1,
          authored_at: '2024-01-01T00:00:00.000Z',
          subject: 'a-subject',
          fallback: heldResolution('no-hypothesis-confirmed'),
          state: 'released',
          manifest: [heldManifestEntry(1, 'hypothesis-a')],
  - node: rules/knowledge/a-case-read-by-an-unknown-slug-or-version-is-refused
    held_at: >-
      the test constructing and propagating CaseNotFoundError with the named slug and version
      unchanged when readCase refuses
    evidence: |-
      const notFound = new CaseNotFoundError('an-unknown-slug', 9);
      readCase.mockRejectedValueOnce(notFound);

      const rejection = handleSimulateCaseRequest(dependencies, { ...REQUEST_BODY, case: { slug: 'an-unknown-slug', version: 9 } });

      await expect(rejection).rejects.toBe(notFound);
  - node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
    held_at: nowhere
    evidence: >-
      import { handleSimulateCaseRequest, type SimulateCaseControllerDependencies } from
      '../../../http/simulate-case.controller.js'; — the file exercises only the simulate-case
      controller; no editing surface, update-draft or draft-attribute presentation is imported
      or asserted anywhere in it.
  - node: constraints/a-successful-case-version-own-record-read-answers-with-http-200
    held_at: nowhere
    evidence: >-
      expect(result).toEqual({ evidence: record.evidence, evaluations: record.evaluations,
      resolved: record.resolved, assessment: record.assessment, cost: record.cost, durations:
      record.durations, }); — every assertion in the file checks the returned record or a
      rejected promise; no HTTP status code is read-case-version's to state here, and none
      appears.
  - node: constraints/a-malformed-request-is-refused-with-a-validation-error
    held_at: nowhere
    evidence: >-
      it('refuses a request whose subject carries no attribute-value at all, throwing exactly a
      SubjectCarriesNoAttributeError, before runSimulate is ever called' — the file's only
      refusal tests are SubjectCarriesNoAttributeError, CaseNotFoundError and
      CaseVersionNotValidError; no malformed-shape VALIDATION_ERROR case is exercised.
  - node: rules/knowledge/a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
    held_at: nowhere
    evidence: >-
      import { handleSimulateCaseRequest, type SimulateCaseControllerDependencies } from
      '../../../http/simulate-case.controller.js'; — no discard operation, controller or route
      is imported or referenced anywhere in the file.
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-discardable
    held_at: nowhere
    evidence: >-
      const REQUEST_BODY: SimulateCaseRequestDto = { case: { slug: 'a-slug', version: 1 },
      subject: { type: 'a-subject-type', attributes: [{ attribute: 'an-attribute', value:
      'a-value' }] }, requester: 'a-requester', }; — the file's fixtures and assertions concern
      simulate-case requests alone; discard is not exercised.
  - node: constraints/a-successful-case-version-discard-answers-with-no-content
    held_at: nowhere
    evidence: >-
      expect(Object.keys(result).sort()).toEqual(['assessment', 'cost', 'durations',
      'evaluations', 'evidence', 'resolved']); — the only response shape asserted is
      simulate-case's own record; no 204/no-content discard answer is asserted anywhere.
  - node: rules/knowledge/an-accepted-update-draft-answers-its-versions-own-stored-declared-attributes
    held_at: nowhere
    evidence: >-
      import type { SimulateCaseRequestDto } from '../../../http/dto/simulate-case.dto.js'; —
      the file imports only the simulate-case DTO and controller; update-draft's own controller,
      DTO or answer shape is never imported or asserted.
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-open-for-editing
    held_at: nowhere
    evidence: >-
      function heldManifestEntry(position: number, hypothesisName: string): ManifestEntry { ...
      } — every fixture in the file builds a manifest already holding one hypothesis; no test
      exercises a manifest holding none, or an editing surface reached over it.
looked_past: >-
  heldCase()'s base fixture (state: 'released' with no released_at set) is a test-data realism
  question, not a domain fact. The file's other claims (simulate-case over draft and released
  versions, the six-field response shape, the required requester, the CaseVersionNotValidError
  refusal shape) all check out against nodes outside this file's own node set, so none is
  reported as a finding.
