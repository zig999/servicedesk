looked_past: The sha256-of-JSON-serialization hash the "computes StoredInvestigation's own hash" test
  pins, and the migrations/0013 aside embedded in one test's own title, are implementation/historical
  narrative rather than a domain fact this pass judges — the specification elsewhere treats a comparable
  hash mechanism as "the implementation's own engineering choice," so I did not raise either as a finding.
