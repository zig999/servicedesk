looked_past: >-
  the node's fitness criterion also calls for a caller over the limit on one route to be answered
  ordinarily on another route, which this file (scoped to simulate-case alone) does not exercise —
  that is a coverage question for another file/pass, not a domain-fact discrepancy in this one.
