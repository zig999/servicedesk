findings:
  - file: src/services/case-creation-form-schema.ts
    where: "isBlank (lines 39-41), applied by stillAbsentRequiredFields to every entry of REQUIRED_CASE_CREATION_FIELDS — slug, title, when_to_use, subject, fallback.outcome, fallback.referral.action, fallback.referral.recipient"
    evidence: |-
      function isBlank(value: string | undefined): boolean {
        return value === undefined || value.trim() === "";
      }
    cost: >-
      The specification never says whether a slug, title, when_to_use, subject or fallback
      value consisting only of whitespace counts as "absent" for the purpose of withholding
      create-draft's submission; this file now answers that for every required field of a case,
      so the next reader who wants to know what "absent" means for these fields will look at
      rules/knowledge/a-case-authoring-surface-offers-no-submission-while-required-content-is-absent
      and find nothing, because the decision lives only in this trim() call.
    kind: unstated
    correction: >-
      State, in rules/knowledge/a-case-authoring-surface-offers-no-submission-while-required-content-is-absent
      or its decision log entry, whether whitespace-only content is treated as absent for the
      case's required fields — the way rules/integration/a-draft-request-is-offered-only-over-a-named-connector-and-a-chosen-operation
      explicitly decided the same question for a Connector field's name.
    node: rules/knowledge/a-case-authoring-surface-offers-no-submission-while-required-content-is-absent

