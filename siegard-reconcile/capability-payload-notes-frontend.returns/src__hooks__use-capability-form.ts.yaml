findings:
  - file: src/hooks/use-capability-form.ts
    where: "SAVE_FAILURE_MESSAGE_BY_KIND, lines 43-52"
    evidence: |-
      const SAVE_FAILURE_MESSAGE_BY_KIND: Partial<Record<UiErrorStateKind, string>> = {
        "capability-not-read-only":
          "This capability's declared nature is not read-only; the registry only accepts read-only capabilities.",
        "incomplete-capability-contract":
          "This capability does not declare its contract completely; every field of its contract is required.",
        "capability-schema-not-well-formed":
          "The input schema or the output schema is not syntactically valid JSON.",
        "concept-already-answered":
          "Another capability already answers this concept; each concept resolves to exactly one capability.",
      };
    cost: >-
      domain/integration/capability-registry's own Responsibility names six distinct grounds on which
      the registry refuses a capability registration — not read-only, an incomplete contract, a schema
      that is not valid JSON, an input schema that does not hold a well-formed shape, a connector whose
      registered configuration already embeds an undeclared placeholder, and a concept another capability
      already answers — but this table gives a distinguishing message to only four of the six. A
      registration refused on either of the other two grounds falls through `?? GENERIC_SAVE_FAILURE_MESSAGE`
      via saveFailureMessage, the same text an operator sees for a refusal whose condition the surface does
      not recognise at all, so an operator told a named refusal answered their submission cannot tell it
      apart from one the surface never named.
    kind: contradicts
    node: rules/integration/a-submitted-registration-states-its-outcome-to-the-operator
    correction: >-
      add a distinguishing message for a refusal on the input schema's well-formed shape and for a refusal
      on an undeclared connector placeholder, so every condition register-capability can name is stated
      apart from the others and apart from an unrecognised refusal.
  - file: src/hooks/use-capability-form.ts
    where: "the mutationFn request body, lines 106-116"
    evidence: |-
      body: JSON.stringify({
        nature: values.nature,
        input_schema: getJsonTextareaMinifiedValue(inputSchemaValue),
        output_schema: getJsonTextareaMinifiedValue(outputSchemaValue),
        timeout: values.timeout,
        connector: values.connector,
        concept: values.concept,
        ...(form.formState.dirtyFields.payload_notes
          ? { payload_notes: values.payload_notes }
          : {}),
      }),
    cost: >-
      Every other attribute is sent from the form's current value regardless of whether the operator
      touched it, so an untouched field still carries forward what was loaded. payload_notes alone is
      singled out: it is included only when `dirtyFields.payload_notes` is true, even though
      `values.payload_notes` already holds the correct, previously-declared text when untouched. Since
      register-capability "replac[es] whatever already stood at that identity" (contracts/integration/capability-registry),
      an operator who edits an existing capability's timeout or connector without retyping its payload
      notes submits a write that omits payload_notes entirely, and the registered capability's
      previously-declared notes is silently gone — a rule about which loaded, unedited attribute may drop
      out of a resubmission that no node states, and that applies to this one attribute alone.
    kind: unstated
    node: domain/integration/capability
    correction: >-
      state, for the one optional attribute a registration may leave undeclared, whether an untouched but
      previously-loaded value participates in a resubmission the way every other declared attribute
      already does — and if so, send it unconditionally as the other fields are sent.
