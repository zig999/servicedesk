looked_past: "this file exercises the repository directly and never asserts the rule's own second clause — that removing one of a released revision's collects is accepted and left with no effect while every prior collect still reads back — nor does any test here construct that exact scenario; whether that sub-clause is proven anywhere is a coverage question, not a conformance one, so I did not report an absence. I also opened rules/knowledge/a-hypothesis-collects-at-least-one-concept because this file repeatedly calls insertHypothesisRevision with collects:[] and asserts success (e.g. lines 366-369, 385-386, 450-451), which reads like a contradiction of \"a revision that would collect none is refused\"; but that refusal is enforced only in case/revise-hypothesis.operation.ts (HypothesisRevisionCollectsNoConceptError), never in relational-case-store.repository.ts, so this repository-integration file is legitimately exercising a lower layer that carries no such refusal — not a misstatement of the rule."
