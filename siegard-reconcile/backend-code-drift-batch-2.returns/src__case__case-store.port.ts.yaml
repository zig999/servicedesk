findings:
  - file: src/case/case-store.port.ts
    where: "line 7, the HYPOTHESIS_REVISION_STATES constant"
    evidence: "export const HYPOTHESIS_REVISION_STATES = ['draft', 'released'] as const;"
    cost: >-
      This constant re-enumerates the hypothesis-revision lifecycle's two states as a standalone,
      independently-named runtime artifact. A reader who finds it (for validation, iteration, or
      building a schema) is reading a copy rather than domain/knowledge/hypothesis-revision-state,
      and if the node's enumeration ever gains a third state, nothing points back here —
      CaseVersionState right above it (line 5) needs no such array, so this one is the odd,
      driftable copy.
    kind: contradicts
    correction: >-
      Drop the standalone array and derive HypothesisRevisionState the way CaseVersionState is
      derived on line 5 — a literal union typed directly from the node's declared values — rather
      than declaring a second, independently-named list of the same values.
    node: domain/knowledge/hypothesis-revision-state
