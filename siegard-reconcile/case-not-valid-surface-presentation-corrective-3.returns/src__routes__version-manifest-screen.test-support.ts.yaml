read:
  - node: rules/knowledge/a-hypothesis-composition-stands-on-a-reading-whose-anchoring-version-does-not-read-back-as-a-case
    held_at: nowhere
    evidence: >-
      export const NEW_HYPOTHESIS_PATH = `${MANIFEST_ROUTE_PATH}/hypotheses/new`;
      — the file only wires a route path and a placeholder route
      (`component: () => createElement("div", null, "New Hypothesis Placeholder")`) for tests to
      navigate to; it states nothing about what a hypothesis-composition surface presents on a
      refused anchoring-version read.
  - node: rules/knowledge/a-hypothesis-composition-states-which-of-its-reads-did-not-complete
    held_at: nowhere
    evidence: >-
      export function sequentialGetHandler(responses: readonly unknown[]): FetchResponder — a
      generic response sequencer for GET calls; it carries no statement distinguishing a
      glossary/revisions read that did not complete from a case-version read that did not
      complete.
  - node: rules/knowledge/a-case-keyed-surface-states-a-current-version-that-does-not-read-back-as-a-case
    held_at: nowhere
    evidence: >-
      export const VERSION_PATH = `/v1/cases/${SLUG}/versions/${VERSION}`; — every fixture in
      this file is keyed on a case slug together with an explicit version number, never on a
      slug alone, so no construct here exercises a case-keyed (slug-only) surface's statement.
  - node: rules/knowledge/a-refusal-a-case-keyed-surface-cannot-name-is-presented-as-a-read-that-did-not-complete
    held_at: nowhere
    evidence: >-
      export function apiErrorResponse(code: string, status: number, message: string): Response
      { return jsonResponse({ error: { code, message } }, status); } — a generic wire-shaped
      error stub taking any code/status/message; it makes no distinction between a named
      presentation and an unrecognised refusal.
  - node: rules/knowledge/a-revise-reads-its-drafts-declared-subject-type-even-when-that-draft-does-not-read-back-as-a-case
    held_at: nowhere
    evidence: >-
      The file exposes putCallCount, deleteCallCount, getCallCount and parsedPutBody as generic
      call-counting/body-parsing helpers over fetchMock.mock.calls; none reads or asserts a
      case-version's declared subject_type or a concept-acceptance outcome.
  - node: rules/knowledge/a-case-listing-states-a-current-version-that-does-not-read-back-in-that-cases-entry-alone
    held_at: nowhere
    evidence: >-
      buildTestRouter registers only manifestRoute (`/cases/$slug/versions/$version/manifest`)
      and newHypothesisRoute; there is no route or fixture here for a listing of every case, so
      nothing states how one case's entry in a listing is told apart from the others.
  - node: domain/knowledge/case-summary
    held_at: nowhere
    evidence: >-
      No fixture in this file declares current_state, version_count, last_updated, title,
      when_to_use or released_version; the only case-shaped data are manifest fixtures such as
      ONE_ENTRY_MANIFEST = { manifest: [entry(1, "Solo", 1)] }.
  - node: domain/knowledge/case
    held_at: nowhere
    evidence: >-
      export const SLUG = "some-slug"; is a bare fixture string used to build request URLs; the
      file states no counter, no create-draft flow and no aggregate-root behaviour for a case.
  - node: rules/knowledge/a-version-keyed-surface-states-a-named-version-that-does-not-read-back-as-a-case
    held_at: nowhere
    evidence: >-
      export const VERSION_PATH = `/v1/cases/${SLUG}/versions/${VERSION}`; — the fixture names a
      slug-and-version identity for tests to request, but the file itself asserts no statement
      about what is presented when that version does not read back as a case; that assertion, if
      any, is left to the spec test that imports these helpers.
  - node: rules/knowledge/a-manifest-surface-offers-placing-a-hypothesis-on-every-reading-but-a-released-versions
    held_at: nowhere
    evidence: >-
      export const ONE_ENTRY_MANIFEST = { manifest: [entry(1, "Solo", 1)] }; and its siblings are
      static manifest fixtures; the file offers no place-hypothesis affordance and states no
      condition — released, draft, refused, or manifest-empty — under which one is or is not
      offered.
  - node: rules/knowledge/a-manifest-surface-names-the-composing-refusals-it-holds-a-presentation-for
    held_at: nowhere
    evidence: >-
      export function apiErrorResponse(code: string, status: number, message: string): Response
      — a generic stub taking any error code; it hard-codes neither
      ManifestPositionOccupiedError nor ManifestWouldHoldNoHypothesisError nor any wording for
      either.
  - node: rules/knowledge/a-presented-case-version-offers-a-route-to-its-own-manifest-on-every-reading
    held_at: nowhere
    evidence: >-
      export const MANIFEST_ROUTE_PATH = `/cases/${SLUG}/versions/${VERSION}/manifest`; is a
      routing constant for the test router; it names a path but states no condition — refused,
      pending, released or draft — under which the route is offered.
looked_past: >-
  The role labels the DOM helpers query for — "Remove" and "Cancel" on findRow/clickRemoveTrigger/dialogConfirmRemoveButton/dialogCancelButton, and the "New Hypothesis Placeholder" stub text — are wording and control choices every node in this set leaves to the interface, so I did not treat them as domain facts.
