findings:
  - file: src/__tests__/unit/http/simulate-hypothesis.controller.spec.ts
    where: "the test 'answers exactly evidence, evaluation and durations — no resolved, no assessment, no cost, no narrative and no ticket_ref field' (lines 103-115), together with completeRecord() (lines 49-71), whose fixture never assembles a cost field"
    evidence: |-
      expect(Object.keys(result).sort()).toEqual(['durations', 'evaluation', 'evidence']);
      expect(result).not.toHaveProperty('resolved');
      expect(result).not.toHaveProperty('assessment');
      expect(result).not.toHaveProperty('cost');
      expect(result).not.toHaveProperty('narrative');
      expect(result).not.toHaveProperty('ticket_ref');
    cost: >-
      A later reader debugging why a curator's simulation surface shows no run cost for a hypothesis
      simulation will find this test asserting that absence as correct, and will look no further —
      while the specification requires the run's own cost to travel in exactly this record, alongside
      durations, for a-simulation-session-retains-its-runs-and-shows-one to have anything to present.
    kind: contradicts
    correction: >-
      completeRecord() would need to include a cost fixture, and the assertions would need to expect
      cost among the result's keys instead of asserting its absence.
    node: rules/investigation/a-simulated-hypothesis-returns-the-runs-cost-and-durations
