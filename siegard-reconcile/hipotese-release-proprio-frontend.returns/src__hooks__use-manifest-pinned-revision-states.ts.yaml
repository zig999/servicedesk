findings:
  - file: src/hooks/use-manifest-pinned-revision-states.ts
    where: "the manifest.forEach block that computes each entry's state, lines 21-29"
    evidence: |-
      const pinned = result.data?.data.find(
        (item) => item.revision === entry.hypothesis_revision.revision,
      );
      if (pinned !== undefined) {
        states.set(entry.position, pinned.state);
      }
    cost: "hypothesisRevisionsQueryOptions is called with no offset or limit, so result.data.data is only the default first page of that hypothesis's revisions (constraints/listings-are-paged). When an entry's pinned revision is an older one that does not fall on that default page, .find returns undefined, states.set is never called for that entry's position, and the map this hook returns carries no state for it at all — exactly the silent, page-dependent gap the rule calls out as never permitted (\"the statement is unconditional ... it does not depend on ... the reader opening e's revision selector\"). Whatever surface consumes this map is left unable to distinguish \"still draft\" from \"not yet known,\" for a pin the curator has already placed."
    kind: contradicts
    correction: "resolve each entry's own pinned revision directly (e.g. request it by its own revision number, or keep paging the listing until it is found) instead of searching only the first, unpaged answer of hypothesisRevisionsQueryOptions, so the state is set for every entry regardless of which page the default query happened to return."
    node: rules/knowledge/a-presented-manifest-entry-states-its-pinned-revisions-state

looked_past: "the hook issues one parallel query per manifest entry via useQueries with no batching or dedup across repeated hypotheses — a performance/design shape, not a domain fact, and left for a code-quality pass rather than this one."
