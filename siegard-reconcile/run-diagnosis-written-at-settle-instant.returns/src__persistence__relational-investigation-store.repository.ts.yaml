    held_at: "written_at is absent from INVESTIGATION_INSERT_TEXT and is only ever read back from the row"
    evidence: "written_at: row.written_at.toISOString(),"
looked_past: "whether raising InvestigationAlreadyStoredError from the root insert genuinely implements an-investigation-is-written-once's \"settles rather than failing\" depends on how the caller (src/investigation/run-diagnosis.ts, outside this file) handles that specific error, which is that file's judgment, not this one's."
