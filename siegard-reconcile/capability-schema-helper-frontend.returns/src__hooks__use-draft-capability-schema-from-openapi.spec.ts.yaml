findings:
  - file: src/hooks/use-draft-capability-schema-from-openapi.spec.ts
    where: "UNRECOGNIZED_FAILURE_CASES (lines 213-223) and the it.each block asserting on it (lines 225-231)"
    evidence: |-
      {
        label: "the request failing outright with no answer at all (criterion 8's fallback; a dependency failing edge case)",
        handler: () => {
          throw new TypeError("network failure reaching this project's own backend");
        },
      },
      ...
      it.each(UNRECOGNIZED_FAILURE_CASES)("resolves $label to unrecognized-failure, distinct from drafted and the three named refusals", async ({ handler }) => {
        const { result } = await mountAndDispatch(handler, "unrecognized-failure");
        expect(result.current.outcome.kind).toBe("unrecognized-failure");
      });
    cost: >-
      The test fixes, as required hook behavior, that a request which never reached
      draft-capability-schema-from-openapi at all (the fetch to this project's own backend throwing,
      by the test's own description "no answer at all") is stated to the operator as the same
      refusal-shaped "unrecognized-failure" outcome that the node reserves for a request the
      operation did answer but with a code it does not recognise. A reader auditing this hook
      against the specification will find a passing test that requires exactly the invented refusal
      the node forbids, and nothing in the file distinguishes "the operation refused for an
      unrecognised reason" from "the operation was never reached" -- the two are folded into one
      outcome kind with no node authorizing that fold.
    kind: contradicts
    correction: >-
      Either give a request that never reaches the backend a distinct outcome that is not one of
      the refusal-shaped kinds a-refused-schema-draft-states-its-refusal-to-the-operator defines
      for an answered request, or have the specification decide that a client-side/network failure
      reaching this project's own backend is itself treated as an answer for this rule's purposes --
      and state that decision in a node, since no-schema-draft-refusal-is-stated-before-the-operation-answers
      does not currently say so.
    node: rules/integration/no-schema-draft-refusal-is-stated-before-the-operation-answers

read:
