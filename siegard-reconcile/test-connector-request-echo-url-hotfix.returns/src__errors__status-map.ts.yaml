looked_past: >-
  Every status/error-class pair in STATUS_BY_ERROR_CLASS was checked against
  knowledge/projections/full-text.md; every entry matches a node's stated status somewhere in
  the specification (several entries are governed by nodes outside this file's node set but were
  confirmed rather than reported, since they match); the first-match instanceof iteration order of
  the map and its type-safety shape are a code-review concern about the construct rather than a
  domain fact, and are not reported here.
