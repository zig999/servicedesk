    evidence: 'import { ApiError } from "./api-client"; import { uiStateForApiError } from "./error-ui-state"; — the file''s whole subject is error-code-to-UI-state mapping, nothing about an authentication posture or its disclosure'
  - node: contracts/knowledge/case-lifecycle
    held_at: nowhere
    evidence: "the tests exercise error codes by name only (e.g. new ApiError(\"CaseAlreadyHasDraftError\", ...)) and never call or assert against any of create-draft, revise-hypothesis, release-hypothesis, place-hypothesis, remove-hypothesis, update-draft, release or discard"
