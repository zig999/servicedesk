looked_past: >-
  ttl and elapsed_ms validate as z.number() rather than enforcing integer values (e.g. via
  z.number().int()), even though both nodes declare them as type integer; this is a
  validation-completeness/code-quality matter about how tightly the schema constrains input
  shape, not a stated domain fact, so it is left to a different pass.
