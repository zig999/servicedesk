looked_past: >-
  The literal 'draft'/'released' constants duplicated across DRAFT_STATE/RELEASED_STATE and
  HYPOTHESIS_REVISION_DRAFT_STATE/RELEASED_STATE, and resolveSourceVersion's silent acceptance of a
  caller-supplied source_version without checking it names an existing version, are implementation
  shape rather than an unheld domain fact and are left for a code review rather than reported here.
