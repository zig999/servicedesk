    held_at: the SOME_OK_EVIDENCE and mixedEvidence fixtures
    evidence: |-
      { concept: 'concept-one', result: 'ok', observation: 'an-observed-value', fields: [{ name: 'field-one', type: 'string', description: 'field-one description' }], concept_description: 'what concept-one means', capability_payload_notes: '', observed_at: '2024-01-01T00:00:00.000Z', ttl: 60 }
  - node: domain/investigation/citation
