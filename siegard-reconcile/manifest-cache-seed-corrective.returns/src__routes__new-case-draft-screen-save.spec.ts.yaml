findings:
  - file: src/routes/new-case-draft-screen-save.spec.ts
    where: "the first test, lines 27-60 (\"issues POST /v1/cases with slug, the curator's entered content and a client-side authored_at timestamp when Save is clicked\")"
    evidence: "const before = Date.now(); ... const authoredAtMillis = new Date(postedAuthoredAt(fetchMock)).getTime(); expect(authoredAtMillis).toBeGreaterThanOrEqual(before); expect(authoredAtMillis).toBeLessThanOrEqual(after);"
    cost: "The test fixes, as a fact of the system, that authored_at — the datetime the specification introduced specifically so a case version's curation history survives an audit of which procedure was current when an old investigation ran — is stamped by the curator's own browser clock at the moment Save is clicked, sent to the server as a value the server then trusts, rather than assigned by the server at the moment it persists the version. domain/knowledge/case-version says only that authored_at is a required datetime; a reader who goes there to learn whether the audited timestamp is trustworthy against a skewed or backdated client clock finds nothing, and the next person changing create-draft's payload has no node to check this choice against."
    kind: unstated
    node: domain/knowledge/case-version
    correction: "domain/knowledge/case-version (or the create-draft contract) would need to state whether authored_at is supplied by the curator's own client at submission or assigned by the server at persistence."

