looked_past: >-
  mutation.isSuccess (exposed as isSubmitSuccessful) is not reset by react-query when the
  operator edits a field after a successful save, so a stale "submitted" flag can sit beside a
  now-dirty form; whether that combination is misleading is a question for whichever component
  consumes isSubmitSuccessful together with isDirty, not settled by anything this file states on
  its own.
