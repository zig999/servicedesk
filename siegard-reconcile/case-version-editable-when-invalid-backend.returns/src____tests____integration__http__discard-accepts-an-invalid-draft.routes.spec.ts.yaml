  - node: constraints/a-malformed-request-is-refused-with-a-validation-error
    held_at: >-
      nowhere
    evidence: >-
      const response = await app.inject({ method: 'DELETE', url: `/v1/cases/${slug}/versions/${discardedVersion}` });
      — the sole request sent is well-formed, naming a real slug and a real, freshly-created
