looked_past: "the discriminated union repeats hypothesis/citations/usage/elapsed_ms/prompt identically across all three verdict branches, and several fields typed integer in the specification (cost's calls/input_tokens/output_tokens, durations, usage) are validated with z.number() rather than an integer check throughout the file — both are schema-construction concerns rather than a stated fact or rule being contradicted, so I left them unreported; likewise, whether an inconclusive evaluation's no-data reason must carry a citation of the non-ok evidence (rules/investigation/an-inconclusive-evaluation-declares-its-reason) is a judgment stage's construction, not this response schema's, since that rule binds to src/investigation/judgment-stage.ts."

