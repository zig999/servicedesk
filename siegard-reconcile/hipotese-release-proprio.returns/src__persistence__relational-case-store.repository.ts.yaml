    held_at: DRAFT_STATE/RELEASED_STATE constants and isCaseVersionState
    evidence: "function isCaseVersionState(value: string): value is CaseVersionState {\n  return value === DRAFT_STATE || value === RELEASED_STATE;\n}"

  - node: domain/knowledge/hypothesis
    held_at: hypothesisIdentityStatement / insertRevisionRow
    evidence: "INSERT INTO ${HYPOTHESES_TABLE} (case_slug, name) VALUES ($1, $2) ON CONFLICT (case_slug, name) DO NOTHING"

