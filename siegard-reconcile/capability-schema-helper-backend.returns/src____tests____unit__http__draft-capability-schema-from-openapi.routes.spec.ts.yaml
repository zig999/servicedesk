looked_past: >-
  The it block reading capability-schema-draft-generation.ts's own source to assert it imports
  readOpenApiOperation and avoids JSON.parse/js-yaml directly is a duplication/architecture check
  on implementation structure, not a domain fact, and is left to a different judgment.
