looked_past: >-
  The zod schema's slug: z.string().min(1) and the isBlank/trim() check disagree on whether a
  single-space slug is valid (min(1) passes it, isBlank rejects it) — a mismatch between the two
  validation paths in this file, not a domain-fact question, so it is left for a different pass.

