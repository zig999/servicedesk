read:
  - node: contracts/knowledge/capability-check
    held_at: "capabilityViolations, the await capabilities.readCapability call per concept"
    evidence: "violations.push(...answerGaps(name, await capabilities.readCapability(name)));"
  - node: contracts/knowledge/vocabulary-terms
    held_at: "vocabularyViolations' glossary.readVocabularyTerm call and conceptViolations' glossary.readConcept call"
    evidence: |-
      const resolution = await glossary.readVocabularyTerm(vocabulary, name);
      const resolution = await glossary.readConcept(name);
  - node: contracts/system/case-authoring
    held_at: "caseCoherenceViolations combining every check into one list before validateCaseCoherence throws once"
    evidence: |-
      return [...(await glossaryCoherenceViolations(theCase, glossary)), ...(await capabilityViolations(theCase, capabilities))];
      const violations = await caseCoherenceViolations(theCase, glossary, capabilities);
      if (violations.length > 0) { throw new IncoherentCaseError(theCase.slug, violations); }
  - node: domain/knowledge/case
    held_at: "the throw in validateCaseCoherence, line 52"
    evidence: "throw new IncoherentCaseError(theCase.slug, violations);"
  - node: domain/knowledge/case-version
    held_at: "namedVocabularyTerms reading theCase.subject and declaredResolutions reading theCase.fallback"
    evidence: |-
      { vocabulary: 'subject-type', name: theCase.subject },
      return [...theCase.hypotheses.map((hypothesis) => hypothesis.resolution), theCase.fallback];
  - node: domain/knowledge/hypothesis
