looked_past: >-
  The file asserts only status codes and the Retry-After header for the 429 case — it never
  asserts the response body's RATE_LIMIT_EXCEEDED code, message or details.retryAfterSeconds, and
  it never advances fake time to exercise the sliding window's own reset-after-60-seconds behavior;
  both are coverage gaps rather than a stated fact disagreeing with the specification, so they are
  left to whichever pass judges test completeness. Separately, this file's own domain fact (10
  requests/minute per caller, 429, Retry-After: 60) is governed by
  constraints/the-diagnosis-and-simulation-routes-are-rate-limited, outside this delegation's node
  set and candidate index (found by a specification-root search); the test matches that node's
  statement exactly, so no contradiction results.
