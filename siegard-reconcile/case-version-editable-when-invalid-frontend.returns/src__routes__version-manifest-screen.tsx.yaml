      the guards derived from the version's own state and manifest, e.g. `const rowsDisabled
      = state.isBlocked || state.isBusy || state.isReleased;` and `{!state.isReleased &&
      placingControl}`
    evidence: "const rowsDisabled = state.isBlocked || state.isBusy || state.isReleased;"
  - node: domain/knowledge/hypothesis
