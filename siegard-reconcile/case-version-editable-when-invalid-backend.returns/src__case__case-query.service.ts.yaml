looked_past: >-
  attributesOf, trustedCaseOf and assembledAsRawDocument each repeat the same
  consolidation_register/released_at optional-spread pattern over the same assembled
  record; whether that repetition should be collapsed is a code-quality question, not a
  conformance one, so it is not reported as a finding here.
