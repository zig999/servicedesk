    held_at: raiseCreateDraftFailure
    evidence: "return (cause) => (isConstraintViolation(cause, ONE_DRAFT_PER_CASE_CONSTRAINT) ? new CaseAlreadyHasDraftError(slug) : raiseWriteFailure(cause));"

  - node: rules/knowledge/a-case-listing-answers-cases-in-slug-order
    held_at: casesPageSelect
    evidence: "FROM (SELECT slug FROM ${CASES_TABLE} ORDER BY slug LIMIT $1 OFFSET $2) c ... ORDER BY c.slug"

  - node: rules/knowledge/a-case-summary-is-derived-from-its-existing-versions
    held_at: casesPageSelect's latest/released subqueries
    evidence: "SELECT DISTINCT ON (slug) slug, state, authored_at,\n                    COUNT(*) OVER (PARTITION BY slug) AS version_count\n             FROM ${CASE_VERSIONS_TABLE}\n             ORDER BY slug, version DESC"

  - node: rules/knowledge/a-case-version-is-written-once
    held_at: refuseUnlessDraft guarding insertManifestEntry, deleteManifestEntry and updateDraftVersion
    evidence: "function refuseUnlessDraft(key: ICaseVersionKey, state: CaseVersionState): void {\n  if (state !== DRAFT_STATE) {\n    throw new CaseVersionNotDraftError(key.slug, key.version, state);\n  }\n}"

