findings:
  - file: src/investigation/run-diagnosis.ts
    where: "the throw in writeWithinDeadline, line 89, reusing stageBoundMs"
    evidence: |-
      const stageBoundMs = persistenceStageBoundMs(now, deadline, elapsedBeforePersistenceMs);
      const settled = stageBoundMs > 0 && (await persistWithinBound(store, investigation, stageBoundMs));
      if (!settled) {
        throw new InvestigationWriteDeadlineExceededError(investigation.id, stageBoundMs);
      }
    cost: >-
      The node requires remainingMs to be the milliseconds that remained of the declared
      deadline when persistence gave up. stageBoundMs is instead the bound persistence was
      granted at entry, fixed before any write attempt runs. A requester who meets this refusal
      is told a number that is never the actual deadline slack left when persistence stopped
      trying — sometimes overstating it as nonzero when in fact none was left.
    kind: contradicts
    correction: >-
      Compute the milliseconds actually remaining of the declared deadline at the instant
      persistence gives up and pass that value — not the pre-computed stageBoundMs — as the
      error's remainingMs.
    node: rules/investigation/no-stage-aborts-on-its-deadline
