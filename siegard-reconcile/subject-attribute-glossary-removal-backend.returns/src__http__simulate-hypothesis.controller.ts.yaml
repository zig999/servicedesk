    where: "the module-level constant TOTAL_DEADLINE_BUDGET_MS and its use in the deadline field passed to runSimulateHypothesis"
    evidence: |-
      const TOTAL_DEADLINE_BUDGET_MS = 20_000;
      deadline: now + TOTAL_DEADLINE_BUDGET_MS,
    cost: >-
      rules/investigation/an-answer-arrives-within-the-declared-deadline is scoped explicitly to
      "a diagnosis" and includes writing/persistence stages simulate-hypothesis never runs. This
      controller nonetheless binds simulate-hypothesis to the same 20,000ms ceiling with no node
      naming that figure for this operation.
    kind: unstated
    correction: >-
      Add a node (or extend an existing one) stating simulate-hypothesis's own total deadline
      budget explicitly, with a decision-log entry disclosing the value.
