looked_past: >-
  The describe-block names reference a task's own criterion numbering and an "UNDERDETERMINED
  entry" from planning, and one test locates its target list by scanning every rendered list for
  one containing the statement text rather than a stable locator — both are test-construction
  choices, not domain facts, and are left to whichever pass reviews test quality rather than
  conformance.
