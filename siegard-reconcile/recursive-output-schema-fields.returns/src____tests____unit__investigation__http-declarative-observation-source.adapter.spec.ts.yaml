findings:
  - file: src/__tests__/unit/investigation/http-declarative-observation-source.adapter.spec.ts
    where: "lines 150-173, the 'imports no HTTP client package' and 'defaults its own HTTP client to the platform global fetch' tests"
    evidence: |-
      const forbidden = ['axios', 'node-fetch', 'got', 'undici', 'superagent', 'request'];
      const offenders = forbidden.filter((name) => source.includes(`'${name}'`) || source.includes(`"${name}"`));

      expect(offenders).toEqual([]);
    cost: >-
      The adapter's binding to the platform's own global fetch, and the specific ban on axios,
      node-fetch, got, undici, superagent and request, lives only in this test. A reader of the
      specification looking for what HTTP transport the observe-concept adapter may depend on
      finds nothing — none of `contracts/integration/concept-observation`,
      `rules/integration/an-http-connector-configuration-declares-its-call` or
      `constraints/the-domain-depends-on-no-infrastructure` (which binds the domain layer, not
      this infrastructure adapter) states it — so a future change introducing one of these
      packages would violate only this test file, never a documented rule.
    kind: unstated
    correction: >-
      State, in a node scoping this adapter's own infrastructure boundary (the way
      `constraints/the-domain-depends-on-no-infrastructure` states the domain layer's), that the
      HTTP connector adapter reaches the network only through the platform's own fetch and depends
      on no HTTP client package.
  - file: src/__tests__/unit/investigation/http-declarative-observation-source.adapter.spec.ts
    where: "lines 828-852, the two request-body-serialization tests"
    evidence: |-
      expect(httpClient.mock.calls[0]?.[1]?.body).toBe(JSON.stringify({ subjectId: 'a-subject-id' }));
    cost: >-
      How the connector call's own resolved body reaches the wire — a non-string resolved body is
      JSON-encoded, an already-string one is sent verbatim without double-encoding — is asserted
      only here. `rules/integration/an-http-connector-configuration-declares-its-call` states the
      body may be "of any shape" with placeholders substituted as plain text, but is silent on the
      wire encoding once that substitution resolves; `rules/investigation/an-observation-is-recorded-as-json-object-text`
      states the symmetric rule for the read side (the evidence's own observation) but nothing
      states it for the outbound call, so this encoding rule lives only in code a test happens to
      pin down.
    kind: unstated
    correction: >-
      State, beside `rules/integration/an-http-connector-configuration-declares-its-call`, how a
      resolved request body is placed on the wire — JSON-encoded when not already a string, sent
      verbatim when it is.
