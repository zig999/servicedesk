findings:
  - file: src/investigation/citation-validation.ts
    where: "citesADeclaredField, lines 26-32"
    evidence: |-
      function citesADeclaredField(context: HypothesisCitationContext, citation: Citation): boolean {
        const citedEvidence = context.evidence.find((item) => item.concept === citation.concept);
        if (citedEvidence === undefined) {
          return false;
        }
        return citedEvidence.fields.some((field) => field.name === citation.field);
      }
    cost: >-
      The invariant scopes the field check to citations that carry a field ("where the citation
      carries one") and states explicitly that a no-data verdict's citation carries none, since
      the evidence it cites snapshotted no fields at all. This function applies
      `fields.some((field) => field.name === citation.field)` unconditionally: when
      `citation.field` is `undefined` (the no-data case) and `citedEvidence.fields` is `[]` (the
      same case), `.some(...)` is false on both counts, so `isCitationValid` — and therefore
      `acceptedCitations` — rejects a citation the specification says is legitimately fieldless.
      A caller filtering a hypothesis's citations through this module would silently drop every
      no-data citation, and the next reader chasing the loss would look at the containment rule
      rather than at this unconditional equality check.
    kind: contradicts
    node: rules/investigation/a-cited-field-exists-in-the-capability-output-schema
    correction: >-
      Guard the field check on `citation.field` being present — e.g. return `true` (no field to
      validate) when `citation.field === undefined`, and only run `fields.some(...)` when it is
      defined — so a fieldless no-data citation is not rejected by this function.
