read:
  - node: constraints/a-domain-error-unmapped-by-status-is-refused-generically
    held_at: >-
      the fallback path of statusForError — the for-loop over STATUS_BY_ERROR_CLASS finding no
      matching class and falling through to the final return, which signals "unnamed" to
      whatever turns that signal into the fixed HTTP 500 INTERNAL_ERROR answer; the fixed message
      text and error code themselves are not constructed in this file.
    evidence: |-
      for (const [errorClass, status] of STATUS_BY_ERROR_CLASS) {
          if (error instanceof errorClass) {
            return status;
          }
        }
        return undefined;
