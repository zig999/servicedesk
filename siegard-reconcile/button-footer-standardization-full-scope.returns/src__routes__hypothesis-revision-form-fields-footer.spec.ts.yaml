looked_past: The file asserts UI structure this specification consistently reserves to the interface — an accessible group's role/name "Actions", the literal button labels "Save hypothesis" and "Cancel", and the trailingActions prop shape — none of which is a domain fact any node here states or denies, so no finding is raised over them; whether that structure itself is good practice is the standard-conformance pass's question, not this one's.
