    held_at: "the assertion in \"answers exactly one evaluation per required hypothesis, in the case's declared order, none omitted or duplicated\""
    evidence: "expect(result.map((evaluation) => evaluation.hypothesis)).toEqual(['hyp-no-data', 'hyp-decided', 'hyp-inconclusive']);"
