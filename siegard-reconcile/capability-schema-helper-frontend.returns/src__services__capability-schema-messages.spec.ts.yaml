findings:
  - file: src/services/capability-schema-messages.spec.ts
    where: "lines 8 and 13, the `outsideVocabulary` case"
    evidence: |-
      const outsideVocabulary = capabilitySchemaDraftUnresolvedReasonMessage("some-future-reason");
      ...
      expect(outsideVocabulary).toBe("some-future-reason");
    cost: >-
      The test fixes what an operator sees when draft-capability-schema-from-openapi names an
      unresolved-item reason outside the two-value closed enumeration schema-not-reducible-to-a-type /
      name-claimed-by-another-parameter: the raw enumeration string is echoed back verbatim, unlabeled.
      No node decides this. The specification does have a stated convention for a value outside a
      vocabulary the surface must present — "a refusal whose condition the surface does not recognise
      is stated as exactly that" (the pattern rules/integration/a-refused-schema-draft-states-its-refusal-to-the-operator
      also applies to refusal conditions) — but nothing extends or excludes that convention here, so
      whether echoing the raw value or stating it as unrecognised is correct for this vocabulary is a
      decision this test makes on its own, and the next person who extends the enumeration has nowhere
      in the specification to check it against.
    kind: unstated
    correction: >-
      Add to domain/integration/capability-schema-draft-unresolved-reason, or a new rule constraining
      it, a statement of what a surface displays for an unresolved-item reason outside the two named
      values — echoed raw, as this test fixes, or stated as unrecognised the way an unmatched refusal
      condition already is elsewhere in this specification.
