findings:
  - file: src/routes/case-version-editor-screen-refused-draft-discard.spec.ts
    where: "the comment above notValidDraftHandlers, lines 43-46"
    evidence: >-
      the versions listing reports this same version's own state (the
      gate the discard offer turns on)
    cost: >-
      the discard-offer's own condition — that it turns on the version's state alone,
      per only-a-draft-case-version-may-be-discarded — is restated here in prose next
      to the fixture rather than left to the node; if the node's condition ever changes,
      this comment can go on saying what it used to say, and a reader who trusts the
      comment instead of opening the node never notices the two have parted ways.
    kind: contradicts
    correction: >-
      drop the parenthetical explaining why the versions listing matters; describe only
      what the fixture returns, not the rule that reads it
    node: rules/knowledge/a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
