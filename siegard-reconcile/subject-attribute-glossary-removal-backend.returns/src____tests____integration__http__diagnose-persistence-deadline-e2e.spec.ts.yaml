    where: the title string of the third `it()` block, lines 472-476
    evidence: >-
      "declares TOTAL_DEADLINE_BUDGET_MS, the total deadline this file injects into the diagnose runner, equal to " +
        "rules/investigation/an-answer-arrives-within-the-declared-deadline's own declared total of 20000ms " +
        '(2000 overhead/margin + 7000 collection + 5000 judgment + 4000 writing + 2000 persistence), never a locally ' +
        'chosen figure that diverges from it'
    cost: >-
      The only assertion this test makes is `expect(declared).toBe(20_000)` — it never reads back or checks the
      per-stage split. If the specification's own breakdown of the twenty-second budget changes, this title keeps
      stating the old split as fact and nothing here would catch the drift; a reader who trusts this title for the
      breakdown reads a business decision that may no longer be the one the node holds.
    kind: contradicts
    correction: >-
      Drop the parenthetical breakdown from the title (or state it without the specific numbers), leaving the
      title tied only to the figure the test actually verifies — the 20000ms total.
    node: rules/investigation/an-answer-arrives-within-the-declared-deadline
