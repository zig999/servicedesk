looked_past: >-
  The test at lines 809-813 asserting that the exported asHttpConnectorCallConfiguration throws
  unwrapped for a caller that narrows a configuration directly is an internal API-shape assertion
  with no domain content, and the it()-title citations of scenario names (e.g. "exactly as the
  response-map-key-names-nothing scenario states") are test-naming style rather than a domain fact
  or a comment on production code, so neither is reported here.
