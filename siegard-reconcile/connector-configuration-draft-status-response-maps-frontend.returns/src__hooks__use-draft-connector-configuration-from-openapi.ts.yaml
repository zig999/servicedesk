findings:
  - file: src/hooks/use-draft-connector-configuration-from-openapi.ts
    where: the isDispatchingRef guard inside requestDraft, lines 211-218
    evidence: |-
      const requestDraft = (request: DraftConnectorConfigurationFromOpenApiRequest): void => {
          if (isDispatchingRef.current) {
            return;
          }
          isDispatchingRef.current = true;

          mutation.reset();
    cost: >-
      An operator who invokes requestDraft again while an earlier draft request for this same
      helper is still outstanding has the second request silently dropped: no call reaches the
      backend, isDispatchingRef.current stays true until the first call's onSettled fires, and
      nothing in the returned outcome or statedFor changes to tell the operator their second
      click did nothing. The node this file otherwise implements says only that what a surface
      states while a draft request is outstanding "is not decided here" — so the choice to drop
      rather than queue, replace or refuse a repeated request was made here, in code, and the
      specification is silent on it.
    kind: unstated
    correction: >-
      Decide, in the specification, what a repeated draft request does while an earlier one for
      the same connector/operation is still outstanding — dropped, queued, or refused — and let
      this guard follow that decision rather than stand as the only place it is made.
