certified:
  - node: constraints/the-pool-bounds-are-positive-integers
    state: covered
    tests:
      - file: src/__tests__/unit/config/env.spec.ts
        name: >-
          $description for $field
      - file: src/__tests__/unit/config/env.spec.ts
        name: >-
          throws InvalidEnvironmentError naming the field when a pool variable is set to a non-numeric value
      - file: src/__tests__/unit/config/env.spec.ts
        name: >-
          defaults each of the three pool variables to a positive integer when the existing required-variable fixture names none of them
      - file: src/__tests__/unit/config/env.spec.ts
        name: >-
          parses a configured value for each of the three pool variables as a number, distinct from their defaults
      - file: src/__tests__/unit/index.spec.ts
        name: >-
          fails startup and binds no listener when $field names $description
      - file: src/__tests__/unit/index.spec.ts
        name: >-
          creates the server and binds a listener at the configured PORT when every pool bound is valid
