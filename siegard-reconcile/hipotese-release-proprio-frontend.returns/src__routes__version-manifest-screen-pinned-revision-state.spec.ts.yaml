    where: "lines 117-136, describe/it block \"the state statement when the pin is absent from the answered page (this task's own inference)\""
    evidence: |
      expect(within(findRow("H1")).queryByText("Draft")).toBeNull();
      expect(within(findRow("H1")).queryByText("Released")).toBeNull();
    cost: "The test fixes, as the correct behavior a suite will keep green, that a manifest entry shows no draft-or-released statement at all whenever the pinned hypothesis-revision is not on the page the revisions listing happened to answer — even though the entry's own pinned revision number (2) is still shown (line 132). The test's own title admits this is \"this task's own inference,\" so a future reader who checks the specification for what an entry says when its pin falls outside the fetched page finds nothing there, while the source and its suite already answer it — the same silence rules/knowledge/a-manifest-entrys-pinned-revision-is-always-shown closed for the pinned revision's own reference is left open here for the revision's state."
    kind: unstated
    correction: "Decide, into the specification (e.g. by extending rules/knowledge/a-presented-manifest-entry-states-its-pinned-revisions-state or a sibling node) what a presented entry states about its pinned revision's state when the revisions-listing page fetched does not carry that revision, then bring this test in line with what is decided."
