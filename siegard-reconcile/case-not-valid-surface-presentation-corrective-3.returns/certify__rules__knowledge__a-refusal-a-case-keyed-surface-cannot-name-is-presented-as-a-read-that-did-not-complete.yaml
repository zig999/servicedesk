certified:
  - node: rules/knowledge/a-refusal-a-case-keyed-surface-cannot-name-is-presented-as-a-read-that-did-not-complete
    state: partial
    tests:
      - file: src/routes/case-version-editor-screen-not-valid.spec.ts
        name: >-
          renders only the fixed read-did-not-complete statement, never the not-valid statement,
          the refusal's own error code, its own message, or any attribute the refusal carries,
          when the version's own read fails with a code the screen holds no presentation of its
          own for
      - file: src/routes/case-version-editor-screen-not-valid.spec.ts
        name: >-
          renders only the read-did-not-complete statement, never an attribute of the version left
          over in the query cache from an earlier successful read, once a later reading of the same
          version fails with a code the screen holds no presentation of its own for
      - file: src/routes/version-manifest-screen-not-valid.spec.ts
        name: >-
          renders only the fixed read-did-not-complete statement, never the not-valid statement,
          the refusal's own error code, its own message, or any value it carries, when the
          version's own read fails with a code the screen holds no presentation of its own for
      - file: src/routes/version-manifest-screen-not-valid.spec.ts
        name: >-
          renders the + Add hypothesis link while the read is pending, once it has failed to
          complete, once it has been refused for validation, once it has answered a draft version
          with entries and once with none, and withholds it only once it has answered a version
          released
      - file: src/routes/hypothesis-revision-screen-case-not-valid.spec.ts
        name: >-
          renders the same read-did-not-complete statement an unrelated failed read renders, and
          discloses neither the refusal's own error code, its own message, nor any value it carries
    why: >-
      On all three surfaces a refusal carrying an unrecognised code is exercised, and the tests
      would fail if the surface disclosed the code, the refusal's own message, a value the refusal
      carries, or the not-read-back-as-a-case statement in place of the read-did-not-complete one.
      Two stated parts are left short. First, the statement being the same one the surface makes
      for any read of that case that did not complete, indistinguishable from it: only
      hypothesis-revision-screen-case-not-valid.spec.ts puts the two readings side by side and
      asserts one text for both; version-manifest-screen-not-valid.spec.ts reaches the same text
      for a transport failure only incidentally, inside the add-hypothesis test, on the way to
      asserting the link; and case-version-editor-screen-not-valid.spec.ts never exercises a read
      of the version that did not complete at all — both of its failing readings carry the
      unrecognised code — so the editor could begin stating one thing for an unnamed refusal and
      another for a read that did not complete and every named test would still pass. Second, "no
      attribute of c or of any version of c": each surface excludes only the attributes the refusal
      itself carries in its payload, and an attribute reaching the statement from elsewhere is
      excluded only on the version editor, whose cached-payload test seeds the case-version key
      before the unrecognised refusal. Nothing in the manifest or hypothesis-composition proof
      seeds that key before an unrecognised refusal, so a manifest table or version attribute left
      from an earlier successful read rendered beside the read-did-not-complete notice would break
      the fact on those two surfaces without failing any named test — their cache-seeding tests sit
      on the not-read-back-as-a-case branch, which is a different node's statement.
    remainder: testable
    remainder_why: >-
      Two assertions close it. For the version editor: one input — a read of the version that did
      not complete, a transport failure rather than a refusal — against the result that the screen
      states exactly the text it states for a refusal whose code it holds no presentation for, the
      two readings asserted in one test as the hypothesis-composition proof already does. For the
      manifest screen and the hypothesis-composition screen: one input — the case-version query key
      seeded with a manifest and version attributes from an earlier successful read, then that same
      read refused with a code the screen holds no presentation for — against the result that the
      screen states only the read-did-not-complete statement, with no seeded manifest entry and no
      seeded attribute of the case or of its version present.
