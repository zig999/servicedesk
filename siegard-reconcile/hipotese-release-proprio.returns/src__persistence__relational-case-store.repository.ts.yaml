    evidence: "UPDATE ${CASE_VERSIONS_TABLE} SET state = $3, released_at = NOW() WHERE slug = $1 AND version = $2"

  - node: rules/knowledge/a-case-version-number-is-never-reused
    held_at: assignNextVersion
    evidence: "UPDATE ${CASES_TABLE} SET next_version = next_version + 1\n           WHERE slug = $1\n           RETURNING next_version - 1 AS version"

