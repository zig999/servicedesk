  - node: constraints/a-domain-error-unmapped-by-status-is-refused-generically
    held_at: nowhere
    evidence: &class_surface |-
      export class RelationalInvestigationStore implements IInvestigationStore {
        public constructor(private readonly connection: IConnectableQueryable) {}

        public async write(investigation: Investigation): Promise<void> {
          await runInTransaction(this.connection, raiseWriteFailure, (tx) => writeWholeInvestigation(tx, investigation));
        }

        public async read(id: string): Promise<StoredInvestigation | undefined> {
          return runInTransaction(this.connection, raiseReadFailure, (tx) => readWholeInvestigation(tx, id));
        }

        public async isCapabilityNamedByEvidence(name: string, version: string): Promise<boolean> {
          const row = await queryOneOrAbsent(
            this.connection,
            {
              text: `SELECT 1 FROM ${INVESTIGATION_EVIDENCE_TABLE} WHERE capability_name = $1 AND capability_version = $2 LIMIT 1`,
              params: [name, version],
            },
            raiseReadFailure,
          );
          return row !== undefined;
        }

        public async isConceptNamedByEvidence(concept: string): Promise<boolean> {
          const row = await queryOneOrAbsent(
            this.connection,
            {
              text: `SELECT 1 FROM ${INVESTIGATION_EVIDENCE_TABLE} WHERE concept = $1 LIMIT 1`,
              params: [concept],
            },
            raiseReadFailure,
          );
          return row !== undefined;
        }

        public async isConceptNamedByCitation(concept: string): Promise<boolean> {
          const row = await queryOneOrAbsent(
            this.connection,
            {
              text: `SELECT 1 FROM ${INVESTIGATION_EVALUATION_CITATIONS_TABLE} WHERE concept = $1 LIMIT 1`,
              params: [concept],
            },
            raiseReadFailure,
          );
          return row !== undefined;
        }
      }
