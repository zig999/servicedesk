findings:
  - file: src/routes/capability-form-fields.tsx
    where: the help paragraph beneath the Output schema field, lines 183–186
    evidence: >-
      Para cada campo em <code>properties</code>, a plataforma lê seu próprio{" "}
      <code>type</code> e <code>description</code> como o significado declarado
      desse campo — nenhum outro conteúdo deste schema é lido ou validado.
    cost: >-
      Which two attributes of a properties entry are read as a field's declared meaning, and
      that nothing else in the output schema is read or validated, is domain/investigation/field-semantics'
      own statement; it now also lives, translated, as hardcoded copy inside this form component.
      If that node is ever amended — a third attribute read, or the "no other content" boundary
      narrowed or widened — nothing rebinds this paragraph, and every operator who opens this
      screen keeps being told the rule as it stood before the change.
    kind: contradicts
    correction: >-
      Remove this restatement of field-semantics from the component (or replace it with a
      pointer to documentation rather than the rule's own words), leaving the fact held only by
      domain/investigation/field-semantics.
    node: domain/investigation/field-semantics
  - file: src/routes/capability-form-fields.tsx
    where: the same help paragraph, lines 186–190
    evidence: >-
      Uma description declara o que um valor significa (&quot;2 = suspenso por
      inadimplência&quot;), nunca uma decisão (&quot;quando 2, confirme a
      hipótese&quot;).
    cost: >-
      rules/glossary/a-description-states-meaning-never-policy states this same distinction with
      this same worked example ("2 = suspended for delinquency" / "when 2, confirm the
      financial-block hypothesis"); the component now carries a translated copy of both the
      policy and its example. A later change to the node's own wording or example leaves this
      paragraph exactly as it is, so the two can read apart from the day the node is next edited,
      with the UI still teaching the retired version.
    kind: contradicts
    correction: >-
      Drop the restated policy and example from the component; if operator-facing guidance is
      wanted at all, phrase it without repeating the node's own words or example.
    node: rules/glossary/a-description-states-meaning-never-policy
