findings:
  - file: src/routes/capability-form-fields-schema-apply.spec.ts
    where: the comment above the second "Solicitar rascunho de schema" dispatch in the first `it` block (lines 134-137)
    evidence: |-
      // requesting again from the same chosen operation resolves this time to a refusal (one
      // representative of the four -- the mechanism does not vary by which of the four fires,
      // since none of them ever renders the section that offers Apply)
      fireEvent.click(screen.getByRole("button", { name: "Solicitar rascunho de schema" }));
      await screen.findByRole("alert");
    cost: >-
      The comment asserts, as an already-settled fact, that no refusal ever renders the
      Apply section -- exactly what a-refused-schema-draft-states-its-refusal-to-the-operator
      requires ("no input_schema, no output_schema and no unresolved item stands beside that
      refusal") -- but the code that follows only awaits a generic `alert` role and checks the
      two field values; it never queries for the "Aplicar" buttons to confirm none render. A
      regression that kept an Apply button visible after a refusal would pass this test
      unnoticed, leaving the comment as the only place this guarantee is recorded.
    kind: contradicts
    correction: >-
      Replace or supplement the comment's claim with an assertion, e.g.
      `expect(screen.queryAllByRole("button", { name: "Aplicar" })).toHaveLength(0)`
      immediately after the refusal, so the fact the node states is checked by code rather
      than asserted only in prose.
    node: rules/integration/a-refused-schema-draft-states-its-refusal-to-the-operator

