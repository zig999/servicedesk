  - node: rules/integration/a-malformed-or-unsupported-openapi-document-refuses-the-schema-draft
    held_at: >-
      the readableErrorThrownBy tests, lines 30-77
    evidence: >-
      "const error = readableErrorThrownBy(() => readOpenApiOperation(documentText, '/widgets', 'GET'));"
      thrown for swagger 2.0, an unsupported declared version, unparseable text, empty text, a
      YAML syntax error and a document declaring no version — each raising
      OpenApiDocumentNotReadableError as the rule requires.
  - node: rules/integration/an-openapi-document-declaring-no-such-operation-refuses-the-schema-draft
    held_at: >-
      lines 79-93
    evidence: >-
      "const error = operationNotFoundThrownBy(() => readOpenApiOperation(documentText, '/absent', 'GET'));
      expect(error.context).toEqual({ path: '/absent', method: 'GET' });" and the DELETE-method
      variant at lines 87-93 — both name the path and method exactly as the rule requires.
  - node: rules/integration/a-schema-draft-refusal-distinguishes-a-fetch-failure-from-an-unreadable-document
    held_at: nowhere
    evidence: >-
      The distinctness test at lines 95-102 compares OpenApiDocumentNotReadableError against
      OpenApiOperationNotFoundError, not against OpenApiDocumentNotFetchedError — the pairing
      this node states — and OpenApiDocumentNotFetchedError never appears in the file.
  - node: constraints/a-domain-error-unmapped-by-status-is-refused-generically
    held_at: nowhere
    evidence: >-
      No unmapped domain error or HTTP 500/INTERNAL_ERROR response is exercised in the file.
looked_past: >-
  The exact internal shape of OpenApiDocumentNotReadableError's own context (the `kind` values
  unsupported-version/unparseable/no-version-declared, and the literal detail text) is an
  internal representation the reader throws; whether the HTTP-facing disclosure built from it
  narrows down to "the link and nothing else of the document" as
  a-schema-draft-refusal-distinguishes-a-fetch-failure-from-an-unreadable-document requires is a
  question for the route/controller file that maps this error to a response, not for this reader
  spec.
