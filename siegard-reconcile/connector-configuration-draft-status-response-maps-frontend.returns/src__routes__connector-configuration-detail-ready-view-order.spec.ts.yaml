looked_past: >-
  The file asserts a purely structural/layout fact — that the "Test" heading renders outside the
  "Actions" group — which every node in this set that speaks to surface presentation explicitly
  leaves to "the interface's own"; no node in the set or reachable from it governs footer/heading
  arrangement, so this is a surface-arrangement test outside this pass's domain-fact judgment
  rather than a gap in the specification.
