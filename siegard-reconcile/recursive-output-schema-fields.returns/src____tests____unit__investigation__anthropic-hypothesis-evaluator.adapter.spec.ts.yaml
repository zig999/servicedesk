looked_past: >-
  The defaulted token ceiling (1024), the caller-configurable model and maxTokens, and the
  ANTHROPIC_API_KEY environment fallback are adapter configuration for the Anthropic SDK call
  itself, not domain facts the specification governs, so they are not reported as findings here.
