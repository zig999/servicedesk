looked_past: The file's checks that the adapter imports no third-party HTTP client and defaults to the platform's own fetch, and that a non-string resolved body is JSON-encoded while a string body is sent verbatim, are transport-mechanics and tooling choices with no domain content once an HTTP body must leave as bytes — they read as a standard-conformance or architecture concern, not a specification-conformance one, and are not reported here.
