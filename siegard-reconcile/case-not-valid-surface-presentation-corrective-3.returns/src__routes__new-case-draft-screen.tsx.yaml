looked_past: >-
  The hooks this screen calls (useNewDraftVersionForm, and the useEditDraftVersionForm
  it delegates to once creation succeeds) and the CaseVersionEditorReadyView component
  it renders in the ready phase were read only to trace which state each phase in this
  file actually corresponds to; any conformance question about their own content is
  outside this file's set and is not reported here.
