findings:
  - file: src/investigation/http-declarative-observation-source.adapter.ts
    where: >-
      resolveHttpConnectorCallConfiguration's catch (lines 149-161), which routes a
      MalformedHttpConnectorConfigurationError through the generic unavailableFor helper (lines
      52-54), discarding the vocabulary httpConfigurationProblems computed for it (lines 256-268)
    evidence: |-
      function unavailableFor(error: Error): ObservationOutcome {
        return { result: 'unavailable', result_detail: error.name };
      }
      ...
      if (error instanceof MalformedHttpConnectorConfigurationError) {
        return { ok: false, outcome: unavailableFor(error) };
      }
      ...
      if (!isHttpMethod(configuration.method)) {
        problems.push(`method is not one of ${HTTP_METHODS.join(', ')}`);
      }
      ...
      if (!isStatusEndingMap(configuration.statusMap)) {
        problems.push(`statusMap is not a plain object mapping a status to one of ${EVIDENCE_RESULTS.join(', ')}`);
      }
    cost: >-
      An operator reading the evidence recorded for an observation refused over a malformed
      connector configuration sees only the bare class name "MalformedHttpConnectorConfigurationError"
      as result_detail. The vocabulary this same file computes — which methods the connector
      accepts, or which evidence-result endings a statusMap may map a status to — is built into
      `problems` and handed to the error, then dropped: `unavailableFor` reads only `error.name`.
      The file already knows how to enrich a detail when one is owed (`unavailableForUnreachableConnector`
      appends the connector name explicitly), so this is not a uniform convention but a gap in the
      one case the specification says needs the extra text, and the operator has to go elsewhere
      to learn which key was wrong or what it should have been.
    kind: contradicts
    node: rules/integration/an-http-connector-configuration-declares-its-method-and-status-vocabulary
    correction: >-
      unavailableFor would need a MalformedHttpConnectorConfigurationError-specific branch —
      mirroring unavailableForUnreachableConnector's own explicit enrichment — that folds the
      computed `problems` vocabulary into result_detail alongside the error's name, instead of
      returning error.name alone.
