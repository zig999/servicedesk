findings:
  - file: src/case/release.operation.ts
    where: "releaseViolations, the `if (structural.kind === 'invalid')` branch, lines 74-77"
    evidence: |
      const structural = structuralOutcome(assembled);
      if (structural.kind === 'invalid') {
        return structural.problems;
      }
      return [
        ...(await caseCoherenceViolations(structural.theCase, sources.glossary, sources.capabilities)),
        ...(await manifestOwnStateViolations(assembled, sources.hypothesisRevisions)),
      ];
    cost: "When a draft is both structurally invalid and manifests a hypothesis-revision that is still in draft state, a curator asking to release it is told only about the structural problems: manifestOwnStateViolations is never called on this path, even though it needs only `assembled.manifest` and not the parsed Case that structural validation produces. The manifest-hypothesis violation surfaces only on a second release attempt, after the structural one is fixed — no single refusal ever names both together."
    kind: contradicts
    correction: "manifestOwnStateViolations should be evaluated and its results merged into the violations list regardless of whether structuralOutcome succeeded, since it depends only on the raw assembled manifest, not on the parsed Case that a structural failure withholds."
    node: rules/knowledge/a-released-case-version-manifests-only-released-hypothesis-revisions

