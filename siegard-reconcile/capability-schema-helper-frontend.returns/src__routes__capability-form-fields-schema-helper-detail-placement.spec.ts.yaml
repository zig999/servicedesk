looked_past: >-
  The test verifies the Schema Helper heading's position only against the Output schema field,
  not additionally against the Input schema field the node also names beneath which the helper
  must sit; that is a test-coverage question rather than a stated domain fact conflicting with a
  node, so it is left unreported here.
