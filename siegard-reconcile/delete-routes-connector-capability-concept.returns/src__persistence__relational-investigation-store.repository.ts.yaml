  - node: rules/investigation/an-empty-ticket-reference-is-no-ticket-reference
    held_at: ticketRefForWrite/holdsNoTicketReference (write) and the conditional ticket_ref
      spread in investigationOf (read)
    evidence: |-
      function ticketRefForWrite(ticketRef: string | undefined): string | undefined {
        return holdsNoTicketReference(ticketRef) ? undefined : ticketRef;
      }

      function holdsNoTicketReference(value: string | undefined): boolean {
        return value === undefined || value === '';
      }
  - node: rules/investigation/an-investigation-is-written-once
    held_at: raiseRootInsertFailure/isUniqueViolation, which turns a duplicate id into a
      distinguishable InvestigationAlreadyStoredError rather than the generic write failure
    evidence: |-
      function raiseRootInsertFailure(id: string): RaiseStoreError {
        return (cause) => (isUniqueViolation(cause) ? new InvestigationAlreadyStoredError(id) : raiseWriteFailure(cause));
      }
