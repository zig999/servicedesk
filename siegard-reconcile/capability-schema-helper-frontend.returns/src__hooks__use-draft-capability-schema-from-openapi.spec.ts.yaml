looked_past: >-
  The hardcoded DRAFT_ROUTE literal ("/v1/draft-capability-schema-from-openapi") and the request
  DTO shape ({link, path, method}) are wiring for the contract operation rather than a domain fact
  any node states, and domain/integration/capability-schema-draft-unresolved-reason's second value
  going unexercised in this file is a coverage gap rather than a conformance question, so neither
  is reported as a finding here.
