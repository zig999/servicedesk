looked_past: "The literal string \"Loading…\" asserted at line 111, and the exact zero-button count at line 113, are wording and control-layout choices the specification's own sibling rules repeatedly and explicitly leave to the interface (\"which control carries..., its wording... are form\"), so asserting them is not itself a domain-fact claim outside the specification — that is a standard/form concern, not this pass's."
