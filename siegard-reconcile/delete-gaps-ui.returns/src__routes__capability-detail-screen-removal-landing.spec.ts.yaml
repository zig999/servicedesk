findings:
  - file: src/routes/capability-detail-screen-removal-landing.spec.ts
    where: >-
      the describe/it block at lines 94-113, "the landing waits for the removal's own answer,
      never taken merely because the removal was issued (an underdetermined note in this task)"
    evidence: |-
      describe("CapabilityDetailScreen -- the landing waits for the removal's own answer, never taken merely because the removal was issued (an underdetermined note in this task)", () => {
        it("still presents the capability's own surface while the DELETE request is outstanding, navigating to /capabilities only once it resolves with HTTP 204", async () => {
          ...
          await waitFor(() => expect(removeTriggerButton().hasAttribute("disabled")).toBe(true));
          expect(router.state.location.pathname).toBe(`/capabilities/${NAME}/${VERSION}`);
    cost: >-
      The test fixes, as a hard requirement of the screen, that the remove control disables and
      navigation is withheld for the whole time the DELETE request is outstanding. No node in this
      file's set, and none found elsewhere in the specification, decides whether a removal in
      flight disables its own control or what the surface shows meanwhile; the next reader who
      needs to know that will find only this test enforcing it, never a specification node — and
      the test's own title concedes the gap it is filling: "(an underdetermined note in this task)".
    kind: unstated
    correction: >-
      Decide, in the specification, whether and how a capability removal in flight is reflected on
      the remove control and the surface, then bring this test back to assert only what was decided.
  - file: src/routes/capability-detail-screen-removal-landing.spec.ts
    where: >-
      the describe/it block at lines 115-128, "a refused removal leaves the operator on the
      capability's own surface (an underdetermined note in this task)"
    evidence: |-
      describe("CapabilityDetailScreen -- a refused removal leaves the operator on the capability's own surface (an underdetermined note in this task)", () => {
        it("stays at the capability's own detail route when the removal answers with a refusal instead of HTTP 204", async () => {
          ...
          await waitFor(() => expect(removeTriggerButton().hasAttribute("disabled")).toBe(false));
          expect(router.state.location.pathname).toBe(`/capabilities/${NAME}/${VERSION}`);
    cost: >-
      The test fixes, as a hard requirement, that a refused removal leaves the operator on the
      capability's own detail route with the control usable again. rules/integration/a-submitted-removal-states-its-outcome-to-the-operator
      states what the surface discloses on a refusal but not where the operator is left able to
      act next, and no other node in this set settles it; a reader who needs to know what a
      refused capability removal leaves the operator able to do will find only this assertion, and
      the test's own title admits the specification does not settle it: "(an underdetermined note
      in this task)".
    kind: unstated
    correction: >-
      Decide, in the specification, what a refused capability removal leaves the operator able to
      do — surface, control state — then bring this test back to assert only what was decided.
