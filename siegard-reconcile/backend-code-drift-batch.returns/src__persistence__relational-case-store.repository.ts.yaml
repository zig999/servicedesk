findings:
  - where: "the DRAFT_STATE/RELEASED_STATE constants (lines 101-102) and the isCaseVersionState function (lines 946-948)"
    evidence: |
      const DRAFT_STATE: CaseVersionState = 'draft';
      const RELEASED_STATE: CaseVersionState = 'released';
      ...
      function isCaseVersionState(value: string): value is CaseVersionState {
        return value === DRAFT_STATE || value === RELEASED_STATE;
      }
    cost: "the case-version lifecycle's two legal states are re-enumerated here as hand-typed literals rather than read from any single canonical source — contrast HYPOTHESIS_REVISION_STATE_VALUES a few lines above, which derives from the imported HYPOTHESIS_REVISION_STATES array instead of hardcoding 'draft'/'released' again. If the specification's state machine ever adds a state, this check has no link back to the rule that declares initial/terminal states; a maintainer edits this constant pair from memory, and the next reader who wants to know what states a case version has does not find the answer read from the specification — they find it typed here."
    kind: contradicts
    correction: "derive isCaseVersionState from an exported canonical list of case-version states (mirroring the HYPOTHESIS_REVISION_STATES pattern), instead of the two hardcoded literal comparisons."
    node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle

