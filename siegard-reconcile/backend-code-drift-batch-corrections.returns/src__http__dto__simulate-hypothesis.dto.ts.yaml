looked_past: the confirmed/refuted branches mark usage, elapsed_ms and prompt all .optional() even though a decided verdict always followed a judgment call per domain/investigation/evaluation's own conditional-presence description; the required/optional distinction across the five reason-and-verdict combinations is nuanced enough (judgment-failure vs. deadline-exceeded vs. no-data all differ) that I did not treat it as a clear, single-node contradiction the way the no-data citations gap is.
