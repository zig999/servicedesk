findings:
  - file: src/__tests__/unit/http/case-input-requirements.routes.spec.ts
    where: "the sixth `it`, lines 95-103 (\"answers 400 for a version of zero, one below the positive range the domain declares, without ever reaching the query\")"
    evidence: "'answers 400 for a version of zero, one below the positive range the domain declares, without ever reaching the query'"
    cost: "the test's own title asserts, as settled fact, that the domain declares a positive range for a case version number and that zero falls outside it; domain/knowledge/case-version.md declares the `version` attribute only as `type: integer, required: true`, with no floor, and no rule (a-case-version-number-is-never-reused included) fixes a starting value or excludes zero — a reader who goes to the specification to confirm that a version of zero is invalid finds nothing there and is left trusting this test (and the route's own `.positive()` schema) as if it were the decision"
    kind: unstated
    correction: "decide, into domain/knowledge/case-version.md or a dedicated rule, whether a case version number is bounded below (e.g. positive, or minimum 1), disclosed in the decision log, and have this test's title cite that node rather than asserting the range as an already-settled domain fact"
