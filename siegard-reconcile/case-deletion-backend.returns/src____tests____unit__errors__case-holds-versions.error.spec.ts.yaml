findings:
  - file: src/__tests__/unit/errors/case-holds-versions.error.spec.ts
    where: >-
      line 18, inside the test "names the case slug in a Brazilian-Portuguese message that calls
      the case \"caso\" and never the English word \"case\""
    evidence: |-
      expect(error.message).toMatch(/exclu[ií]do/i);
    cost: >-
      The node this test otherwise draws from requires only that the refusal name the case slug,
      write it in Brazilian Portuguese, and use "caso" rather than "case" — and its own Description
      states plainly that "how each message is built around these words stays free to be written
      and rewritten for clarity". A future message satisfying every one of those requirements but
      phrasing the refusal without the literal word "excluído"/"excluido" would fail this assertion
      though nothing the specification states would be violated — the suite polices a wording
      choice the specification explicitly leaves open.
    kind: contradicts
    correction: >-
      Remove the exclu[ií]do assertion, or narrow it to only the facts the node states: the
      slug present, the fixed noun "caso" present, and the English word "case" absent.
    node: constraints/a-domain-refusal-names-each-domain-noun-by-one-fixed-portuguese-word
  - file: src/__tests__/unit/errors/case-holds-versions.error.spec.ts
    where: >-
      line 36, inside the test "names the remaining version by its fixed Portuguese noun
      \"versão\"..."
    evidence: |-
      expect(error.message).toMatch(/\bversão\b/);
    cost: >-
      rules/knowledge/a-case-holding-no-version-may-be-deleted states only that the refusal's
      message "names the case slug" — it says nothing about the message needing to also name the
      version. A refusal message that names the slug alone, in Portuguese, without "case", "draft"
      or "version" — fully satisfying every stated requirement — would fail this positive
      assertion, so the suite requires content the rule that governs the message never asked for.
    kind: contradicts
    correction: >-
      Drop the requirement that "versão" be present, keeping the negative checks that guard
      against the English word "version" and the raw "draft" token wherever the message does name
      the version.
    node: rules/knowledge/a-case-holding-no-version-may-be-deleted
