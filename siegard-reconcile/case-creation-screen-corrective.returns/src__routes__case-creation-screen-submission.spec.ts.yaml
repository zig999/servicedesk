looked_past: >-
  The literal button label "Create case" and the literal route shape "/cases/{slug}/versions/{version}"
  are both facts the specification leaves as interface form (per the presentation rules' own
  "form belonging to the interface" language), so their presence in this test is not reported as
  a domain-fact gap.
