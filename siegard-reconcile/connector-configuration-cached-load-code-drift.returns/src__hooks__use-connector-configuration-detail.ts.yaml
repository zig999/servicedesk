findings:
  - file: src/hooks/use-connector-configuration-detail.ts
    where: the phase branching that returns `load-error`, lines 122-133 (the `query.isError` check runs ahead of, and without regard to, whether `query.data` already holds an answer)
    evidence: |-
      if (query.isError) {
        return {
          phase: "load-error",
          retryLoad: () => {
            void query.refetch();
          },
          onCancel,
        };
      }
      if (query.isLoading || !query.data) {
        return { phase: "loading", onCancel };
      }
    cost: >-
      An operator already presented with a connector's configuration — reached, for instance,
      after this same hook invalidates and refetches the query on a successful save — is switched
      into the load-error phase and loses the presented connector, configuration and any in-place
      edit the moment any further read of that same configuration fails, even one that fails only
      in the background. The node bound to this file states that a screen already holding an
      earlier answer "stays in the returned window presenting that held answer" through a failed
      further read, and reserves the failed window for a screen that holds no earlier answer; this
      branch does not distinguish the two and empties the screen either way.
    kind: contradicts
    node: rules/integration/a-presented-connector-configuration-states-an-outstanding-or-failed-read
    correction: >-
      guard the load-error branch on the absence of a held answer, e.g. `if (query.isError &&
      !query.data)`, so a screen already presenting a returned configuration remains in the ready
      phase through a failed further read.
  - file: src/hooks/use-connector-configuration-detail.ts
    where: the submit gate inside `submit`, lines 139-144
    evidence: |-
      const submit = form.handleSubmit((values) => {
          if (!configurationValid) {
            return;
          }
          mutation.mutate(values);
        });
    cost: >-
      When the surface's own local judgment marks the Configuration field content as not
      well-formed, pressing submit silently does nothing: no register-connector call is ever
      issued, and neither of the outcomes an operator is owed on submitting — registered, or
      refused with a named condition — is ever stated, because none was submitted. Nothing in the
      specification decided that this is what should happen to such an attempt; the one rule that
      governs the surface's own well-formedness judgment expressly leaves this open ("Whether the
      surface withholds a submission of content its judgment finds short of the criterion... [is]
      no part of this"), so the silent no-op is a decision this file made on its own rather than
      one the specification recorded.
    kind: unstated
    correction: >-
      the specification would need to decide, and record, whether an operator's attempt to submit
      locally-judged-invalid content is withheld client-side or sent to the registry to be refused
      and reported through the outcome the operator is otherwise owed.
