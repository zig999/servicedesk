read:
  - node: constraints/the-diagnosis-and-simulation-routes-are-rate-limited
    held_at: >-
      the `onRequest` hook registration, which wires the shared rate-limit
      factory with this route's own max-per-window and window-length values
    evidence: >-
      const RATE_LIMIT_MAX_REQUESTS_PER_MINUTE = 10;
      const RATE_LIMIT_WINDOW_MS = 60_000;
      ...
      app.addHook(
        'onRequest',
        createRateLimitHook({
          maxRequestsPerWindow: RATE_LIMIT_MAX_REQUESTS_PER_MINUTE,
          windowMs: RATE_LIMIT_WINDOW_MS,
        }),
      );
  - node: contracts/investigation/case-simulation
    held_at: >-
      the POST route registration naming the operation's own path and
      dispatching to the controller that runs the narrowed, no-outcome,
      no-persistence collection the node describes; this file itself decides
      none of that behavior, only the wiring to it
    evidence: >-
      app.post(`${API_PREFIX}/simulate/hypothesis`, (request, reply) => simulateHypothesisHandler(dependencies, request, reply));
      ...
      const result = await handleSimulateHypothesisRequest(dependencies, parsed.data);
      return reply.code(200).send(result);
