looked_past: >-
  RevisionSelect's "Newer revision available" hint and the released row's disabled Select
  both bear on rules/knowledge/a-presented-manifest-entry-says-whether-its-pinned-revision-is-the-latest
  and rules/knowledge/a-manifest-entry-discloses-a-higher-revision-of-its-hypothesis; the
  disclosure looked adequate on inspection and any remaining question about whether an
  absent hint unambiguously reads as "this is the latest" versus "not yet compared" is a
  judgment about a hook this file only consumes, not about this file's own text.
