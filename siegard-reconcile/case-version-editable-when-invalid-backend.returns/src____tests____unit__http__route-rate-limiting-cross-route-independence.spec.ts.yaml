  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-open-for-editing
    held_at: nowhere
    evidence: >-
      No editing surface, curator correction or update-draft submission is present; the
      file's two `it(...)` blocks are titled around rate-limit cross-route and cross-address
