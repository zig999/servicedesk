looked_past: >-
  The describe title labels the whitespace-connector case "UNDERDETERMINED whitespace entry"
  while the governing rule's own description explicitly settles that a whitespace-only Connector
  field is treated the same as empty; the test's own assertions conform to that settled reading,
  so the mislabel is a documentation/citation inaccuracy in the test's own title rather than a
  domain fact the code states.
