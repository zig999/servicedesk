findings:
  - file: src/investigation/anthropic-hypothesis-evaluator.adapter.ts
    where: "outcomeFromModelText, lines 104-107"
    evidence: |-
      if (parsed === undefined || parsed.verdict === 'inconclusive') {
          return judgmentFailureOutcome(callRecord);
        }
    cost: >-
      When the model returns the well-formed `{"verdict":"inconclusive"}` response the
      system prompt itself instructs it to give "whenever the evidence does not ground
      either" verdict — the honest, no-inference answer judgment-does-not-infer calls
      for, with nothing having actually failed — this branch records it under reason
      "judgment-failure", the identical label used when the response could not be
      parsed at all. A reader relying on the reason to separate a broken call from an
      evidence-grounded "cannot decide" will find the two merged under one label,
      which is the same confusion an-inconclusive-evaluation-declares-its-reason's own
      rationale warns against ("an infrastructure failure is read as a domain fact —
      the pathology the rest of the system exists to avoid"), here running the other
      way: a domain conclusion (the evidence does not decide it) is read as an
      infrastructure failure.
    kind: unstated
    node: rules/investigation/an-inconclusive-evaluation-declares-its-reason
    correction: >-
      A distinct reason for "the call completed and the model itself could not ground
      a verdict" — or an explicit decision, recorded in domain/investigation/evaluation-reason
      or this rule, that such a response is folded into judgment-failure on purpose —
      would have to be stated before this branch's choice stops being the adapter's own.
