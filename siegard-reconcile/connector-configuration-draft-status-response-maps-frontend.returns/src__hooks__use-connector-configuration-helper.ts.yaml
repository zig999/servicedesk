findings:
  - file: src/hooks/use-connector-configuration-helper.ts
    where: >-
      the ConnectorConfigurationHelperState type (lines 21 and 23) and its implementation in the hook's return (lines 73 and 75)
    evidence: |-
      readonly onPathChange: (value: string) => void;
      readonly onMethodChange: (value: string) => void;
      ...
      onPathChange: setPath,
      ...
      onMethodChange: setMethod,
    cost: >-
      a consumer of this hook can set path or method to any typed string through onPathChange/onMethodChange, independently of onChooseOperation; the request onRequestDraft then issues — requestDraft({ link, path, method }) — would name a path or a method the operator typed rather than one chosen from the fetched document's own listing, which the rule states never happens, and nothing else in this file withholds that capability.
    kind: contradicts
    node: rules/integration/a-configuration-helper-operation-is-chosen-from-the-fetched-documents-listing
    correction: >-
      drop onPathChange and onMethodChange from the hook's returned state (keep setPath/setMethod internal, reachable only through onChooseOperation) so path and method can only ever be set from a chosen operation of the fetched listing.
looked_past: >-
  Whether the draft-request act itself is withheld while the connector name is empty or whitespace or no operation is chosen, and the widened optionality of `connector` and `stale` in the returned type against always-present values, are left to the consuming surface (connector-configuration-helper-fields.tsx) and to a code-quality reading rather than reported here.
