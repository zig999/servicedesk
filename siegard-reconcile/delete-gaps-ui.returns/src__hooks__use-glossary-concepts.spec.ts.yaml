looked_past: >-
  The query-key naming (["glossary", "concepts-with-ttl"] kept distinct from
  use-concept-options.ts's own key) and the fallback to an empty concepts array on a
  failed or empty read are cache-hygiene and defensive-return choices rather than
  disclosed domain facts, and are already flagged in the test's own titles as
  "(disclosed inference)" -- another judgment's to weigh, not a specification-conformance
  finding.
