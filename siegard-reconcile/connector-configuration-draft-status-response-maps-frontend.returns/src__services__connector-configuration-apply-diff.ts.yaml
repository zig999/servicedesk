findings:
  - file: src/services/connector-configuration-apply-diff.ts
    where: the draftObject === null branch inside computeApplyConfirmationDiff
    evidence: |-
      const draftObject = parseJsonObject(draftText);
      if (draftObject === null) { return { kind: "not-itemisable" }; }
    cost: >-
      an-apply-confirmation-states-what-the-draft-would-change conditions "cannot be itemized"
      solely on the field's own content failing to be well-formed, and
      a-connector-configuration-drafts-configuration-is-well-formed-object-text declares a
      draft's configuration is always well-formed — so no node describes what should happen if
      the draft's own text ever failed to parse. This branch folds that unaddressed case into the
      same "not-itemisable" outcome as an ordinary malformed edit.
    kind: unstated
    node: rules/integration/an-apply-confirmation-states-what-the-draft-would-change
    correction: >-
      Either extend the node to state what the confirmation shows when the draft's own
      configuration is not well-formed, or drop this branch and trust the invariant that a
      generated draft's configuration is always well-formed.
looked_past: >-
  The nested-key diff only records an entry for statusMap/responseMap/query/headers when both
  sides are plain objects, so a key present as a non-object or missing on one side surfaces only
  in the top-level set and never as a nested breakdown — an edge case neither node specifies.
