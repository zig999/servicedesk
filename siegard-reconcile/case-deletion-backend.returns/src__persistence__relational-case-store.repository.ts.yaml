looked_past: >-
  contracts/knowledge/case-query names a separate read-case-version operation (the case version's
  own stored record, "neither validated at this reading nor assembled as a whole case") distinct
  from the whole-version read this file exposes as assembleVersion; whether that separate raw read
  is implemented elsewhere or missing turns on src/case/case-store.port.ts's own interface, which
  is outside this file and this pass's scope.
