findings:
  - file: src/case/revise-hypothesis.operation.ts
    where: "refuseWithoutDraft (lines 47-52) together with refuseConceptsRefusingSubject/conceptsRefusingSubjectOf (lines 102-120)"
    evidence: |
      const draftVersion = await this.caseStore.findDraftVersion(slug);
      if (draftVersion === undefined) {
        throw new CaseHoldsNoDraftError(slug);
      }
      ...
      function conceptsRefusingSubjectOf(resolutions: readonly ConceptResolution[], subject: string): readonly string[] {
        return resolutions
          .filter(isHeld)
          .map((resolution) => resolution.concept)
          .filter((concept) => !concept.accepts.includes(subject))
      }
    cost: "The rule requires the concept-acceptance check to run against the draft version's own declared subject type, but this file never reads that attribute — findDraftVersion returns only a version number, discarded once existence is confirmed — and instead checks caller-supplied input.subject verbatim. A caller passing a subject that no longer matches the case's actual draft (stale UI state, a client bug, a second concurrent update-draft) is checked against the wrong subject type with nothing here to catch it, defeating the guarantee the rule states in exactly the aggregate meant to enforce it."
    kind: contradicts
    correction: "Read the draft version's own subject (e.g. via assembleVersion(slug, draftVersion)) inside refuseWithoutDraft/writeRevision and use that value in refuseConceptsRefusingSubject instead of input.subject, or verify input.subject against it before proceeding."
    node: rules/knowledge/a-hypothesis-is-revised-only-against-its-cases-draft

