  - node: domain/integration/connector-configuration-draft-generated-credential
    held_at: the generated-credentials list inside the draft disclosure
    evidence: |-
      {draft.generatedCredentials.map((credential) => (<li key={`${credential.name}:${credential.securityScheme}`}>{credential.name}: {credential.securityScheme}</li>))}
  - node: domain/integration/connector-configuration-draft-method-mismatch
    held_at: the method-mismatch section, rendered only when the draft carries one
