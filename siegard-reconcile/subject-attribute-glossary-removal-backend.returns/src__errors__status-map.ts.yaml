findings:
  - file: src/errors/status-map.ts
    where: "the STATUS_BY_ERROR_CLASS map, lines 43-83 (and its import list, lines 1-39)"
    evidence: |-
      [InvestigationWriteDeadlineExceededError, 500],
        [DuplicateGlossaryNameError, 500],
      ]);
    cost: >-
      DuplicateConceptAnswerError is a fully implemented, named error carrying its own concept
      and answers context, but it is imported and named nowhere in this map. A concept read that
      finds two capabilities answering it throws this class, statusForError finds no matching
      entry and falls through to a generic 500/INTERNAL_ERROR, indistinguishable from any other
      unanticipated server fault.
    kind: contradicts
    correction: >-
      import DuplicateConceptAnswerError from './duplicate-concept-answer.error.js' and add
      [DuplicateConceptAnswerError, 500] to STATUS_BY_ERROR_CLASS.
    node: rules/integration/one-capability-answers-one-concept
