      import type { FieldSemantics } from './field-semantics.js';
      import type { Usage } from './usage.js';
      import type { Verdict } from './verdict.js';
      ...
      export interface IHypothesisEvaluator {

        evaluate(
          criterion: string,
          evidence: readonly EvidenceItem[],
          caseContext: CaseContext,
        ): Promise<EvaluationOutcome>;
      }
  - node: constraints/the-judgment-prompt-is-closed
    held_at: >-
      the evaluate() signature, which admits only criterion, evidence and caseContext —
      nothing that could be a live glossary or registry lookup
    evidence: |-
      evaluate(
          criterion: string,
          evidence: readonly EvidenceItem[],
          caseContext: CaseContext,
        ): Promise<EvaluationOutcome>;
  - node: domain/investigation/hypothesis-evaluator
    held_at: the IHypothesisEvaluator interface, whose one operation is evaluate
    evidence: |-
      export interface IHypothesisEvaluator {

        evaluate(
          criterion: string,
          evidence: readonly EvidenceItem[],
          caseContext: CaseContext,
        ): Promise<EvaluationOutcome>;
      }
  - node: domain/investigation/verdict
    held_at: >-
      the verdict discriminant of EvaluationOutcome — literal 'confirmed' and 'refuted' branches
      plus Exclude<Verdict, 'confirmed' | 'refuted'> for the remaining value
    evidence: |-
      readonly verdict: 'confirmed';
      ...
      readonly verdict: 'refuted';
      ...
      readonly verdict: Exclude<Verdict, 'confirmed' | 'refuted'>;
  - node: rules/investigation/a-decided-evaluation-cites-evidence
    held_at: >-
      the citations field of the confirmed and refuted branches of EvaluationOutcome, typed as
      a non-empty tuple
    evidence: "readonly citations: readonly [Citation, ...Citation[]];"
  - node: rules/investigation/an-inconclusive-evaluation-declares-its-reason
    held_at: the third branch of EvaluationOutcome, which requires reason
    evidence: |-
      {
            readonly verdict: Exclude<Verdict, 'confirmed' | 'refuted'>;
            readonly reason: EvaluationReason;
            readonly citations: readonly Citation[];
            ...
          }
  - node: rules/investigation/judgment-reads-the-evidence-snapshot
    held_at: >-
      the EvidenceItem type, limited to concept, fields, concept_description and
      capability_payload_notes plus ObservationOutcome's observation/result — nothing drawn
      from a live glossary or registry read
    evidence: |-
      export type EvidenceItem = {
        readonly concept: string;
        readonly fields: readonly FieldSemantics[];
        readonly concept_description: string;
        readonly capability_payload_notes: string;
      } & ObservationOutcome;
