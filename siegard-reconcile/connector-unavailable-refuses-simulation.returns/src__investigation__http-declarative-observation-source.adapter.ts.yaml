findings:
  - file: src/investigation/http-declarative-observation-source.adapter.ts
    where: "httpConfigurationProblems(), line 259"
    evidence: "problems.push('method is not one of GET, POST, PUT, PATCH, DELETE');"
    cost: "The five accepted methods are hand-copied into this diagnostic string rather than read from HTTP_METHODS, the same list isHttpMethod actually validates configuration.method against; if the rule ever admits a sixth method, isHttpMethod (reading the canonical list) would accept it while this message kept telling an operator only these five are valid — the message and the acceptance rule can silently drift apart because nobody has to touch this line to make the rule change take effect elsewhere."
    kind: contradicts
    correction: "Build the message from HTTP_METHODS (e.g. a joined list) instead of a literal enumeration."
    node: rules/integration/an-http-connector-configuration-declares-its-call
  - file: src/investigation/http-declarative-observation-source.adapter.ts
    where: "httpConfigurationProblems(), line 265"
    evidence: "problems.push('statusMap is not a plain object mapping a status to one of ok, unavailable, denied, timeout');"
    cost: "The four evidence-result endings are hand-copied here rather than read from EVIDENCE_RESULTS, the array isEvidenceResult (and therefore isStatusEndingMap) actually validates statusMap's values against; a fifth ending added to the enumeration would be accepted by the real validation while this message kept naming only the original four, so the message stops describing what the code accepts."
    kind: contradicts
    correction: "Build the message from EVIDENCE_RESULTS instead of a literal enumeration."
    node: domain/investigation/evidence-result
  - file: src/investigation/http-declarative-observation-source.adapter.ts
    where: "parsedBodyOrUndefined() and outcomeFromResponse(), lines 203-215 and 222-228"
    evidence: "async function parsedBodyOrUndefined(response: Response): Promise<unknown> {\n  try {\n    return await response.json();\n  } catch {\n    return undefined;\n  }\n}\n... const body = await parsedBodyOrUndefined(response);\n  const observation = observationOf(capability, configuration.responseMap, body);\n  return { result: 'ok', observation: JSON.stringify(observation) };"
    cost: "When the connector's statusMap classifies the HTTP status as ok but the response body does not parse as JSON, the collection still records result 'ok' — the one ending domain/investigation/evidence-result's own description reserves for a usable observation — built from a body the adapter itself just failed to parse. No node says what should happen to a source system's unparseable response on an otherwise-ok status; a reader checking the specification for that case finds nothing, because the choice to still call it ok, silently, from an empty/undefined body, was made only here."
    kind: unstated
    correction: "The specification would need to state the ending an unparseable body produces on an ok-classified status (e.g. the same unavailable ending an unclassified status gets); the adapter would then check the parse outcome instead of defaulting silently to undefined."
