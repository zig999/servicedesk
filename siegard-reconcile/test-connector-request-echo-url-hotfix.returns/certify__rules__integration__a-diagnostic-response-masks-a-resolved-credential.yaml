certified:
  - node: rules/integration/a-diagnostic-response-masks-a-resolved-credential
    state: partial
    tests:
      - file: src/__tests__/unit/http/test-connector.routes.spec.ts
        name: >-
          ends a test whose issued call fails before any HTTP response, and whose failure is not
          the capability's own timeout, with an HTTP 200 response naming ConnectorUnreachableError
          and the connector, carrying no response status, and echoing the request with its
          credential placeholder masked
      - file: src/__tests__/unit/http/test-connector.routes.spec.ts
        name: >-
          refuses a test-connector request whose resolved address is not a valid absolute URL with
          an HTTP 422 ConnectorCallAddressNotAbsoluteUrlError disclosing only the masked resolved
          address, issuing no call
    why: >-
      Masking of a resolved credential is asserted against a real environment value in two places
      only, and neither is the echo the diagnostic ordinarily returns. The unreachable test puts
      `${credential:UNREACHABLE_HOTFIX_TOKEN}` in a header, sets it to 'another-real-secret', and
      asserts body.request.headers.authorization is 'Bearer ***REDACTED***' — that assertion would
      fail if masking stopped holding on the unreachable outcome. The 422 test masks
      `${credential:ADDRESS_HOTFIX_TOKEN}` in the address, but in the error details of a refusal
      that issues no call, not in a response echoing a call back. Nothing in the named set
      resolves a credential placeholder on a call that reaches an HTTP response: the two tests
      that read body.request on the 'response' outcome ('returns the raw HTTP status, headers,
      body and elapsed time...' and 'issues the exact request resolveConnectorRequest
      assembles...') use a configuration with no credential placeholder at all, so they cannot
      detect a real value surviving into that echo, and the 'timed-out' outcome's echo is never
      read. The node's fact is stated over the response echoing the call back; masking that held
      on the unreachable branch and failed on the ordinary one would leave every named test
      passing. Separately, no named test asserts that a credential resolved into the address is
      masked in the echoed body.request.address — only in a refusal's details.
    remainder: testable
    remainder_why: >-
      One input — a connector configuration whose call carries a credential placeholder in both
      the address and a header, with those environment variables set to real values, and an
      httpClient that answers a successful HTTP response — against one expected result: the
      200 body's echoed request.address and request.headers carry the redaction marker in place
      of both environment values, with the non-credential parts of the call still resolved. The
      same input against an aborted call closes the 'timed-out' outcome; the outcomes the route
      declares ('response', 'unreachable', 'timed-out', and the address refusal) are a finite set,
      so a test over each with a credential placeholder resolved decides the node whole.
