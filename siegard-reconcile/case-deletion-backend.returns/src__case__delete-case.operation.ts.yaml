looked_past: >-
  The accept/refuse branching, the cascading removal of hypotheses, hypothesis-revisions and
  collects, the 404/409 refusals, the Portuguese message vocabulary and the 204-no-content
  response are all absent from this file by design — it only delegates to `store.delete(slug)`
  through the ICaseStore port — and their conformance is the persistence-repository and route
  files' own reading, not this one's.
