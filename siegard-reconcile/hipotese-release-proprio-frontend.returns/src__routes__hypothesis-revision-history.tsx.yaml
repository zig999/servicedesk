    cost: "The descending-by-revision-number order that rules/knowledge/a-hypothesis-revisions-listing-answers-highest-revision-first assigns to the listing itself is re-derived here as a second, independent sort over whatever page the hook returns. A reader auditing how the order is guaranteed finds it enforced twice — once as the API's own invariant, once as this local .sort — and the two can diverge silently: a change to (or a bug in) the listing's own ordering would be masked here rather than surfaced, since this component fixes the order itself regardless of what it received."
    kind: contradicts
    correction: "Render revisions in the order the hook returns it and drop the local sort, trusting the listing's own descending-by-revision guarantee instead of re-implementing it."
