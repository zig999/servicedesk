read:
  - node: contracts/knowledge/case-lifecycle
    held_at: >-
      handleUpdateDraftRequest, the http entry point dispatching the contract's
      update-draft operation.
    evidence: |
      export async function handleUpdateDraftRequest(
        dependencies: UpdateDraftControllerDependencies,
        params: UpdateDraftParamsDto,
        body: UpdateDraftBodyDto,
      ): Promise<ReadCaseVersionResponseDto> {
        await dependencies.caseStore.updateDraft(params.slug, params.version, body);
  - node: domain/knowledge/case-version
    held_at: >-
      the same handleUpdateDraftRequest call, which invokes the aggregate's
      update-draft operation against the named slug and version; the attribute
      list itself is not declared in this file.
    evidence: >-
      await dependencies.caseStore.updateDraft(params.slug, params.version, body);
  - node: rules/knowledge/an-accepted-update-draft-answers-its-versions-own-stored-declared-attributes
    held_at: >-
      the write-then-read sequence: updateDraft is awaited to settle, then the
      version's own stored record is fetched through caseQuery.readCaseVersion
      (never through the whole-case read) and returned via
      toReadCaseVersionResponse, which carries no manifest entry.
    evidence: |
      await dependencies.caseStore.updateDraft(params.slug, params.version, body);
      const { version } = await dependencies.caseQuery.readCaseVersion(params.slug, params.version);
      return toReadCaseVersionResponse(version);
  - node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
    held_at: >-
      the choice of caseQuery.readCaseVersion (the unvalidated, record-only
      read) rather than caseQuery.readCase to fetch the answer, so acceptance
      of the update-draft does not turn on whether the version currently reads
      back as a case.
    evidence: >-
      const { version } = await dependencies.caseQuery.readCaseVersion(params.slug, params.version);
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-open-for-editing
    held_at: >-
      the same flow — no manifest check of any kind is performed before or
      after updateDraft is awaited, so a version whose manifest holds no
      hypothesis is still corrected and answered.
    evidence: |
      await dependencies.caseStore.updateDraft(params.slug, params.version, body);
      const { version } = await dependencies.caseQuery.readCaseVersion(params.slug, params.version);
  - node: contracts/knowledge/case-query
    held_at: >-
      the call to dependencies.caseQuery.readCaseVersion, matching the
      contract's read-case-version operation rather than its read-case
      operation.
    evidence: >-
      const { version } = await dependencies.caseQuery.readCaseVersion(params.slug, params.version);
  - node: rules/knowledge/a-case-read-by-an-unknown-slug-or-version-is-refused
    held_at: nowhere
    evidence: >-
      the file contains no branch, catch or status handling of its own for an
      unknown slug or version — it only awaits caseStore.updateDraft and
      caseQuery.readCaseVersion and returns their result, leaving any such
      refusal to those dependencies.
  - node: constraints/a-successful-case-version-own-record-read-answers-with-http-200
    held_at: nowhere
    evidence: >-
      return toReadCaseVersionResponse(version); — the function returns a
      response body only; no status code is set or declared anywhere in this
      file.
  - node: constraints/a-malformed-request-is-refused-with-a-validation-error
    held_at: nowhere
    evidence: >-
      params and body are accepted as already-typed UpdateDraftParamsDto and
      UpdateDraftBodyDto values with no validation logic of any kind performed
      in this file.
  - node: rules/knowledge/a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
    held_at: nowhere
    evidence: >-
      the file defines only handleUpdateDraftRequest; no discard-related call
      or branch appears anywhere in it.
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-discardable
    held_at: nowhere
    evidence: >-
      the file defines only handleUpdateDraftRequest; no discard-related call
      or branch appears anywhere in it.
  - node: constraints/a-successful-case-version-discard-answers-with-no-content
    held_at: nowhere
    evidence: >-
      the file defines only handleUpdateDraftRequest; no discard-related call
      or branch appears anywhere in it.
looked_past: >-
  Whether the HTTP layer actually answers 200, whether slug/version and body
  shape are validated before this handler runs, and how caseStore.updateDraft
  or caseQuery.readCaseVersion themselves behave are settled in files outside
  this file set (routes, dto, store and query implementations) and were not
  judged here.
