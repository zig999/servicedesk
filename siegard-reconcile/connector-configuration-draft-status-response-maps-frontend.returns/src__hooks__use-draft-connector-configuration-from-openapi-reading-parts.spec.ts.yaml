looked_past: >-
  The fixture ending values "read-through" and "not-drafted" used to exercise status_readings pass-through do not belong to the evidence-result vocabulary (ok, denied, timeout, unavailable), but since the hook types `ending` as a plain string and the tests only assert pass-through rather than validity, this reads as arbitrary fixture data rather than a claim about the vocabulary, so it is not reported as a finding.
