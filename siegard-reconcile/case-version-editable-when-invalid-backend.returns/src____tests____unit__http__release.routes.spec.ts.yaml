    held_at: >-
      the ICaseQuery stub built for the test app, stubCaseQuery, lines 50-58
    evidence: |-
      return {
        readCase,
        readCaseVersion: vi.fn(),
        listCases: vi.fn(),
        listCaseVersions: vi.fn(),
        listHypotheses: vi.fn(),
        listHypothesisRevisions: vi.fn(),
