read:
  - node: constraints/the-diagnosis-and-simulation-routes-are-rate-limited
    held_at: nowhere
    evidence: |-
      import { createDatabaseConnection, type IDatabaseConnectionPoolOptions } from '../../../persistence/database-connection.js';
  - node: constraints/the-connection-pool-is-bounded-by-configuration
    held_at: |-
      the mapping assertions for maxConnections/idleTimeoutMs/statementTimeoutMs (lines 46-62) and the no-hardcoded-literal assertion for those same three options (lines 64-70)
    evidence: |-
      expect(poolMock).toHaveBeenCalledWith(expect.objectContaining({ max: A_MAX_CONNECTIONS }));
