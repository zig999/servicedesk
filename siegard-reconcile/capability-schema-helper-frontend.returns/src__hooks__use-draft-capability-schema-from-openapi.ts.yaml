looked_past: >-
  The reason field is typed as a bare string rather than the closed
  capability-schema-draft-unresolved-reason enumeration, but the hook never asserts or restates
  a value from that enumeration — it passes the field through opaquely — so this is a type-safety
  looseness rather than a domain-fact deviation, and belongs to a code-quality pass rather than
  this one.
