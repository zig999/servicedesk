read:
  - node: constraints/the-openapi-document-is-fetched-by-the-backend
    held_at: >-
      the fetch stub wiring in mountCreateReady, which only intercepts backend routes and never
      the operator-supplied OpenAPI link itself
    evidence: |-
      const fetchMock = createFetchStub({
        [DRAFT_ROUTE]: () => draftResponse(draftConfigurationText),
        [operationsReadRoute(OPERATOR_LINK)]: operationsReadJsonResponse,
      });
  - node: contracts/integration/connector-configuration-draft
    held_at: the DRAFT_ROUTE constant and the draftResponse fixture it is stubbed to answer
    evidence: |-
      const DRAFT_ROUTE = "/v1/draft-connector-configuration-from-openapi";
  - node: domain/integration/connector-configuration
    held_at: the Configuration and Conector fields exercised in openApplyConfirmation
    evidence: |-
      fireEvent.change(configurationField, { target: { value: fieldText } });
      fireEvent.change(screen.getByLabelText("Conector"), { target: { value: CONNECTOR } });
  - node: domain/integration/connector-configuration-draft
    held_at: >-
      the draftResponse fixture, partially — only connector, configuration, unresolved and
      generated_credentials are populated
    evidence: |-
      function draftResponse(configurationText: string): Response {
        return jsonResponse({
          connector: CONNECTOR,
          configuration: configurationText,
          unresolved: [],
          generated_credentials: [],
        });
      }
