looked_past: >-
  The UNREAD_DRAFT_SUBJECT sentinel sent as the request's `subject` field when the version has not
  been read, and the single generic "Something went wrong while saving" toast covering every
  revise-mutation refusal alike (ConceptRefusesSubjectTypeError, ConceptNotInGlossaryError,
  CaseHoldsNoDraftError) — neither states a domain fact at odds with a node, so weighing whether
  that complexity or that lack of differentiation is worth keeping is a code-review question, not
  this pass's.
