    held_at: "HYPOTHESIS_REVISION_STATE_VALUES (built from the imported HYPOTHESIS_REVISION_STATES) and isHypothesisRevisionState, lines 92 and 584-586"
    evidence: |
      const HYPOTHESIS_REVISION_STATE_VALUES: ReadonlySet<string> = new Set<string>(HYPOTHESIS_REVISION_STATE_VALUES);
      function isHypothesisRevisionState(value: string): value is HypothesisRevisionState {
        return HYPOTHESIS_REVISION_STATE_VALUES.has(value);
      }
  - node: rules/knowledge/a-case-version-moves-through-its-declared-lifecycle
    held_at: "refuseUnlessDraft and refuseUnlessDraftAtRelease, lines 879-889, guarding every lifecycle operation but release, and releaseVersion, lines 837-840, guarding the one transition"
    evidence: |
      function refuseUnlessDraft(key: ICaseVersionKey, state: CaseVersionState): void {
        if (state !== DRAFT_STATE) {
          throw new CaseVersionNotDraftError(key.slug, key.version, state);
        }
      }

      function refuseUnlessDraftAtRelease(key: ICaseVersionKey, state: CaseVersionState): void {
        if (state !== DRAFT_STATE) {
          throw new CaseVersionNotDraftAtReleaseError(key.slug, key.version, state);
        }
      }
