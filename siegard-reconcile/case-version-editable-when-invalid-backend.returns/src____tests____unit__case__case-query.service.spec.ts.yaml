  - node: rules/knowledge/an-accepted-update-draft-answers-its-versions-own-stored-declared-attributes
    held_at: nowhere
    evidence: >-
      FakeCaseStore.updateDraft is defined as a stub — public async updateDraft(_slug, _version,
