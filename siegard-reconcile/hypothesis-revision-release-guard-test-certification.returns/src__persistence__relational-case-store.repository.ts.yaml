looked_past: >-
  releaseHypothesisRevisionRow (and the analogous refuseUnlessDraft/refuseUnlessDraftAtRelease
  guards on case-version) read the current state with a plain SELECT and issue the UPDATE as a
  second statement in the same transaction without row locking, leaving a theoretical
  read-then-write race under concurrent release calls — a concurrency-correctness question for
  a code review, not a divergence from any node's stated fact.
