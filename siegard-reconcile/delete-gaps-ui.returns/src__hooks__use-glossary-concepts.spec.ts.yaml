findings:
  - file: src/hooks/use-glossary-concepts.spec.ts
    where: >-
      lines 311-330, the describe block "useRemoveGlossaryConcept -- the ConceptInUseError
      statement names the concept, never the reported reference (UNDERDETERMINED...)" and its
      single test
    evidence: |-
      const capabilityMessage = await captureRemovalFailureMessage(
        refusalResponse(capabilityReference, 409),
      );
      const evidenceMessage = await captureRemovalFailureMessage(
        refusalResponse(evidenceReference, 409),
      );

      expect(evidenceMessage).toBe(capabilityMessage);
    cost: >-
      The test pins, as a passing requirement, that the operator's toast never varies with
      whether a capability or an evidence item is what still names the concept -- rules/glossary/a-registered-concept-is-never-removed
      states that the refusal reports "a reference identifying what names it" precisely
      "so the person told to keep the concept knows what to look at," yet no node decides
      whether that reference reaches the operator-facing surface distinctly or is folded away.
      The describe block's own title labels this UNDERDETERMINED and cites a delivery-record
      inference rather than a specification decision; the next reader who opens the specification
      to learn why the reference is discarded finds nothing, because the choice was made in
      the test and a proof record, never decided into the specification's own decision log.
    kind: unstated
    correction: >-
      Decide, into the specification (naming rules/glossary/a-registered-concept-is-never-removed
      or the operator-outcome rule it feeds), whether a ConceptInUseError refusal's reported
      reference must reach the operator distinctly or is deliberately folded into one statement,
      and record that decision in knowledge/decision-log.md rather than only in delivery/proof
      and this test.
    node: rules/glossary/a-registered-concept-is-never-removed
