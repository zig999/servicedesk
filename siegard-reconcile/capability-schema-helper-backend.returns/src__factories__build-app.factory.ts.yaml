looked_past: >-
  The choice to construct a separate `new OpenApiDocumentFetcher()` for each of the three controllers rather than
  sharing one instance, and the choice of the native `fetch` global as testConnectorDependencies()'s httpClient,
  are implementation choices this file makes with no stated domain fact behind them, so they are a code-review
  question rather than a conformance one.
