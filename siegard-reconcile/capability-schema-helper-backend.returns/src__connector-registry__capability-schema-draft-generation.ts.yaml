findings:
  - file: src/connector-registry/capability-schema-draft-generation.ts
    where: readableErrorDisclosingLink, lines 50-56
    evidence: |-
      const reason: OpenApiDocumentNotReadableReason & { readonly link: string } = { ...error.context, link };
      return new OpenApiDocumentNotReadableError(reason, { cause: error });
    cost: >-
      The rule fixes that an OpenApiDocumentNotReadableError refusal discloses, beside the error
      value, only the link and "nothing else of the document" — in particular not which of
      unparseable, unsupported-version or no-version-declared occurred, unlike the sibling
      fetch-failure refusal which does disclose its own three-way distinction. By spreading
      `error.context` (which carries `kind` and, per variant, `detail` or `declaredVersion`)
      into the same object that carries `link`, this is the one point where that boundary is
      drawn, and it draws it wider than the rule allows: whatever downstream layer serializes
      this error's context now has no way to tell the link apart from the document detail the
      rule says must stay server-side, so a caller inspecting the response can learn why the
      document was unreadable, not only that it was.
    kind: contradicts
    correction: >-
      Construct the propagated reason as `{ link }` alone (discarding kind/detail/declaredVersion),
      so the new error's context carries only what the rule permits disclosed.
    node: rules/integration/a-schema-draft-refusal-distinguishes-a-fetch-failure-from-an-unreadable-document
