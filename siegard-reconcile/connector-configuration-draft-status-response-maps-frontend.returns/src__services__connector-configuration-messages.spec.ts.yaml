findings:
  - file: src/services/connector-configuration-messages.spec.ts
    where: the comment claiming criterion-3 coverage and the describe/it block asserting every INVENTORY entry
    evidence: |-
      // proving criterion 3 ("every message the module holds is written in pt-BR") over the module's whole, finite inventory, not a sample of it.
      it.each(INVENTORY)("%s is non-empty and carries its expected pt-BR wording", (_label, value, expectedFragment) => { expect(value.length).toBeGreaterThan(0); expect(value).toContain(expectedFragment); });
    cost: >-
      Every INVENTORY entry is asserted against a Portuguese fragment, making "the operator-facing
      vocabulary is authored in Brazilian Portuguese" a hard requirement — yet no node in the
      specification states any language or locale requirement for these surfaces.
    kind: unstated
    correction: >-
      State the pt-BR (or whichever locale) requirement as a node the specification holds, and
      let this test verify that node's requirement rather than being its sole record.
  - file: src/services/connector-configuration-messages.spec.ts
    where: NINE_READING_NOTE_KINDS
    evidence: |-
      const NINE_READING_NOTE_KINDS = ["default-response-not-drafted", "status-range-not-drafted", "non-json-success-content-not-read", "envelope-read-through", "variants-united", "repeated-field-name-path-not-taken", "no-responses-declared", "no-success-response-schema", "success-schema-declares-no-properties"] as const;
    cost: >-
      The closed set of reading-note kinds is retyped here as a bare string-literal array with no
      link back to the module's own type, so a specification change would not be caught by this
      test.
    kind: contradicts
    node: domain/integration/connector-configuration-draft-reading-note-kind
    correction: >-
      Derive NINE_READING_NOTE_KINDS from the module's own exported type instead of re-listing
      the nine literal strings.
  - file: src/services/connector-configuration-messages.spec.ts
    where: THREE_UNRESOLVED_REASONS
    evidence: |-
      const THREE_UNRESOLVED_REASONS = ["no-capability-registered", "security-scheme-not-reducible-to-a-credential", "drafted-key-occupied-by-another-security-scheme"] as const;
    cost: >-
      The closed set of unresolved reasons is retyped here rather than read from the module's own
      type, so a reason added, renamed or removed would not be caught by comparing against it.
    kind: contradicts
    node: domain/integration/connector-configuration-draft-unresolved-reason
    correction: >-
      Derive THREE_UNRESOLVED_REASONS from the module's own exported type instead of re-listing
      the three literal strings.
