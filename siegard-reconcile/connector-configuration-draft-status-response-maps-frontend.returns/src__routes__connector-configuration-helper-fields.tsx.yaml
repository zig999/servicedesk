      {draft.methodMismatch !== undefined && (<section><p>{DRAFT_DISCLOSURE_METHOD_MISMATCH_LABEL}</p><p>{methodMismatchText(draft.methodMismatch.registered, draft.methodMismatch.operation)}</p></section>)}
