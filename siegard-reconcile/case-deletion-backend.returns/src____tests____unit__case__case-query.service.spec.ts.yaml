findings:
  - file: src/__tests__/unit/case/case-query.service.spec.ts
    where: >-
      the violations arrays pinned for a coherence refusal of CaseVersionNotValidError, at the
      concept-violation assertion (line 533), the joined action-and-concept assertion (lines
      547-550), and the readCaseInputRequirements coherence assertion (lines 750-754)
    evidence: |-
      violations: [`the concept "${CONCEPT}" does not exist in the glossary`],
      violations: [
        `the action "${ACTION}" does not exist in the glossary`,
        `the concept "${CONCEPT}" does not exist in the glossary`,
      ],
    cost: >-
      The same CaseVersionNotValidError whose message this file elsewhere pins in Brazilian
      Portuguese for a missing-hypothesis violation ('o caso não declara nenhuma hipótese', line
      502, and asserted via .message at lines 850-853) is pinned here, by three separate
      assertions, to carry an English sentence for a coherence violation. An operator reading a
      refusal that happens to fail on a concept or action coherence rule is handed wording the
      specification's own constraint says a domain refusal never carries, while the sibling
      structural refusal in the same file is correctly Portuguese — the file itself is the
      inconsistency's only record.
    kind: contradicts
    correction: >-
      The pinned violation text for a missing concept or action would have to read in Brazilian
      Portuguese, the same as the missing-hypothesis and blank-title violations already pinned
      elsewhere in this file.
    node: constraints/a-domain-refusals-message-is-written-in-brazilian-portuguese
  - file: src/__tests__/unit/case/case-query.service.spec.ts
    where: >-
      the same three violations assertions (lines 533, 549 and 753), specifically the word
      naming the concept noun
    evidence: 'the concept "${CONCEPT}" does not exist in the glossary'
    cost: >-
      This file fixes, by hard equality, the exact string the error's message carries — and that
      string names the noun this specification reserves one fixed Portuguese word for
      ("conceito") by its English word instead. A reader comparing this refusal against another
      that correctly says "conceito" has no way to tell whether the two speak of the same thing,
      which is exactly the confusion the fixed-vocabulary rule exists to close off.
    kind: contradicts
    correction: >-
      The pinned violation text would have to name the noun "conceito", never "concept", to
      match the fixed Portuguese vocabulary this file already uses correctly for "caso" and
      "hipótese".
    node: constraints/a-domain-refusal-names-each-domain-noun-by-one-fixed-portuguese-word
