findings:
  - file: src/routes/connector-configuration-create-screen.spec.ts
    where: "describe title, line 91"
    evidence: "\"ConnectorConfigurationCreateScreen -- the footer Cancel link registers nothing before it navigates (UNDERDETERMINED note: a-connector-configuration-surface-offers-a-route-to-the-listing leaves open whether the route submits before landing on the listing)\""
    cost: >-
      A reader trusting this note believes the specification leaves the submit-then-navigate ordering of the
      Cancel route undetermined, when the node it names already forecloses it in full — "Following that route
      from s issues no register-connector call and leaves every registered connector configuration exactly as
      it stood" is unconditional, not partial. A later change made on the strength of this comment could
      reintroduce a register-connector call ahead of navigation, believing an open question is being resolved
      rather than a settled one being broken.
    kind: contradicts
    node: rules/integration/a-connector-configuration-surface-offers-a-route-to-the-listing
    correction: Remove or correct the "UNDERDETERMINED" framing in the describe title; the named node already settles that the route issues no register-connector call, in either order.
  - file: src/routes/connector-configuration-create-screen.spec.ts
    where: "describe title, line 116"
    evidence: "\"ConnectorConfigurationCreateScreen -- carries no discard control (UNDERDETERMINED note: no criterion distinguishes which controls the shared footer carries on the create screen)\""
    cost: >-
      A reader trusting this note believes the specification leaves open whether the create screen's shared
      footer carries a "Discard changes" control, when the node governing that exact act already forecloses it
      for this surface — "d is offered on no surface authoring a registration at an identity nothing is
      currently registered at ... those surfaces holding no read registration for d to return the fields to."
      A future edit could add the control back to the create screen believing it fills an undecided gap rather
      than violates a settled exclusion.
    kind: contradicts
    node: rules/integration/a-loaded-registration-edit-may-be-discarded-without-leaving-the-surface
    correction: Remove or correct the "UNDERDETERMINED" framing; the node already distinguishes the create/authoring surface (holding no read registration) from a surface that loaded a registration, and excludes the discard-edit act from the former.
