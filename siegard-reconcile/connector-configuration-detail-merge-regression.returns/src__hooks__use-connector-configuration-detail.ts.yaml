findings:
  - file: src/hooks/use-connector-configuration-detail.ts
    where: "the isValidConfigurationObject function, lines 16-23"
    evidence: |
      function isValidConfigurationObject(text: string): boolean {
        const minified = getJsonTextareaMinifiedValue(text);
        if (minified === null) {
          return false;
        }
        const parsed: unknown = JSON.parse(minified);
        return typeof parsed === "object" && parsed !== null && !Array.isArray(parsed);
      }
    cost: The definition of a well-formed connector configuration — a JSON object that is neither an array nor null — now lives twice, once in the registry the node describes and again in this hook's own gate; a reader who needs to know what "well-formed" means for a connector configuration has two definitions to reconcile, and if the registry's own criterion is ever revised only one of the two copies would change, so this client gate could silently start refusing submissions the registry would now accept.
    kind: contradicts
    correction: Remove the independent object/array/null re-derivation and let the registry's own 422 refusal (surfaced through the existing onError/saveFailureMessage path) be the one place "well-formed" is decided, keeping only the JSON-syntax check the textarea field already performs.
    node: rules/integration/a-connector-configuration-holds-a-well-formed-object
  - file: src/hooks/use-connector-configuration-detail.ts
    where: "the query.isError branch of the phase computation, lines 118-126"
    evidence: |
      if (query.isError) {
        return {
          phase: "load-error",
          retryLoad: () =>
            void query.refetch();
          },
          onCancel,
        };
      }
    cost: An operator opening this surface for a connector name nothing is registered under is shown the identical "load-error" state, with a retryLoad action, as any transient failure; the retry can never succeed while nothing is registered under that name, so the operator is handed an act that promises a recovery that will never come, and cannot tell a name that is merely unreachable right now from one nothing has ever been registered under.
    kind: contradicts
    correction: Distinguish the read refused because nothing is registered under this connector name from every other failure (by inspecting the error the query carries) and return a fourth, non-retryable state for it instead of folding it into "load-error".
    node: rules/integration/a-presented-connector-configuration-states-an-outstanding-or-failed-read
