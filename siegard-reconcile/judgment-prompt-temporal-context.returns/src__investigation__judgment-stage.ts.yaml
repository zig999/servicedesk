  - node: rules/investigation/a-citation-stays-within-the-hypothesis-collects
    held_at: |-
      the HypothesisCitationContext built from hypothesis.collects for the evaluator-response path, and noDataEvaluation drawing citations directly from that hypothesis's own evidence for the no-call path
    evidence: |-
