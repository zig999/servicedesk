        investigation_id TEXT NOT NULL REFERENCES investigations (id),
looked_past: >-
  Every table in this file encodes a governed vocabulary or enumeration as a TEXT column with an
  inline REFERENCES or CHECK, and several columns 0005 declares NOT NULL (durations_writing,
  investigation_evaluation_citations.field) are later relaxed by 0015 and 0016, and a FK 0005
  declares against subject_attributes is later dropped by 0023 — each of these is a domain fact
  a later migration corrects forward and I found no live discrepancy in any of them, so none is
  reported; the schema-style choice of TEXT-plus-constraint over a native enum type is a code-review
  matter, not a domain fact, and is also not reported here.
