findings:
  - file: src/errors/case-version-not-valid.error.ts
    where: the constructor body, lines 5-10
    evidence: |-
      `the case "${slug}" at version ${version} violates its validator rules: ${violations.join('; ')}`,
      ...
      this.context = { slug, version, violations };
    cost: rules/knowledge/a-case-version-failing-validation-at-a-read-is-refused-by-name states only that this read is refused with an HTTP 409 reporting a CaseVersionNotValidError; it says nothing about the refusal naming which validator rules failed. This file makes that disclosure decision on its own — the error's message and its `context.violations` list enumerate the failed rules — with no node saying whether a caller ever learns which rule failed or only that validation failed. A later reader who wants to know what this 409 discloses looks in the specification and finds no field for it; the sibling 422 refusal (a-release-refusal-with-no-named-violation-says-so) does state its error "names every violated rule together," so the silence here reads as an oversight rather than a considered choice, and the next person to touch this file has no node to check the shape against.
    kind: unstated
    correction: state, in rules/knowledge/a-case-version-failing-validation-at-a-read-is-refused-by-name or a sibling node, whether the 409 refusal's details name the validator rules that failed, the way a-case-read-by-an-unknown-slug-or-version-is-refused states its details carry the named slug and version.
