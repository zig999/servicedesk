findings:
  - file: src/services/connector-configuration-http-departures.ts
    where: methodDeparture
    evidence: |-
      function methodDeparture(configuration: Record<string, unknown>): HttpConnectorDeparture | null {
        if (!("method" in configuration)) { return null; }
    cost: >-
      an-http-connector-configuration-declares-its-method-and-status-vocabulary requires method,
      responseMap and statusMap alike, stating that an observation reaching a configuration
      lacking any of the three issues no call and ends unavailable with a
      MalformedHttpConnectorConfigurationError. statusMapDepartures and responseMapDeparture both
      report a departure when their own key is absent, but methodDeparture returns null — no
      departure — when the method key is missing entirely.
    kind: contradicts
    node: rules/integration/an-http-connector-configuration-declares-its-method-and-status-vocabulary
    correction: >-
      methodDeparture should treat an absent method key as a departure, as statusMapDepartures
      and responseMapDeparture already do for statusMap and responseMap.
looked_past: >-
  The collectStrings/placeholderDepartures traversal walks array elements and object values
  equally when hunting placeholder text, which is a traversal-shape choice, not a domain fact.
