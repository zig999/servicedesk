  - node: rules/knowledge/a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
    held_at: >-
      the test's title and its status assertion
    evidence: >-
      'accepts a discard of a draft whose manifest holds no entry: the route answers 204 with an
      empty body, ' ... expect(response.statusCode).toBe(204);
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-discardable
    held_at: >-
      the test body as a whole
    evidence: >-
      expect(response.statusCode).toBe(204);
      expect(response.body).toBe('');

      const assembledAfterDiscard = await store.assembleVersion(slug, discardedVersion);
      expect(assembledAfterDiscard).toBeUndefined();

      const nextVersion = await store.createDraft(aCreateDraftInput(slug, glossary));
      expect(nextVersion).not.toBe(discardedVersion);
  - node: constraints/a-successful-case-version-discard-answers-with-no-content
    held_at: >-
