looked_past: >-
  The pool-acquisition race in acquireSlotOrDeadline (the orphaned acquisition.then(() =>
  pool.release()) when the deadline wins the race) and the CallPool's own queue mechanics
  are implementation choices about concurrency, not domain facts, so they are left for a
  code review rather than this pass.
