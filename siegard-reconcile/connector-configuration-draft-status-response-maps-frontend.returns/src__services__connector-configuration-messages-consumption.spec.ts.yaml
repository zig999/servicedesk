findings:
  - file: src/services/connector-configuration-messages-consumption.spec.ts
    where: the DRAFT_ROUTE fetch stub's mocked draft answer
    evidence: |-
      jsonResponse({ connector: "deepl-connector", configuration: '{"distinctive":true}', unresolved: [], generated_credentials: [] }),
    cost: >-
      This is the file's one stand-in for what draft-connector-configuration-from-openapi
      answers, and it models a complete, successful draft with only four of the seven attributes
      domain/integration/connector-configuration-draft declares required (status_readings,
      response_fields and reading_notes are absent, not even as empty arrays).
    kind: contradicts
    node: domain/integration/connector-configuration-draft
    correction: >-
      Include status_readings, response_fields and reading_notes in the mocked answer (each
      required, so an empty array where the scenario has nothing to disclose).
looked_past: >-
  Tests 1-3 check that UI labels come from the shared messages module while other labels used in
  the same file are hard-coded Portuguese strings not sourced from any constants module; wording,
  control labels and their placement are left to the interface by every surface rule in this
  pack, so this asymmetry is a code/test-consistency matter rather than a domain-fact one.
