findings:
  - file: src/hooks/use-case-simulation-cockpit-hold-dispatch-open-for-missing-requirement.spec.ts
    where: "the twoRequirementsResponse fixture, lines 27-35"
    evidence: |-
      requirements: [
        { attribute: "account-id", required: true, capabilities: [] },
        { attribute: "escalation-flag", required: false, capabilities: [] },
      ],
    cost: >-
      The fixture models a case-input-requirement carrying zero asking capabilities, for both the
      required and the optional attribute driving criterion 1 and criterion 2. A reader treating
      this proof as documentation of the wire shape learns that an entry can exist without a
      capability behind it; the domain node the entry answers to says the opposite — an attribute
      no currently-registered capability asks for is not a requirement at all — so a future read
      that produced such an entry through a real defect would pass unnoticed against this fixture
      rather than being caught by it.
    correction: >-
      Give each requirement in the fixture at least one capability entry (name and version), the
      way REQUIRED_FIELD_RESPONSE in use-case-simulation-cockpit.test-support.ts already does, so
      the fixture states a reachable case-input-requirement rather than one the domain node rules
      out.
    kind: contradicts
    node: domain/knowledge/case-input-requirement
