      RETURNING revision

looked_past: >-
  overwriteRevision (the in-place path of "revise") never calls requireCaseHoldsDraft the way
  insertRevision does before writing a hypothesis-revision, and requireCaseIdentity/
  requireHypothesisIdentity pass a synthetic NO_VERSION_NAMED (0) into CaseNotFoundError when no
  version was actually named by the caller — both are implementation questions this pass cannot
  settle without the application layer that chooses which store method to call and without the
  CaseNotFoundError class itself, neither of which is in this file; they belong to a coverage
  pass or a reading of those other files, not to this conformance judgment.
