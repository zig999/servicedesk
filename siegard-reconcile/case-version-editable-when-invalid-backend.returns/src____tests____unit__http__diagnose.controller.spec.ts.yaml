findings:
  - file: src/__tests__/unit/http/diagnose.controller.spec.ts
    where: "the test \"names the pinned case's own slug, version and state on the thrown refusal, rather than a fixed or unrelated value\", lines 102-110"
    evidence: |-
      await expect(rejection).rejects.toMatchObject({
          context: { slug: 'a-different-slug', version: 4, state: 'draft' },
        });
    cost: >-
      The specification's own refusal rule for this case (rules/investigation/only-a-released-case-version-is-diagnosed)
      says only that the attempt is "refused with an HTTP 409 response reporting a CaseVersionNotReleasedError" and
      never says what that error's details carry. This test fixes that the refusal names the pinned version's own
      slug, version and state — a disclosure decision the same node already made for the sibling CaseNotFoundError
      (decided: "the named slug and version") but never made for this error. A reader of the rule learns the status
      and the error name but not that state rides along in the payload; that fact currently lives only in this
      test.
    kind: unstated
    correction: >-
      State, in rules/investigation/only-a-released-case-version-is-diagnosed, what CaseVersionNotReleasedError's
      details/context payload carries (the named slug, version and state), the same way the log already closed this
      for CaseNotFoundError's details.
    node: rules/investigation/only-a-released-case-version-is-diagnosed
