findings:
  - file: src/http/dto/simulate-case.dto.ts
    where: "the confirmed and refuted branches of evaluationSchema, lines 40-47 and 48-55"
    evidence: |
      z.object({
          hypothesis: z.string().min(1),
          verdict: z.literal('confirmed'),
          citations: z.array(citationSchema).min(1).readonly(),
          usage: usageSchema.optional(),
          elapsed_ms: z.number().optional(),
          prompt: z.string().optional(),
        }),
    cost: "a confirmed or refuted evaluation validates against this schema with usage, elapsed_ms and prompt entirely absent, so a caller reading the API contract from this file alone learns that a decided verdict may carry no cost or timing record; the next reader who needs 'was a judgment call actually made and what did it cost' for a confirmed/refuted evaluation cannot rely on this schema to guarantee it, and has to go find the domain node to learn the fields are in fact never missing for those two verdicts"
    kind: contradicts
    correction: "drop .optional() from usage, elapsed_ms and prompt in the confirmed and refuted branches, since a call always happened to reach those verdicts; keep them optional only in the inconclusive branch, where reason no-data is the one case a call never happened at all"
    node: domain/investigation/evaluation

