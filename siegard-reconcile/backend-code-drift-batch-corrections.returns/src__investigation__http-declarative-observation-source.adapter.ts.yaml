looked_past: The generic unavailableFor(error) => error.name shape is used identically for CapabilityNotResolvedForObservationError, ConnectorConfigurationNotRegisteredError, DuplicateConceptAnswerError, ConnectorPlaceholderNotResolvedError and IncompleteConnectorCallDescriptorError, which is a code-shape choice (one helper reused across five error kinds) rather than a domain-fact finding, since none of those rules requires more than the error name in result_detail.
