findings:
  - file: src/__tests__/unit/http/release.routes.spec.ts
    where: >-
      the first test, "answers 200 with the version now in released state, read back whole
      through the published case-query and projected the same way read-case-route already
      is", lines 81-105
    evidence: |-
      expect(response.statusCode).toBe(200);
      expect(response.json()).toEqual({
        slug: releasedCase.slug,
        title: releasedCase.title,
        when_to_use: releasedCase.when_to_use,
        version: releasedCase.version,
        authored_at: releasedCase.authored_at,
        subject: releasedCase.subject,
        fallback: releasedCase.fallback,
        state: 'released',
        released_at: releasedCase.released_at,
        manifest: releasedCase.manifest,
      });
    cost: >-
      Read-case-version's own successful status is decided by
      constraints/a-successful-case-version-own-record-read-answers-with-http-200, discard's by
      constraints/a-successful-case-version-discard-answers-with-no-content, and update-draft's
      by rules/knowledge/an-accepted-update-draft-answers-its-versions-own-stored-declared-attributes
      — each names the status and exactly what the body carries. No node states what an accepted
      release answers with: neither that it is HTTP 200, nor that the body is the released
      version read back whole through case-query's read-case rather than through
      read-case-version's own stored record. A later reader who wants to know or change what a
      release call returns has nowhere in the specification to look, and this test and the
      controller it exercises are the only place that decision now lives.
    kind: unstated
    correction: >-
      add a constraint, alongside the sibling ones for read-case-version, discard and
      update-draft, stating that an accepted release answers with HTTP 200 carrying the released
      version's own attributes read back whole through contracts/knowledge/case-query's read-case
    node: domain/knowledge/case-version
read:
