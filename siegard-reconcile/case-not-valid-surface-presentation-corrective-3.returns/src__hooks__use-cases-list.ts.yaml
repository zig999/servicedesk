findings:
  - file: src/hooks/use-cases-list.ts
    where: "line 17, the `CaseVersionState` type declaration"
    evidence: |-
      export type CaseVersionState = "draft" | "released";
    cost: >-
      The two literal values are decided by the specification's own
      case-version-state enumeration, not by this file. This hook (and, independently,
      src/hooks/use-case-versions.ts, which declares the identical literal union on its
      own) each carry a private copy of that enumeration rather than deriving it from one
      shared declaration; if the specification's set of states ever changes, nothing here
      reads that change, and a reader who finds three independent copies of "draft" |
      "released" has no way to tell which one is still authoritative.
    kind: contradicts
    node: domain/knowledge/case-version-state
    correction: >-
      Replace the locally authored union with a single shared declaration derived from
      the specification's case-version-state enumeration (or import the one canonical
      frontend type), so the values are declared once rather than restated per file.
