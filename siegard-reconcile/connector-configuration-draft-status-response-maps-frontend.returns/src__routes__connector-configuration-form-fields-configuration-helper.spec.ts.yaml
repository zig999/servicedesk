looked_past: >-
  The "Request Draft is disabled only while its own request is pending" tests assert a specific
  disable/re-enable timing the specification explicitly leaves to the interface ("what that
  surface states while a draft request is outstanding is not decided here"), so this is not
  reported as an unstated-fact finding.
