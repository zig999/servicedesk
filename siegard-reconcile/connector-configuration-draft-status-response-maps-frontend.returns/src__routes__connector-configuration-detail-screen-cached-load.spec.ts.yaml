looked_past: >-
  The explanatory comment inside pendingResponse() ("Never settles: the further read of the same
  configuration stays outstanding for the whole test.") is prose about test mechanics rather than
  a domain fact weighed against the specification, and any comment-placement rule it might touch
  is a different judgment's.
