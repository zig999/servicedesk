findings:
  - file: src/hooks/use-edit-draft-version-form-not-valid-load.spec.ts
    where: the outer `describe` title, lines 51-54
    evidence: >-
      "useEditDraftVersionForm -- a draft refused by read-case with CaseVersionNotValidError is
      read " + "through read-case-version, and its own declared attributes fill the editable
      form " + "(criteria 1, 2, 3, 4, 5, 6, 7, 8;
      rules/knowledge/a-draft-versions-content-is-presented-only-from-its-own-record)"
    cost: >-
      a-draft-versions-content-is-presented-only-from-its-own-record is decided over "a case
      version v created through create-draft" and the interval before that version's own answer
      has arrived; its own decision-log entry records it as sibling to
      a-newly-created-draft-offers-no-act-before-its-own-record-arrives on exactly that ground.
      This file never creates a draft and never exercises a pending-read interval — it stubs an
      existing version refused by validation at an ordinary read. A reader following this
      citation to find where the pending-created-draft rule is proved will find this file
      instead, and a reader trying to find test coverage for
      an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
      — the node whose own decision-log entry ("a curator be able to correct a draft case
      version's own declared attributes ... without first having to place a hypothesis to make
      the version read back as a case") matches exactly what this file's assertions demonstrate
      — will not find it credited here.
    kind: contradicts
    node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
    correction: >-
      cite rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
      in the describe title instead of a-draft-versions-content-is-presented-only-from-its-own-record
