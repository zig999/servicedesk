read:
  - node: domain/knowledge/hypothesis-revision
    held_at: >-
      the reviseHypothesis call building a revision's criterion, collects and resolution, and the
      releaseRevisionDirectly helper moving that revision through release as a call made directly
      against the revision itself, independent of any case-version manifest operation
    evidence: |
      const revised = await lifecycle.reviseHypothesis({
          slug: fixture.slug,
          hypothesis_name: 'h1',
          criterion: fixture.hypothesisCriterion,
          collects: [fixture.concept],
          resolution: { outcome: fixture.outcome, referral: { action: fixture.action, recipient: fixture.recipient } },
          subject: fixture.subjectType,
        });
      ...
      async function releaseRevisionDirectly(
        connection: DatabaseConnection,
        identity: { readonly slug: string; readonly hypothesisName: string; readonly revision: number },
      ): Promise<void> {
        await createCaseLifecycle(connection).releaseHypothesisRevision(identity.slug, identity.hypothesisName, identity.revision);
      }
  - node: rules/investigation/an-answer-arrives-within-the-declared-deadline
    held_at: >-
      the TOTAL_DEADLINE_BUDGET_MS constant wired into the runner's deadline, and a dedicated test
      asserting that declared constant equals the node's own total
    evidence: |
      const TOTAL_DEADLINE_BUDGET_MS = 20_000;
      ...
      const declared = await declaredTotalDeadlineBudgetMs();

          expect(declared).toBe(20_000);
  - node: rules/knowledge/a-hypothesis-revision-moves-through-its-declared-lifecycle
    held_at: >-
      the second `it` block, which calls releaseRevisionDirectly a second time against a revision
      already released and asserts the specific refusal error class is thrown
    evidence: |
      const refusal = await releaseRevisionDirectly(connection, identity).catch((error: unknown) => error);

          expect(refusal).toBeInstanceOf(HypothesisRevisionNotDraftAtReleaseError);
looked_past: >-
  The Proxy-based delayed-connection scaffolding (wrapClient, delayedConnect,
  createDelayingConnection, boundProperty) and the file-reading self-check for
  TOTAL_DEADLINE_BUDGET_MS are test-harness technique rather than a domain fact, so they are
  outside this pass's judgment; likewise the HTTP-500 status and the
  InvestigationWriteDeadlineExceededError message/details asserted in assertDeadlineExceeded were
  checked against rules/investigation/no-stage-aborts-on-its-deadline (found by searching the
  specification root, outside this file's node pack and outside the supplied candidate index) and
  conform to that node's own statement, so they are not reported as findings here.
