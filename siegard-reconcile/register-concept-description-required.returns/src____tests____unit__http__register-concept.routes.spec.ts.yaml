    where: "the third 422 test, lines 200-211 (\"answers 422 reporting a ConceptDescriptionRequiredError for a request whose body carries an explicit empty-string description, exactly as one naming no description at all\")"
    evidence: |
      payload: validBody({ description: '' }),

      expect(response.statusCode).toBe(422);
      expect(response.json()).toMatchObject({ error: { code: 'ConceptDescriptionRequiredError' } });
