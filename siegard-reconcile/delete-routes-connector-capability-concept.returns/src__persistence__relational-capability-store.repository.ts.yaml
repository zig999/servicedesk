read:
  - node: constraints/the-stored-schema-mirrors-the-declared-model
    held_at: >-
      the ICapabilityRow interface and the column lists of the SELECT and
      upsert statements, which enumerate exactly the nine attributes
      domain/integration/capability declares
    evidence: |-
      SELECT name, version, nature, input_schema, output_schema, timeout, connector, concept, payload_notes
             FROM ${CAPABILITIES_TABLE}
  - node: constraints/the-system-persists-to-one-relational-database
    held_at: >-
      the single injected DatabaseConnection the class is built around, and
      the transactional write/delete paths that run through it
    evidence: |-
      public constructor(private readonly connection: DatabaseConnection) {}
  - node: contracts/integration/capability-registry
    held_at: >-
      the three public methods — readCapabilities, writeCapabilities,
      deleteCapability — which back the registry's read, register and remove
      operations
    evidence: |-
      public async readCapabilities(): Promise<readonly Capability[]> {
      public async writeCapabilities(capabilities: readonly Capability[]): Promise<void> {
      public async deleteCapability(name: string, version: string): Promise<void> {
  - node: domain/integration/capability
    held_at: toCapability(), which maps a stored row back into a Capability carrying all nine declared attributes
    evidence: |-
      return {
          name: row.name,
          version: row.version,
          nature: row.nature,
          input_schema: row.input_schema,
          output_schema: row.output_schema,
          timeout: row.timeout,
          connector: row.connector,
          concept: row.concept,
          ...(row.payload_notes !== null && row.payload_notes !== '' ? { payload_notes: row.payload_notes } : {}),
        };
  - node: domain/integration/capability-nature
    held_at: >-
      isCapabilityNature(), which checks a stored value against the imported
      CAPABILITY_NATURE_VALUES set rather than redeclaring the enumeration
    evidence: |-
      const CAPABILITY_NATURE_VALUES: ReadonlySet<string> = new Set<string>(CAPABILITY_NATURES);
      function isCapabilityNature(value: string): value is CapabilityNature {
        return CAPABILITY_NATURE_VALUES.has(value);
      }
  - node: domain/integration/capability-registry
    held_at: >-
      writeCapabilities and deleteCapability, the persistence backing for
      the domain service's register-capability and remove-capability
      operations; resolve-concept has no counterpart here
    evidence: |-
      public async writeCapabilities(capabilities: readonly Capability[]): Promise<void> {
      public async deleteCapability(name: string, version: string): Promise<void> {
