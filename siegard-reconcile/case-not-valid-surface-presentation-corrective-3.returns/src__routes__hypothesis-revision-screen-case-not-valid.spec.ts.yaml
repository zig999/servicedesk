findings:
  - file: src/routes/hypothesis-revision-screen-case-not-valid.spec.ts
    where: >-
      LOAD_ERROR_TEXT (line 30) asserted identically for the glossary/revisions-read failures
      (lines 184, 199) and for the draft version's own read failing to complete or being
      refused with an unrecognized code (lines 230, 248)
    evidence: >-
      const LOAD_ERROR_TEXT = "Unable to load this form right now.";
      ... expect(await screen.findByText(LOAD_ERROR_TEXT)).toBeTruthy(); (glossary failure,
      line 184; hypothesis-revisions failure, line 199; unmapped GET VERSION_PATH refusal,
      line 230; GET VERSION_PATH network failure, line 248)
    cost: >-
      a curator whose own anchoring-version read stalls or is refused for an unrecognized
      reason sees the exact same notice a curator sees when only the glossary or the
      hypothesis's own revisions failed to load, so nothing on screen tells them which of the
      three reads to retry — the confusion the node's distinctness requirement exists to rule
      out.
    kind: contradicts
    node: rules/knowledge/a-hypothesis-composition-states-which-of-its-reads-did-not-complete
    correction: >-
      the screen (and this spec) would need a statement worded distinctly for the anchoring
      version's own read not completing, separate from the text used for a glossary or
      revisions read not completing, and this file would assert that distinct text for the
      GET VERSION_PATH failure cases rather than reusing LOAD_ERROR_TEXT.
looked_past: >-
  block 1 (lines 45-70) never asserts the absence of NOT_VALID_TEXT when the composition form
  renders on a refused draft-version read, and describe-block labeling/cleanup style (manual
  cleanup, criterion numbering) is left to a code-quality pass rather than reported here.
