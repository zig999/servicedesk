findings:
  - file: src/investigation/investigation-factory.ts
    where: "BuildInvestigationOptions, line 35, and the return statement of buildInvestigation(), line 59"
    evidence: "readonly written_at?: string;"
    cost: "written_at is the one required attribute the domain model marks as a datetime an audit needs to recover the record's own creation instant, yet nothing here stops buildInvestigation from returning a built Investigation with written_at absent — unlike evidence and evaluations, whose totality the same factory actively refuses to build without (refuseTotalityViolations), a caller omitting written_at is never refused. A reader trusting the node's own description of this factory as one that \"cannot build an invalid instance\" will not expect the one required datetime attribute to be the sole field silently allowed to go missing."
    kind: contradicts
    node: domain/investigation/investigation
    correction: "Either drop the `?` from written_at in BuildInvestigationOptions and require every call site to supply it, or have buildInvestigation itself refuse to return when written_at is absent, the same way refuseTotalityViolations already refuses an incomplete evidence or evaluation set."

