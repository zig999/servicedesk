findings:
  - file: src/investigation/run-diagnosis.ts
    where: "buildInvestigationOptions, line 72, and investigationForRetry, lines 113-115"
    evidence: |
      written_at: new Date(readClockMs()).toISOString(), // in buildInvestigationOptions, evaluated before writeWithinDeadline is ever called — and, on retry: return { ...investigation, written_at: new Date(readClockMs()).toISOString() };
    cost: "written_at is read from the local clock at record-assembly time — before persistence is even attempted — and, on a retry, again from the local clock immediately before that second write is dispatched; neither reading is the store's own confirmation that a write settled. Persisted this way, an audit reading written_at to learn when the record came into being instead reads the moment the response pipeline finished assembling the investigation (or the moment the retry was issued), drifting from the true persist instant by however long that write actually took to settle — the exact confusion the rule exists to prevent, and it is silent in the code: nothing here computes or waits for a settle-time reading at all."
    correction: "Stamp written_at from a reading taken after the store confirms the write that actually persists the record has settled, not from a clock read taken before that write is dispatched — for both the first attempt and the retry."
    node: rules/investigation/written-at-records-when-the-write-settled
