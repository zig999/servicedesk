  - node: rules/integration/the-input-schema-and-output-schema-fields-are-untouched-by-a-schema-drafts-arrival
    held_at: nowhere
    evidence: |-
      const { unmount } = renderFields(stateWith({ stale: true }));
      expect(screen.getByText(/desatualizado/i)).toBeTruthy();
      The test that renders the drafted state only checks the stale statement's presence; it makes no assertion about the Input schema or Output schema fields' own content before or after the draft's arrival.
  - node: rules/integration/applying-a-drafted-capability-schema-changes-only-the-local-edit
    held_at: the second `it` block ("keeps both Apply buttons rendered and enabled while the draft is stale, ...")
    evidence: |-
      const buttons = screen.getAllByRole("button", { name: "Aplicar" });
      expect(buttons).toHaveLength(2);
      expect(buttons.every((button) => !button.hasAttribute("disabled"))).toBe(true);

      const [inputButton, outputButton] = buttons;
      ...
      inputButton.click();
      outputButton.click();

      expect(onApplyInputSchema).toHaveBeenCalledWith(DISTINCTIVE_DRAFT.input_schema);
      expect(onApplyOutputSchema).toHaveBeenCalledWith(DISTINCTIVE_DRAFT.output_schema);
  - node: rules/integration/a-stated-capability-schema-draft-is-marked-stale-once-what-it-was-generated-for-changes
    held_at: the two `it` blocks under the "stale drafted disclosure" and "still offers the act applying" describes
    evidence: |-
      const { unmount } = renderFields(stateWith({ stale: true }));
      expect(screen.getByText(/desatualizado/i)).toBeTruthy();
      unmount();

      renderFields(stateWith({ stale: false }));
      expect(screen.queryByText(/desatualizado/i)).toBeNull();
      ...
      renderFields(stateWith({ stale: true }), { onApplyInputSchema, onApplyOutputSchema });
      const buttons = screen.getAllByRole("button", { name: "Aplicar" });
      expect(buttons.every((button) => !button.hasAttribute("disabled"))).toBe(true);
  - node: scenarios/integration/a-cleared-operation-choice-leaves-a-stated-schema-draft-stale
    held_at: nowhere
    evidence: |-
      chosenOperation: undefined,
      onChooseOperation: () => {},
      ...
      renderFields(stateWith({ stale: true }));
      `stale` is injected directly as a boolean override; the file never drives staleness by naming a different link or clearing a chosen operation, so the scenario's own causal chain is not exercised here.
looked_past: This file's scope is the presentational stale-marking and apply-offer behavior of CapabilitySchemaHelperFields given a `stale` boolean already computed elsewhere; whether that boolean is itself derived correctly from a changed link or operation, and the confirmation guard over an unsubmittedly-edited field, are not exercised here, which reads as a coverage question for the hook-level tests rather than a fact this file states wrongly.
