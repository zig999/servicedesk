findings:
  - file: src/persistence/relational-glossary-store.repository.ts
    where: readTerms (lines 30-36) and readWholeConcepts (lines 111-119)
    evidence: |-
      return runStatement<GlossaryTerm>(
            this.connection,
            { text: `SELECT name FROM ${VOCABULARY_TABLES[vocabulary]}` },
            raiseReadFailure,
          );
      ...
      return rows.map((row) => ({ name: row.name, accepts: accepts.get(row.name) ?? [], ttl: row.ttl, description: row.description }));
    cost: >-
      If the underlying table ever holds two rows sharing one name, readTerms and readConcepts
      hand both rows to the caller silently instead of refusing the read — the caller never sees
      the distinct HTTP 500 DuplicateGlossaryNameError the rule promises, so a corrupted store is
      read as an odd-but-valid one and the next reader has to notice a duplicate downstream rather
      than trusting the store layer to have already refused it.
    kind: contradicts
    correction: >-
      readTerms and readWholeConcepts would need to check the rows they are about to return for a
      repeated name and raise a failure carrying DuplicateGlossaryNameError instead of returning
      the rows unchecked.
    node: rules/glossary/a-vocabulary-holds-each-name-once

