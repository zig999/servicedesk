findings:
  - file: src/__tests__/unit/errors/openapi-document-not-readable.error.spec.ts
    where: "the third test, lines 17-21, 'carries only the kind in context for a no-version-declared outcome, naming no other field'"
    evidence: |-
      const error = new OpenApiDocumentNotReadableError({ kind: 'no-version-declared' });

        expect(error.context).toEqual({ kind: 'no-version-declared' });
    cost: "The node requires this refusal to name what failed to parse or which version was declared; this test locks in a third outcome that names neither, so an operator who gets a document declaring no version at all is told less than the node promises every reader of this refusal, and the gap is discoverable only by reading this test rather than the specification."
    kind: contradicts
    correction: "Either carry a field naming what is missing (e.g. that no version was declared, as the fact actually named) so the case satisfies the node's disjunctive disclosure, or fold this case into 'unsupported-version'/'unparseable' with the field that disjunction already requires — decided in the specification, not left to this test alone."
    node: rules/integration/a-malformed-or-unsupported-openapi-document-refuses-the-draft

looked_past: "The test asserting the built message never embeds the underlying parse exception's own text (lines 40-49) mirrors the non-disclosure treatment the specification states elsewhere for a sibling error's underlying failure text; it is folded into the finding above rather than raised separately since it names no fact beyond what that finding already covers."
