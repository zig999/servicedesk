findings:
- file: src/__tests__/unit/investigation/investigation-factory.spec.ts
  where: the aDurations fixture, line 141-143 (its default is reused by validOptions() across nearly every test in the file)
  evidence: 'return { collection: 10, judgment: 20, writing: 5, total: 35, ...overrides };'
  cost: the one default durations value every test in the file draws on embodies total as exactly collection + judgment + writing (10+20+5=35); a reader treating this fixture as an example of a valid Durations value — the way test fixtures ordinarily are read — takes away that total is the sum of the stages, the opposite of what the specification states, and may carry that assumption into a load-test comparison or a new fixture that actually depends on the relationship
  kind: contradicts
  correction: give the fixture a total that is not the sum of its own collection, judgment and writing (e.g. one that includes overhead/gaps), so the default no longer models the relationship the node forbids
  node: domain/investigation/durations
