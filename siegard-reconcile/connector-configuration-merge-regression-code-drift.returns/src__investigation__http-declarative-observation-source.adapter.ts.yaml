findings:
  - file: src/investigation/http-declarative-observation-source.adapter.ts
    where: "httpConfigurationProblems, line 259"
    evidence: "problems.push('method is not one of GET, POST, PUT, PATCH, DELETE');"
    cost: "The allowed-method list is hand-typed a second time here, separate from the HTTP_METHODS constant the same function actually validates against; if the specification's rule ever changes which methods a connector configuration may declare, this literal string can go stale and mislead an operator reading the resulting error about what the rule currently permits, while the check itself (driven by the import) would already have moved on."
    kind: contradicts
    correction: "Build the message from HTTP_METHODS rather than repeating the method list as a literal string."
    node: rules/integration/an-http-connector-configuration-declares-its-call
  - file: src/investigation/http-declarative-observation-source.adapter.ts
    where: "httpConfigurationProblems, line 265"
    evidence: "problems.push('statusMap is not a plain object mapping a status to one of ok, unavailable, denied, timeout');"
    cost: "The evidence-result enumeration (ok, unavailable, denied, timeout) is domain/investigation/evidence-result's own vocabulary; hand-typing it again here, rather than deriving the message from EVIDENCE_RESULTS, gives that vocabulary a second home that can silently drift from the node the next time an ending is added, renamed or removed."
    kind: contradicts
    correction: "Build the message from EVIDENCE_RESULTS rather than repeating the four ending names as a literal string."
    node: domain/investigation/evidence-result

