    held_at: HYPOTHESIS_REVISION_DRAFT_STATE/RELEASED_STATE, hypothesisRevisionStateOf
    evidence: "function isHypothesisRevisionState(value: string): value is HypothesisRevisionState {\n  return HYPOTHESIS_REVISION_STATE_VALUES.has(value);\n}"

