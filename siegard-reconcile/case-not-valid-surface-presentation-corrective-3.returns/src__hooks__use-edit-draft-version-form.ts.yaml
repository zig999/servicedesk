looked_past: >-
  The version===null branch always resolves to `{ phase: "loading" }` before the later `throw
  new Error(...)` guards on the release/discard paths can ever run, and the SaveStatus,
  telemetry and formatSavedAt plumbing are implementation shape rather than a stated domain
  fact; both are a different pass's concern, not this one's.
