    where: "the describe/it text and literal fixture value at lines 255-262"
    evidence: |-
      describe("ConnectorConfigurationDraftUnresolvedItem -- reason is a plain string, not narrowed to the closed set of four reason literals (inference)", () => {
        it("type-checks a reason value outside the closed reason set", () => {
          const buildItem = (): ConnectorConfigurationDraftUnresolvedItem => ({
            name: "api-key",
            reason: "a-reason-the-closed-four-value-set-does-not-name",
          });
    cost: A reader trusting this test's own description learns the unresolved reason vocabulary has four members; the specification's own enumeration has three (no-capability-registered, security-scheme-not-reducible-to-a-credential, drafted-key-occupied-by-another-security-scheme), so the next person who adds or checks a fourth reason against this test's account is working from a count the specification never gave.
    kind: contradicts
    node: domain/integration/connector-configuration-draft-unresolved-reason
    correction: "Restate the describe title and the literal fixture value against the three-member set the node actually holds, rather than a four-member one."
