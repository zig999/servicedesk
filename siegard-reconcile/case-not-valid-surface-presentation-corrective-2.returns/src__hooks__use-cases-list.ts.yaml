  - node: domain/knowledge/case-summary
    held_at: >-
      the `CaseSummary` type declaration and its construction in `fetchCaseListEntry` /
      `releasedInfo`: `current_state`/`last_updated` are populated only once at least one
      version exists, and `title`/`when_to_use`/`released_version` only once a released
      version is found, matching the node's presence conditions field for field
    evidence: |-
      export type CaseSummary = {
        readonly versionCount: number;
        readonly currentState?: CaseVersionState;
        readonly lastUpdated?: string;
        readonly title?: string;
        readonly whenToUse?: string;
        readonly releasedVersion?: number;
      };
      ...
      return {
        slug,
        summary: {
          versionCount,
          currentState: highest.state,
          lastUpdated: detail.authored_at,
          ...released,
        },
      };
  - node: rules/knowledge/a-case-listing-states-a-current-version-that-does-not-read-back-in-that-cases-entry-alone
    held_at: >-
      the `CaseListEntry` union together with the catch branch in `fetchCaseListEntry`: when
      the highest version's detail fetch reports `case-not-valid`, the function returns only
      the slug and the `notValid` flag, carrying none of the summary fields
    evidence: |-
      } catch (error) {
        if (errorStateKind(error) === "case-not-valid") {
          return { slug, notValid: true };
        }
        throw error;
      }
looked_past: >-
  fetchCasesWithSummaries calls `/v1/cases` with no limit/offset and the highest-version lookup
  assumes the versions endpoint returns highest-numbered-first -- both are API-ordering/pagination
  assumptions rather than domain facts this file states on its own authority, and the
  case-query contract that would settle them is bound to cases-list-screen.tsx, not this file.
