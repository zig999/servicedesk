looked_past: The assertion that the Release trigger and Dialog confirm never carry a "destructive" CSS variant, and the test covering a loaded version record missing its required `state` field entirely, are a styling choice and a defensive-coding choice for data the specification's own read-validation already rules out, respectively — neither is a domain fact, so neither is reported here.
