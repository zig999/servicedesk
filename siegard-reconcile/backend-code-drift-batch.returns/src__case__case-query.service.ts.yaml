findings:
  - where: readCaseInputRequirements(), lines 41-46
    evidence: |-
      const assembled = await heldVersion(this.caseStore, slug, version);
      const theCase = structuralCase(assembled, slug, version);
      const registeredCapabilities = await everyRegisteredCapability(this.capabilities);
      return deriveCaseInputRequirements(theCase, registeredCapabilities);
    cost: readCase, reading the same stored version, refuses with CaseVersionNotValidError whenever a coherence violation exists (a glossary term or concept the case names no longer resolves, a concept the subject type no longer accepts, a capability that stopped answering). readCaseInputRequirements runs structuralCase but never refuseIncoherence/caseCoherenceViolations on that same version, so it derives and returns input requirements for a version the specification treats as not currently readable as a case at all — a curator composing against, or any caller reading, a version whose glossary terms currently fail to resolve gets a computed answer instead of the refusal read-case gives for the identical content, and nothing in this file marks that the two reads diverge on this.
    kind: contradicts
    correction: readCaseInputRequirements would need to run the same coherence check readCase runs (refuseIncoherence or equivalent) before deriving input requirements, unless the specification is amended to state an explicit exception for this read.
    node: rules/knowledge/validation-runs-at-every-read
