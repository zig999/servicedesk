  - node: rules/knowledge/a-case-read-by-an-unknown-slug-or-version-is-refused
    held_at: >-
      The 404 test asserts CaseNotFoundError with details carrying the named slug and version.
    evidence: |-
      built.readCaseVersion.mockRejectedValueOnce(new CaseNotFoundError('an-absent-slug', 9));
      ...
      expect(response.statusCode).toBe(404);
      const body = response.json() as { error: { code: string; details?: unknown } };
      expect(body.error.code).toBe('CaseNotFoundError');
      expect(body.error.details).toEqual({ slug: 'an-absent-slug', version: 9 });
  - node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
    held_at: >-
      The first two tests assert HTTP 200 regardless of whether the version fails a validator rule (empty
      manifest, or an unregistered subject), and the third asserts the body carries the declared attributes
      exactly as the mocked stored record held them. The consolidation-absent test, however, states the
      contrary of this node's own explicit-statement requirement (see findings).
    evidence: |-
      built.readCaseVersion.mockResolvedValueOnce({ version: heldAttributes({ subject: 'an-unregistered-subject-type' }) });
      const response = await app.inject({ method: 'GET', url: '/v1/cases/a-slug/versions/2/declared-attributes' });
      expect(response.statusCode).toBe(200);
      expect((response.json() as { subject: string }).subject).toBe('an-unregistered-subject-type');
  - node: constraints/a-successful-case-version-own-record-read-answers-with-http-200
    held_at: >-
      Both the failing-validation draft read and the fully-valid version read assert HTTP 200.
    evidence: |-
      expect(draftResponse.statusCode).toBe(200);
      expect(validatingResponse.statusCode).toBe(200);
  - node: constraints/a-malformed-request-is-refused-with-a-validation-error
    held_at: >-
      The non-integer version segment test asserts HTTP 400, code VALIDATION_ERROR, a message naming the
      path, and a non-empty details list, and that the domain read was never called.
    evidence: |-
      expect(response.statusCode).toBe(400);
      const body = response.json() as { error: { code: string; message: string; details?: unknown } };
      expect(body.error.code).toBe('VALIDATION_ERROR');
      expect(body.error.message).toMatch(/path/);
      expect(body.error.details).toEqual(expect.arrayContaining([expect.stringContaining('version')]));
      expect(built.readCaseVersion).not.toHaveBeenCalled();
