      part of this file that substantiates "requesting a draft issues no register-capability call".
    evidence: |-
      expect(calls.map((call) => call.url)).toEqual([DRAFT_ROUTE]);
  - node: rules/integration/an-answered-schema-draft-request-states-its-draft-to-the-operator
    held_at: >-
      the "a 200 answer's draft is exposed with exactly its declared top-level fields" and "each
      unresolved item is exposed with exactly its name and reason" blocks (lines 124-171).
    evidence: |-
      expect(outcome.draft).toEqual({
        input_schema: FULL_DRAFT.input_schema,
        output_schema: FULL_DRAFT.output_schema,
        unresolved: FULL_DRAFT.unresolved,
      });
