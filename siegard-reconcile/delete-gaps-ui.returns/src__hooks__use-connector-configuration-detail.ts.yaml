looked_past: >-
  The two-step "ask, then confirm" gate `a-removal-surface-offers-a-control-behind-a-further-explicit-act`
  requires, and whether `onSubmit`'s lack of an `isDirty` check is safe, both turn on how
  `connector-configuration-detail-ready-view.tsx` wires the exposed `onRemove`, `isDirty`
  and `onSubmit` — that file is outside this review's file set, so whether the control
  layer actually supplies the missing gate is that file's own question, not reported here.
