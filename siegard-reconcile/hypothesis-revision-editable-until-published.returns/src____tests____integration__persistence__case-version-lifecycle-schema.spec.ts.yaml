findings:
  - file: src/__tests__/integration/persistence/case-version-lifecycle-schema.spec.ts
    where: "the `it` block at lines 208-214, \"defaults a newly created case row (no case_versions row at all) to next_version 1\""
    evidence: "expect(rows[0]?.next_version).toBe(1);"
    cost: "domain/knowledge/case's own next_version attribute says only that it is 'always greater than every version number this case has ever held, including one later discarded' — a condition any starting value satisfies vacuously for a case with no versions yet. The migration that sets DEFAULT 1 (0009) says outright this is 'not a claim about what any later-created case's own first draft is numbered'. This test asserts exactly that claim as an established fact, so a reader who takes the test as authoritative will treat 1 as decided when no node ever decided it."
    kind: unstated
    correction: "State, on domain/knowledge/case or rules/knowledge/a-case-version-number-is-never-reused, what a case holding no versions yet is first assigned, and disclose the decision in decision-log.md."
  - file: src/__tests__/integration/persistence/case-version-lifecycle-schema.spec.ts
    where: "the `it` block at lines 592-603, \"defaults a newly-inserted case_versions row that does not name its own state to 'released' ...\""
    evidence: "expect(result.rows[0].state).toBe('released');"
    cost: "No node in domain/knowledge/case-version or its state vocabulary states what a case_versions row that omits its own state resolves to. The test locks in 'released' — the terminal, immutable state — as that default, meaning any write path that forgets to name state silently produces an unchangeable version rather than an editable draft; a reader looking for this consequential default in the specification will not find it, only in this test and the migration's own DEFAULT clause."
    kind: unstated
    correction: "State, on domain/knowledge/case-version or its state rule, what an omitted state resolves to (or that state must always be supplied), and disclose the decision in decision-log.md."
