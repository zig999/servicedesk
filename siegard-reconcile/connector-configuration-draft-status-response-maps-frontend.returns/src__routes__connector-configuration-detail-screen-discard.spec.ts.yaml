looked_past: >-
  The behaviors this file actually exercises — withholding and enabling the Discard control on
  whether an edit exists, gating the reset with a plain confirmation dialog, leaving the edit
  untouched on "Keep editing", and falling back to the just-saved configuration — read as
  conformant to rules/integration/a-loaded-registration-edit-may-be-discarded-without-leaving-the-surface
  and rules/integration/a-successful-connector-registration-lands-on-the-configurations-own-surface,
  neither in this delegation's node set, so no finding is reported against either; the dialog's
  exact wording and its button styling are left to the interface by those same nodes and by the
  surface rules in this set.
