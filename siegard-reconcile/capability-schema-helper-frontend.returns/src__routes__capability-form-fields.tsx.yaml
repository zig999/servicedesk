looked_past: >-
  The apply-confirmation dialog component is named ConnectorConfigurationApplyConfirmationDialog
  yet reused here for the capability schema fields, and the per-field "unsubmitted edit" signal
  falls back to `value !== ""` when `isDirty` is undefined — both are implementation choices
  inside a file (use-apply-to-json-schema-field.ts) outside this set, not a domain-fact
  discrepancy this file itself states.
