findings:
  - file: src/routes/case-simulation-subject-panel.spec.ts
    where: "the last it() in the describe block \"every asking capability for a requirement is shown by its own name, version and connector, never only one (criterion 4)\", lines 166-173"
    evidence: |-
      it("renders no capability list under a requirement whose own capabilities array is empty (edge case: no currently-registered capability resolves)", async () => {
          await renderPanel(
            baseState({ requiredFields: [buildRequiredField({ attribute: "account-id", capabilities: [] })] }),
          );
          const [row] = requirementRows();
          expect(within(row).queryByRole("list")).toBeNull();
        });
    cost: |-
      domain/knowledge/case-input-requirement declares its capabilities relationship 1..* and says
      outright that "an attribute nobody currently asks for is not a requirement at all" — a
      requirement the derivation produces at all always names at least one asking capability.
      This test builds and locks in rendering behavior for exactly the state the node says cannot
      occur: a present requirement with a zero-length capabilities array, calling it a legitimate
      "edge case." Any future branch written to satisfy this test would have no node behind it.
    correction: "Drop the empty-capabilities fixture and assertion, or replace it with the case the node actually admits — a requirement absent from the set entirely."
    kind: contradicts
    node: domain/knowledge/case-input-requirement
