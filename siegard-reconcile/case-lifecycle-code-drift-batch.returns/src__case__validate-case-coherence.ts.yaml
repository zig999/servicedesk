findings:
  - file: src/case/validate-case-coherence.ts
    where: >-
      capabilityViolations (lines 102-111) and answerGaps (lines 113-129)
    evidence: |
      function answerGaps(concept: string, resolution: CapabilityResolution): string[] {
        if (!resolution.held) {
          return [`no read-only capability currently answers the concept "${concept}"`];
        }
        const { capability } = resolution;
        const gaps: string[] = [];
        if (capability.nature !== READ_ONLY_NATURE) {
          gaps.push(answeringGap(concept, 'is not read-only'));
        }
        if (!declaresText(capability.output_schema)) {
          gaps.push(answeringGap(concept, 'declares no output schema'));
        }
        if (!declaresTimeout(capability.timeout)) {
          gaps.push(answeringGap(concept, 'declares no timeout'));
        }
        return gaps;
      }
    cost: >-
      A reader who follows this rule's binding to this file to see how a case version's input
      requirements are derived — one case-input-requirement per subject attribute, its `required`
      taken from whichever answering capability's own input schema names it — finds instead a
      check that the concept's answering capability is read-only and declares an output schema
      and a timeout; `capability.input_schema` is never read here and no per-attribute
      requirement is ever assembled, so the binding points at code answering a different
      question (which capability answers the concept and whether it is fit to be read from) than
      the one the statement names.
    kind: contradicts
    correction: >-
      Either rebind this rule away from this file to wherever the input-schema-driven
      requirement set is actually assembled, or add here the derivation the statement requires:
      one case-input-requirement per subject attribute an answering capability's own input
      schema names in `properties`, with `required` taken from that schema's own `required` list.
    node: rules/knowledge/a-case-versions-input-requirements-are-derived

