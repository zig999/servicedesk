looked_past: >-
  createReadCaseVersionRoutesPlugin is wired with dependencies.readCase rather than a
  distinctly-named field, and BuildAppDependencies declares no separate readCaseVersion
  dependency — a naming/structure choice, not a domain fact, so it is left for a code review
  rather than reported here.
