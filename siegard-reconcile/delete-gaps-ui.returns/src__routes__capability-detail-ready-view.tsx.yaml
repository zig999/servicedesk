findings:
  - file: src/routes/capability-detail-ready-view.tsx
    where: >-
      the trailingActions block, between the Remove capability dialog (lines 87-111) and
      the Cancel/Capabilities controls — the only outcome-disclosure element present is
      for the save operation, at lines 112-116
    evidence: |-
      {state.justSaved && (
        <p role="status" className="text-sm text-foreground">
          Saved.
        </p>
      )}
    cost: >-
      An operator who confirms "Remove capability" and has the removal refused — for
      instance because a collected evidence item still names the capability — sees the
      confirmation dialog close and then nothing: this surface's only outcome text is
      "Saved.", gated on state.justSaved, which reports the save operation alone. The
      operator is left unable to tell whether the further explicit act they just took did
      anything, on the one surface required to tell them.
    kind: contradicts
    node: rules/integration/a-submitted-removal-states-its-outcome-to-the-operator
    correction: >-
      Render the removal's own outcome on this surface — success, or the specific
      refusal condition the api's answer named — the same way state.justSaved already
      renders the save outcome.
