    evidence: |-
      const capability = await sources.capabilityQuery.readCapability(concept);
        if (capability.held) {
          return { named: true, reference: 'capability' };
        }
  - node: domain/investigation/citation
    held_at: "the third branch of resolveConceptUsage, lines 33-35"
