findings:
  - file: src/hooks/use-case-creation-form.ts
    where: "mutationFn's request-body construction, `authored_at: new Date().toISOString()`"
    evidence: |-
      const body: CreateDraftRequestBody = {
        slug: values.slug,
        authored_at: new Date().toISOString(),
    cost: >-
      The decision log's own reason for requiring authored_at is "an audit of which procedure
      was current when an old investigation ran," yet no node says whose clock or which moment
      the field records. This hook fixes that meaning unilaterally — the browser's local clock
      at the instant the mutation fires, rather than a server-assigned receipt time — so a
      skewed client clock can misstate the audit trail without breaking anything the
      specification checks, and the next reader auditing authored_at's precision will look in
      domain/knowledge/case-version and find only "required, datetime," not this rule.
    kind: unstated
    correction: >-
      domain/knowledge/case-version's authored_at attribute (or contracts/knowledge/case-lifecycle's
      create-draft operation) would need to state whether authored_at is client-submitted or
      server-assigned, and at which moment of the act it is taken.
