read:
  - node: contracts/knowledge/case-query
    held_at: >-
      the ICaseQuery interface's six method signatures, lines 27-43
    evidence: |
      readCase(slug: string, version: number): Promise<ReadCaseResult>;

        readCaseVersion(slug: string, version: number): Promise<ReadCaseVersionResult>;

        listCases(pagination: PaginationRequest): Promise<PaginatedResponse<CaseCatalogEntry>>;

        listCaseVersions(slug: string, pagination: PaginationRequest): Promise<PaginatedResponse<CaseVersionListItem>>;

        listHypotheses(slug: string, pagination: PaginationRequest): Promise<PaginatedResponse<HypothesisIdentity>>;

        listHypothesisRevisions(
          slug: string,
          hypothesisName: string,
          pagination: PaginationRequest,
        ): Promise<PaginatedResponse<HypothesisRevisionListItem>>;
  - node: domain/knowledge/case
    held_at: >-
      the slug: string parameter shared by every operation that names a case
    evidence: >-
      listCaseVersions(slug: string, pagination: PaginationRequest): Promise<PaginatedResponse<CaseVersionListItem>>;
  - node: domain/knowledge/case-version
    held_at: >-
      the CaseVersionAttributes type (lines 15-21) and the version: number
      parameter shared by readCase and readCaseVersion
    evidence: |
      export type CaseVersionAttributes = {
        readonly title: string;
        readonly when_to_use: string;
        readonly subject: string;
        readonly fallback: Resolution;
        readonly consolidation_register?: ConsolidationRegister;
      };
  - node: domain/knowledge/hypothesis
    held_at: >-
      the hypothesisName: string parameter of listHypothesisRevisions, line 41
    evidence: >-
      listHypothesisRevisions(
        slug: string,
        hypothesisName: string,
        pagination: PaginationRequest,
      ): Promise<PaginatedResponse<HypothesisRevisionListItem>>;
  - node: domain/knowledge/hypothesis-revision
    held_at: nowhere
    evidence: >-
      HypothesisRevisionListItem is only imported and used as the return item type of
      listHypothesisRevisions; this file declares none of the revision's own attributes
      (revision, criterion, collects, resolution, state).
