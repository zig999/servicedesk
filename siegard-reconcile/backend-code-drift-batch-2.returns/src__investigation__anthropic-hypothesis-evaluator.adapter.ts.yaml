    held_at: >-
      the outcome-construction functions noDataOutcome, judgmentFailureOutcome, notGroundedOutcome
      and the confirmed/refuted branches of outcomeFromModelText (lines 91-126), which build the
      hypothesis-less evaluation shape (verdict, reason, citations, usage, elapsed_ms, prompt) with
      the conditional presence the node describes.
    evidence: >-
      return {
        verdict: 'inconclusive',
        reason: 'no-data',
        citations: nonOkEvidence.map((item): Citation => ({ concept: item.concept })),
      }; (no usage/elapsed_ms/prompt, matching "absent when reason `no-data`") versus
