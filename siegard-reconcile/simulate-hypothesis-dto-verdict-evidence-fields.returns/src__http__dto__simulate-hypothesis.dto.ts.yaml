findings:
  - file: src/http/dto/simulate-hypothesis.dto.ts
    where: "usageSchema, lines 35-38"
    evidence: |
      const usageSchema = z.object({
        input_tokens: z.number(),
        output_tokens: z.number(),
      });
    cost: "domain/investigation/usage declares input_tokens and output_tokens as integers, but the schema accepts any number — a fractional token count passes the one boundary meant to validate a provider's own usage record."
    kind: contradicts
    correction: "validate input_tokens and output_tokens with z.number().int() (or z.int()), matching the integer type domain/investigation/usage declares."
    node: domain/investigation/usage
  - file: src/http/dto/simulate-hypothesis.dto.ts
    where: "evaluationSchema, elapsed_ms in each discriminated-union branch, lines 48, 56, 65"
    evidence: "elapsed_ms: z.number().optional(),"
    cost: "domain/investigation/evaluation declares elapsed_ms as an integer (milliseconds); the schema admits any fractional number."
    kind: contradicts
    correction: "validate elapsed_ms with z.number().int() in all three branches."
    node: domain/investigation/evaluation
  - file: src/http/dto/simulate-hypothesis.dto.ts
    where: "evidenceSchema, ttl and elapsed_ms, lines 81 and 87"
    evidence: |
      ttl: z.number(),
        ...
        elapsed_ms: z.number(),
    cost: "domain/investigation/evidence declares both ttl and elapsed_ms as integers; the schema accepts fractional values for either."
    kind: contradicts
    correction: "validate ttl and elapsed_ms with z.number().int()."
    node: domain/investigation/evidence
  - file: src/http/dto/simulate-hypothesis.dto.ts
    where: "durationsSchema, lines 92-96"
    evidence: |
      const durationsSchema = z.object({
        collection: z.number(),
        judgment: z.number(),
        total: z.number(),
      });
    cost: "domain/investigation/durations declares collection, judgment and total as integers (milliseconds); the schema accepts fractional values for all three."
    kind: contradicts
    correction: "validate collection, judgment and total with z.number().int()."
    node: domain/investigation/durations
