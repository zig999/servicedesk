looked_past: >-
  listCaseVersionsPage returns an empty page with no explicit statement when a case currently
  holds no version, and assembleWholeVersion's manifest entries never carry the pinned
  hypothesis-revision's own draft/released state; both look like they could belong to
  scenarios/knowledge/a-case-holding-no-versions-is-told-explicitly and
  rules/knowledge/a-presented-manifest-entry-states-its-pinned-revisions-state respectively, but
  neither node is bound to this repository file and both facts plausibly belong to a
  presentation/route layer this file set does not include, so I left them unreported rather than
  attribute them here on a guess.
