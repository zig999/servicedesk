  - node: domain/investigation/subject-attribute-value
    held_at: >-
      the test "answers 400 for a GET of /v1/glossary/subject-attribute, the vocabulary this reduction dropped, never reaching listVocabularyTerms"
    evidence: >-
      const response = await app.inject({ method: 'GET', url: '/v1/glossary/subject-attribute' });
      expect(response.statusCode).toBe(400);
      expect(built.listVocabularyTerms).not.toHaveBeenCalled();
  - node: rules/glossary/a-glossary-read-by-an-unheld-name-is-refused
    held_at: nowhere
    evidence: >-
      readVocabularyTerm: () => Promise.reject(new Error('readVocabularyTerm is not scripted for this file')),
  - node: rules/glossary/a-vocabulary-holds-each-name-once
    held_at: >-
      the test "answers a listing whose vocabulary holds one name twice with an HTTP 500 response reporting DuplicateGlossaryNameError"
    evidence: >-
      built.listVocabularyTerms.mockRejectedValueOnce(new DuplicateGlossaryNameError('action', 'repeated-term'));
      expect(response.statusCode).toBe(500);
      expect(body.error.code).toBe('DuplicateGlossaryNameError');
