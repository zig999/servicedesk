read:
  - node: domain/knowledge/case
    held_at: >-
      the `slug` prop threaded through the manifest read and the discard dialog
    evidence: >-
      <ManifestTable slug={slug} manifest={state.manifest ?? []} /> ... <DiscardDraftDialog discard={discard} slug={slug} disabled={state.isBlocked} />
  - node: domain/knowledge/case-version
    held_at: >-
      the release dialog's title, which carries the version number
    evidence: '<DialogTitle>Release v{release.version}?</DialogTitle>'
  - node: domain/knowledge/manifest-entry
    held_at: >-
      `toManifestRow`, which maps one manifest entry to its position, its pinned
      hypothesis and revision
    evidence: |-
      function toManifestRow(
        entry: CaseVersionManifestEntry,
        pinnedStates: ManifestPinnedRevisionStates,
      ): StatusTableRow {
        const pinnedState = pinnedStates.get(entry.position) ?? STILL_UNRESOLVED_PIN_STATE;
        return {
          id: entry.position,
          position: entry.position,
          hypothesis: entry.hypothesis_revision.hypothesis.name,
          revision: entry.hypothesis_revision.revision,
          state: pinnedRevisionStateCell(pinnedState),
          criterion: entry.hypothesis_revision.criterion,
        };
      }
  - node: rules/knowledge/a-case-version-is-written-once
    held_at: >-
      the `isReadOnly` gate that removes the Save control once the version is
      not draft
    evidence: >-
      {!isReadOnly && (<Button type="submit" form={CASE_VERSION_EDITOR_FORM_ID}
      disabled={state.isBlocked || state.status === "clean"}>Save
      changes</Button>)}
  - node: rules/knowledge/a-presented-manifest-entry-states-its-pinned-revisions-state
    held_at: >-
      `toManifestRow`'s `state` field, falling back to a pending cell while the
      pin's own read has not resolved
    evidence: >-
      const pinnedState = pinnedStates.get(entry.position) ??
      STILL_UNRESOLVED_PIN_STATE; ... state: pinnedRevisionStateCell(pinnedState),
  - node: rules/knowledge/a-release-refusal-with-no-named-violation-says-so
    held_at: the release dialog's violations block
    evidence: >-
      {release.violations.length === 0 ? (<p className="text-sm
      text-destructive">No specific violation was returned.</p>) : ( ... )}
  - node: rules/knowledge/a-released-case-version-manifests-only-released-hypothesis-revisions
    held_at: >-
      the same violations list, which names every violated hypothesis a refused
      release returns
    evidence: >-
      <ul className="flex flex-col gap-1 text-sm text-destructive">{release.violations.map((violation)
      => (<li key={violation}>! {violation}</li>))}</ul>
  - node: rules/knowledge/a-surface-offering-release-states-which-release-conditions-the-draft-meets
    held_at: >-
      the release-conditions section rendered ahead of, and independent of, the
      release dialog
    evidence: >-
      {release.conditions.map((condition) => (<li
      key={condition.label}>{RELEASE_CONDITION_STATUS_LABEL[condition.status]}:
      {condition.label}</li>))}
  - node: rules/knowledge/an-abandoned-case-version-edit-writes-nothing
    held_at: the unconditional Cancel control at the foot of the form
    evidence: >-
      <Button type="button" variant="secondary" onClick={state.onCancel}>Cancel</Button>
  - node: rules/knowledge/releasing-or-discarding-a-draft-case-version-takes-a-further-explicit-act
    held_at: >-
      the release Dialog, whose trigger only opens the dialog and whose own
      Release button is the separate, further confirming act
    evidence: >-
      <DialogTrigger asChild><Button type="button"
      disabled={state.isBlocked}>Release…</Button></DialogTrigger> ...
      <Button type="button" loading={release.isConfirming}
      onClick={release.onConfirm}>Release</Button>
  - node: scenarios/knowledge/a-release-is-refused-for-manifested-draft-hypothesis-revisions
    held_at: the same violations list rendering
    evidence: >-
      {release.violations.map((violation) => (<li key={violation}>!
      {violation}</li>))}
  - node: rules/knowledge/an-editing-surface-presents-a-drafts-own-declared-attributes-even-when-that-draft-does-not-read-back-as-a-case
    held_at: nowhere
    evidence: >-
      <CaseVersionEditorFormFields form={state.form} savedAt={state.savedAt}
      isBlocked={state.isBlocked} ... isReadOnly={isReadOnly} /> — rendered
      unconditionally, this file itself branches on nothing about whether the
      draft reads back as a case; that reading, and its own dedicated
      presentation, sit in the sibling not-valid view this delivery also
      touched.
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-open-for-editing
    held_at: nowhere
    evidence: >-
      this file's only status banner is <ConflictBanner title={CONFLICT_BANNER_TITLE}
      message={CONFLICT_BANNER_MESSAGE} /> for state.status === "conflict"; it
      states nothing of a version failing to read back as a case, and the
      empty-manifest text <p>This version&apos;s manifest holds no entry.</p>
      only ever renders behind `isReadOnly`.
  - node: rules/knowledge/a-version-keyed-surface-states-a-named-version-that-does-not-read-back-as-a-case
    held_at: nowhere
    evidence: >-
      no branch in this file states that the named version does not read back
      as a case; state.status is checked only against "conflict" and "clean".
  - node: rules/knowledge/a-case-version-failing-validation-at-a-read-is-refused-by-name
    held_at: nowhere
    evidence: >-
      no CaseVersionNotValidError or read-refusal branch appears in this file.
  - node: rules/knowledge/a-draft-versions-content-is-presented-only-from-its-own-record
    held_at: nowhere
    evidence: >-
      readonly state: Extract<EditDraftVersionFormState, { phase: "ready" }> —
      the props type excludes a pending-record phase; this file has no branch
      for content not yet arrived.
  - node: rules/knowledge/a-newly-created-draft-offers-no-act-before-its-own-record-arrives
    held_at: nowhere
    evidence: >-
      same props type, `{ phase: "ready" }` — no act here is conditioned on a
      record still arriving.
  - node: rules/knowledge/a-refusal-a-case-keyed-surface-cannot-name-is-presented-as-a-read-that-did-not-complete
    held_at: nowhere
    evidence: >-
      this file names no error code and holds no generic-refusal branch; its
      only refusal-shaped state is state.status === "conflict".
  - node: contracts/knowledge/case-query
    held_at: nowhere
    evidence: >-
      this file makes no call of its own; it only consumes the already-resolved
      `state` and `slug` props.
  - node: constraints/a-successful-case-version-own-record-read-answers-with-http-200
    held_at: nowhere
    evidence: >-
      no HTTP status handling appears in this presentational component.
  - node: rules/knowledge/a-presented-case-version-offers-a-route-to-its-own-manifest-on-every-reading
    held_at: nowhere
    evidence: >-
      {isReadOnly && (<section className="flex flex-col gap-2"><h2>Manifest</h2>
      <ManifestTable slug={slug} manifest={state.manifest ?? []}
      /></section>)} — while draft (isReadOnly false) this file carries no
      manifest content and no route of its own to a manifest surface.
  - node: rules/knowledge/a-presented-case-version-offers-a-route-to-its-own-editing-surface-on-every-reading
    held_at: nowhere
    evidence: >-
      this file is the editing surface's own destination content; it carries
      no outbound route of its own.
  - node: rules/knowledge/an-accepted-update-draft-answers-its-versions-own-stored-declared-attributes
    held_at: nowhere
    evidence: >-
      no update-draft call or its answer appears in this file; state.form is
      consumed as already given.
  - node: rules/knowledge/a-discard-is-offered-and-accepted-while-its-drafts-current-read-does-not-answer-a-case
    held_at: the discard control's own gate, conditioned only on `discard.canDiscard`
    evidence: >-
      {discard !== undefined && discard.canDiscard && (<DiscardDraftDialog
      discard={discard} slug={slug} disabled={state.isBlocked} />)}
  - node: rules/knowledge/only-a-draft-case-version-may-be-discarded
    held_at: the same discard gate
    evidence: >-
      {discard !== undefined && discard.canDiscard && (<DiscardDraftDialog
      discard={discard} slug={slug} disabled={state.isBlocked} />)}
  - node: rules/knowledge/a-draft-case-versions-discard-reproduces-the-cases-own-slug
    held_at: nowhere
    evidence: >-
      <DiscardDraftDialog discard={discard} slug={slug}
      disabled={state.isBlocked} /> — the slug is only passed through as a
      prop; the further act that reproduces it lives in DiscardDraftDialog.
  - node: scenarios/knowledge/a-case-with-no-hypothesis-is-still-discardable
    held_at: the same discard gate as the two rules above
    evidence: >-
      {discard !== undefined && discard.canDiscard && (<DiscardDraftDialog
      discard={discard} slug={slug} disabled={state.isBlocked} />)} — offered
      with no reference to the manifest's own content.
  - node: constraints/a-successful-case-version-discard-answers-with-no-content
    held_at: nowhere
    evidence: >-
      no discard response handling appears in this file; the call is delegated
      entirely to DiscardDraftDialog.
findings:
  - file: src/routes/case-version-editor-ready-view.tsx
    where: >-
      the RELEASE_DIALOG_DESCRIPTION constant, rendered as the release
      confirmation dialog's own DialogDescription
    evidence: >-
      "Once released, this version and every manifest entry it holds are
      frozen — permanently."
    cost: >-
      the confirmation dialog re-asserts the write-once invariant's own content
      as its own authority; if a-case-version-is-written-once is ever revised
      (an exception carved into it, say), this hardcoded sentence keeps telling
      every curator confirming a release the old rule, and nothing ties the
      string back to the node for whoever changes it to find.
    kind: contradicts
    correction: >-
      state the consequence of confirming without re-deriving the invariant's
      own wording, or source the claim from the node so a later change to it
      is felt here.
    node: rules/knowledge/a-case-version-is-written-once
looked_past: >-
  whether a persistent route to the version's manifest is offered on every
  reading of a draft (a-presented-case-version-offers-a-route-to-its-own-manifest-on-every-reading)
  is not settled by this file alone — it only embeds the manifest inline, and
  only while isReadOnly — and depends on the composing screen (case-version-editor-screen.tsx)
  that is outside this file set; the CONFLICT_BANNER copy naming a release by
  someone else is consistent with a-case-version-moves-through-its-declared-lifecycle's
  own refusal shape and is left as interface wording, not reported.
