findings:
  - file: src/__tests__/unit/http/diagnose.routes.spec.ts
    where: >-
      the 409 draft-state test, line 105 — `expect(body.error.details).toEqual({ slug: 'a-slug',
      version: 1, state: 'draft' });`
    evidence: >-
      expect(body.error.details).toEqual({ slug: 'a-slug', version: 1, state: 'draft' });
    cost: >-
      rules/investigation/only-a-released-case-version-is-diagnosed states only that an attempt to
      diagnose a version not in released state "is refused with an HTTP 409 response reporting a
      CaseVersionNotReleasedError" — its decision-log entry ("HTTP 409 reporting a
      CaseVersionNotReleasedError") settles the status and the error name and nothing further, unlike
      the sibling refusals in this same specification (CaseNotFoundError's details carry "the named
      slug and version", CaseAlreadyHasDraftError's carry "that slug and nothing else",
      ManifestPositionOccupiedError's carry "exactly those three values") which each spell out their
      details payload in their own node. A reader who wants to know what a CaseVersionNotReleasedError
      discloses has no node to open for it; the shape {slug, version, state} exists only as an
      assertion in this test, so it reads as a decision the business made when nobody recorded it as one.
    kind: unstated
    correction: >-
      Extend rules/investigation/only-a-released-case-version-is-diagnosed (or a new constraint
      beside it) to state what the refusal's details carry, the same way
      rules/knowledge/a-case-read-by-an-unknown-slug-or-version-is-refused already does for
      CaseNotFoundError.
